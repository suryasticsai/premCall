            const historyList = document.getElementById('historyList');
            const clearHistoryBtn = document.getElementById('clearHistoryBtn');
            const registerLink = document.getElementById('registerLink');
            const accountModal = document.getElementById('accountModal');
            const brandLogo = document.getElementById('brandLogo');
            const exportTxtBtn = document.getElementById('exportTxtBtn');
            const exportJsonBtn = document.getElementById('exportJsonBtn');

            let dialedNumber = '';
            let callTimerInterval = null;
            let toastTimeout = null;
            let pendingCallDirection = null;
            let getCallDuration = null;

            // ---------- Theme toggle ----------
            let lastLogoTap = 0;
            brandLogo.addEventListener('click', function() {
                const now = Date.now();
                if (now - lastLogoTap < 350) {
                    document.body.classList.toggle('light-mode');
                    showToast(document.body.classList.contains('light-mode') ? 'Bright mode' : 'Dark mode');
                    lastLogoTap = 0;
                } else {
                    lastLogoTap = now;
                }
            });

            // ---------- Audio helpers ----------
            let actx = null;

            function audioCtx() {
                if (!actx) { try { actx = new(window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
                if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
                return actx;
            }

            function beep(freq1, freq2, dur) {
                const ctx = audioCtx();
                if (!ctx) return;
                const now = ctx.currentTime;
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.exponentialRampToValueAtTime(0.06, now + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
                gain.connect(ctx.destination);
                [freq1, freq2].forEach(f => {
                    if (!f) return;
                    const osc = ctx.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.value = f;
                    osc.connect(gain);
                    osc.start(now);
                    osc.stop(now + dur);
                });
            }
            const DTMF = {
                '1': [697, 1209],
                '2': [697, 1336],
                '3': [697, 1477],
                '4': [770, 1209],
                '5': [770, 1336],
                '6': [770, 1477],
                '7': [852, 1209],
                '8': [852, 1336],
                '9': [852, 1477],
                '*': [941, 1209],
                '0': [941, 1336],
                '#': [941, 1477]
            };

            function playDtmf(d) { const t = DTMF[d]; if (t) beep(t[0], t[1], 0.08); }

            let ringtoneTimer = null;

            function startRingtone() {
                stopRingtone();
                const tick = () => beep(440, 480, 0.35);
                tick();
                ringtoneTimer = setInterval(tick, 1600);
            }

            function stopRingtone() { if (ringtoneTimer) { clearInterval(ringtoneTimer);
                    ringtoneTimer = null; } }

            function vibrate(pattern) { if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) {} } }

            function addRipple(el, evt) {
                const rect = el.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const point = evt.touches ? evt.touches[0] : evt;
                const x = (point ? point.clientX : rect.left + rect.width / 2) - rect.left - size / 2;
                const y = (point ? point.clientY : rect.top + rect.height / 2) - rect.top - size / 2;
                const span = document.createElement('span');
                span.className = 'ripple';
                span.style.width = span.style.height = size + 'px';
                span.style.left = x + 'px';
                span.style.top = y + 'px';
                el.appendChild(span);
                setTimeout(() => span.remove(), 520);
            }

            // ---------- History ----------
            function getHistory() { try { return JSON.parse(localStorage.getItem('premCallHistory')) || []; } catch (e) { return []; } }

            function saveHistory(h) { localStorage.setItem('premCallHistory', JSON.stringify(h)); }

            function addHistoryEntry(number, direction, duration) {
                const history = getHistory();
                history.unshift({ number, direction, duration: duration || '—', timestamp: Date.now() });
                if (history.length > 50) history.length = 50;
                saveHistory(history);
                renderHistory();
            }

            function renderHistory() {
                if (!historyList) return;
                historyList.innerHTML = '';
                const history = getHistory();
                if (!history.length) { historyList.innerHTML = '<li class="empty">No calls yet</li>'; return; }
                history.forEach(entry => {
                    const li = document.createElement('li');
                    const dirIcon = entry.direction === 'incoming' ? 'fa-arrow-down' : entry.direction === 'outgoing' ?
                        'fa-arrow-up' : 'fa-phone-slash';
                    const dirClass = entry.direction === 'incoming' ? 'incoming' : entry.direction === 'outgoing' ?
                        'outgoing' : 'missed';
                    const date = new Date(entry.timestamp);
                    const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    li.innerHTML =
                        `<span class="chip ${dirClass}"><i class="fas ${dirIcon}"></i></span><span class="num">${entry.number}</span><span class="time">${entry.duration}<br>${timeStr}</span>`;
                    historyList.appendChild(li);
                });
            }
            clearHistoryBtn.addEventListener('click', () => { saveHistory([]);
                renderHistory();
                showToast('History cleared'); });

            function showToast(msg, duration) {
                if (!toast) return;
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => toast.classList.remove('show'), duration || 2500);
            }

            function log(msg, type) {
                if (!logArea) return;
                const now = new Date().toLocaleTimeString();
                const entry = document.createElement('div');
                entry.className = 'log-entry' + (type ? ' ' + type : '');
                entry.textContent = now + ' ' + msg;
                logArea.prepend(entry);
                if (logArea.children.length > 50) logArea.removeChild(logArea.lastChild);
            }

            function setStatusDot(state) { if (headerStatusDot) headerStatusDot.className = 'status-dot ' + state; }

            function getStoredNumber() {
                const num = localStorage.getItem('premCallNumber');
                const verified = localStorage.getItem('premCallVerified') === 'true';
                return (num && verified) ? num : null;
            }

            function startTimer() {
                if (callTimerInterval) clearInterval(callTimerInterval);
                let seconds = 0;
                callTimerInterval = setInterval(() => {
                    seconds++;
                    const m = String(Math.floor(seconds / 60)).padStart(2, '0');
                    const s = String(seconds % 60).padStart(2, '0');
                    if (callTimer) callTimer.textContent = m + ':' + s;
                }, 1000);
                return () => { clearInterval(callTimerInterval);
                    callTimerInterval = null; return seconds; };
            }

            function initials(label) {
                if (!label) return '👤';
                const digitsOnly = /^[\d+\s-]+$/.test(label);
                if (digitsOnly) return label.replace(/\D/g, '').slice(-2) || '👤';
                return label.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
            }

            function showIncomingOverlay(callerId) {
                if (!incomingOverlay) return;
                incomingAvatar.textContent = initials(callerId);
                incomingName.textContent = callerId;
                incomingNumber.textContent = callerId;
                incomingOverlay.classList.add('active');
                incomingOverlay.classList.add('ring-anim');
                startRingtone();
                vibrate([300, 200, 300, 200, 300]);
                showToast('Incoming call from ' + callerId);
                log('Incoming call from ' + callerId, 'warning');
            }

            function hideIncomingOverlay() {
                if (!incomingOverlay) return;
                incomingOverlay.classList.remove('active');
                incomingOverlay.classList.remove('ring-anim');
                stopRingtone();
            }

            function hideCallScreen() {
                if (!callScreen) return;
                callScreen.classList.remove('active');
                callRingWrap.classList.remove('ring-anim');
                if (callTimerInterval) clearInterval(callTimerInterval);
                callTimer.textContent = '00:00';
                if (remoteAudio) remoteAudio.srcObject = null;
                if (dialCallBtn) dialCallBtn.classList.remove('disabled');
                const dimEls = [
                    document.getElementById('dialerSection'),
                    document.getElementById('historySection'),
                    document.getElementById('logArea'),
                    document.getElementById('mainHeader'),
                    document.getElementById('registerLink')
                ];
                dimEls.forEach(el => { if (el) el.classList.remove('dimmed'); });
                document.getElementById('exportButtons').classList.remove('active');
            }

            function unlockSpeechSynthesis() {
                if (PremCall && typeof PremCall.unlockSpeech === 'function') {
                    PremCall.unlockSpeech();
                }
            }

            // ---------- Init PremCall ----------
            function initPremCall() {
                const number = getStoredNumber();
                if (!number) {
                    if (myNumberDisplay) myNumberDisplay.textContent = 'Not registered';
                    setStatusDot('offline');
                    log('No verified number yet. Tap Registration to set one up.', 'warning');
                    showToast('Register your number to start calling');
                    registerLink.classList.remove('hidden');
                    return;
                }
                if (!/^\d{10}$/.test(number)) {
                    if (myNumberDisplay) myNumberDisplay.textContent = 'Invalid';
                    setStatusDot('offline');
                    log('Stored number is not 10 digits.', 'error');
                    registerLink.classList.remove('hidden');
                    return;
                }
                registerLink.classList.add('hidden');
                if (myNumberDisplay) myNumberDisplay.textContent = number;
                setStatusDot('connecting');
                log('Initializing with number: ' + number, 'info');

                try {
                    PremCall.init(number, {
                        onIncoming: (callerId) => { showIncomingOverlay(callerId); },
                        onConnected: () => {
                            setStatusDot('online');
                            if (callScreen.classList.contains('active')) {
                                if (callSubstatus) callSubstatus.textContent = 'Connected';
                                callRingWrap.classList.remove('ring-anim');
                                if (!callTimerInterval) getCallDuration = startTimer();
                            }
                        },
                        onDisconnected: () => setStatusDot('offline'),
                        onRemoteStream: (stream) => {
                            if (remoteAudio) {
                                remoteAudio.srcObject = stream;
                                remoteAudio.muted = false;
                                remoteAudio.play().catch(() => {
                                    document.addEventListener('click', () => remoteAudio.play(), { once: true });
                                    document.addEventListener('touchstart', () => remoteAudio.play(), { once: true });
                                });
                            }
                            if (callSubstatus) callSubstatus.textContent = 'Connected';
                        },
                        onCallStarted: (data) => {
                            if (data.isRAGina) {
                                // already handled
                            } else {
                                pendingCallDirection = data.isCaller ? 'outgoing' : 'incoming';
                                callAvatar.textContent = initials(data.target);
                                callName.textContent = data.target;
                                callNumber.textContent = data.target;
                                callSubstatus.textContent = data.isCaller ? 'Ringing…' : 'Connecting…';
                                callTimer.textContent = '00:00';
                                callRingWrap.classList.add('ring-anim');
                                callScreen.classList.add('active');
                                dialCallBtn.classList.add('disabled');
                                hideIncomingOverlay();
                                const dimEls = [
                                    document.getElementById('dialerSection'),
                                    document.getElementById('historySection'),
                                    document.getElementById('logArea'),
                                    document.getElementById('mainHeader'),
                                    document.getElementById('registerLink')
                                ];
                                dimEls.forEach(el => { if (el) el.classList.add('dimmed'); });
                                document.getElementById('exportButtons').classList.remove('active');
                            }
                        },
                        onCallEnded: () => {
                            let duration = '—';
                            if (getCallDuration) {
                                const secs = getCallDuration();
                                const m = String(Math.floor(secs / 60)).padStart(2, '0');
                                const s = String(secs % 60).padStart(2, '0');
                                duration = m + ':' + s;
                                getCallDuration = null;
                            }
                            const currentNumber = callNumber ? callNumber.textContent : '';
                            if (currentNumber && currentNumber !== 'Calling…' && currentNumber !==
                                '+1234567890' && currentNumber !== RAGINA_NUMBER) {
                                addHistoryEntry(currentNumber, pendingCallDirection || 'incoming', duration);
                            }
                            pendingCallDirection = null;
                            hideCallScreen();
                            hideIncomingOverlay();
                            showToast('Call ended');
                        },
                        onError: (err) => {
                            log('Error: ' + err.message, 'error');
                            showToast('Error: ' + err.message);
                            setStatusDot('offline');
                        },
                        onLog: (msg, level) => log(msg, level)
                    });
                    setStatusDot('online');
                } catch (err) {
                    log('Init failed: ' + err.message, 'error');
                    setStatusDot('offline');
                    showToast('Init failed: ' + err.message);
                }
            }

            // ---------- Dialpad ----------
            function updateDisplay() {
                if (dialedNumber) {
                    dialText.innerHTML = dialedNumber + '<span class="cursor"></span>';
                    addBtn.style.display = 'block';
                    backspaceBtn.style.display = 'block';
                } else {
                    dialText.innerHTML = '<span class="hint"><i class="fas fa-phone"></i> Enter a 10-digit number</span>';
                    addBtn.style.display = 'none';
                    backspaceBtn.style.display = 'none';
                }
            }

            backspaceBtn.addEventListener('click', () => { dialedNumber = dialedNumber.slice(0, -1);
                updateDisplay();
                vibrate(8); });
            addBtn.addEventListener('click', () => { showToast('Add contact feature coming soon');
                vibrate(10); });

            dialPad.addEventListener('pointerdown', (e) => { const key = e.target.closest('.key'); if (key) addRipple(key,
                e); });

            dialPad.addEventListener('click', (e) => {
                const key = e.target.closest('.key');
                if (!key) return;
                const digit = key.dataset.digit;
                const action = key.dataset.action;

                if (digit) {
                    if (dialedNumber.length < 15) { dialedNumber += digit;
                        updateDisplay(); }
                    playDtmf(digit);
                    vibrate(10);
                } else if (action === 'call') {
                    if (!dialedNumber || !/^\d{10}$/.test(dialedNumber)) {
                        const reason = !dialedNumber ? 'No number entered' : 'Number is ' + dialedNumber.length +
                            ' characters, need exactly 10 digits (no * or #)';
                        log(reason, 'error');
                        showToast('Enter exactly 10 digits');
                        vibrate([40, 40, 40]);
                        return;
                    }
                    // For RAGina number, skip online check entirely
                    if (dialedNumber !== RAGINA_NUMBER) {
                        const dotState = headerStatusDot.className;
                        if (dotState.indexOf('online') === -1 && dotState.indexOf('connecting') === -1) {
                            log('PeerJS not connected — only RAGina calls work right now.', 'warning');
                            showToast('PeerJS offline. Use RAGina (0000000000) or wait.');
                            vibrate([40, 40, 40]);
                            return;
                        }
                    }
                    unlockSpeechSynthesis();
                    dialCallBtn.classList.add('disabled');
                    vibrate(15);
                    try {
                        PremCall.call(dialedNumber);
                    } catch (err) {
                        log('Call failed: ' + err.message, 'error');
                        showToast('Call failed: ' + err.message);
                        dialCallBtn.classList.remove('disabled');
                    }
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key >= '0' && e.key <= '9') {
                    if (dialedNumber.length < 15) { dialedNumber += e.key;
                        updateDisplay();
                        playDtmf(e.key); }
                } else if (e.key === 'Backspace') { dialedNumber = dialedNumber.slice(0, -1);
                    updateDisplay(); } else if (e.key === 'Enter') { if (dialedNumber && /^\d{10}$/.test(dialedNumber))
                        dialCallBtn.click(); }
            });

            hangupCallBtn.addEventListener('click', () => { PremCall.hangup();
                dialCallBtn.classList.remove('disabled');
                vibrate(15); });

            muteBtn.addEventListener('click', () => {
                const muted = PremCall.mute();
                muteBtn.innerHTML = muted ? '<i class="fas fa-microphone-slash"></i>' :
                    '<i class="fas fa-microphone"></i>';
                muteBtn.className = muted ? 'mute active' : 'mute';
                showToast(muted ? 'Muted' : 'Unmuted');
                vibrate(10);
            });

            speakerBtn.addEventListener('click', () => {
                const on = PremCall.speaker();
                speakerBtn.className = on ? 'speaker active' : 'speaker';
                speakerBtn.innerHTML = on ? '<i class="fas fa-volume-high"></i>' :
                    '<i class="fas fa-volume-xmark"></i>';
                showToast(on ? 'Speaker on' : 'Earpiece');
                vibrate(10);
            });

            answerBtn.addEventListener('click', async () => {
                try { await PremCall.answer();
                    hideIncomingOverlay();
                    vibrate(15); } catch (err) { showToast('Answer failed: ' + err.message); }
            });

            rejectBtn.addEventListener('click', () => {
                const caller = incomingName.textContent;
                PremCall.hangup();
                hideIncomingOverlay();
                if (caller && caller !== 'Unknown') addHistoryEntry(caller, 'missed', '—');
                showToast('Call declined');
                vibrate(15);
            });

            // ---------- Swipe to answer ----------
            (function enableSwipe() {
                let startY = null;
                incomingOverlay.addEventListener('touchstart', (e) => { startY = e.touches[0].clientY;
                    incomingOverlay.style.transition = 'none'; }, { passive: true });
                incomingOverlay.addEventListener('touchmove', (e) => {
                    if (startY === null) return;
                    const dy = e.touches[0].clientY - startY;
                    incomingOverlay.style.transform = 'translateY(' + (dy * 0.35) + 'px)';
                    incomingOverlay.style.opacity = String(1 - Math.min(Math.abs(dy) / 500, 0.5));
                }, { passive: true });
                incomingOverlay.addEventListener('touchend', (e) => {
                    if (startY === null) return;
                    const dy = e.changedTouches[0].clientY - startY;
                    incomingOverlay.style.transition = 'transform .25s ease, opacity .25s ease';
                    incomingOverlay.style.transform = '';
                    incomingOverlay.style.opacity = '';
                    if (dy < -80) answerBtn.click();
                    else if (dy > 80) rejectBtn.click();
                    startY = null;
                });
            })();

            checkStatusBtn.addEventListener('click', async () => {
                const num = dialedNumber || prompt('Enter 10-digit number to check:');
                if (!num) return;
                if (!/^\d{10}$/.test(num)) { statusResult.textContent = 'Invalid number'; return; }
                statusResult.textContent = 'Checking…';
                try {
                    const online = await PremCall.checkStatus(num);
                    statusResult.textContent = online ? '✅ Online' : '❌ Offline';
                } catch (err) { statusResult.textContent = 'Error';
                    log('Status check failed: ' + err.message, 'error'); }
            });

            // ---------- Account modal ----------
            myNumberDisplay.addEventListener('click', () => {
                const num = getStoredNumber();
                if (num) {
                    document.getElementById('accountNumber').textContent = num;
                    const since = localStorage.getItem('premCallRegisteredAt');
                    document.getElementById('accountDate').textContent = since ? new Date(Number(since))
                        .toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) :
                        'Unknown';
                    accountModal.classList.add('active');
                }
            });

            // ---------- Export buttons ----------
            exportTxtBtn.addEventListener('click', () => {
                if (typeof PremCall.exportLastTranscript === 'function') {
                    PremCall.exportLastTranscript();
                } else {
                    showToast('Export not available.');
                }
            });
            exportJsonBtn.addEventListener('click', () => {
                if (typeof PremCall.exportLastTranscriptJSON === 'function') {
                    PremCall.exportLastTranscriptJSON();
                } else {
                    showToast('JSON export not available.');
                }
            });

            // ---------- init ----------
            initPremCall();
            renderHistory();
            updateDisplay();

            // auto-dial from URL
            (function autoLoad() {
                const params = new URLSearchParams(window.location.search);
                const num = params.get('number');
                if (num && /^\d{10}$/.test(num)) {
                    dialedNumber = num;
                    updateDisplay();
                    setTimeout(() => { try { PremCall.call(num); } catch (e) {} }, 1500);
                }
            })();

            log('UI ready. Dial 0000000000 to talk to RAGina (fallback enabled).', 'success');
        })();
    </script>

</body>
</html>

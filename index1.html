<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#070a12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PremCall" />
    <title>PremCall — RAGina AI Call</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/suryasticsai/premCall/main/premCall-logo.png" />
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/suryasticsai/premCall/main/premCall-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== base ===== */
        :root {
            --bg-0: #05070d;
            --bg-1: #0a0e18;
            --surface: #0e1424;
            --surface-2: #141c30;
            --surface-3: #1b2540;
            --line: #1e2a42;
            --text: #eef2fb;
            --text-dim: #8891ab;
            --text-faint: #525d78;
            --signal: #4f8cf7;
            --signal-soft: #2f5fc4;
            --go: #2fd992;
            --go-deep: #12683f;
            --stop: #ff5470;
            --stop-deep: #7a1730;
            --warn: #ffb648;
            --warn-deep: #5c3d10;
            --radius-xl: 30px;
            --radius-lg: 22px;
            --radius-md: 16px;
            --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --safe-t: env(safe-area-inset-top, 0px);
            --safe-b: env(safe-area-inset-bottom, 0px);
        }
        body.light-mode {
            --bg-0: #f0f2f5;
            --bg-1: #ffffff;
            --surface: #ffffff;
            --surface-2: #f8fafc;
            --surface-3: #f1f5f9;
            --line: #d1d5db;
            --text: #111827;
            --text-dim: #4b5563;
            --text-faint: #9ca3af;
            --signal: #2563eb;
            --signal-soft: #1d4ed8;
            --go: #10b981;
            --go-deep: #047857;
            --stop: #ef4444;
            --stop-deep: #b91c1c;
            --warn: #f59e0b;
            --warn-deep: #b45309;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        html,
        body {
            height: 100%;
            font-family: var(--font-body);
            color: var(--text);
            background: radial-gradient(1100px 700px at 15% -10%, var(--bg-1) 0%, transparent 55%), radial-gradient(900px 600px at 110% 10%, var(--bg-1) 0%, transparent 50%), var(--bg-0);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
            transition: background .3s ease, color .3s ease;
        }
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }

        .stage {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 0;
        }
        .phone-frame {
            position: relative;
            width: 100%;
            max-width: 428px;
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
            display: flex;
            flex-direction: column;
            padding: calc(1.1rem + var(--safe-t)) 1.15rem calc(1.1rem + var(--safe-b));
            transition: background .3s ease;
        }
        @media (min-width: 620px) {
            body {
                align-items: center;
                padding: 3rem 1.5rem;
            }
            .phone-frame {
                min-height: auto;
                height: min(860px, 92vh);
                border-radius: 44px;
                box-shadow: 0 0 0 10px #050810, 0 0 0 11px #23304e, 0 40px 100px -20px rgba(0, 0, 0, 0.75), 0 0 90px -10px rgba(79, 140, 247, 0.18);
                overflow: hidden;
            }
            body.light-mode .phone-frame {
                box-shadow: 0 0 0 10px #d1d5db, 0 0 0 11px #9ca3af, 0 40px 100px -20px rgba(0, 0, 0, 0.2), 0 0 90px -10px rgba(37, 99, 235, 0.15);
            }
            .phone-frame::before {
                content: "";
                position: absolute;
                top: 14px;
                left: 50%;
                transform: translateX(-50%);
                width: 120px;
                height: 22px;
                background: #050810;
                border-radius: 0 0 16px 16px;
                z-index: 5;
            }
            body.light-mode .phone-frame::before {
                background: #d1d5db;
            }
            .phone-frame {
                padding-top: calc(2.2rem);
            }
        }

        /* ===== main UI ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.85rem;
            border-bottom: 1px solid var(--line);
            flex-shrink: 0;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            cursor: default;
        }
        .brand img {
            height: 30px;
            width: 30px;
            border-radius: 9px;
            object-fit: cover;
            pointer-events: none;
        }
        .brand span {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: -0.02em;
            color: var(--text);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.72rem;
            color: var(--text-dim);
            font-variant-numeric: tabular-nums;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
            box-shadow: 0 0 0 3px transparent;
            transition: background .3s, box-shadow .3s;
        }
        .status-dot.online {
            background: var(--go);
            box-shadow: 0 0 0 3px rgba(47, 217, 146, 0.18);
        }
        .status-dot.offline {
            background: var(--stop);
            box-shadow: 0 0 0 3px rgba(255, 84, 112, 0.18);
        }
        .status-dot.connecting {
            background: var(--warn);
            box-shadow: 0 0 0 3px rgba(255, 182, 72, 0.18);
            animation: blink 1.1s ease-in-out infinite;
        }
        @keyframes blink {
            50% {
                opacity: 0.35;
            }
        }
        .settings-link {
            background: var(--surface-2);
            border: 1px solid var(--line);
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.76rem;
            font-weight: 500;
            padding: 0.42rem 0.9rem;
            border-radius: 40px;
            margin: 0.75rem 0 0.2rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            align-self: flex-start;
            transition: background .15s, color .15s, border-color .15s;
        }
        .settings-link:hover {
            background: var(--surface-3);
            color: var(--text);
            border-color: var(--signal-soft);
        }
        .settings-link.hidden {
            display: none;
        }

        .dialer-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding-top: 0.5rem;
            min-height: 0;
        }
        .dialer-display {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            padding: 1rem 1.1rem;
            min-height: 4.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 1.9rem;
            letter-spacing: 0.08em;
            color: var(--text);
            word-break: break-all;
            margin-bottom: 1.3rem;
            position: relative;
        }
        .dialer-display .hint {
            font-size: 0.86rem;
            font-weight: 400;
            letter-spacing: 0;
            color: var(--text-faint);
            font-family: var(--font-body);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .dialer-display .cursor {
            display: inline-block;
            width: 2px;
            height: 1.6rem;
            background: var(--signal);
            margin-left: 2px;
            animation: caret 1s steps(1) infinite;
        }
        @keyframes caret {
            50% {
                opacity: 0;
            }
        }
        .dialer-display .left-btn,
        .dialer-display .right-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-faint);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px;
            transition: color .15s;
        }
        .dialer-display .left-btn:hover,
        .dialer-display .right-btn:hover {
            color: var(--text);
        }
        .dialer-display .left-btn {
            left: 8px;
        }
        .dialer-display .right-btn {
            right: 8px;
        }

        .dialer-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.8rem;
            max-width: 300px;
            margin: 0 auto;
            width: 100%;
        }
        .dialer-pad .key {
            position: relative;
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 50%;
            aspect-ratio: 1/1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-size: 1.55rem;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: background .12s, border-color .12s, transform .08s;
        }
        .dialer-pad .key .sub {
            font-size: 0.5rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            color: var(--text-faint);
            margin-top: 1px;
            font-family: var(--font-body);
        }
        .dialer-pad .key:active {
            background: var(--surface-3);
            transform: scale(0.93);
        }
        .dialer-pad .key.call {
            background: linear-gradient(160deg, var(--go) 0%, #17a06a 100%);
            border-color: transparent;
            color: #04140c;
            box-shadow: 0 8px 20px -6px rgba(47, 217, 146, 0.55);
        }
        .dialer-pad .key.call:active {
            transform: scale(0.93);
            box-shadow: 0 4px 12px -4px rgba(47, 217, 146, 0.55);
        }
        .dialer-pad .key.call.disabled {
            opacity: 0.35;
            pointer-events: none;
            box-shadow: none;
        }
        .dialer-pad .key.ghost {
            background: transparent;
            border-color: transparent;
            color: var(--text-dim);
        }
        .dialer-pad .key.ghost:active {
            background: var(--surface-2);
        }
        .dialer-pad .key i {
            font-size: 1.3rem;
        }
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.28);
            transform: scale(0);
            animation: rip .5s ease-out forwards;
            pointer-events: none;
        }
        @keyframes rip {
            to {
                transform: scale(2.6);
                opacity: 0;
            }
        }

        .action-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-top: 1rem;
            flex-shrink: 0;
        }
        .action-row .btn {
            padding: 0.45rem 1.05rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.78rem;
            cursor: pointer;
            background: transparent;
            border: 1px solid var(--line);
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: background .15s, border-color .15s;
        }
        .action-row .btn:hover {
            background: var(--surface-2);
            border-color: var(--signal-soft);
        }
        .action-row .status-badge {
            font-size: 0.78rem;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 0.3rem;
            min-height: 1.2rem;
        }

        .log-area {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 0.5rem 0.75rem;
            font-family: 'SFMono-Regular', 'Courier New', monospace;
            font-size: 0.62rem;
            max-height: 64px;
            overflow-y: auto;
            color: var(--text-faint);
            margin-top: 0.8rem;
            flex-shrink: 0;
            line-height: 1.65;
        }
        .log-entry.error {
            color: var(--stop);
            opacity: 1;
        }
        .log-entry.success {
            color: var(--go);
            opacity: 1;
        }
        .log-entry.warning {
            color: var(--warn);
            opacity: 1;
        }

        #historySection {
            margin-top: 1rem;
            border-top: 1px solid var(--line);
            padding-top: 0.75rem;
            flex-shrink: 0;
        }
        #historySection h3 {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
        }
        #historySection h3 .title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        #historyList {
            list-style: none;
            max-height: 118px;
            overflow-y: auto;
            font-size: 0.8rem;
        }
        #historyList li {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.4rem 0.1rem;
            border-bottom: 1px solid #141b2c;
            color: var(--text-dim);
        }
        #historyList li .chip {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            flex-shrink: 0;
        }
        #historyList li .chip.incoming {
            background: rgba(47, 217, 146, 0.15);
            color: var(--go);
        }
        #historyList li .chip.outgoing {
            background: rgba(79, 140, 247, 0.15);
            color: var(--signal);
        }
        #historyList li .chip.missed {
            background: rgba(255, 84, 112, 0.15);
            color: var(--stop);
        }
        #historyList li .num {
            flex: 1;
            font-variant-numeric: tabular-nums;
            color: var(--text);
            font-weight: 500;
            font-size: 0.82rem;
        }
        #historyList li .time {
            color: var(--text-faint);
            font-size: 0.7rem;
            text-align: right;
        }
        #historyList li.empty {
            color: var(--text-faint);
            border-bottom: none;
            justify-content: center;
            padding: 0.6rem;
        }
        .clear-history {
            background: none;
            border: none;
            color: var(--text-faint);
            cursor: pointer;
            font-size: 0.7rem;
            padding: 0.15rem 0.3rem;
        }
        .clear-history:hover {
            color: var(--stop);
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--surface-3);
            border-radius: 10px;
        }
        @media (max-width: 380px) {
            .dialer-pad {
                gap: 0.55rem;
                max-width: 250px;
            }
            .dialer-display {
                font-size: 1.55rem;
                padding: 0.8rem;
            }
        }

        #accountModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            z-index: 5000;
        }
        #accountModal.active {
            display: flex;
        }
        .account-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            padding: 2rem 1.5rem;
            width: 90%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        .account-card h2 {
            font-family: var(--font-display);
            font-size: 1.3rem;
            margin-bottom: 1.2rem;
        }
        .account-card .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--surface-2);
            font-size: 0.85rem;
        }
        .account-card .info-row span:first-child {
            color: var(--text-dim);
        }
        .account-card .info-row span:last-child {
            color: var(--text);
            font-weight: 600;
        }
        .account-card .close-btn {
            margin-top: 1.2rem;
            width: 100%;
            padding: 0.6rem;
            border-radius: 40px;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
            font-weight: 600;
        }
        .account-card .close-btn:hover {
            background: var(--surface-2);
            color: var(--text);
        }

        /* ===== INCOMING OVERLAY (PeerJS) ===== */
        #incomingOverlay {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem calc(2rem + var(--safe-b));
            background: radial-gradient(600px 400px at 50% 20%, rgba(79, 140, 247, 0.14), transparent 60%), var(--bg-0);
            border-radius: inherit;
        }
        #incomingOverlay.active {
            display: flex;
        }
        #incomingOverlay .avatar-wrap {
            position: relative;
            width: 132px;
            height: 132px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.1rem;
        }
        #incomingOverlay .ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1.5px solid var(--signal);
            opacity: 0;
        }
        #incomingOverlay.ring-anim .ring {
            animation: signal-pulse 2.4s ease-out infinite;
        }
        #incomingOverlay.ring-anim .ring:nth-child(2) {
            animation-delay: .8s;
        }
        #incomingOverlay.ring-anim .ring:nth-child(3) {
            animation-delay: 1.6s;
        }
        @keyframes signal-pulse {
            0% {
                transform: scale(0.72);
                opacity: 0.55;
            }
            100% {
                transform: scale(1.65);
                opacity: 0;
            }
        }
        #incomingOverlay .avatar {
            position: relative;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(155deg, var(--surface-3), var(--surface));
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-size: 2.1rem;
            font-weight: 700;
            color: var(--text);
            z-index: 1;
            overflow: hidden;
        }
        #incomingOverlay .avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        #incomingOverlay .peer-name {
            font-family: var(--font-display);
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            text-align: center;
        }
        #incomingOverlay .peer-number {
            color: var(--text-dim);
            margin-top: 0.15rem;
            font-variant-numeric: tabular-nums;
            font-size: 0.95rem;
        }
        #incomingOverlay .swipe-hint {
            font-size: 0.72rem;
            color: var(--text-faint);
            margin-top: 0.4rem;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }
        #incomingOverlay .actions {
            display: flex;
            gap: 2.6rem;
            margin-top: 2.2rem;
        }
        #incomingOverlay .actions button {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 1.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            transition: transform .12s;
        }
        #incomingOverlay .actions button:active {
            transform: scale(0.9);
        }
        #incomingOverlay .actions .answer {
            background: linear-gradient(160deg, var(--go), #17a06a);
            box-shadow: 0 8px 22px -6px rgba(47, 217, 146, 0.55);
            animation: answer-nudge 1.8s ease-in-out infinite;
        }
        #incomingOverlay .actions .reject {
            background: linear-gradient(160deg, var(--stop), #c2213f);
            box-shadow: 0 8px 22px -6px rgba(255, 84, 112, 0.55);
        }
        @keyframes answer-nudge {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-4px);
            }
        }

        /* ===== CALL SCREEN — full-screen phone UI ===== */
        #callScreen {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: calc(2.5rem + var(--safe-t)) 1.5rem calc(1.5rem + var(--safe-b));
            background: radial-gradient(800px 600px at 50% 30%, rgba(20, 30, 60, 0.92), #05070d 95%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: #fff;
            font-family: var(--font-display);
        }
        #callScreen.active {
            display: flex;
        }
        #callScreen::before {
            content: "";
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 22px;
            background: #050810;
            border-radius: 0 0 16px 16px;
            z-index: 5;
        }
        body.light-mode #callScreen::before {
            background: #d1d5db;
        }

        #callScreen .avatar-wrap {
            position: relative;
            width: 160px;
            height: 160px;
            display: flex;
            align-items: center;

    <!-- ===== RAGina Core — load from CDN with fallback ===== -->
    <script>
        // RAGina engine loader with fallback and status updates
        (function loadRAGina() {
            const statusEl = document.getElementById('raginaStatus');
            const logArea = document.getElementById('logArea');

            function setStatus(text, type) {
                if (!statusEl) return;
                statusEl.textContent = text;
                statusEl.className = type || '';
                if (type === 'ready') {
                    statusEl.innerHTML = '<i class="fas fa-check-circle" style="color:var(--go);"></i> RAGina ready';
                } else if (type === 'error') {
                    statusEl.innerHTML = '<i class="fas fa-exclamation-circle" style="color:var(--stop);"></i> ' + text;
                } else if (type === 'fallback') {
                    statusEl.innerHTML = '<i class="fas fa-triangle-exclamation" style="color:var(--warn);"></i> ' + text;
                } else {
                    statusEl.innerHTML = '<span class="spinner"></span> ' + text;
                }
            }

            function log(msg, cls) {
                if (!logArea) return;
                const now = new Date().toLocaleTimeString();
                const div = document.createElement('div');
                div.className = 'log-entry' + (cls ? ' ' + cls : '');
                div.textContent = now + ' ' + msg;
                logArea.prepend(div);
            }

            // Try loading RAGina from multiple sources
            const sources = [
                'ragina-pro.min.js',
                'https://cdn.jsdelivr.net/gh/suryasticsai/RAGina@main/ragina-pro.min.js',
                'https://raw.githubusercontent.com/suryasticsai/RAGina/main/ragina-pro.min.js'
            ];

            let loaded = false;

            function tryLoad(index) {
                if (loaded) return;
                if (index >= sources.length) {
                    setStatus('Fallback mode (no engine)', 'fallback');
                    log('RAGina engine not available — using direct API fallback', 'warning');
                    // Notify app that we are in fallback mode
                    if (window.__onRAGinaFallback) window.__onRAGinaFallback();
                    return;
                }
                const src = sources[index];
                setStatus('Loading RAGina (' + (index + 1) + '/' + sources.length + ')…', '');
                log('RAGina: trying ' + src, 'info');

                const script = document.createElement('script');
                script.src = src;
                script.onload = function() {
                    if (typeof window.RAGina !== 'undefined' && typeof window.RAGina.init === 'function') {
                        loaded = true;
                        setStatus('RAGina ready', 'ready');
                        log('RAGina loaded from ' + src, 'success');
                        try {
                            window.RAGina.init({
                                title: 'RAGina',
                                personality: 'sassy',
                                voiceEnabled: false
                            });
                            log('RAGina engine initialized', 'success');
                            if (window.__onRAGinaReady) window.__onRAGinaReady();
                        } catch (e) {
                            log('RAGina init error: ' + e.message, 'error');
                            // Fallback
                            setStatus('Fallback mode (init failed)', 'fallback');
                            if (window.__onRAGinaFallback) window.__onRAGinaFallback();
                        }
                    } else {
                        log('RAGina: script loaded but API not found, trying next', 'warning');
                        tryLoad(index + 1);
                    }
                };
                script.onerror = function() {
                    log('RAGina: failed to load from ' + src, 'warning');
                    tryLoad(index + 1);
                };
                const timeout = setTimeout(function() {
                    if (!loaded) {
                        log('RAGina: timeout loading ' + src, 'warning');
                        tryLoad(index + 1);
                    }
                }, 8000);
                script.onload = (function(prev) {
                    return function() {
                        clearTimeout(timeout);
                        if (prev) prev.call(this);
                    };
                })(script.onload);
                script.onerror = (function(prev) {
                    return function() {
                        clearTimeout(timeout);
                        if (prev) prev.call(this);
                    };
                })(script.onerror);
                document.head.appendChild(script);
            }

            // Start loading
            tryLoad(0);

            // Also check if RAGina is already present
            if (typeof window.RAGina !== 'undefined' && typeof window.RAGina.init === 'function') {
                loaded = true;
                setStatus('RAGina ready', 'ready');
                log('RAGina already present', 'success');
                try {
                    window.RAGina.init({ title: 'RAGina', personality: 'sassy', voiceEnabled: false });
                    log('RAGina engine initialized', 'success');
                    if (window.__onRAGinaReady) window.__onRAGinaReady();
                } catch (e) {
                    log('RAGina init error: ' + e.message, 'error');
                    setStatus('Fallback mode (init failed)', 'fallback');
                    if (window.__onRAGinaFallback) window.__onRAGinaFallback();
                }
            } else {
                // If not present after a delay, fallback
                setTimeout(function() {
                    if (!loaded) {
                        setStatus('Fallback mode (no engine)', 'fallback');
                        log('RAGina engine not available — using direct API fallback', 'warning');
                        if (window.__onRAGinaFallback) window.__onRAGinaFallback();
                    }
                }, 10000);
            }

            // Expose callbacks
            window.__onRAGinaReady = function() {
                if (window.PremCall && typeof window.PremCall._setRAGinaReady === 'function') {
                    window.PremCall._setRAGinaReady(true);
                }
            };
            window.__onRAGinaFallback = function() {
                if (window.PremCall && typeof window.PremCall._setRAGinaReady === 'function') {
                    window.PremCall._setRAGinaReady(false); // fallback mode
                }
            };
            window.__isRAGinaReady = function() {
                return typeof window.RAGina !== 'undefined' &&
                    typeof window.RAGina.getEngine === 'function' &&
                    window.RAGina.getEngine() &&
                    window.RAGina.getEngine().isReady;
            };
        })();
    </script>

    <script>

                    raginaEngineReady = !!(engine && engine.isReady);
                    return raginaEngineReady;
                } catch (e) {
                    return false;
                }
            }

            // Called when RAGina loads successfully
            global.__onRAGinaReady = function() {
                raginaEngineReady = checkRAGinaEngine();
                raginaFallbackMode = false;
                log('RAGina engine ready: ' + raginaEngineReady, 'info');
            };

            // Called when RAGina fails to load
            global.__onRAGinaFallback = function() {

            let peer = null;

            let remoteStream = null;
            let inCall = false;
            let muted = false;

            // RAGina call state
            let raginaCallActive = false;

            let raginaIsMuted = false;

            // ---------- TTS ----------
            let ttsVoices = [];
            let speechUnlocked = false;

            function refreshVoices() {
                if (window.speechSynthesis) ttsVoices = window.speechSynthesis.getVoices();
            }
            if (window.speechSynthesis) {
                refreshVoices();
                window.speechSynthesis.onvoiceschanged = refreshVoices;

            function unlockSpeech() {
                if (!window.speechSynthesis || speechUnlocked) return;

                    const primer = new SpeechSynthesisUtterance(' ');
                    primer.volume = 0;

            }

            let speechQueue = Promise.resolve();

            function speakText(text) {

                if (!clean) return;
                speechQueue = speechQueue.then(() => new Promise((resolve) => {
                    window.speechSynthesis.cancel();
                    setTimeout(() => {
                        const utterance = new SpeechSynthesisUtterance(clean);
                        utterance.lang = 'en-US';
                        utterance.rate = 1;
                        utterance.pitch = 1;
                        utterance.volume = 1;
                        const preferred = ttsVoices.find(v => v.lang === 'en-US') || ttsVoices[0];
                        if (preferred) utterance.voice = preferred;
                        utterance.onerror = () => resolve();
                        utterance.onend = () => resolve();
                        try {
                            window.speechSynthesis.speak(utterance);
                            if (window.speechSynthesis.paused) window.speechSynthesis.resume();
                        } catch (e) {
                            resolve();
                        }
                        setTimeout(resolve, 12000);
                    }, 60);
                }));
            }

            // ---------- Logging ----------
            function log(msg, level) {
                console.log('[PremCall]', msg);
                if (callbacks.onLog) callbacks.onLog(msg, level);
            }

            function fire(name, data) {
                if (callbacks[name]) callbacks[name](data);
            }

            // ---------- PeerJS handlers ----------
            function resetCallState() {
                if (activeCall) {
                    try { activeCall.close(); } catch (e) {}
                }
                activeCall = null;
                remoteStream = null;
                inCall = false;
                incomingCall = null;
                muted = false;
            }

            async function getLocalStream() {
                if (localStream && localStream.getAudioTracks().length > 0) return localStream;
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                    });
                    localStream = stream;
                    log('Microphone acquired', 'info');
                    return stream;
                } catch (e) {
                    log('Microphone error: ' + e.message, 'error');
                    throw e;
                }
            }

            function wireCallEvents(call, isCaller) {
                activeCall = call;
                inCall = true;
                fire('onCallStarted', { target: call.peer, isCaller: isCaller });

                call.on('stream', function(stream) {
                    remoteStream = stream;
                    fire('onRemoteStream', remoteStream);
                });

                call.on('close', function() {
                    resetCallState();
                    fire('onCallEnded', null);
                });

                call.on('error', function(err) {
                    log('Call error: ' + err.message, 'error');
                    resetCallState();
                    fire('onError', err);
                });

                const pc = call.peerConnection;
                if (pc) {
                    pc.oniceconnectionstatechange = function() {
                        const state = pc.iceConnectionState;
                        log('ICE state: ' + state, 'info');
                        if (state === 'connected' || state === 'completed') {
                            fire('onConnected', null);
                        }
                        if (state === 'failed' || state === 'disconnected') {
                            resetCallState();
                            fire('onError', new Error('Connection lost'));
                        }
                    };
                }
            }

            function attachPeerHandlers() {
                if (!peer) return;

                peer.on('open', function(id) {
                    log('Connected with ID: ' + id, 'info');
                    fire('online', id);
                    fire('onConnected', id);
                });

                peer.on('error', function(err) {
                    log('Peer error: ' + err.type + ' - ' + err.message, 'error');
                    if (err.type === 'unavailable-id') {
                        fire('onError', new Error('Number already taken'));
                    } else {
                        fire('onError', err);
                    }
                });

                peer.on('close', function() {
                    log('Peer connection closed', 'warn');
                    fire('offline', null);
                    fire('onDisconnected', null);
                    if (inCall && !raginaCallActive) resetCallState();
                });

                peer.on('disconnected', function() {
                    log('Peer disconnected - reconnecting...', 'warn');
                    fire('offline', null);
                    fire('onDisconnected', null);
                    setTimeout(function() {
                        if (peer && !peer.destroyed) peer.reconnect();
                    }, 3000);
                });

                peer.on('call', function(call) {
                    if (inCall || raginaCallActive) {
                        call.close();
                        log('Rejected - already in call', 'warn');
                        return;
                    }
                    incomingCall = call;
                    fire('onIncoming', call.peer);
                });

                peer.on('connection', function(conn) {
                    conn.on('data', function(data) {
                        try {
                            const msg = typeof data === 'string' ? JSON.parse(data) : data;
                            if (msg && msg.type === 'premcall-message') {
                                const message = {
                                    from: msg.from,
                                    text: msg.text,
                                    timestamp: msg.timestamp || Date.now(),
                                    direction: 'incoming'
                                };
                                messageListeners.forEach(function(cb) { cb(message); });
                                fire('onMessage', message);
                            }
                        } catch (e) { console.warn('[PremCall] Invalid message data', e); }
                    });
                });
            }

            // ---------- RAGina call logic (fallback-friendly) ----------
            async function askRAGina(query) {
                // Try to use engine if ready, else fallback to direct API
                if (!raginaFallbackMode && raginaEngineReady) {
                    try {
                        const engine = global.RAGina?.getEngine?.();
                        if (engine && engine.isReady) {
                            const chunks = engine.retrieve(query, 3);
                            const contextText = chunks.length > 0 ?
                                chunks.map((c, i) => `[${i+1}] ${c.source || 'doc'}\n${c.text}`).join('\n\n') :
                                'No relevant documents found.';
                            const prompt =
                                `You are RAGina, a sassy mentalist who can read any document. Answer using ONLY the context below. If the answer isn't there, respond with attitude that the info isn't in the files.\n\nContext:\n${contextText}\n\nQuestion: ${query}\nAnswer (as RAGina, with sass):`;
                            const resp = await fetch('https://ragina-crawler-ragina.vercel.app/api/ask', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ prompt })
                            });
                            if (!resp.ok) throw new Error(`LLM error: ${resp.status}`);
                            const data = await resp.json();
                            if (data.error) throw new Error(data.error);
                            return data.text || 'No response from RAGina.';
                        }
                    } catch (e) {
                        console.warn('Engine retrieval failed, falling back to direct API', e);
                        // fall through to fallback
                    }
                }

                // FALLBACK: direct API without context
                try {
                    const prompt =
                        `You are RAGina, a helpful assistant. Answer the following question concisely and clearly:\n\nQuestion: ${query}\nAnswer:`;
                    const resp = await fetch('https://ragina-crawler-ragina.vercel.app/api/ask', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt })
                    });
                    if (!resp.ok) throw new Error(`LLM error: ${resp.status}`);
                    const data = await resp.json();
                    if (data.error) throw new Error(data.error);
                    return data.text || 'No response from RAGina.';
                } catch (err) {
                    console.error('Direct API error:', err);
                    return "I'm sorry, I'm having trouble answering right now. Please try again in a moment.";
                }
            }

            // ---------- Transcript UI ----------
            function addCallTranscript(role, text) {
                const container = document.getElementById('callTranscript');
                if (!container) return;
                const hint = container.querySelector('.empty-hint');
                if (hint) hint.remove();

                const div = document.createElement('div');
                div.className = 'msg';
                const who = document.createElement('span');
                who.className = 'who ' + (role === 'user' ? 'user' : 'ragina');
                who.textContent = role === 'user' ? 'You' : 'RAGina';
                const txt = document.createElement('span');
                txt.className = 'text';
                txt.textContent = text;
                div.appendChild(who);
                div.appendChild(txt);
                container.appendChild(div);
                container.scrollTop = container.scrollHeight;
            }

            function clearCallTranscript() {
                const container = document.getElementById('callTranscript');
                if (!container) return;
                container.innerHTML = '<div class="empty-hint">Conversation will appear here…</div>';
            }

            // ---------- Export ----------
            function buildTranscriptText() {
                const lines = raginaTranscript.map(m => {
                    const time = new Date(m.timestamp).toLocaleTimeString();
                    const who = m.role === 'user' ? 'You' : 'RAGina';
                    return `[${time}] ${who}: ${m.text}`;
                });
                const header = `RAGina Call Transcript\nStarted: ${new Date(raginaCallStart || Date.now()).toLocaleString()}\n\n`;
                return header + (lines.length ? lines.join('\n') : '(no exchanges recorded)');
            }

            function buildTranscriptJSON() {
                return {
                    callType: 'RAGina',
                    number: RAGINA_NUMBER,
                    name: RAGINA_NAME,
                    started: raginaCallStart ? new Date(raginaCallStart).toISOString() : null,
                    ended: new Date().toISOString(),
                    messages: raginaTranscript.map(m => ({
                        role: m.role === 'user' ? 'user' : 'assistant',
                        text: m.text,
                        timestamp: new Date(m.timestamp).toISOString()
                    }))
                };
            }

            function exportTranscript(format) {
                if (!raginaTranscript.length) {
                    showToast('No conversation to export.');
                    return;
                }
                try {
                    let content, filename, mime;
                    if (format === 'json') {
                        const data = buildTranscriptJSON();
                        content = JSON.stringify(data, null, 2);
                        const stamp = new Date(raginaCallStart || Date.now()).toISOString().replace(/[:.]/g, '-');
                        filename = `ragina-transcript-${stamp}.json`;
                        mime = 'application/json';
                    } else {
                        content = buildTranscriptText();
                        const stamp = new Date(raginaCallStart || Date.now()).toISOString().replace(/[:.]/g, '-');
                        filename = `ragina-transcript-${stamp}.txt`;
                        mime = 'text/plain';
                    }
                    const blob = new Blob([content], { type: mime + ';charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 2000);
                    showToast(`Exported ${format.toUpperCase()}`);
                } catch (e) {
                    console.warn('[PremCall] export failed:', e);
                    showToast('Export failed.');
                }
            }

            // ---------- Start RAGina call ----------
            function startRAGinaCall() {
                if (raginaCallActive || inCall) {
                    showToast('Already in a call.');
                    return;
                }

                // Check if we have any working mode (engine or fallback)
                // We don't require engine to be ready; we'll use fallback if needed
                // But we need speech recognition
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    showToast('Your browser does not support voice calls.');
                    return;
                }

                raginaCallActive = true;
                raginaTranscript = [];
                raginaCallStart = Date.now();
                clearCallTranscript();

                // ---- show full-screen call UI ----
                const avatarEl = document.getElementById('callAvatar');
                avatarEl.innerHTML = '<img src="https://ragina-crawler-ragina.vercel.app/ragina-logo.png" alt="RAGina" onerror="this.textContent=\'🤖\'">';
                document.getElementById('callName').textContent = RAGINA_NAME;
                document.getElementById('callNumber').textContent = RAGINA_NUMBER;
                document.getElementById('callSubstatus').textContent = 'Connecting…';
                document.getElementById('callTimer').textContent = '00:00';
                document.getElementById('callRingWrap').classList.add('ring-anim');
                document.getElementById('callScreen').classList.add('active');
                document.getElementById('dialCallBtn').classList.add('disabled');
                document.getElementById('exportButtons').classList.remove('active');

                // dim main UI
                const dimEls = [
                    document.getElementById('dialerSection'),
                    document.getElementById('historySection'),
                    document.getElementById('logArea'),
                    document.getElementById('mainHeader'),
                    document.getElementById('registerLink')
                ];
                dimEls.forEach(el => { if (el) el.classList.add('dimmed'); });

                // timer
                let seconds = 0;
                if (raginaTimerInterval) clearInterval(raginaTimerInterval);
                raginaTimerInterval = setInterval(() => {
                    seconds++;
                    const m = String(Math.floor(seconds / 60)).padStart(2, '0');
                    const s = String(seconds % 60).padStart(2, '0');
                    document.getElementById('callTimer').textContent = m + ':' + s;
                }, 1000);

                // connect
                setTimeout(() => {
                    document.getElementById('callSubstatus').textContent = 'Connected';
                    document.getElementById('callRingWrap').classList.remove('ring-anim');
                    const mode = raginaFallbackMode ? ' (fallback)' : '';
                    showToast('Connected to RAGina' + mode);
                    const greeting = 'Hello! I\'m RAGina. Ask me anything.' + mode;
                    addCallTranscript('ragina', greeting);
                    raginaTranscript.push({ role: 'assistant', text: greeting, timestamp: Date.now() });
                    speakText(greeting);
                    listenToRAGina();
                }, 1200);

                fire('onCallStarted', { target: RAGINA_NUMBER, isCaller: true, isRAGina: true });
                log('RAGina call started (fallback: ' + raginaFallbackMode + ')', 'success');
            }

            function listenToRAGina() {
                if (!raginaCallActive) return;
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) return;
                if (raginaIsMuted) {
                    setTimeout(listenToRAGina, 500);
                    return;
                }

                raginaRecognition = new SpeechRecognition();
                raginaRecognition.continuous = false;
                raginaRecognition.interimResults = false;
                raginaRecognition.lang = 'en-US';
                raginaRecognition.maxAlternatives = 1;

                raginaRecognition.onresult = async (event) => {
                    const transcript = event.results[0][0].transcript;
                    console.log('User said:', transcript);
                    addCallTranscript('user', transcript);
                    raginaTranscript.push({ role: 'user', text: transcript, timestamp: Date.now() });
                    document.getElementById('callSubstatus').textContent = 'RAGina is thinking…';

                    try {
                        const answer = await askRAGina(transcript);
                        console.log('RAGina answer:', answer);
                        raginaTranscript.push({ role: 'assistant', text: answer, timestamp: Date.now() });
                        document.getElementById('callSubstatus').textContent = 'Connected';
                        addCallTranscript('ragina', answer);
                        speakText(answer);
                    } catch (err) {
                        console.error('RAGina error:', err);
                        document.getElementById('callSubstatus').textContent = 'Error: ' + err.message;
                        addCallTranscript('ragina', 'Sorry, I encountered an error.');
                        raginaTranscript.push({ role: 'assistant', text: 'Sorry, I encountered an error.', timestamp: Date
                                .now() });
                        speakText('Sorry, I encountered an error.');
                    }
                    if (raginaCallActive) setTimeout(listenToRAGina, 800);
                };

                raginaRecognition.onerror = (event) => {
                    console.error('Speech error:', event.error);
                    if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                        showToast('Microphone access denied. Ending call.');
                        endRAGinaCall();
                        return;
                    }
                    if (raginaCallActive) {
                        raginaRecognition = null;
                        setTimeout(listenToRAGina, 600);
                    }
                };

                raginaRecognition.onend = () => {
                    if (raginaCallActive && !raginaIsMuted) {
                        raginaRecognition = null;
                        setTimeout(listenToRAGina, 400);
                    }
                };

                try {
                    raginaRecognition.start();
                } catch (e) {
                    console.warn('Recognition start failed:', e);
                    if (raginaCallActive) {
                        raginaRecognition = null;
                        setTimeout(listenToRAGina, 600);
                    }
                }
            }

            function endRAGinaCall() {
                if (!raginaCallActive) return;
                raginaCallActive = false;
                if (raginaRecognition) {
                    try { raginaRecognition.stop(); } catch (e) {}
                    raginaRecognition = null;
                }
                if (window.speechSynthesis) window.speechSynthesis.cancel();
                if (raginaTimerInterval) {
                    clearInterval(raginaTimerInterval);
                    raginaTimerInterval = null;
                }

                // reset UI
                document.getElementById('callScreen').classList.remove('active');
                document.getElementById('callRingWrap').classList.remove('ring-anim');
                document.getElementById('dialCallBtn').classList.remove('disabled');
                document.getElementById('callSubstatus').textContent = '';
                document.getElementById('callTimer').textContent = '00:00';

                // restore main UI
                const dimEls = [
                    document.getElementById('dialerSection'),
                    document.getElementById('historySection'),
                    document.getElementById('logArea'),
                    document.getElementById('mainHeader'),
                    document.getElementById('registerLink')
                ];
                dimEls.forEach(el => { if (el) el.classList.remove('dimmed'); });

                // show export buttons
                if (raginaTranscript.length) {
                    document.getElementById('exportButtons').classList.add('active');
                }

                // add to history
                const duration = Math.floor((Date.now() - (raginaCallStart || Date.now())) / 1000);
                const durStr = String(Math.floor(duration / 60)).padStart(2, '0') + ':' + String(duration % 60)
                .padStart(2, '0');
                addHistoryEntry(RAGINA_NUMBER, 'outgoing', durStr);

                showToast('Call with RAGina ended');
                fire('onCallEnded', null);
                log('RAGina call ended', 'info');
            }

            function toggleRAGinaMute() {
                raginaIsMuted = !raginaIsMuted;
                if (raginaIsMuted && raginaRecognition) {
                    try { raginaRecognition.stop(); } catch (e) {}
                    raginaRecognition = null;
                }
                if (!raginaIsMuted && raginaCallActive) {
                    listenToRAGina();
                }
                return raginaIsMuted;
            }

            // ---------- PremCall public API ----------
            const PremCall = {
                _setRAGinaReady: function(ready) {
                    raginaEngineReady = ready;
                    raginaFallbackMode = !ready;
                    log('RAGina engine set to ready: ' + ready + ', fallback: ' + raginaFallbackMode, 'info');
                },

                init: function(number, opts) {
                    if (!/^\d{10}$/.test(number)) throw new Error('Number must be exactly 10 digits');
                    if (peer) { peer.destroy();
                        peer = null; }
                    myNumber = number;
                    callbacks = opts || {};
                    if (typeof global.Peer !== 'undefined') {
                        try {
                            peer = new global.Peer(number, { debug: 0, config: CONFIG });
                            attachPeerHandlers();
                        } catch (e) {
                            log('PeerJS init failed: ' + e.message, 'warning');
                            peer = null;
                        }
                    } else {
                        log('PeerJS not available — only RAGina calls work', 'warning');
                    }
                    // Check RAGina status after a moment
                    setTimeout(function() {
                        raginaEngineReady = checkRAGinaEngine();
                        if (raginaEngineReady) {
                            log('RAGina engine ready', 'success');
                        } else {
                            // If not ready, set fallback
                            if (!raginaFallbackMode) {
                                raginaFallbackMode = true;
                                log('RAGina not ready, using fallback mode', 'warning');
                            }
                        }
                    }, 1000);
                },

                call: async function(target) {
                    if (target === RAGINA_NUMBER) {
                        startRAGinaCall();
                        return;
                    }
                    if (inCall || raginaCallActive) throw new Error('Already in a call');
                    if (!peer) throw new Error('PeerJS not available. Only RAGina calls work.');
                    if (!/^\d{10}$/.test(target)) throw new Error('Target must be exactly 10 digits');
                    if (target === myNumber) throw new Error('Cannot call yourself');
                    log('Calling ' + target + '...', 'info');
                    try {
                        const stream = await getLocalStream();
                        const call = peer.call(target, stream);
                        if (!call) throw new Error('Target unreachable');
                        wireCallEvents(call, true);
                    } catch (e) {
                        log('Call failed: ' + e.message, 'error');
                        throw e;
                    }
                },

                answer: async function() {
                    if (!incomingCall) throw new Error('No incoming call');
                    const call = incomingCall;
                    incomingCall = null;
                    try {
                        const stream = await getLocalStream();
                        call.answer(stream);
                        wireCallEvents(call, false);
                    } catch (e) {
                        log('Answer failed: ' + e.message, 'error');
                        throw e;
                    }
                },

                hangup: function() {
                    if (raginaCallActive) { endRAGinaCall(); return; }
                    resetCallState();
                    fire('onCallEnded', null);
                    log('Call ended', 'info');
                },

                mute: function() {
                    if (raginaCallActive) return toggleRAGinaMute();
                    if (!localStream) return muted;
                    muted = !muted;
                    localStream.getAudioTracks().forEach(function(t) { t.enabled = !muted; });
                    fire('onMuteToggled', muted);
                    return muted;
                },

                speaker: function() {
                    speakerOn = !speakerOn;
                    fire('onSpeakerToggled', speakerOn);
                    return speakerOn;
                },

                checkStatus: function(number) {
                    if (number === RAGINA_NUMBER) {
                        return Promise.resolve(true);
                    }
                    return new Promise(function(resolve) {
                        if (!peer) return resolve(false);
                        const conn = peer.connect(number);
                        let done = false;
                        conn.on('open', function() {
                            if (!done) { done = true;
                                resolve(true);
                                conn.close(); }
                        });
                        conn.on('error', function() {
                            if (!done) { done = true;
                                resolve(false); }
                        });
                        setTimeout(function() {
                            if (!done) { done = true;
                                resolve(false); try { conn.close(); } catch (e) {} }
                        }, 3000);
                    });
                },

                getNumber: function() { return myNumber; },
                isInCall: function() { return inCall || raginaCallActive; },
                unlockSpeech: unlockSpeech,

                destroy: function() {
                    if (peer) { peer.destroy();
                        peer = null; }
                    if (localStream) { localStream.getTracks().forEach(function(t) { t.stop(); });
                        localStream = null; }
                    remoteStream = null;
                    inCall = false;
                    raginaCallActive = false;
                    incomingCall = null;
                    activeCall = null;
                    myNumber = null;
                    muted = false;
                    speakerOn = false;
                    messageListeners.clear();
                    if (raginaRecognition) { try { raginaRecognition.stop(); } catch (e) {}
                        raginaRecognition = null; }
                    if (window.speechSynthesis) window.speechSynthesis.cancel();
                },

                sendMessage: function(target, text) {
                    return new Promise(function(resolve, reject) {
                        if (!peer) return reject(new Error('PeerJS not available.'));
                        if (!/^\d{10}$/.test(target)) return reject(new Error('Target must be 10 digits.'));
                        if (!text || typeof text !== 'string' || text.trim().length === 0) {
                            return reject(new Error('Message cannot be empty.'));
                        }
                        const payload = { type: 'premcall-message', from: myNumber, text: text.trim(),
                            timestamp: Date.now() };
                        const conn = peer.connect(target, { reliable: true });
                        let done = false;
                        conn.on('open', function() {
                            conn.send(JSON.stringify(payload));
                            if (!done) {
                                done = true;
                                const messageObj = { target: target, text: payload.text, timestamp: payload
                                        .timestamp, direction: 'outgoing' };
                                resolve(messageObj);
                                fire('onMessage', messageObj);
                                setTimeout(function() { try { conn.close(); } catch (e) {} }, 500);
                            }
                        });
                        conn.on('error', function(err) { if (!done) { done = true;
                                reject(err); } });
                        setTimeout(function() {
                            if (!done) { done = true;
                                reject(new Error('Send timeout')); try { conn.close(); } catch (e) {} }
                        }, 5000);
                    });
                },

                onMessage: function(cb) { if (typeof cb === 'function') messageListeners.add(cb); },
                offMessage: function(cb) { messageListeners.delete(cb); },

                exportLastTranscript: function() { exportTranscript('txt'); },
                exportLastTranscriptJSON: function() { exportTranscript('json'); }
            };

            global.PremCall = PremCall;
            console.log('[PremCall] Library loaded with robust RAGina fallback.');
        })(window);

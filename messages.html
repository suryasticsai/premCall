<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#070a12" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Messages – PremCall</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/suryasticsai/premCall/main/premCall-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
  :root{
    --bg-0:#05070d; --bg-1:#0a0e18; --surface:#0e1424; --surface-2:#141c30; --surface-3:#1b2540;
    --line:#1e2a42; --text:#eef2fb; --text-dim:#8891ab; --text-faint:#525d78;
    --signal:#4f8cf7; --signal-soft:#2f5fc4; --go:#2fd992; --go-deep:#12683f;
    --stop:#ff5470; --stop-deep:#7a1730; --warn:#ffb648; --warn-deep:#5c3d10;
    --radius-lg:22px; --radius-md:16px;
    --font-display:'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  body.light-mode{
    --bg-0:#f0f2f5; --bg-1:#ffffff; --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#f1f5f9;
    --line:#d1d5db; --text:#111827; --text-dim:#4b5563; --text-faint:#9ca3af;
    --signal:#2563eb; --signal-soft:#1d4ed8; --go:#10b981; --go-deep:#047857;
    --stop:#ef4444; --stop-deep:#b91c1c; --warn:#f59e0b; --warn-deep:#b45309;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:var(--font-body);
    color:var(--text);
    background:var(--bg-0);
    min-height:100vh; min-height:100dvh;
    display:flex; justify-content:center;
    padding:0;
    overflow-x:hidden;
  }
  .app-container{
    width:100%; max-width:480px; min-height:100vh; min-height:100dvh;
    background:var(--bg-1); display:flex; flex-direction:column;
    position:relative; padding-top:var(--safe-t); padding-bottom:var(--safe-b);
  }
  .header{
    display:flex; align-items:center; padding:0.8rem 1rem;
    background:var(--surface); border-bottom:1px solid var(--line);
    gap:0.8rem; flex-shrink:0;
  }
  .header .back-btn{
    background:none; border:none; color:var(--text); font-size:1.4rem; cursor:pointer;
    text-decoration:none; display:flex; align-items:center; justify-content:center;
  }
  .header .title{
    flex:1; font-family:var(--font-display); font-weight:700; font-size:1.2rem;
    display:flex; align-items:center; gap:0.5rem;
    flex-wrap:wrap;
  }
  .header .title .my-number{
    font-size:0.7rem; font-weight:400; color:var(--text-dim);
    font-family:var(--font-body);
  }
  .header .icon-btn{
    background:none; border:none; color:var(--text-dim); font-size:1.2rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0.4rem;
    transition:color .2s;
  }
  .header .icon-btn:hover{ color:var(--text); }
  .header .icon-btn:disabled{
    opacity:0.4; cursor:not-allowed;
  }
  .status-badge {
    display:inline-block; padding:0.2rem 0.6rem; border-radius:10px;
    font-size:0.6rem; font-weight:600;
  }
  .status-badge.online { background:var(--go); color:#fff; }
  .status-badge.offline { background:var(--stop); color:#fff; }
  .status-badge.connecting { background:var(--warn); color:#fff; }
  
  .conversation-list{
    flex:1; overflow-y:auto; padding:0.5rem 0;
  }
  .conversation-item{
    display:flex; align-items:center; gap:0.8rem; padding:0.8rem 1rem;
    border-bottom:1px solid var(--surface-2); cursor:pointer; transition:background .15s;
  }
  .conversation-item:hover{ background:var(--surface-2); }
  .conversation-item .avatar{
    width:48px; height:48px; border-radius:50%; background:var(--surface-3);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:1.1rem; color:var(--text);
    flex-shrink:0;
  }
  .conversation-item .info{ flex:1; min-width:0; }
  .conversation-item .name{ font-weight:600; font-size:0.95rem; }
  .conversation-item .preview{
    font-size:0.8rem; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .conversation-item .time{ font-size:0.7rem; color:var(--text-faint); flex-shrink:0; }
  .conversation-item .status-dot{
    width:8px; height:8px; border-radius:50%; display:inline-block; margin-left:0.3rem;
  }
  .conversation-item .status-dot.online{ background:var(--go); }
  .conversation-item .status-dot.offline{ background:var(--stop); }
  .conversation-item .status-dot.unknown{ background:var(--text-faint); }
  
  .empty-state{
    text-align:center; color:var(--text-faint); padding:2rem; font-size:0.9rem;
  }
  .empty-state .icon{ font-size:2.5rem; display:block; margin-bottom:0.8rem; opacity:0.5; }
  .empty-state .sub-text{ font-size:0.8rem; opacity:0.7; margin-top:0.3rem; }
  
  .chat-view{
    flex:1; display:flex; flex-direction:column;
  }
  .chat-header{
    display:flex; align-items:center; gap:0.8rem; padding:0.8rem 1rem;
    background:var(--surface); border-bottom:1px solid var(--line); flex-shrink:0;
  }
  .chat-header .back-btn{
    background:none; border:none; color:var(--text); font-size:1.4rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .chat-header .avatar{
    width:36px; height:36px; border-radius:50%; background:var(--surface-3);
    display:flex; align-items:center; justify-content:center; font-weight:700;
    color:var(--text);
  }
  .chat-header .peer-info{
    flex:1; display:flex; flex-direction:column;
  }
  .chat-header .peer-name{
    font-family:var(--font-display); font-weight:600; font-size:0.95rem;
  }
  .chat-header .peer-status{
    font-size:0.7rem; color:var(--text-dim);
  }
  .chat-header .peer-status .status-dot{
    width:6px; height:6px; border-radius:50%; display:inline-block; margin-right:0.3rem;
  }
  .chat-header .peer-status .status-dot.online{ background:var(--go); }
  .chat-header .peer-status .status-dot.offline{ background:var(--stop); }
  .chat-header .peer-status .status-dot.unknown{ background:var(--text-faint); }
  
  .messages{
    flex:1; overflow-y:auto; padding:1rem; display:flex; flex-direction:column; gap:0.4rem;
  }
  .message-wrapper{
    display:flex; flex-direction:column; max-width:85%;
  }
  .message-wrapper.outgoing{
    align-self:flex-end; align-items:flex-end;
  }
  .message-wrapper.incoming{
    align-self:flex-start; align-items:flex-start;
  }
  .message-bubble{
    padding:0.6rem 0.9rem; border-radius:16px; font-size:0.9rem;
    white-space:pre-wrap; word-break:break-word; position:relative;
    animation:fadeIn .2s ease;
  }
  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(5px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .message-wrapper.outgoing .message-bubble{
    background:var(--signal); color:#fff;
    border-bottom-right-radius:4px;
  }
  .message-wrapper.incoming .message-bubble{
    background:var(--surface-2); color:var(--text);
    border-bottom-left-radius:4px;
  }
  .message-sender{
    font-size:0.65rem; color:var(--text-faint); margin:0 0.3rem 0.1rem 0.3rem;
    font-weight:500;
  }
  .message-wrapper.outgoing .message-sender{
    color:var(--signal);
  }
  .message-wrapper.incoming .message-sender{
    color:var(--text-dim);
  }
  .message-timestamp{
    font-size:0.6rem; opacity:0.6; margin-top:0.15rem; display:block; text-align:right;
  }
  .message-wrapper.outgoing .message-timestamp{
    color:rgba(255,255,255,0.7);
  }
  .message-wrapper.incoming .message-timestamp{
    color:var(--text-faint);
  }
  
  .chat-input-area{
    display:flex; gap:0.5rem; padding:0.8rem; background:var(--surface);
    border-top:1px solid var(--line); flex-shrink:0;
  }
  .chat-input-area input{
    flex:1; padding:0.6rem 1rem; border-radius:20px; border:1px solid var(--line);
    background:var(--bg-0); color:var(--text); outline:none;
    font-family:inherit; font-size:0.95rem;
  }
  .chat-input-area input::placeholder{
    color:var(--text-faint);
  }
  .chat-input-area input:focus{
    border-color:var(--signal);
  }
  .chat-input-area input:disabled{
    opacity:0.5;
  }
  .chat-input-area button{
    width:42px; height:42px; border-radius:50%; border:none; background:var(--signal);
    color:#fff; cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center;
    transition:opacity .2s, transform .1s;
  }
  .chat-input-area button:disabled{
    opacity:0.4; cursor:not-allowed;
  }
  .chat-input-area button:active:not(:disabled){
    transform:scale(0.95);
  }
  .hidden{ display:none !important; }
  
  #toast {
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
    background:var(--surface-3); border:1px solid var(--line);
    color:var(--text); padding:0.7rem 1.3rem; border-radius:40px;
    font-size:0.85rem; z-index:11000; opacity:0; transition:opacity .3s;
    pointer-events:none; max-width:90%;
    font-family:var(--font-body);
  }

  .connection-status {
    display:flex; align-items:center; gap:0.3rem;
    font-size:0.65rem; color:var(--text-dim);
  }
  .connection-status .pulse {
    width:6px; height:6px; border-radius:50%; display:inline-block;
    animation:pulse 1.5s ease-in-out infinite;
  }
  .connection-status .pulse.online { background:var(--go); }
  .connection-status .pulse.offline { background:var(--stop); animation:none; }
  .connection-status .pulse.connecting { background:var(--warn); }
  
  @keyframes pulse {
    0%, 100% { opacity:1; transform:scale(1); }
    50% { opacity:0.5; transform:scale(0.8); }
  }

  .peer-online-status {
    font-size:0.65rem;
  }
  .peer-online-status.online { color:var(--go); }
  .peer-online-status.offline { color:var(--stop); }
  .peer-online-status.unknown { color:var(--text-faint); }

  /* Reconnection status bar */
  .reconnect-bar {
    background:var(--warn-deep);
    color:#fff;
    padding:0.4rem 1rem;
    text-align:center;
    font-size:0.75rem;
    display:none;
    animation:slideDown .3s ease;
  }
  .reconnect-bar.show {
    display:block;
  }
  @keyframes slideDown {
    from { opacity:0; transform:translateY(-10px); }
    to { opacity:1; transform:translateY(0); }
  }
  .reconnect-bar .spinner {
    display:inline-block;
    animation:spin 1s linear infinite;
    margin-right:0.5rem;
  }
  @keyframes spin {
    from { transform:rotate(0deg); }
    to { transform:rotate(360deg); }
  }
</style>
</head>
<body>

<div class="app-container" id="app">
  <!-- Reconnection bar -->
  <div class="reconnect-bar" id="reconnectBar">
    <span class="spinner"><i class="fas fa-spinner"></i></span>
    Reconnecting to server...
  </div>

  <div class="header" id="listHeader">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <span class="title">
      Messages
      <span class="status-badge offline" id="statusBadge">Offline</span>
      <span class="my-number" id="myNumberDisplay"></span>
    </span>
    <button class="icon-btn" id="newChatBtn"><i class="fas fa-plus"></i></button>
  </div>
  <div class="conversation-list" id="conversationList">
    <div class="empty-state">
      <span class="icon"><i class="fas fa-comments"></i></span>
      Loading messages...
    </div>
  </div>
  <div class="chat-view hidden" id="chatView">
    <div class="chat-header">
      <button class="back-btn" id="chatBackBtn"><i class="fas fa-arrow-left"></i></button>
      <div class="avatar" id="chatPeerAvatar">?</div>
      <div class="peer-info">
        <span class="peer-name" id="chatPeerName"></span>
        <span class="peer-status" id="chatPeerStatus">
          <span class="status-dot unknown"></span>
          <span class="peer-online-status unknown">Checking...</span>
        </span>
      </div>
      <button class="icon-btn" id="refreshPeerStatus" title="Check status"><i class="fas fa-sync-alt"></i></button>
    </div>
    <div class="messages" id="messagesContainer"></div>
    <div class="chat-input-area">
      <input type="text" id="messageInput" placeholder="Connecting..." autocomplete="off" disabled />
      <button id="sendBtn" disabled><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>
</div>
<div id="toast"></div>

<!-- Load PeerJS -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script>
/* ============================================================
   PremCall v2.2  (Persistent connections)
   WebRTC calling + chat over PeerJS with persistent connections
   ============================================================ */
(function (global) {
  'use strict';

  if (typeof global.Peer === 'undefined') {
    console.error('[PremCall] The PeerJS library was not found.');
    return;
  }

  const CONFIG = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun2.l.google.com:19302' },
      { urls: 'stun:stun3.l.google.com:19302' },
      { urls: 'stun:stun4.l.google.com:19302' },
      { urls: 'stun:stun.ekiga.net' },
      { urls: 'stun:stun.ideasip.com' },
      {
        urls: ['turn:numb.viagenie.ca:3478', 'turn:numb.viagenie.ca:443'],
        username: 'webrtc@live.com',
        credential: 'muazkh'
      }
    ],
    iceCandidatePoolSize: 10
  };

  // ─── State ──────────────────────────────────────────────────
  let peer = null;
  let myNumber = null;
  let incomingCall = null;
  let activeCall = null;
  let localStream = null;
  let remoteStream = null;
  let inCall = false;
  let muted = false;
  let speakerOn = false;
  let callbacks = {};
  let messageListeners = new Set();
  let persistentConnections = {}; // Store persistent data connections
  let reconnectAttempts = 0;
  const MAX_RECONNECT_ATTEMPTS = 10;
  let reconnectTimer = null;

  // ─── Internal helpers ──────────────────────────────────────
  function log(message, level) {
    console.log('[PremCall]', message);
    if (callbacks.onLog) callbacks.onLog(message, level);
  }

  function fire(name, data) {
    if (callbacks[name]) callbacks[name](data);
  }

  function resetCallState() {
    if (activeCall) {
      try { activeCall.close(); } catch (e) {}
    }
    activeCall = null;
    remoteStream = null;
    inCall = false;
    incomingCall = null;
    muted = false;
  }

  async function getLocalStream() {
    if (localStream && localStream.getAudioTracks().length > 0) return localStream;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });
      localStream = stream;
      log('Microphone acquired', 'info');
      return stream;
    } catch (e) {
      log('Microphone error: ' + e.message, 'error');
      throw e;
    }
  }

  function wireCallEvents(call, isCaller) {
    activeCall = call;
    inCall = true;
    fire('onCallStarted', { target: call.peer, isCaller: isCaller });

    call.on('stream', function (stream) {
      remoteStream = stream;
      fire('onRemoteStream', remoteStream);
    });

    call.on('close', function () {
      resetCallState();
      fire('onCallEnded', null);
    });

    call.on('error', function (err) {
      log('Call error: ' + err.message, 'error');
      resetCallState();
      fire('onError', err);
    });

    const pc = call.peerConnection;
    if (pc) {
      pc.oniceconnectionstatechange = function () {
        const state = pc.iceConnectionState;
        log('ICE state: ' + state, 'info');
        if (state === 'connected' || state === 'completed') {
          fire('onConnected', null);
        }
        if (state === 'failed' || state === 'disconnected') {
          resetCallState();
          fire('onError', new Error('Connection lost'));
        }
      };
    }
  }

  function setupPersistentConnection(conn) {
    const peerId = conn.peer;
    
    // Store the connection
    persistentConnections[peerId] = conn;
    
    conn.on('data', function (data) {
      try {
        const msg = typeof data === 'string' ? JSON.parse(data) : data;
        if (msg && msg.type === 'premcall-message') {
          const message = {
            from: msg.from,
            text: msg.text,
            timestamp: msg.timestamp || Date.now(),
            direction: 'incoming'
          };
          messageListeners.forEach(function (cb) { cb(message); });
          fire('onMessage', message);
        }
      } catch (e) {
        console.warn('[PremCall] Invalid message data', e);
      }
    });

    conn.on('close', function () {
      log('Connection closed with: ' + peerId, 'warn');
      delete persistentConnections[peerId];
      // Attempt to reconnect
      setTimeout(function() {
        if (peer && !peer.destroyed) {
          log('Reconnecting to: ' + peerId, 'info');
          connectToPeer(peerId);
        }
      }, 2000);
    });

    conn.on('error', function (err) {
      log('Connection error with ' + peerId + ': ' + err.message, 'error');
    });
  }

  function connectToPeer(peerId) {
    if (!peer || peer.destroyed) return;
    if (persistentConnections[peerId]) {
      // Already connected
      return;
    }
    
    log('Establishing persistent connection to: ' + peerId, 'info');
    const conn = peer.connect(peerId, { reliable: true });
    
    conn.on('open', function () {
      log('Persistent connection established with: ' + peerId, 'info');
      setupPersistentConnection(conn);
    });
    
    conn.on('error', function (err) {
      log('Failed to connect to ' + peerId + ': ' + err.message, 'error');
      // Retry after delay
      setTimeout(function() {
        if (peer && !peer.destroyed) {
          connectToPeer(peerId);
        }
      }, 3000);
    });
  }

  function attachPeerHandlers() {
    peer.on('open', function (id) {
      log('Connected with ID: ' + id, 'info');
      reconnectAttempts = 0;
      fire('online', id);
      fire('onConnected', id);
      
      // Reconnect to existing peers
      Object.keys(persistentConnections).forEach(function(peerId) {
        if (!persistentConnections[peerId] || persistentConnections[peerId].destroyed) {
          delete persistentConnections[peerId];
          connectToPeer(peerId);
        }
      });
    });

    peer.on('error', function (err) {
      log('Peer error: ' + err.type + ' - ' + err.message, 'error');
      if (err.type === 'unavailable-id') {
        fire('onError', new Error('Number already taken'));
      } else if (err.type === 'network') {
        // Network error - attempt reconnect
        handleReconnect();
      } else {
        fire('onError', err);
      }
    });

    peer.on('close', function () {
      log('Connection closed', 'warn');
      fire('offline', null);
      fire('onDisconnected', null);
      if (inCall) resetCallState();
      handleReconnect();
    });

    peer.on('disconnected', function () {
      log('Disconnected - reconnecting...', 'warn');
      fire('offline', null);
      fire('onDisconnected', null);
      handleReconnect();
    });

    peer.on('call', function (call) {
      log('Incoming call from: ' + call.peer, 'info');
      if (inCall) {
        call.close();
        log('Rejected - already in call', 'warn');
        return;
      }
      incomingCall = call;
      fire('onIncoming', call.peer);
    });

    // ─── Persistent message connections ──────────────────────
    peer.on('connection', function (conn) {
      log('New connection from: ' + conn.peer, 'info');
      setupPersistentConnection(conn);
    });
  }

  function handleReconnect() {
    if (reconnectTimer) return;
    
    reconnectAttempts++;
    if (reconnectAttempts > MAX_RECONNECT_ATTEMPTS) {
      log('Max reconnect attempts reached', 'error');
      fire('onError', new Error('Unable to reconnect to server'));
      return;
    }
    
    const delay = Math.min(1000 * reconnectAttempts, 30000);
    log('Reconnect attempt ' + reconnectAttempts + ' in ' + delay + 'ms', 'info');
    fire('onReconnecting', { attempt: reconnectAttempts, delay: delay });
    
    reconnectTimer = setTimeout(function() {
      reconnectTimer = null;
      if (peer && !peer.destroyed) {
        peer.reconnect();
      } else if (peer && peer.destroyed) {
        // Recreate peer
        log('Recreating peer instance', 'info');
        const oldPeer = peer;
        peer = new global.Peer(myNumber, { debug: 2, config: CONFIG });
        attachPeerHandlers();
        if (oldPeer) {
          try { oldPeer.destroy(); } catch(e) {}
        }
      }
    }, delay);
  }

  // ─── Public API ──────────────────────────────────────────
  const PremCall = {
    init: function (number, opts) {
      if (!/^\d{10}$/.test(number)) {
        throw new Error('Number must be exactly 10 digits');
      }
      
      if (peer) {
        peer.destroy();
        peer = null;
      }
      
      myNumber = number;
      callbacks = opts || {};
      peer = new global.Peer(number, { debug: 2, config: CONFIG });
      attachPeerHandlers();
      
      // Restore persistent connections from localStorage
      try {
        const savedPeers = JSON.parse(localStorage.getItem('premCallPeers') || '[]');
        savedPeers.forEach(function(peerId) {
          if (peerId && peerId !== myNumber) {
            setTimeout(function() {
              connectToPeer(peerId);
            }, 1000);
          }
        });
      } catch (e) {}
    },

    connectToPeer: function(peerId) {
      if (!peer || peer.destroyed) {
        log('Cannot connect: Peer not initialized', 'error');
        return;
      }
      if (!/^\d{10}$/.test(peerId)) {
        log('Invalid peer ID: ' + peerId, 'error');
        return;
      }
      if (peerId === myNumber) {
        log('Cannot connect to self', 'warn');
        return;
      }
      
      // Save for reconnection
      try {
        let savedPeers = JSON.parse(localStorage.getItem('premCallPeers') || '[]');
        if (!savedPeers.includes(peerId)) {
          savedPeers.push(peerId);
          localStorage.setItem('premCallPeers', JSON.stringify(savedPeers));
        }
      } catch (e) {}
      
      connectToPeer(peerId);
    },

    call: async function (target) {
      if (inCall) throw new Error('Already in a call');
      if (!peer) throw new Error('Not initialized. Call init() first.');
      if (!/^\d{10}$/.test(target)) throw new Error('Target must be exactly 10 digits');
      if (target === myNumber) throw new Error('Cannot call yourself');
      
      log('Calling ' + target + '...', 'info');
      try {
        const stream = await getLocalStream();
        const call = peer.call(target, stream);
        if (!call) throw new Error('Target unreachable');
        wireCallEvents(call, true);
      } catch (e) {
        log('Call failed: ' + e.message, 'error');
        throw e;
      }
    },

    answer: async function () {
      if (!incomingCall) throw new Error('No incoming call');
      const call = incomingCall;
      incomingCall = null;
      try {
        const stream = await getLocalStream();
        call.answer(stream);
        wireCallEvents(call, false);
      } catch (e) {
        log('Answer failed: ' + e.message, 'error');
        throw e;
      }
    },

    hangup: function () {
      resetCallState();
      fire('onCallEnded', null);
      log('Call ended', 'info');
    },

    mute: function () {
      if (!localStream) return muted;
      muted = !muted;
      localStream.getAudioTracks().forEach(function (t) { t.enabled = !muted; });
      fire('onMuteToggled', muted);
      return muted;
    },

    speaker: function () {
      speakerOn = !speakerOn;
      fire('onSpeakerToggled', speakerOn);
      return speakerOn;
    },

    checkStatus: function (number) {
      return new Promise(function (resolve) {
        if (!peer) return resolve(false);
        
        // Check if we have a persistent connection
        if (persistentConnections[number] && persistentConnections[number].open) {
          return resolve(true);
        }
        
        const conn = peer.connect(number);
        let done = false;
        conn.on('open', function () {
          if (!done) { 
            done = true; 
            resolve(true); 
            // Make it persistent
            setupPersistentConnection(conn);
            conn.close();
          }
        });
        conn.on('error', function () {
          if (!done) { done = true; resolve(false); }
        });
        setTimeout(function () {
          if (!done) { 
            done = true; 
            resolve(false); 
            try { conn.close(); } catch (e) {} 
          }
        }, 3000);
      });
    },

    getNumber: function () { return myNumber; },
    isInCall: function () { return inCall; },
    getPeerConnections: function () { return Object.keys(persistentConnections); },

    destroy: function () {
      if (reconnectTimer) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }
      
      // Close all persistent connections
      Object.keys(persistentConnections).forEach(function(key) {
        try { persistentConnections[key].close(); } catch(e) {}
      });
      persistentConnections = {};
      
      if (peer) { 
        peer.destroy(); 
        peer = null; 
      }
      if (localStream) {
        localStream.getTracks().forEach(function (t) { t.stop(); });
        localStream = null;
      }
      remoteStream = null;
      inCall = false;
      incomingCall = null;
      activeCall = null;
      myNumber = null;
      muted = false;
      speakerOn = false;
      messageListeners.clear();
      
      try {
        localStorage.removeItem('premCallPeers');
      } catch(e) {}
    },

    sendMessage: function (target, text) {
      return new Promise(function (resolve, reject) {
        if (!peer) return reject(new Error('PremCall not initialized.'));
        if (!/^\d{10}$/.test(target)) return reject(new Error('Target must be 10 digits.'));
        if (!text || typeof text !== 'string' || text.trim().length === 0) {
          return reject(new Error('Message cannot be empty.'));
        }
        
        const payload = {
          type: 'premcall-message',
          from: myNumber,
          text: text.trim(),
          timestamp: Date.now()
        };
        
        // Use persistent connection if available
        if (persistentConnections[target] && persistentConnections[target].open) {
          try {
            persistentConnections[target].send(JSON.stringify(payload));
            const messageObj = { 
              target: target, 
              text: payload.text, 
              timestamp: payload.timestamp, 
              direction: 'outgoing' 
            };
            resolve(messageObj);
            fire('onMessage', messageObj);
            return;
          } catch (e) {
            // Fall through to create new connection
            delete persistentConnections[target];
          }
        }
        
        // Create new connection
        const conn = peer.connect(target, { reliable: true });
        let done = false;
        
        conn.on('open', function () {
          // Make it persistent
          setupPersistentConnection(conn);
          
          conn.send(JSON.stringify(payload));
          if (!done) {
            done = true;
            const messageObj = { 
              target: target, 
              text: payload.text, 
              timestamp: payload.timestamp, 
              direction: 'outgoing' 
            };
            resolve(messageObj);
            fire('onMessage', messageObj);
          }
        });
        
        conn.on('error', function (err) { 
          if (!done) { 
            done = true; 
            reject(err); 
          } 
        });
        
        setTimeout(function () {
          if (!done) {
            done = true;
            reject(new Error('Send timeout'));
            try { conn.close(); } catch (e) {}
          }
        }, 10000);
      });
    },

    onMessage: function (cb) { 
      if (typeof cb === 'function') messageListeners.add(cb); 
    },

    offMessage: function (cb) { 
      messageListeners.delete(cb); 
    }
  };

  global.PremCall = PremCall;
  console.log('[PremCall] Library loaded (v2.2 - Persistent).');
})(window);
</script>

<!-- Main App Script -->
<script>
(function() {
  'use strict';

  /* ---------- Helpers ---------- */
  function escapeHtml(text) {
    if (text == null) return '';
    return String(text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function showToast(msg) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.opacity = '1';
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function() { toast.style.opacity = '0'; }, 3000);
  }

  function updateStatus(status) {
    var badge = document.getElementById('statusBadge');
    var statusMap = {
      'online': 'Online',
      'offline': 'Offline',
      'connecting': 'Connecting...'
    };
    badge.textContent = statusMap[status] || status;
    badge.className = 'status-badge ' + status;
    
    // Show/hide reconnect bar
    var reconnectBar = document.getElementById('reconnectBar');
    if (status === 'offline' || status === 'connecting') {
      reconnectBar.classList.add('show');
    } else {
      reconnectBar.classList.remove('show');
    }
  }

  function setInputEnabled(enabled) {
    var input = document.getElementById('messageInput');
    var sendBtn = document.getElementById('sendBtn');
    input.disabled = !enabled;
    sendBtn.disabled = !enabled;
    if (enabled) {
      input.placeholder = 'Type a message…';
    } else {
      input.placeholder = 'Connecting...';
    }
  }

  function initials(peer) {
    if (!peer) return '?';
    var digits = peer.replace(/\D/g, '');
    return digits.slice(-2) || '?';
  }

  function formatTime(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function formatDate(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    if (isNaN(d.getTime())) return '';
    var today = new Date();
    if (d.toDateString() === today.toDateString()) {
      return 'Today';
    }
    var yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);
    if (d.toDateString() === yesterday.toDateString()) {
      return 'Yesterday';
    }
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  }

  function sanitizeConversations(data) {
    var out = {};
    for (var key in data) {
      if (Object.prototype.hasOwnProperty.call(data, key)) {
        var arr = data[key];
        if (Array.isArray(arr)) {
          out[key] = arr.filter(function(m) {
            return m && typeof m === 'object';
          }).map(function(m) {
            return {
              text: String(m.text || ''),
              timestamp: typeof m.timestamp === 'number' ? m.timestamp : Date.now(),
              direction: m.direction === 'outgoing' ? 'outgoing' : 'incoming',
              from: m.from || null
            };
          });
        } else {
          out[key] = [];
        }
      }
    }
    return out;
  }

  /* ---------- State ---------- */
  var conversations = {};
  var activePeer = null;
  var isSending = false;
  var isReady = false;
  var myNumber = null;
  var peerStatusCache = {};

  function loadConversations() {
    try {
      return JSON.parse(localStorage.getItem('premCallChats') || '{}');
    } catch (e) {
      console.error('Failed to load conversations:', e);
      return {};
    }
  }

  function saveConversations() {
    try {
      localStorage.setItem('premCallChats', JSON.stringify(conversations));
    } catch (e) {
      console.error('Failed to save conversations:', e);
      showToast('Storage full: unable to save message');
    }
  }

  /* ---------- Peer status checking ---------- */
  function checkPeerStatus(peerNumber) {
    if (!isReady || typeof PremCall === 'undefined' || typeof PremCall.checkStatus !== 'function') {
      return;
    }
    
    PremCall.checkStatus(peerNumber)
      .then(function(isOnline) {
        peerStatusCache[peerNumber] = {
          online: isOnline,
          lastCheck: Date.now()
        };
        updatePeerStatusUI(peerNumber, isOnline);
      })
      .catch(function(err) {
        console.warn('Status check failed for', peerNumber, err);
        peerStatusCache[peerNumber] = {
          online: false,
          lastCheck: Date.now()
        };
        updatePeerStatusUI(peerNumber, false);
      });
  }

  function updatePeerStatusUI(peerNumber, isOnline) {
    var items = document.querySelectorAll('.conversation-item');
    items.forEach(function(item) {
      var nameEl = item.querySelector('.name');
      if (nameEl && nameEl.textContent === peerNumber) {
        var dot = item.querySelector('.status-dot');
        if (dot) {
          dot.className = 'status-dot ' + (isOnline ? 'online' : 'offline');
        }
      }
    });

    if (activePeer === peerNumber) {
      var statusEl = document.getElementById('chatPeerStatus');
      var dot = statusEl.querySelector('.status-dot');
      var text = statusEl.querySelector('.peer-online-status');
      if (dot) {
        dot.className = 'status-dot ' + (isOnline ? 'online' : 'offline');
      }
      if (text) {
        text.textContent = isOnline ? 'Online' : 'Offline';
        text.className = 'peer-online-status ' + (isOnline ? 'online' : 'offline');
      }
    }
  }

  /* ---------- Render functions ---------- */
  function renderConversationList() {
    var listEl = document.getElementById('conversationList');
    listEl.innerHTML = '';
    var peers = Object.keys(conversations);
    if (peers.length === 0) {
      listEl.innerHTML = '<div class="empty-state"><span class="icon"><i class="fas fa-comments"></i></span>No conversations yet<span class="sub-text">Start a chat with any registered number</span></div>';
      return;
    }
    peers.sort(function(a, b) {
      var msgsA = conversations[a];
      var msgsB = conversations[b];
      var lastA = msgsA.length ? (Number(msgsA[msgsA.length - 1].timestamp) || 0) : 0;
      var lastB = msgsB.length ? (Number(msgsB[msgsB.length - 1].timestamp) || 0) : 0;
      return lastB - lastA;
    });

    peers.forEach(function(peer) {
      var msgs = conversations[peer];
      var lastMsg = msgs[msgs.length - 1] || { text: '', timestamp: 0, direction: '' };

      var item = document.createElement('div');
      item.className = 'conversation-item';

      var avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = initials(peer);
      item.appendChild(avatar);

      var info = document.createElement('div');
      info.className = 'info';

      var nameDiv = document.createElement('div');
      nameDiv.className = 'name';
      nameDiv.textContent = peer;
      
      var statusDot = document.createElement('span');
      statusDot.className = 'status-dot unknown';
      nameDiv.appendChild(statusDot);
      
      info.appendChild(nameDiv);

      var preview = document.createElement('div');
      preview.className = 'preview';
      preview.textContent = (lastMsg.direction === 'outgoing' ? 'You: ' : '') + (lastMsg.text || '');
      info.appendChild(preview);

      item.appendChild(info);

      var time = document.createElement('span');
      time.className = 'time';
      time.textContent = formatTime(lastMsg.timestamp);
      item.appendChild(time);

      item.addEventListener('click', function() { openChat(peer); });
      listEl.appendChild(item);

      if (isReady) {
        checkPeerStatus(peer);
        // Establish persistent connection
        if (typeof PremCall !== 'undefined' && PremCall.connectToPeer) {
          PremCall.connectToPeer(peer);
        }
      }
    });
  }

  function openChat(peer) {
    activePeer = peer;
    document.getElementById('listHeader').classList.add('hidden');
    document.getElementById('conversationList').classList.add('hidden');
    document.getElementById('chatView').classList.remove('hidden');

    document.getElementById('chatPeerName').textContent = peer;
    document.getElementById('chatPeerAvatar').textContent = initials(peer);
    
    // Establish persistent connection
    if (isReady && typeof PremCall !== 'undefined' && PremCall.connectToPeer) {
      PremCall.connectToPeer(peer);
    }
    
    if (isReady) {
      checkPeerStatus(peer);
    } else {
      var statusEl = document.getElementById('chatPeerStatus');
      var dot = statusEl.querySelector('.status-dot');
      var text = statusEl.querySelector('.peer-online-status');
      if (dot) dot.className = 'status-dot unknown';
      if (text) {
        text.textContent = 'Checking...';
        text.className = 'peer-online-status unknown';
      }
    }
    
    renderMessages();
    setInputEnabled(isReady);
    if (isReady) {
      document.getElementById('messageInput').focus();
    }
  }

  function closeChat() {
    activePeer = null;
    document.getElementById('chatView').classList.add('hidden');
    document.getElementById('listHeader').classList.remove('hidden');
    document.getElementById('conversationList').classList.remove('hidden');
    renderConversationList();
  }

  function renderMessages() {
    var container = document.getElementById('messagesContainer');
    container.innerHTML = '';
    if (!activePeer || !conversations[activePeer]) return;

    var msgs = conversations[activePeer];
    var lastDate = null;
    
    msgs.forEach(function(msg) {
      var msgDate = formatDate(msg.timestamp);
      if (msgDate !== lastDate) {
        lastDate = msgDate;
        var dateDiv = document.createElement('div');
        dateDiv.style.cssText = 'text-align:center;font-size:0.7rem;color:var(--text-faint);padding:0.5rem 0;';
        dateDiv.textContent = msgDate;
        container.appendChild(dateDiv);
      }

      var wrapper = document.createElement('div');
      wrapper.className = 'message-wrapper ' + (msg.direction === 'outgoing' ? 'outgoing' : 'incoming');

      var sender = document.createElement('div');
      sender.className = 'message-sender';
      if (msg.direction === 'outgoing') {
        sender.textContent = 'You (' + (myNumber || 'Me') + ')';
      } else {
        sender.textContent = msg.from || activePeer;
      }
      wrapper.appendChild(sender);

      var bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.textContent = msg.text || '';
      wrapper.appendChild(bubble);

      var time = document.createElement('span');
      time.className = 'message-timestamp';
      time.textContent = formatTime(msg.timestamp);
      wrapper.appendChild(time);

      container.appendChild(wrapper);
    });

    container.scrollTop = container.scrollHeight;
  }

  function addMessage(peer, msg) {
    if (!peer || !msg) return;
    if (!Array.isArray(conversations[peer])) conversations[peer] = [];
    conversations[peer].push({
      text: String(msg.text || ''),
      timestamp: typeof msg.timestamp === 'number' ? msg.timestamp : Date.now(),
      direction: msg.direction === 'outgoing' ? 'outgoing' : 'incoming',
      from: msg.from || null
    });
    saveConversations();
    if (activePeer === peer) {
      renderMessages();
    } else {
      renderConversationList();
    }
  }

  /* ---------- Message handlers ---------- */
  function handleIncomingMessage(msg) {
    if (!msg || typeof msg !== 'object') {
      console.warn('Invalid message received:', msg);
      return;
    }
    var peer = msg.from;
    var text = msg.text;
    var timestamp = msg.timestamp;

    if (!peer || text == null) {
      console.warn('Message missing from or text:', msg);
      return;
    }

    addMessage(peer, {
      text: String(text),
      timestamp: (typeof timestamp === 'number' && timestamp > 0) ? timestamp : Date.now(),
      direction: 'incoming',
      from: peer
    });

    if (activePeer !== peer) {
      showToast('New message from ' + peer + ': ' + (text.length > 30 ? text.substring(0, 30) + '...' : text));
      if (navigator.vibrate) navigator.vibrate(50);
    }
    renderConversationList();
  }

  /* ---------- Send message ---------- */
  function sendMessage() {
    if (!activePeer || isSending) return;
    if (!isReady) {
      showToast('Please wait, connecting...');
      return;
    }
    
    if (typeof PremCall === 'undefined' || typeof PremCall.sendMessage !== 'function') {
      showToast('Messaging service not available');
      return;
    }

    var input = document.getElementById('messageInput');
    var text = input.value.trim();
    if (!text) return;

    isSending = true;
    var sendBtn = document.getElementById('sendBtn');
    sendBtn.disabled = true;
    sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

    PremCall.sendMessage(activePeer, text)
      .then(function(result) {
        addMessage(activePeer, {
          text: text,
          timestamp: Date.now(),
          direction: 'outgoing',
          from: myNumber || 'You'
        });
        input.value = '';
        renderConversationList();
      })
      .catch(function(err) {
        var errorMsg = err && err.message ? err.message : 'Unknown error';
        showToast('Send failed: ' + errorMsg);
        console.error('Send error:', err);
      })
      .finally(function() {
        isSending = false;
        sendBtn.disabled = !isReady;
        sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
      });
  }

  /* ---------- Event listeners ---------- */
  function setupEventListeners() {
    document.getElementById('newChatBtn').addEventListener('click', function() {
      if (!isReady) {
        showToast('Please wait for connection...');
        return;
      }
      var num = prompt('Enter 10-digit number to start a chat:');
      if (num && /^\d{10}$/.test(num.trim())) {
        var trimmed = num.trim();
        if (!Array.isArray(conversations[trimmed])) conversations[trimmed] = [];
        saveConversations();
        openChat(trimmed);
        // Establish persistent connection
        if (typeof PremCall !== 'undefined' && PremCall.connectToPeer) {
          PremCall.connectToPeer(trimmed);
        }
      } else if (num) {
        showToast('Please enter a valid 10-digit number');
      }
    });

    document.getElementById('chatBackBtn').addEventListener('click', closeChat);
    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('messageInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') sendMessage();
    });
    
    document.getElementById('refreshPeerStatus').addEventListener('click', function() {
      if (activePeer && isReady) {
        checkPeerStatus(activePeer);
        showToast('Checking status...');
      }
    });
  }

  /* ---------- Initialize PremCall ---------- */
  function initPremCall(number) {
    myNumber = number;
    document.getElementById('myNumberDisplay').textContent = number;
    
    try {
      PremCall.init(number, {
        onMessage: handleIncomingMessage,
        onError: function(err) {
          console.warn('PremCall error:', err);
          var msg = err && err.message ? err.message : 'Unknown error';
          showToast('Error: ' + msg);
          updateStatus('offline');
          isReady = false;
          setInputEnabled(false);
        },
        onConnected: function() {
          console.log('Connected to PeerJS network');
          updateStatus('online');
          showToast('Connected!');
          isReady = true;
          setInputEnabled(true);
          renderConversationList();
          if (activePeer) {
            checkPeerStatus(activePeer);
            document.getElementById('messageInput').focus();
          }
        },
        onDisconnected: function() {
          console.warn('Disconnected from PeerJS network');
          updateStatus('offline');
          isReady = false;
          setInputEnabled(false);
          showToast('Disconnected - reconnecting...');
        },
        onReconnecting: function(data) {
          console.log('Reconnecting... attempt ' + data.attempt);
          updateStatus('connecting');
          showToast('Reconnecting... (' + data.attempt + '/' + 10 + ')');
        },
        online: function() {
          updateStatus('online');
          isReady = true;
          setInputEnabled(true);
          renderConversationList();
        },
        offline: function() {
          updateStatus('offline');
          isReady = false;
          setInputEnabled(false);
        }
      });
      updateStatus('connecting');
      console.log('PremCall initialized with number:', number);
      return true;
    } catch (e) {
      console.error('PremCall init error:', e);
      showToast('Init failed: ' + e.message);
      updateStatus('offline');
      isReady = false;
      setInputEnabled(false);
      return false;
    }
  }

  /* ---------- Boot ---------- */
  document.addEventListener('DOMContentLoaded', function() {
    conversations = sanitizeConversations(loadConversations());
    renderConversationList();
    setupEventListeners();

    if (typeof PremCall !== 'undefined' && typeof PremCall.init === 'function') {
      console.log('PremCall loaded');
      var storedNumber = localStorage.getItem('premCallNumber');
      var verified = localStorage.getItem('premCallVerified') === 'true';

      if (storedNumber && verified) {
        initPremCall(storedNumber);
      } else {
        document.getElementById('conversationList').innerHTML =
          '<div class="empty-state"><span class="icon"><i class="fas fa-phone"></i></span>Please register in the dialer first.<span class="sub-text">Go to the dialer and verify your number</span></div>';
        updateStatus('offline');
        setInputEnabled(false);
      }
    } else {
      document.getElementById('conversationList').innerHTML =
        '<div class="empty-state" style="color:var(--stop)"><span class="icon"><i class="fas fa-exclamation-circle"></i></span>PremCall library failed to load.</div>';
      updateStatus('offline');
      setInputEnabled(false);
    }
  });
})();
</script>

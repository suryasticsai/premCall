<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#070a12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Messages – PremCall</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/suryasticsai/premCall/main/premCall-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    /* ========== ORIGINAL STYLES (unchanged) ========== */
    :root{
      --bg-0:#05070d; --bg-1:#0a0e18; --surface:#0e1424; --surface-2:#141c30; --surface-3:#1b2540;
      --line:#1e2a42; --text:#eef2fb; --text-dim:#8891ab; --text-faint:#525d78;
      --signal:#4f8cf7; --signal-soft:#2f5fc4; --go:#2fd992; --go-deep:#12683f;
      --stop:#ff5470; --stop-deep:#7a1730; --warn:#ffb648; --warn-deep:#5c3d10;
      --radius-lg:22px; --radius-md:16px;
      --font-display:'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    body.light-mode{
      --bg-0:#f0f2f5; --bg-1:#ffffff; --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#f1f5f9;
      --line:#d1d5db; --text:#111827; --text-dim:#4b5563; --text-faint:#9ca3af;
      --signal:#2563eb; --signal-soft:#1d4ed8; --go:#10b981; --go-deep:#047857;
      --stop:#ef4444; --stop-deep:#b91c1c; --warn:#f59e0b; --warn-deep:#b45309;
    }
    *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
    html,body{height:100%;}
    body{
      font-family:var(--font-body);
      color:var(--text);
      background:var(--bg-0);
      min-height:100vh; min-height:100dvh;
      display:flex; justify-content:center;
      padding:0;
      overflow-x:hidden;
    }
    .app-container{
      width:100%; max-width:480px; min-height:100vh; min-height:100dvh;
      background:var(--bg-1); display:flex; flex-direction:column;
      position:relative; padding-top:var(--safe-t); padding-bottom:var(--safe-b);
    }
    .header{
      display:flex; align-items:center; padding:0.8rem 1rem;
      background:var(--surface); border-bottom:1px solid var(--line);
      gap:0.8rem; flex-shrink:0;
    }
    .header .back-btn{
      background:none; border:none; color:var(--text); font-size:1.4rem; cursor:pointer;
      text-decoration:none; display:flex; align-items:center; justify-content:center;
    }
    .header .title{
      flex:1; font-family:var(--font-display); font-weight:700; font-size:1.2rem;
      display:flex; align-items:center; gap:0.5rem;
      flex-wrap:wrap;
    }
    .header .title .my-number{
      font-size:0.7rem; font-weight:400; color:var(--text-dim);
      font-family:var(--font-body);
    }
    .header .icon-btn{
      background:none; border:none; color:var(--text-dim); font-size:1.2rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center; padding:0.4rem;
      transition:color .2s;
    }
    .header .icon-btn:hover{ color:var(--text); }
    .header .icon-btn:disabled{
      opacity:0.4; cursor:not-allowed;
    }
    .status-badge {
      display:inline-block; padding:0.2rem 0.6rem; border-radius:10px;
      font-size:0.6rem; font-weight:600;
    }
    .status-badge.online { background:var(--go); color:#fff; }
    .status-badge.offline { background:var(--warn); color:#fff; }
    .status-badge.error { background:var(--stop); color:#fff; }
    
    .conversation-list{
      flex:1; overflow-y:auto; padding:0.5rem 0;
    }
    .conversation-item{
      display:flex; align-items:center; gap:0.8rem; padding:0.8rem 1rem;
      border-bottom:1px solid var(--surface-2); cursor:pointer; transition:background .15s;
    }
    .conversation-item:hover{ background:var(--surface-2); }
    .conversation-item .avatar{
      width:48px; height:48px; border-radius:50%; background:var(--surface-3);
      display:flex; align-items:center; justify-content:center;
      font-family:var(--font-display); font-weight:700; font-size:1.1rem; color:var(--text);
      flex-shrink:0;
    }
    .conversation-item .info{ flex:1; min-width:0; }
    .conversation-item .name{ font-weight:600; font-size:0.95rem; display:flex; align-items:center; }
    .conversation-item .preview{
      font-size:0.8rem; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .conversation-item .time{ font-size:0.7rem; color:var(--text-faint); flex-shrink:0; }
    .status-dot{
      width:8px; height:8px; border-radius:50%; display:inline-block; margin-left:0.4rem;
    }
    .status-dot.online{ background:var(--go); }
    .status-dot.offline{ background:var(--text-faint); }
    
    .empty-state{
      text-align:center; color:var(--text-faint); padding:2rem; font-size:0.9rem;
    }
    .empty-state .icon{ font-size:2.5rem; display:block; margin-bottom:0.8rem; opacity:0.5; }
    .empty-state .sub-text{ font-size:0.8rem; opacity:0.7; margin-top:0.3rem; }
    
    .chat-view{
      flex:1; display:flex; flex-direction:column;
    }
    .chat-header{
      display:flex; align-items:center; gap:0.8rem; padding:0.8rem 1rem;
      background:var(--surface); border-bottom:1px solid var(--line); flex-shrink:0;
    }
    .chat-header .back-btn{
      background:none; border:none; color:var(--text); font-size:1.4rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
    }
    .chat-header .avatar{
      width:36px; height:36px; border-radius:50%; background:var(--surface-3);
      display:flex; align-items:center; justify-content:center; font-weight:700;
      color:var(--text);
    }
    .chat-header .peer-info{
      flex:1; display:flex; flex-direction:column;
    }
    .chat-header .peer-name{
      font-family:var(--font-display); font-weight:600; font-size:0.95rem;
    }
    .chat-header .peer-status{
      font-size:0.7rem; color:var(--text-dim); display:flex; align-items:center;
    }
    
    .messages{
      flex:1; overflow-y:auto; padding:1rem; display:flex; flex-direction:column; gap:0.4rem;
    }
    .message-wrapper{
      display:flex; flex-direction:column; max-width:85%;
    }
    .message-wrapper.outgoing{ align-self:flex-end; align-items:flex-end; }
    .message-wrapper.incoming{ align-self:flex-start; align-items:flex-start; }
    .message-bubble{
      padding:0.6rem 0.9rem; border-radius:16px; font-size:0.9rem;
      white-space:pre-wrap; word-break:break-word; position:relative;
      animation:fadeIn .2s ease;
    }
    @keyframes fadeIn{
      from{ opacity:0; transform:translateY(5px); }
      to{ opacity:1; transform:translateY(0); }
    }
    .message-wrapper.outgoing .message-bubble{
      background:var(--signal); color:#fff;
      border-bottom-right-radius:4px;
    }
    .message-wrapper.incoming .message-bubble{
      background:var(--surface-2); color:var(--text);
      border-bottom-left-radius:4px;
    }
    .message-wrapper.outgoing .message-bubble.pending{ opacity:0.6; }
    .message-timestamp{
      font-size:0.6rem; opacity:0.6; margin-top:0.15rem; display:block; text-align:right;
    }
    .message-wrapper.outgoing .message-timestamp{ color:var(--text-faint); }
    .message-wrapper.incoming .message-timestamp{ color:var(--text-faint); }
    
    .date-divider{
      text-align:center;font-size:0.7rem;color:var(--text-faint);padding:0.5rem 0;
    }
    
    .chat-input-area{
      display:flex; gap:0.5rem; padding:0.8rem; background:var(--surface);
      border-top:1px solid var(--line); flex-shrink:0;
    }
    .chat-input-area input{
      flex:1; padding:0.6rem 1rem; border-radius:20px; border:1px solid var(--line);
      background:var(--bg-0); color:var(--text); outline:none;
      font-family:inherit; font-size:0.95rem;
    }
    .chat-input-area input::placeholder{ color:var(--text-faint); }
    .chat-input-area input:focus{ border-color:var(--signal); }
    .chat-input-area button{
      width:42px; height:42px; border-radius:50%; border:none; background:var(--signal);
      color:#fff; cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center;
      transition:opacity .2s, transform .1s;
    }
    .chat-input-area button:disabled{ opacity:0.4; cursor:not-allowed; }
    .chat-input-area button:active:not(:disabled){ transform:scale(0.95); }
    .hidden{ display:none !important; }
    
    #toast {
      position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
      background:var(--surface-3); border:1px solid var(--line);
      color:var(--text); padding:0.7rem 1.3rem; border-radius:40px;
      font-size:0.85rem; z-index:11000; opacity:0; transition:opacity .3s;
      pointer-events:none; max-width:90%;
      font-family:var(--font-body);
    }
    
    .offline-bar {
      background:var(--warn-deep); color:#fff; padding:0.4rem 1rem;
      text-align:center; font-size:0.75rem; display:none;
    }
    .offline-bar.show{ display:block; }
    
    .setup-banner{
      background:var(--stop-deep); color:#fff; padding:0.9rem 1rem; font-size:0.8rem;
      line-height:1.5; display:none;
    }
    .setup-banner.show{ display:block; }
    .setup-banner code{ background:rgba(0,0,0,0.25); padding:0.1rem 0.35rem; border-radius:4px; }
    
    /* Error log – collapsed by default */
    .error-log {
      background:var(--surface);
      border-top:1px solid var(--stop);
      font-size:0.7rem;
      color:var(--stop);
      max-height:60px;
      overflow-y:auto;
      transition:max-height .3s ease;
    }
    .error-log.collapsed {
      max-height:0;
      overflow:hidden;
      border-top:none;
    }
    .error-log .header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:0.2rem 0.6rem;
      cursor:pointer;
      user-select:none;
      background:var(--surface-2);
      border-bottom:1px solid var(--line);
      color:var(--text-dim);
    }
    .error-log .header .toggle-btn {
      background:none;
      border:none;
      color:var(--text-dim);
      font-size:0.7rem;
      cursor:pointer;
      padding:0.2rem 0.4rem;
    }
    .error-log .header .toggle-btn:hover {
      color:var(--text);
    }
    .error-log .content {
      padding:0.3rem 0.6rem;
      max-height:60px;
      overflow-y:auto;
    }
    .error-log .content .entry {
      padding:0.1rem 0;
      border-bottom:1px solid var(--surface-2);
    }
    .error-log .content .entry:last-child { border-bottom:none; }
    .error-log .content .clear-errors {
      float:right;
      background:none;
      border:none;
      color:var(--text-faint);
      cursor:pointer;
      font-size:0.65rem;
    }

    /* ========== SETTINGS MODAL ========== */
    #settingsModal {
      display:none;
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      background:rgba(0,0,0,0.6);
      backdrop-filter:blur(8px);
      align-items:center;
      justify-content:center;
      z-index:20000;
    }
    #settingsModal.active { display:flex; }
    .settings-card {
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:var(--radius-lg);
      padding:1.8rem 1.5rem;
      width:90%;
      max-width:360px;
      box-shadow:0 20px 40px rgba(0,0,0,0.5);
    }
    .settings-card h2 {
      font-family:var(--font-display);
      font-size:1.3rem;
      margin-bottom:1.2rem;
      text-align:center;
    }
    .settings-item {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:0.6rem 0;
      border-bottom:1px solid var(--surface-2);
      font-size:0.9rem;
    }
    .settings-item .label { color:var(--text-dim); }
    .settings-item .toggle {
      position:relative;
      width:44px; height:24px;
      background:var(--line);
      border-radius:12px;
      cursor:pointer;
      transition:background .2s;
    }
    .settings-item .toggle.active { background:var(--signal); }
    .settings-item .toggle .knob {
      position:absolute;
      top:2px; left:2px;
      width:20px; height:20px;
      background:#fff;
      border-radius:50%;
      transition:transform .2s;
    }
    .settings-item .toggle.active .knob { transform:translateX(20px); }
    .settings-close {
      margin-top:1.2rem;
      width:100%;
      padding:0.6rem;
      border-radius:40px;
      border:1px solid var(--line);
      background:transparent;
      color:var(--text-dim);
      cursor:pointer;
      font-weight:600;
    }
    .settings-close:hover { background:var(--surface-2); color:var(--text); }
  </style>
</head>
<body>

<div class="app-container" id="app">
  <div class="offline-bar" id="offlineBar">
    <i class="fas fa-cloud-slash"></i> You're offline — messages will send once you're back online
  </div>
  <div class="setup-banner" id="setupBanner">
    Firebase isn't configured yet. Open this file and fill in <code>FIREBASE_CONFIG</code>
    near the bottom with your project's config.
  </div>

  <div class="header" id="listHeader">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <span class="title">
      Messages
      <span class="status-badge offline" id="statusBadge">Offline</span>
      <span class="my-number" id="myNumberDisplay"></span>
    </span>
    <!-- Settings gear -->
    <button class="icon-btn" id="settingsBtn"><i class="fas fa-gear"></i></button>
    <button class="icon-btn" id="newChatBtn"><i class="fas fa-plus"></i></button>
  </div>
  <div class="conversation-list" id="conversationList">
    <div class="empty-state">
      <span class="icon"><i class="fas fa-comments"></i></span>
      Loading messages...
    </div>
  </div>
  <div class="chat-view hidden" id="chatView">
    <div class="chat-header">
      <button class="back-btn" id="chatBackBtn"><i class="fas fa-arrow-left"></i></button>
      <div class="avatar" id="chatPeerAvatar">?</div>
      <div class="peer-info">
        <span class="peer-name" id="chatPeerName"></span>
        <span class="peer-status" id="chatPeerStatus">
          <span class="status-dot offline"></span>&nbsp;<span id="chatPeerStatusText">Offline</span>
        </span>
      </div>
    </div>
    <div class="messages" id="messagesContainer"></div>
    <div class="chat-input-area">
      <input type="text" id="messageInput" placeholder="Type a message…" autocomplete="off" />
      <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>

  <!-- ERROR LOG – collapsed by default -->
  <div class="error-log collapsed" id="errorLog">
    <div class="header" id="errorLogHeader">
      <span><i class="fas fa-bug"></i> Log</span>
      <button class="toggle-btn" id="toggleErrorLog"><i class="fas fa-chevron-down"></i></button>
    </div>
    <div class="content" id="errorLogContent">
      <button class="clear-errors" id="clearErrorsBtn">Clear</button>
    </div>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div id="settingsModal">
  <div class="settings-card">
    <h2>Settings</h2>
    <div class="settings-item">
      <span class="label">Debug Mode</span>
      <div class="toggle active" id="debugToggle">
        <div class="knob"></div>
      </div>
    </div>
    <div class="settings-item">
      <span class="label">Dark / Light</span>
      <div class="toggle" id="themeToggle">
        <div class="knob"></div>
      </div>
    </div>
    <div class="settings-item">
      <span class="label">Auto‑Refresh (3s)</span>
      <div class="toggle" id="refreshToggle">
        <div class="knob"></div>
      </div>
    </div>
    <button class="settings-close" id="settingsClose">Close</button>
  </div>
</div>

<div id="toast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDc2vue40jIyuVCnU-frnbC5o0aNzovUNk",
  authDomain: "premcall-msg.firebaseapp.com",
  projectId: "premcall-msg",
  storageBucket: "premcall-msg.firebasestorage.app",
  messagingSenderId: "50980568455",
  appId: "1:50980568455:web:723fb612e7df28169d6722"
};
</script>

<script>
(function() {
  'use strict';

  var FIREBASE_NOT_CONFIGURED = !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey === 'YOUR_API_KEY';

  // ===== TOAST =====
  function showToast(msg) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(function() { toast.classList.remove('show'); }, 3000);
  }

  // ===== ERROR LOG (with toggle) =====
  var errorLogEl = document.getElementById('errorLog');
  var errorContent = document.getElementById('errorLogContent');
  var toggleBtn = document.getElementById('toggleErrorLog');

  function logError(msg) {
    var entry = document.createElement('div');
    entry.className = 'entry';
    entry.textContent = new Date().toLocaleTimeString() + ' ' + msg;
    errorContent.prepend(entry);
    if (errorContent.children.length > 20) errorContent.removeChild(errorContent.lastChild);
    // Auto‑expand if debug mode is on
    if (debugEnabled) {
      errorLogEl.classList.remove('collapsed');
      toggleBtn.innerHTML = '<i class="fas fa-chevron-up"></i>';
    }
  }

  // Toggle handler
  toggleBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (!debugEnabled) return; // if debug off, don't allow toggle
    errorLogEl.classList.toggle('collapsed');
    toggleBtn.innerHTML = errorLogEl.classList.contains('collapsed') ? '<i class="fas fa-chevron-down"></i>' : '<i class="fas fa-chevron-up"></i>';
  });
  document.getElementById('errorLogHeader').addEventListener('click', function(e) {
    if (e.target.tagName !== 'BUTTON' && debugEnabled) {
      toggleBtn.click();
    }
  });

  // Clear handler
  document.getElementById('clearErrorsBtn').addEventListener('click', function() {
    errorContent.innerHTML = '<button class="clear-errors" id="clearErrorsBtn">Clear</button>';
    document.getElementById('clearErrorsBtn').addEventListener('click', arguments.callee);
  });

  // ===== SETTINGS =====
  var debugEnabled = true;      // default on
  var refreshEnabled = false;   // default off
  var refreshInterval = null;
  var themeToggle = document.getElementById('themeToggle');
  var debugToggle = document.getElementById('debugToggle');
  var refreshToggle = document.getElementById('refreshToggle');
  var settingsModal = document.getElementById('settingsModal');
  var settingsBtn = document.getElementById('settingsBtn');
  var settingsClose = document.getElementById('settingsClose');

  // Theme toggle
  themeToggle.addEventListener('click', function() {
    this.classList.toggle('active');
    document.body.classList.toggle('light-mode');
  });

  // Debug toggle
  debugToggle.addEventListener('click', function() {
    this.classList.toggle('active');
    debugEnabled = this.classList.contains('active');
    if (debugEnabled) {
      errorLogEl.classList.remove('collapsed');
      toggleBtn.innerHTML = '<i class="fas fa-chevron-up"></i>';
      errorLogEl.style.display = 'block';
    } else {
      errorLogEl.classList.add('collapsed');
      errorLogEl.style.display = 'none';
    }
  });

  // Refresh toggle
  refreshToggle.addEventListener('click', function() {
    this.classList.toggle('active');
    refreshEnabled = this.classList.contains('active');
    if (refreshEnabled) {
      startRefresh();
    } else {
      stopRefresh();
    }
  });

  function startRefresh() {
    if (refreshInterval) clearInterval(refreshInterval);
    refreshInterval = setInterval(function() {
      if (chatReady && db) {
        // Refresh conversation list
        refreshConversations();
        // Refresh active chat if open
        if (activePeer) refreshMessages(activePeer);
      }
    }, 3000);
    logError('Auto‑refresh started (3s)');
  }

  function stopRefresh() {
    if (refreshInterval) {
      clearInterval(refreshInterval);
      refreshInterval = null;
      logError('Auto‑refresh stopped');
    }
  }

  // Refresh functions (use .get() to avoid duplicate listeners)
  function refreshConversations() {
    if (!myNumber || !db) return;
    db.collection('messages')
      .where('participants', 'array-contains', myNumber)
      .get()
      .then(function(snapshot) {
        var latestByPeer = {};
        snapshot.docs.forEach(function(doc) {
          var d = doc.data();
          var peer = d.from === myNumber ? d.to : d.from;
          if (!latestByPeer[peer] || d.timestamp > latestByPeer[peer].timestamp) {
            latestByPeer[peer] = {
              peer: peer,
              text: d.text,
              timestamp: d.timestamp,
              direction: d.from === myNumber ? 'outgoing' : 'incoming',
              pending: false,
              error: false
            };
          }
        });
        // Merge with local pending/error
        var peers = Object.keys(conversations);
        peers.forEach(function(p) {
          var msgs = conversations[p];
          var last = msgs[msgs.length-1];
          if (last && (last.pending || last.error)) {
            if (!latestByPeer[p]) {
              latestByPeer[p] = {
                peer: p,
                text: last.text,
                timestamp: last.timestamp,
                direction: last.direction,
                pending: last.pending,
                error: last.error
              };
            } else if (last.timestamp > latestByPeer[p].timestamp) {
              latestByPeer[p] = {
                peer: p,
                text: last.text,
                timestamp: last.timestamp,
                direction: last.direction,
                pending: last.pending,
                error: last.error
              };
            }
          }
        });
        var list = Object.keys(latestByPeer).map(function(k) { return latestByPeer[k]; });
        list.sort(function(a,b){ return (b.timestamp||0) - (a.timestamp||0); });
        latestConversations = list;
        renderConversationList();
      }).catch(function(err) {
        logError('Refresh conversation list error: ' + err.message);
      });
  }

  function refreshMessages(peer) {
    if (!myNumber || !db || !peer) return;
    var id = [myNumber, peer].sort().join('_');
    db.collection('messages')
      .where('conversationId', '==', id)
      .get()
      .then(function(snapshot) {
        var msgs = snapshot.docs.map(function(doc) {
          var d = doc.data();
          return {
            id: doc.id,
            text: d.text,
            timestamp: d.timestamp,
            direction: d.from === myNumber ? 'outgoing' : 'incoming',
            from: d.from,
            pending: false,
            error: false,
            delivered: true
          };
        });
        msgs.sort(function(a,b){ return a.timestamp - b.timestamp; });
        // Merge with pending
        var existing = conversations[peer] || [];
        var pending = existing.filter(function(m) { return m.pending || m.error; });
        var merged = msgs.concat(pending);
        merged.sort(function(a,b){ return a.timestamp - b.timestamp; });
        conversations[peer] = merged;
        saveConversations();
        if (activePeer === peer) {
          renderMessages();
          renderConversationList();
        }
      }).catch(function(err) {
        logError('Refresh messages error: ' + err.message);
      });
  }

  // Open/close settings modal
  settingsBtn.addEventListener('click', function() {
    settingsModal.classList.add('active');
  });
  settingsClose.addEventListener('click', function() {
    settingsModal.classList.remove('active');
  });
  settingsModal.addEventListener('click', function(e) {
    if (e.target === this) settingsModal.classList.remove('active');
  });

  // ===== REST OF APP (unchanged except added refresh calls) =====
  function updateNetStatus() {
    var online = navigator.onLine;
    document.getElementById('offlineBar').classList.toggle('show', !online);
    var badge = document.getElementById('statusBadge');
    badge.textContent = online ? 'Online' : 'Offline';
    badge.className = 'status-badge ' + (online ? 'online' : 'offline');
  }

  function setInputEnabled(enabled) {
    var input = document.getElementById('messageInput');
    var sendBtn = document.getElementById('sendBtn');
    input.disabled = !enabled;
    sendBtn.disabled = !enabled;
  }

  function initials(peer) {
    if (!peer) return '?';
    var digits = peer.replace(/\D/g, '');
    return digits.slice(-2) || '?';
  }

  function formatTime(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function formatDate(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    if (isNaN(d.getTime())) return '';
    var today = new Date();
    if (d.toDateString() === today.toDateString()) return 'Today';
    var y = new Date(today); y.setDate(y.getDate()-1);
    if (d.toDateString() === y.toDateString()) return 'Yesterday';
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  }

  var db = null, auth = null;
  var chatReady = false;
  var myNumber = null;
  var activePeer = null;
  var conversations = {};
  var latestConversations = [];
  var conversationListUnsub = null;
  var activeConversationUnsub = null;
  var activePresenceUnsub = null;
  var isSending = false;

  function loadConversations() {
    try { return JSON.parse(localStorage.getItem('premCallChats') || '{}'); } catch(e) { return {}; }
  }
  function saveConversations() {
    try { localStorage.setItem('premCallChats', JSON.stringify(conversations)); } catch(e) {}
  }

  function addMessage(peer, msg) {
    if (!peer || !msg) return;
    if (!Array.isArray(conversations[peer])) conversations[peer] = [];
    conversations[peer].push({
      text: String(msg.text || ''),
      timestamp: typeof msg.timestamp === 'number' ? msg.timestamp : Date.now(),
      direction: msg.direction === 'outgoing' ? 'outgoing' : 'incoming',
      from: msg.from || null,
      pending: msg.pending || false,
      delivered: msg.delivered || false,
      error: msg.error || false,
      _tempId: msg._tempId || null
    });
    saveConversations();
    if (activePeer === peer) renderMessages();
    else renderConversationList();
  }

  function renderMessages() {
    var container = document.getElementById('messagesContainer');
    container.innerHTML = '';
    if (!activePeer || !conversations[activePeer]) return;
    var msgs = conversations[activePeer];
    var lastDate = null;
    msgs.forEach(function(msg) {
      var msgDate = formatDate(msg.timestamp);
      if (msgDate !== lastDate) {
        lastDate = msgDate;
        var dateDiv = document.createElement('div');
        dateDiv.className = 'date-divider';
        dateDiv.textContent = msgDate;
        container.appendChild(dateDiv);
      }
      var wrapper = document.createElement('div');
      wrapper.className = 'message-wrapper ' + msg.direction;
      if (msg.pending) wrapper.classList.add('pending');
      var bubble = document.createElement('div');
      bubble.className = 'message-bubble' + (msg.pending ? ' pending' : '');
      if (msg.error) bubble.style.border = '1px solid var(--stop)';
      bubble.textContent = msg.text || '';
      wrapper.appendChild(bubble);
      var time = document.createElement('span');
      time.className = 'message-timestamp';
      var statusText = '';
      if (msg.pending) statusText = ' · sending…';
      else if (msg.error) statusText = ' · failed';
      time.textContent = formatTime(msg.timestamp) + statusText;
      wrapper.appendChild(time);
      container.appendChild(wrapper);
    });
    container.scrollTop = container.scrollHeight;
  }

  function renderConversationList() {
    var listEl = document.getElementById('conversationList');
    listEl.innerHTML = '';
    var peers = Object.keys(conversations);
    if (peers.length === 0) {
      listEl.innerHTML = '<div class="empty-state"><span class="icon"><i class="fas fa-comments"></i></span>No conversations yet<span class="sub-text">Tap + to message any registered number</span></div>';
      return;
    }
    peers.sort(function(a,b) {
      var msgsA = conversations[a], msgsB = conversations[b];
      var lastA = msgsA.length ? (msgsA[msgsA.length-1].timestamp||0) : 0;
      var lastB = msgsB.length ? (msgsB[msgsB.length-1].timestamp||0) : 0;
      return lastB - lastA;
    });
    peers.forEach(function(peer) {
      var msgs = conversations[peer];
      var lastMsg = msgs[msgs.length-1] || { text: '', timestamp: 0, direction: '' };
      var item = document.createElement('div');
      item.className = 'conversation-item';
      var avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = initials(peer);
      item.appendChild(avatar);
      var info = document.createElement('div');
      info.className = 'info';
      var nameDiv = document.createElement('div');
      nameDiv.className = 'name';
      nameDiv.textContent = peer;
      info.appendChild(nameDiv);
      var preview = document.createElement('div');
      preview.className = 'preview';
      var prefix = lastMsg.direction === 'outgoing' ? 'You: ' : '';
      if (lastMsg.pending) prefix = '[sending] You: ';
      else if (lastMsg.error) prefix = '[failed] You: ';
      preview.textContent = prefix + (lastMsg.text || '');
      info.appendChild(preview);
      item.appendChild(info);
      var time = document.createElement('span');
      time.className = 'time';
      time.textContent = formatTime(lastMsg.timestamp);
      item.appendChild(time);
      item.addEventListener('click', function() { openChat(peer); });
      listEl.appendChild(item);
    });
  }

  function openChat(peer) {
    activePeer = peer;
    document.getElementById('listHeader').classList.add('hidden');
    document.getElementById('conversationList').classList.add('hidden');
    document.getElementById('chatView').classList.remove('hidden');
    document.getElementById('chatPeerName').textContent = peer;
    document.getElementById('chatPeerAvatar').textContent = initials(peer);
    document.getElementById('messagesContainer').innerHTML = '';
    if (activeConversationUnsub) activeConversationUnsub();
    if (activePresenceUnsub) activePresenceUnsub();
    if (chatReady) {
      activeConversationUnsub = listenConversation(peer, function(msgs) {
        var existing = conversations[activePeer] || [];
        var pending = existing.filter(function(m) { return m.pending || m.error; });
        var merged = msgs.concat(pending);
        merged.sort(function(a,b){ return a.timestamp - b.timestamp; });
        conversations[activePeer] = merged;
        saveConversations();
        renderMessages();
        renderConversationList();
        logError('Snapshot updated: ' + merged.length + ' messages');
      });
      activePresenceUnsub = listenPresence(peer, function(online) {
        var dot = document.querySelector('#chatPeerStatus .status-dot');
        var text = document.getElementById('chatPeerStatusText');
        dot.className = 'status-dot ' + (online ? 'online' : 'offline');
        text.textContent = online ? 'Online' : 'Offline';
      });
    }
    renderMessages();
    document.getElementById('messageInput').focus();
    setInputEnabled(true);
  }

  function closeChat() {
    activePeer = null;
    if (activeConversationUnsub) { activeConversationUnsub(); activeConversationUnsub = null; }
    if (activePresenceUnsub) { activePresenceUnsub(); activePresenceUnsub = null; }
    document.getElementById('chatView').classList.add('hidden');
    document.getElementById('listHeader').classList.remove('hidden');
    document.getElementById('conversationList').classList.remove('hidden');
    renderConversationList();
  }

  // --- No .orderBy() – sort in memory ---
  function listenConversation(peerNumber, cb) {
    var id = [myNumber, peerNumber].sort().join('_');
    return db.collection('messages')
      .where('conversationId', '==', id)
      .onSnapshot(function(snapshot) {
        var msgs = snapshot.docs.map(function(doc) {
          var d = doc.data();
          return {
            id: doc.id,
            text: d.text,
            timestamp: d.timestamp,
            direction: d.from === myNumber ? 'outgoing' : 'incoming',
            from: d.from,
            pending: false,
            error: false,
            delivered: true
          };
        });
        msgs.sort(function(a,b){ return a.timestamp - b.timestamp; });
        cb(msgs);
      }, function(err) {
        logError('Conversation listener error: ' + err.message);
        showToast('Error loading messages: ' + err.message);
      });
  }

  function listenPresence(peerNumber, cb) {
    return db.collection('presence').doc(peerNumber).onSnapshot(function(doc) {
      var data = doc.data();
      var online = !!data && (Date.now() - data.lastSeen < 30000);
      cb(online);
    }, function(err) {
      logError('Presence error: ' + err.message);
    });
  }

  function listenConversationsList() {
    return db.collection('messages')
      .where('participants', 'array-contains', myNumber)
      .onSnapshot(function(snapshot) {
        var latestByPeer = {};
        snapshot.docs.forEach(function(doc) {
          var d = doc.data();
          var peer = d.from === myNumber ? d.to : d.from;
          if (!latestByPeer[peer] || d.timestamp > latestByPeer[peer].timestamp) {
            latestByPeer[peer] = {
              peer: peer,
              text: d.text,
              timestamp: d.timestamp,
              direction: d.from === myNumber ? 'outgoing' : 'incoming',
              pending: false,
              error: false
            };
          }
        });
        var peers = Object.keys(conversations);
        peers.forEach(function(p) {
          var msgs = conversations[p];
          var last = msgs[msgs.length-1];
          if (last && (last.pending || last.error)) {
            if (!latestByPeer[p]) {
              latestByPeer[p] = {
                peer: p,
                text: last.text,
                timestamp: last.timestamp,
                direction: last.direction,
                pending: last.pending,
                error: last.error
              };
            } else if (last.timestamp > latestByPeer[p].timestamp) {
              latestByPeer[p] = {
                peer: p,
                text: last.text,
                timestamp: last.timestamp,
                direction: last.direction,
                pending: last.pending,
                error: last.error
              };
            }
          }
        });
        var list = Object.keys(latestByPeer).map(function(k) { return latestByPeer[k]; });
        list.sort(function(a,b){ return (b.timestamp||0) - (a.timestamp||0); });
        latestConversations = list;
        renderConversationList();
        logError('Conversation list updated: ' + list.length + ' conversations');
      }, function(err) {
        logError('Conversation list error: ' + err.message);
        showToast('Error loading conversation list: ' + err.message);
      });
  }

  function sendMessage() {
    if (!activePeer || isSending) return;
    if (!chatReady) { showToast('Still connecting…'); return; }
    var input = document.getElementById('messageInput');
    var text = input.value.trim();
    if (!text) return;

    var tempId = Date.now() + '-' + Math.random().toString(36).substr(2,6);
    addMessage(activePeer, {
      text: text,
      timestamp: Date.now(),
      direction: 'outgoing',
      from: myNumber,
      pending: true,
      error: false,
      _tempId: tempId
    });
    input.value = '';
    renderMessages();
    renderConversationList();
    isSending = true;

    db.collection('messages').add({
      conversationId: [myNumber, activePeer].sort().join('_'),
      participants: [myNumber, activePeer],
      from: myNumber,
      to: activePeer,
      text: text,
      timestamp: Date.now()
    }).then(function(docRef) {
      var msgs = conversations[activePeer] || [];
      for (var i = 0; i < msgs.length; i++) {
        if (msgs[i]._tempId === tempId) {
          msgs[i].pending = false;
          msgs[i].delivered = true;
          msgs[i].error = false;
          msgs[i].id = docRef.id;
          break;
        }
      }
      saveConversations();
      renderMessages();
      renderConversationList();
      showToast('Sent');
    }).catch(function(err) {
      logError('Send failed: ' + err.message);
      var msgs = conversations[activePeer] || [];
      for (var i = 0; i < msgs.length; i++) {
        if (msgs[i]._tempId === tempId) {
          msgs[i].pending = false;
          msgs[i].error = true;
          break;
        }
      }
      saveConversations();
      renderMessages();
      renderConversationList();
      showToast('Send failed: ' + err.message);
    }).finally(function() {
      isSending = false;
    });
  }

  function initChat() {
    var stored = localStorage.getItem('premCallNumber');
    var verified = localStorage.getItem('premCallVerified') === 'true';
    if (!stored || !verified) {
      document.getElementById('conversationList').innerHTML = '<div class="empty-state"><span class="icon"><i class="fas fa-phone"></i></span>Register in dialer first.</div>';
      return;
    }
    myNumber = stored;
    document.getElementById('myNumberDisplay').textContent = myNumber;

    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
      auth = firebase.auth();
      db.enablePersistence({ synchronizeTabs: true }).catch(function(err) {
        logError('Persistence error: ' + err.message);
      });
    } catch(e) {
      logError('Firebase init error: ' + e.message);
      document.getElementById('setupBanner').classList.add('show');
      return;
    }

    auth.signInAnonymously().then(function(cred) {
      var uid = cred.user.uid;
      logError('Your UID: ' + uid);
      logError('Your number: ' + myNumber);
      return db.collection('uids').doc(uid).get().then(function(doc) {
        if (doc.exists) {
          var mappedNumber = doc.data().number;
          logError('UID mapped to number: ' + mappedNumber);
          if (mappedNumber !== myNumber) {
            logError('UID maps to different number, updating…');
            return db.collection('uids').doc(uid).set({ number: myNumber }, { merge: true });
          }
        } else {
          logError('UID mapping missing, creating…');
          var batch = db.batch();
          batch.set(db.collection('users').doc(myNumber), { uid: uid });
          batch.set(db.collection('uids').doc(uid), { number: myNumber });
          return batch.commit().then(function() {
            logError('Mapping created.');
          }).catch(function(err) {
            logError('Failed to create mapping: ' + err.message);
            throw err;
          });
        }
      });
    }).then(function() {
      chatReady = true;
      updateNetStatus();
      var saved = loadConversations();
      Object.keys(saved).forEach(function(k) {
        if (!conversations[k]) conversations[k] = saved[k];
      });
      renderConversationList();
      conversationListUnsub = listenConversationsList();
      db.collection('presence').doc(myNumber).set({ lastSeen: Date.now() }, { merge: true });
      setInterval(function() {
        db.collection('presence').doc(myNumber).set({ lastSeen: Date.now() }, { merge: true });
      }, 15000);
      showToast('Connected');
    }).catch(function(err) {
      logError('Auth/claim error: ' + err.message);
      document.getElementById('conversationList').innerHTML = '<div class="empty-state" style="color:var(--stop)">Error: ' + err.message + '</div>';
    });
  }

  document.addEventListener('DOMContentLoaded', function() {
    updateNetStatus();
    document.getElementById('newChatBtn').addEventListener('click', function() {
      if (!chatReady) { showToast('Still connecting…'); return; }
      var num = prompt('Enter 10-digit number:');
      if (num && /^\d{10}$/.test(num.trim())) {
        var trimmed = num.trim();
        if (!Array.isArray(conversations[trimmed])) conversations[trimmed] = [];
        saveConversations();
        openChat(trimmed);
      } else if (num) showToast('Invalid number');
    });
    document.getElementById('chatBackBtn').addEventListener('click', closeChat);
    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('messageInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') sendMessage();
    });

    if (FIREBASE_NOT_CONFIGURED) {
      document.getElementById('setupBanner').classList.add('show');
      document.getElementById('conversationList').innerHTML = '<div class="empty-state"><span class="icon"><i class="fas fa-gear"></i></span>Add Firebase config.</div>';
    } else {
      initChat();
    }

    window.addEventListener('online', updateNetStatus);
    window.addEventListener('offline', updateNetStatus);
  });
})();
</script>
</body>
</html>

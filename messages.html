<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#070a12" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Messages – PremCall</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/suryasticsai/premCall/main/premCall-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
  :root{
    --bg-0:#05070d; --bg-1:#0a0e18; --surface:#0e1424; --surface-2:#141c30; --surface-3:#1b2540;
    --line:#1e2a42; --text:#eef2fb; --text-dim:#8891ab; --text-faint:#525d78;
    --signal:#4f8cf7; --signal-soft:#2f5fc4; --go:#2fd992; --go-deep:#12683f;
    --stop:#ff5470; --stop-deep:#7a1730; --warn:#ffb648; --warn-deep:#5c3d10;
    --radius-lg:22px; --radius-md:16px;
    --font-display:'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  body.light-mode{
    --bg-0:#f0f2f5; --bg-1:#ffffff; --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#f1f5f9;
    --line:#d1d5db; --text:#111827; --text-dim:#4b5563; --text-faint:#9ca3af;
    --signal:#2563eb; --signal-soft:#1d4ed8; --go:#10b981; --go-deep:#047857;
    --stop:#ef4444; --stop-deep:#b91c1c; --warn:#f59e0b; --warn-deep:#b45309;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:var(--font-body);
    color:var(--text);
    background:var(--bg-0);
    min-height:100vh; min-height:100dvh;
    display:flex; justify-content:center;
    padding:0;
    overflow-x:hidden;
  }
  .app-container{
    width:100%; max-width:480px; min-height:100vh; min-height:100dvh;
    background:var(--bg-1); display:flex; flex-direction:column;
    position:relative; padding-top:var(--safe-t); padding-bottom:var(--safe-b);
  }
  /* Header */
  .header{
    display:flex; align-items:center; padding:0.8rem 1rem;
    background:var(--surface); border-bottom:1px solid var(--line);
    gap:0.8rem; flex-shrink:0;
  }
  .header .back-btn{
    background:none; border:none; color:var(--text); font-size:1.4rem; cursor:pointer;
    text-decoration:none; display:flex; align-items:center; justify-content:center;
  }
  .header .title{
    flex:1; font-family:var(--font-display); font-weight:700; font-size:1.2rem;
  }
  .header .icon-btn{
    background:none; border:none; color:var(--text-dim); font-size:1.2rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0.4rem;
  }
  .header .icon-btn:disabled{
    opacity:0.4; cursor:not-allowed;
  }

  /* Conversation list */
  .conversation-list{
    flex:1; overflow-y:auto; padding:0.5rem 0;
  }
  .conversation-item{
    display:flex; align-items:center; gap:0.8rem; padding:0.8rem 1rem;
    border-bottom:1px solid var(--surface-2); cursor:pointer; transition:background .15s;
  }
  .conversation-item:hover{ background:var(--surface-2); }
  .conversation-item .avatar{
    width:48px; height:48px; border-radius:50%; background:var(--surface-3);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:1.1rem; color:var(--text);
    flex-shrink:0;
  }
  .conversation-item .info{ flex:1; min-width:0; }
  .conversation-item .name{ font-weight:600; font-size:0.95rem; }
  .conversation-item .preview{
    font-size:0.8rem; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .conversation-item .time{ font-size:0.7rem; color:var(--text-faint); flex-shrink:0; }
  .empty-state{
    text-align:center; color:var(--text-faint); padding:2rem; font-size:0.9rem;
  }

  /* Chat view */
  .chat-view{
    flex:1; display:flex; flex-direction:column;
  }
  .chat-header{
    display:flex; align-items:center; gap:0.8rem; padding:0.8rem 1rem;
    background:var(--surface); border-bottom:1px solid var(--line); flex-shrink:0;
  }
  .chat-header .back-btn{
    background:none; border:none; color:var(--text); font-size:1.4rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .chat-header .avatar{
    width:36px; height:36px; border-radius:50%; background:var(--surface-3);
    display:flex; align-items:center; justify-content:center; font-weight:700;
  }
  .chat-header .peer-name{
    flex:1; font-family:var(--font-display); font-weight:600;
  }
  .messages{
    flex:1; overflow-y:auto; padding:1rem; display:flex; flex-direction:column; gap:0.4rem;
  }
  .message-bubble{
    max-width:80%; padding:0.6rem 0.9rem; border-radius:16px; font-size:0.9rem;
    white-space:pre-wrap; word-break:break-word; position:relative;
  }
  .message-bubble.outgoing{
    align-self:flex-end; background:var(--signal); color:#fff;
    border-bottom-right-radius:4px;
  }
  .message-bubble.incoming{
    align-self:flex-start; background:var(--surface-2); color:var(--text);
    border-bottom-left-radius:4px;
  }
  .message-bubble .timestamp{
    font-size:0.6rem; opacity:0.7; margin-top:0.2rem; display:block; text-align:right;
  }
  .chat-input-area{
    display:flex; gap:0.5rem; padding:0.8rem; background:var(--surface);
    border-top:1px solid var(--line); flex-shrink:0;
  }
  .chat-input-area input{
    flex:1; padding:0.6rem 1rem; border-radius:20px; border:1px solid var(--line);
    background:var(--bg-0); color:var(--text); outline:none;
    font-family:inherit; font-size:0.95rem;
  }
  .chat-input-area input::placeholder{
    color:var(--text-faint);
  }
  .chat-input-area button{
    width:42px; height:42px; border-radius:50%; border:none; background:var(--signal);
    color:#fff; cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center;
    transition:opacity .2s, transform .1s;
  }
  .chat-input-area button:disabled{
    opacity:0.6; cursor:not-allowed;
  }
  .chat-input-area button:active:not(:disabled){
    transform:scale(0.95);
  }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<div class="app-container" id="app">
  <!-- Header for conversation list -->
  <div class="header" id="listHeader">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <span class="title">Messages</span>
    <button class="icon-btn" id="newChatBtn"><i class="fas fa-plus"></i></button>
  </div>

  <!-- Conversation list -->
  <div class="conversation-list" id="conversationList">
    <div class="empty-state">Loading…</div>
  </div>

  <!-- Chat view (hidden initially) -->
  <div class="chat-view hidden" id="chatView">
    <div class="chat-header">
      <button class="back-btn" id="chatBackBtn"><i class="fas fa-arrow-left"></i></button>
      <div class="avatar" id="chatPeerAvatar">?</div>
      <span class="peer-name" id="chatPeerName"></span>
    </div>
    <div class="messages" id="messagesContainer"></div>
    <div class="chat-input-area">
      <input type="text" id="messageInput" placeholder="Type a message…" autocomplete="off" />
      <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>
</div>

<!-- Load PremCall core -->
<script src="https://cdn.jsdelivr.net/gh/suryasticsai/premCall@main/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/suryasticsai/premCall@main/premcall.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/suryasticsai/premCall@main/premcall-chat.js"></script>

<script>
(function() {
  'use strict';

  /* ---------- Helpers ---------- */
  function escapeHtml(text) {
    if (text == null) return '';
    return String(text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function waitForPremCall(callback, timeout) {
    timeout = timeout || 10000;
    var start = Date.now();
    var timer = setInterval(function() {
      if (typeof PremCall !== 'undefined' && typeof PremCall.init === 'function' && typeof PremCall.sendMessage === 'function') {
        clearInterval(timer);
        callback(null, PremCall);
      } else if (Date.now() - start > timeout) {
        clearInterval(timer);
        callback(new Error('PremCall library failed to load. Please check your connection and refresh the page.'));
      }
    }, 100);
  }

  function initials(peer) {
    if (!peer) return '?';
    var digitsOnly = /^[\d+\s-]+$/.test(peer);
    if (digitsOnly) {
      var digits = peer.replace(/\D/g, '');
      return digits.slice(-2) || '?';
    }
    var parts = peer.trim().split(/\s+/).slice(0, 2);
    var ret = parts.map(function(w) { return w.charAt(0); }).join('').toUpperCase();
    return ret || '?';
  }

  function formatTime(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function sanitizeConversations(data) {
    var out = {};
    for (var key in data) {
      if (Object.prototype.hasOwnProperty.call(data, key)) {
        var arr = data[key];
        if (Array.isArray(arr)) {
          out[key] = arr.filter(function(m) {
            return m && typeof m === 'object';
          }).map(function(m) {
            return {
              text: String(m.text || ''),
              timestamp: typeof m.timestamp === 'number' ? m.timestamp : Date.now(),
              direction: m.direction === 'outgoing' ? 'outgoing' : 'incoming'
            };
          });
        } else {
          out[key] = [];
        }
      }
    }
    return out;
  }

  /* ---------- State ---------- */
  var conversations = {};
  var activePeer = null;
  var isSending = false;

  function loadConversations() {
    try {
      return JSON.parse(localStorage.getItem('premCallChats') || '{}');
    } catch (e) {
      console.error('Failed to load conversations:', e);
      return {};
    }
  }

  function saveConversations() {
    try {
      localStorage.setItem('premCallChats', JSON.stringify(conversations));
    } catch (e) {
      console.error('Failed to save conversations:', e);
      alert('Storage full: unable to save message. Please clear some conversations.');
    }
  }

  /* ---------- Render conversation list ---------- */
  function renderConversationList() {
    var listEl = document.getElementById('conversationList');
    listEl.innerHTML = '';
    var peers = Object.keys(conversations);
    if (peers.length === 0) {
      listEl.innerHTML = '<div class="empty-state">No conversations yet</div>';
      return;
    }
    peers.sort(function(a, b) {
      var msgsA = conversations[a];
      var msgsB = conversations[b];
      var lastA = msgsA.length ? (Number(msgsA[msgsA.length - 1].timestamp) || 0) : 0;
      var lastB = msgsB.length ? (Number(msgsB[msgsB.length - 1].timestamp) || 0) : 0;
      return lastB - lastA;
    });

    peers.forEach(function(peer) {
      var msgs = conversations[peer];
      var lastMsg = msgs[msgs.length - 1] || { text: '', timestamp: 0, direction: '' };

      var item = document.createElement('div');
      item.className = 'conversation-item';

      var avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = initials(peer);
      item.appendChild(avatar);

      var info = document.createElement('div');
      info.className = 'info';

      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = peer;
      info.appendChild(name);

      var preview = document.createElement('div');
      preview.className = 'preview';
      preview.textContent = (lastMsg.direction === 'outgoing' ? 'You: ' : '') + (lastMsg.text || '');
      info.appendChild(preview);

      item.appendChild(info);

      var time = document.createElement('span');
      time.className = 'time';
      time.textContent = formatTime(lastMsg.timestamp);
      item.appendChild(time);

      item.addEventListener('click', function() { openChat(peer); });
      listEl.appendChild(item);
    });
  }

  /* ---------- Open / close chat ---------- */
  function openChat(peer) {
    activePeer = peer;
    document.getElementById('listHeader').classList.add('hidden');
    document.getElementById('conversationList').classList.add('hidden');
    document.getElementById('chatView').classList.remove('hidden');

    document.getElementById('chatPeerName').textContent = peer;
    document.getElementById('chatPeerAvatar').textContent = initials(peer);
    renderMessages();
    document.getElementById('messageInput').focus();
  }

  function closeChat() {
    activePeer = null;
    document.getElementById('chatView').classList.add('hidden');
    document.getElementById('listHeader').classList.remove('hidden');
    document.getElementById('conversationList').classList.remove('hidden');
    renderConversationList();
  }

  /* ---------- Render messages ---------- */
  function renderMessages() {
    var container = document.getElementById('messagesContainer');
    container.innerHTML = '';
    if (!activePeer || !conversations[activePeer]) return;

    var msgs = conversations[activePeer];
    msgs.forEach(function(msg) {
      var bubble = document.createElement('div');
      bubble.className = 'message-bubble ' + (msg.direction === 'outgoing' ? 'outgoing' : 'incoming');

      var textSpan = document.createElement('span');
      textSpan.textContent = msg.text || '';
      bubble.appendChild(textSpan);

      var timeSpan = document.createElement('span');
      timeSpan.className = 'timestamp';
      timeSpan.textContent = formatTime(msg.timestamp);
      bubble.appendChild(timeSpan);

      container.appendChild(bubble);
    });

    container.scrollTop = container.scrollHeight;
  }

  /* ---------- Add message ---------- */
  function addMessage(peer, msg) {
    if (!peer || !msg) return;
    if (!Array.isArray(conversations[peer])) conversations[peer] = [];
    conversations[peer].push({
      text: String(msg.text || ''),
      timestamp: typeof msg.timestamp === 'number' ? msg.timestamp : Date.now(),
      direction: msg.direction === 'outgoing' ? 'outgoing' : 'incoming'
    });
    saveConversations();
    if (activePeer === peer) renderMessages();
  }

  /* ---------- Incoming message handler ---------- */
  function handleIncomingMessage(msg) {
    if (!msg || typeof msg !== 'object') {
      console.warn('Invalid message received:', msg);
      return;
    }
    var peer = msg.from;
    var text = msg.text;
    var timestamp = msg.timestamp;

    if (!peer || text == null) {
      console.warn('Message missing from or text:', msg);
      return;
    }

    addMessage(peer, {
      text: String(text),
      timestamp: (typeof timestamp === 'number' && timestamp > 0) ? timestamp : Date.now(),
      direction: 'incoming'
    });

    if (activePeer !== peer) {
      renderConversationList();
    }
  }

  /* ---------- Send message ---------- */
  function sendMessage() {
    if (!activePeer || isSending) return;
    var input = document.getElementById('messageInput');
    var text = input.value.trim();
    if (!text) return;

    isSending = true;
    var sendBtn = document.getElementById('sendBtn');
    sendBtn.disabled = true;
    sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

    try {
      PremCall.sendMessage(activePeer, text)
        .then(function() {
          addMessage(activePeer, {
            text: text,
            timestamp: Date.now(),
            direction: 'outgoing'
          });
          input.value = '';
        })
        .catch(function(err) {
          alert('Send failed: ' + (err && err.message ? err.message : 'Unknown error'));
        })
        .finally(function() {
          isSending = false;
          sendBtn.disabled = false;
          sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
        });
    } catch (e) {
      isSending = false;
      sendBtn.disabled = false;
      sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
      alert('Send failed: ' + e.message);
    }
  }

  /* ---------- Event listeners ---------- */
  function setupEventListeners() {
    document.getElementById('newChatBtn').addEventListener('click', function() {
      var num = prompt('Enter 10-digit number to start a chat:');
      if (num && /^\d{10}$/.test(num.trim())) {
        var trimmed = num.trim();
        if (!Array.isArray(conversations[trimmed])) conversations[trimmed] = [];
        saveConversations();
        openChat(trimmed);
      } else if (num) {
        alert('Enter a valid 10-digit number');
      }
    });

    document.getElementById('chatBackBtn').addEventListener('click', closeChat);
    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('messageInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') sendMessage();
    });
  }

  /* ---------- Boot ---------- */
  document.addEventListener('DOMContentLoaded', function() {
    conversations = sanitizeConversations(loadConversations());

    waitForPremCall(function(err, PremCall) {
      if (err) {
        document.getElementById('conversationList').innerHTML =
          '<div class="empty-state" style="color:var(--stop)">' + escapeHtml(err.message) + '</div>';
        return;
      }

      var storedNumber = localStorage.getItem('premCallNumber');
      var verified = localStorage.getItem('premCallVerified') === 'true';

      if (storedNumber && verified) {
        try {
          PremCall.init(storedNumber, {
            onMessage: handleIncomingMessage,
            onError: function(err) {
              console.warn('PremCall error:', err && err.message ? err.message : err);
            }
          });
        } catch (e) {
          console.error('PremCall init error:', e);
          document.getElementById('conversationList').innerHTML =
            '<div class="empty-state" style="color:var(--stop)">Unable to start messaging service.</div>';
          return;
        }
      } else {
        document.getElementById('conversationList').innerHTML =
          '<div class="empty-state">Please register in the dialer first.</div>';
      }

      setupEventListeners();
      renderConversationList();
    });
  });
})();
</script>
</body>
</html>

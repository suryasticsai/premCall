<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PremCall · Minimal</title>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b0e17;
      color: #e8edf5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .container { max-width: 420px; width: 100%; background: #131a26; border-radius: 24px; padding: 1.5rem; box-shadow: 0 0 40px rgba(0,0,0,0.8); }
    .logo { display: flex; align-items: center; gap: 0.5rem; font-size: 1.8rem; font-weight: 700; color: #4f8cf7; }
    .logo svg { width: 32px; height: 32px; }
    .subhead { color: #8892b0; margin: 0.5rem 0 1.5rem; }
    .card { background: #1a2338; border-radius: 16px; padding: 1.2rem; margin-bottom: 1.2rem; }
    .flex-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .btn { padding: 0.6rem 1.2rem; border: none; border-radius: 40px; font-weight: 600; cursor: pointer; background: #2a3a5a; color: #e8edf5; }
    .btn-green { background: #1a7a4a; }
    .btn-red { background: #8a1a2a; }
    .btn-blue { background: #1a4a8a; }
    .btn:disabled { opacity: 0.5; }
    input { padding: 0.6rem; border-radius: 30px; border: 1px solid #2a3a5a; background: #0b0e17; color: #e8edf5; width: 100%; }
    .dialer-display { background: #0b0e17; border-radius: 12px; padding: 0.8rem; font-size: 1.8rem; text-align: center; margin-bottom: 1rem; border: 1px solid #2a3a5a; }
    .dialer-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; max-width: 300px; margin: 0 auto; }
    .dialer-pad .key { background: #1e2a3a; border-radius: 50%; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: 500; cursor: pointer; user-select: none; }
    .dialer-pad .key:active { background: #2a3a5a; }
    .dialer-pad .key.call { background: #1a7a4a; color: #fff; }
    .dialer-pad .key.hangup { background: #8a1a2a; color: #fff; }
    #incomingOverlay {
      display: none;
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
      flex-direction: column; justify-content: center; align-items: center;
      z-index: 1000;
    }
    #incomingOverlay.active { display: flex; }
    #incomingOverlay .caller-name { font-size: 2rem; font-weight: 700; }
    #incomingOverlay .caller-number { color: #8892b0; margin-bottom: 2rem; }
    #incomingOverlay .actions { display: flex; gap: 2rem; }
    #incomingOverlay .actions button { width: 70px; height: 70px; border-radius: 50%; border: none; cursor: pointer; background: #2a3a5a; }
    #incomingOverlay .actions .answer { background: #1a7a4a; }
    #incomingOverlay .actions .reject { background: #8a1a2a; }
    #callScreen {
      display: none;
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #0b0e17;
      flex-direction: column; justify-content: center; align-items: center;
      z-index: 999;
    }
    #callScreen.active { display: flex; }
    #callScreen .caller-name { font-size: 2rem; font-weight: 700; }
    #callScreen .call-timer { font-size: 1.5rem; color: #4ade80; margin: 1rem 0; }
    #callScreen .actions { display: flex; gap: 1.5rem; }
    #callScreen .actions button { width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer; background: #1e2a3a; }
    #callScreen .actions .hangup { background: #8a1a2a; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e2a3a; padding: 0.6rem 1.2rem; border-radius: 30px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 2000; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
<div class="container">

  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#4f8cf7" stroke-width="2">
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
      <circle cx="12" cy="12" r="10"/>
      <path d="M12 8v4l3 3"/>
    </svg>
    <span>PremCall</span>
  </div>
  <p class="subhead">Simple P2P audio calls</p>

  <!-- Number setup -->
  <div class="card">
    <div style="font-weight:600; margin-bottom:0.5rem;">Your Number</div>
    <div style="display:flex; gap:0.5rem;">
      <select id="countryCode" style="padding:0.5rem; border-radius:30px; background:#0b0e17; color:#e8edf5; border:1px solid #2a3a5a;">
        <option value="+91">+91</option>
        <option value="+1">+1</option>
        <option value="+44">+44</option>
      </select>
      <input type="tel" id="phoneInput" placeholder="10 digits" maxlength="10" inputmode="numeric" />
    </div>
    <button class="btn btn-blue" id="registerBtn" style="margin-top:0.5rem;">Register</button>
    <div id="numberStatus" style="margin-top:0.5rem; color:#8892b0;"></div>
  </div>

  <!-- Dialer -->
  <div class="card" id="dialerCard">
    <div class="dialer-display" id="dialDisplay">Enter number</div>
    <div class="dialer-pad" id="dialPad">
      <div class="key" data-digit="1">1</div>
      <div class="key" data-digit="2">2</div>
      <div class="key" data-digit="3">3</div>
      <div class="key" data-digit="4">4</div>
      <div class="key" data-digit="5">5</div>
      <div class="key" data-digit="6">6</div>
      <div class="key" data-digit="7">7</div>
      <div class="key" data-digit="8">8</div>
      <div class="key" data-digit="9">9</div>
      <div class="key" data-digit="*">*</div>
      <div class="key" data-digit="0">0</div>
      <div class="key" data-digit="#">#</div>
      <div class="key" data-action="delete">⌫</div>
      <div class="key call" data-action="call">📞</div>
      <div class="key" data-action="clear">✕</div>
    </div>
  </div>

  <div style="display:flex; gap:0.5rem;">
    <button class="btn btn-outline" id="checkStatusBtn">Check Status</button>
    <span id="statusResult" style="color:#8892b0;"></span>
  </div>
</div>

<!-- Incoming Call Overlay -->
<div id="incomingOverlay">
  <div style="font-size:3rem; margin-bottom:0.5rem;" id="incomingAvatar">📞</div>
  <div class="caller-name" id="incomingName">Unknown</div>
  <div class="caller-number" id="incomingNumber">+1234567890</div>
  <div class="actions">
    <button class="answer" id="answerBtn">✅</button>
    <button class="reject" id="rejectBtn">❌</button>
  </div>
</div>

<!-- Call Screen -->
<div id="callScreen">
  <div style="font-size:3rem; margin-bottom:0.5rem;" id="callAvatar">📞</div>
  <div class="caller-name" id="callName">Calling...</div>
  <div class="call-timer" id="callTimer">00:00</div>
  <div class="actions">
    <button class="hangup" id="hangupCallBtn">📴</button>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Persistent audio element (hidden) -->
<audio id="remoteAudio" autoplay playsinline style="display:none;"></audio>

<script>
  (function() {
    "use strict";

    // ─── DOM refs ────────────────────────────────────────────
    const registerBtn = document.getElementById('registerBtn');
    const phoneInput = document.getElementById('phoneInput');
    const countryCode = document.getElementById('countryCode');
    const numberStatus = document.getElementById('numberStatus');
    const dialDisplay = document.getElementById('dialDisplay');
    const dialPad = document.getElementById('dialPad');
    const checkStatusBtn = document.getElementById('checkStatusBtn');
    const statusResult = document.getElementById('statusResult');
    const incomingOverlay = document.getElementById('incomingOverlay');
    const incomingName = document.getElementById('incomingName');
    const incomingNumber = document.getElementById('incomingNumber');
    const incomingAvatar = document.getElementById('incomingAvatar');
    const answerBtn = document.getElementById('answerBtn');
    const rejectBtn = document.getElementById('rejectBtn');
    const callScreen = document.getElementById('callScreen');
    const callName = document.getElementById('callName');
    const callAvatar = document.getElementById('callAvatar');
    const callTimer = document.getElementById('callTimer');
    const hangupCallBtn = document.getElementById('hangupCallBtn');
    const remoteAudio = document.getElementById('remoteAudio');
    const toast = document.getElementById('toast');

    // ─── State ────────────────────────────────────────────────
    let myNumber = localStorage.getItem('premCallNumber') || null;
    let peer = null;
    let currentCall = null;         // MediaConnection
    let localStream = null;
    let isInCall = false;
    let isCaller = false;
    let incomingCall = null;
    let ringtoneInterval = null;
    let callTimerInterval = null;
    let callStartTime = null;
    let dialedNumber = '';

    // ─── ICE Servers ──────────────────────────────────────────
    function getIceServers() {
      return {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' },
          { urls: 'stun:stun3.l.google.com:19302' },
          { urls: 'stun:stun4.l.google.com:19302' },
          { urls: 'stun:stun.ekiga.net' },
          { urls: 'stun:stun.ideasip.com' },
          {
            urls: ['turn:numb.viagenie.ca:3478', 'turn:numb.viagenie.ca:443'],
            username: 'webrtc@live.com',
            credential: 'muazkh'
          }
        ],
        iceCandidatePoolSize: 10
      };
    }

    // ─── Toast ──────────────────────────────────────────────────
    let toastTimeout;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // ─── Registration ──────────────────────────────────────────
    function register() {
      const cc = countryCode.value;
      const num = phoneInput.value.trim();
      if (!/^\d{10}$/.test(num)) {
        numberStatus.textContent = 'Enter exactly 10 digits.';
        return;
      }
      const full = cc + num;
      myNumber = full;
      localStorage.setItem('premCallNumber', myNumber);
      numberStatus.textContent = 'Registered: ' + full;
      initPeer();
    }

    registerBtn.addEventListener('click', register);
    phoneInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') register(); });

    // ─── PeerJS init ──────────────────────────────────────────
    function initPeer() {
      if (peer) { peer.destroy(); peer = null; }
      if (!myNumber) return;

      peer = new Peer(myNumber, { debug: 2, config: getIceServers() });

      peer.on('open', () => {
        showToast('Peer online: ' + myNumber);
      });

      peer.on('error', (err) => {
        console.error(err);
        if (err.type === 'unavailable-id') {
          numberStatus.textContent = 'Number taken. Choose another.';
          localStorage.removeItem('premCallNumber');
          myNumber = null;
        } else {
          showToast('Peer error: ' + err.message);
        }
      });

      // Incoming call
      peer.on('call', (call) => {
        if (isInCall) {
          call.close();
          showToast('Busy, rejecting');
          return;
        }
        incomingCall = call;
        const name = call.peer;
        incomingName.textContent = name;
        incomingNumber.textContent = name;
        incomingAvatar.textContent = '📞';
        incomingOverlay.classList.add('active');
        playRingtone();
        // Auto‑miss after 20s
        setTimeout(() => {
          if (incomingCall && incomingOverlay.classList.contains('active')) {
            showToast('Missed call from ' + name);
            rejectIncomingCall();
          }
        }, 20000);
      });
    }

    // ─── Ringtone ──────────────────────────────────────────────
    function playRingtone() {
      stopRingtone();
      let ctx = new (window.AudioContext || window.webkitAudioContext)();
      let count = 0;
      ringtoneInterval = setInterval(() => {
        if (count >= 12 || !incomingOverlay.classList.contains('active')) {
          stopRingtone();
          return;
        }
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = count % 2 === 0 ? 440 : 330;
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.3);
        count++;
      }, 400);
    }
    function stopRingtone() {
      if (ringtoneInterval) {
        clearInterval(ringtoneInterval);
        ringtoneInterval = null;
      }
    }

    // ─── Microphone ──────────────────────────────────────────────
    async function getLocalStream() {
      if (!localStream) {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true }
          });
        } catch (err) {
          showToast('Microphone access denied');
          throw err;
        }
      }
      return localStream;
    }

    // ─── Remote Audio ──────────────────────────────────────────
    function attachRemoteStream(stream) {
      remoteAudio.srcObject = stream;
      remoteAudio.play().catch((err) => {
        console.warn('Autoplay prevented:', err);
        // Try on user interaction
        const resume = () => remoteAudio.play().catch(() => {});
        document.addEventListener('click', resume, { once: true });
        document.addEventListener('touchstart', resume, { once: true });
      });
    }

    // ─── Make Call ──────────────────────────────────────────────
    async function makeCall(targetNumber) {
      if (isInCall) { showToast('Already in a call'); return; }
      if (!peer) { showToast('Peer not ready'); return; }
      if (targetNumber === myNumber) { showToast('Cannot call yourself'); return; }
      if (!/^\d+$/.test(targetNumber)) { showToast('Invalid number'); return; }

      try {
        await getLocalStream();
        const call = peer.call(targetNumber, localStream);
        if (!call) {
          showToast('Could not initiate call (peer offline)');
          return;
        }
        currentCall = call;
        isCaller = true;
        isInCall = true;
        callStartTime = Date.now();
        showCallScreen(targetNumber);

        call.on('stream', (stream) => {
          attachRemoteStream(stream);
          startTimer();
          showToast('Connected');
        });

        call.on('close', () => {
          endCall();
        });

        call.on('error', (err) => {
          console.error(err);
          showToast('Call error: ' + err.message);
          endCall();
        });

        // ICE monitoring
        const pc = call.peerConnection;
        if (pc) {
          pc.oniceconnectionstatechange = () => {
            if (pc.iceConnectionState === 'failed') {
              showToast('Connection lost');
              endCall();
            }
          };
        }
      } catch (err) {
        showToast('Call failed: ' + err.message);
        endCall();
      }
    }

    function showCallScreen(number) {
      callName.textContent = number;
      callAvatar.textContent = '📞';
      callScreen.classList.add('active');
      incomingOverlay.classList.remove('active');
    }

    function startTimer() {
      if (callTimerInterval) clearInterval(callTimerInterval);
      let seconds = 0;
      callTimerInterval = setInterval(() => {
        seconds++;
        const m = String(Math.floor(seconds / 60)).padStart(2, '0');
        const s = String(seconds % 60).padStart(2, '0');
        callTimer.textContent = `${m}:${s}`;
      }, 1000);
    }

    // ─── Answer / Reject ──────────────────────────────────────
    async function answerIncomingCall() {
      if (!incomingCall) return;
      try {
        stopRingtone();
        await getLocalStream();
        incomingCall.answer(localStream);
        currentCall = incomingCall;
        isCaller = false;
        isInCall = true;
        callStartTime = Date.now();
        const number = currentCall.peer;
        showCallScreen(number);
        incomingOverlay.classList.remove('active');

        currentCall.on('stream', (stream) => {
          attachRemoteStream(stream);
          startTimer();
          showToast('Connected');
        });

        currentCall.on('close', () => endCall());
        currentCall.on('error', (err) => { console.error(err); showToast('Call error'); endCall(); });

        incomingCall = null;
      } catch (err) {
        showToast('Answer failed: ' + err.message);
        rejectIncomingCall();
      }
    }

    function rejectIncomingCall() {
      if (incomingCall) { incomingCall.close(); incomingCall = null; }
      stopRingtone();
      incomingOverlay.classList.remove('active');
    }

    // ─── End Call ──────────────────────────────────────────────
    function endCall() {
      if (currentCall) { currentCall.close(); currentCall = null; }
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      remoteAudio.pause();
      remoteAudio.srcObject = null;

      isInCall = false;
      isCaller = false;
      stopRingtone();
      incomingOverlay.classList.remove('active');
      callScreen.classList.remove('active');
      if (callTimerInterval) clearInterval(callTimerInterval);
      callTimer.textContent = '00:00';
    }

    // ─── Dialer ──────────────────────────────────────────────────
    dialPad.addEventListener('click', (e) => {
      const key = e.target.closest('.key');
      if (!key) return;
      const digit = key.dataset.digit;
      const action = key.dataset.action;
      if (digit) {
        dialedNumber += digit;
        dialDisplay.textContent = dialedNumber;
      } else if (action === 'delete') {
        dialedNumber = dialedNumber.slice(0, -1);
        dialDisplay.textContent = dialedNumber || 'Enter number';
      } else if (action === 'clear') {
        dialedNumber = '';
        dialDisplay.textContent = 'Enter number';
      } else if (action === 'call') {
        if (dialedNumber) makeCall(dialedNumber);
      }
    });

    // ─── Check Status ──────────────────────────────────────────
    checkStatusBtn.addEventListener('click', () => {
      const num = dialedNumber || prompt('Enter number to check:');
      if (!num) return;
      if (!peer) { statusResult.textContent = 'Peer not ready'; return; }
      statusResult.textContent = 'Checking...';
      const conn = peer.connect(num);
      conn.on('open', () => {
        statusResult.textContent = '✅ Online';
        conn.close();
      });
      conn.on('error', () => {
        statusResult.textContent = '❌ Offline';
      });
      setTimeout(() => {
        if (statusResult.textContent === 'Checking...') {
          statusResult.textContent = '⏳ Timeout (offline)';
          conn.close();
        }
      }, 3000);
    });

    // ─── Button events ──────────────────────────────────────────
    answerBtn.addEventListener('click', answerIncomingCall);
    rejectBtn.addEventListener('click', rejectIncomingCall);
    hangupCallBtn.addEventListener('click', endCall);

    // ─── Init ──────────────────────────────────────────────────
    if (myNumber) {
      numberStatus.textContent = 'Registered: ' + myNumber;
      initPeer();
    } else {
      numberStatus.textContent = 'Set your number to start.';
    }

    console.log('PremCall minimal loaded.');
  })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PremCall · Core</title>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b0e17;
      color: #e8edf5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .container { max-width: 420px; width: 100%; background: #131a26; border-radius: 24px; padding: 1.5rem; }
    .logo { font-size: 1.8rem; font-weight: 700; color: #4f8cf7; margin-bottom: 0.5rem; }
    .subhead { color: #8892b0; margin-bottom: 1.5rem; }
    .card { background: #1a2338; border-radius: 16px; padding: 1.2rem; margin-bottom: 1.2rem; }
    .flex { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    input, select { padding: 0.6rem; border-radius: 30px; border: 1px solid #2a3a5a; background: #0b0e17; color: #e8edf5; width: 100%; }
    .btn { padding: 0.6rem 1.2rem; border: none; border-radius: 40px; font-weight: 600; cursor: pointer; background: #2a3a5a; color: #e8edf5; }
    .btn-primary { background: #1a4a8a; }
    .btn-success { background: #1a7a4a; }
    .btn-danger { background: #8a1a2a; }
    .btn:disabled { opacity: 0.5; }
    .dialer-display { background: #0b0e17; border-radius: 12px; padding: 0.8rem; font-size: 1.8rem; text-align: center; margin-bottom: 1rem; border: 1px solid #2a3a5a; }
    .dialer-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; max-width: 280px; margin: 0 auto; }
    .dialer-pad .key { background: #1e2a3a; border-radius: 50%; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: 500; cursor: pointer; user-select: none; }
    .dialer-pad .key:active { background: #2a3a5a; }
    .dialer-pad .key.call { background: #1a7a4a; color: #fff; }
    .dialer-pad .key.hangup { background: #8a1a2a; color: #fff; }
    #incomingOverlay {
      display: none;
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
      flex-direction: column; justify-content: center; align-items: center;
      z-index: 1000;
    }
    #incomingOverlay.active { display: flex; }
    #incomingOverlay .caller-name { font-size: 2rem; font-weight: 700; }
    #incomingOverlay .caller-number { color: #8892b0; margin-bottom: 2rem; }
    #incomingOverlay .actions { display: flex; gap: 2rem; }
    #incomingOverlay .actions button { width: 70px; height: 70px; border-radius: 50%; border: none; cursor: pointer; font-size: 2rem; }
    #incomingOverlay .actions .answer { background: #1a7a4a; }
    #incomingOverlay .actions .reject { background: #8a1a2a; }
    #callScreen {
      display: none;
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #0b0e17;
      flex-direction: column; justify-content: center; align-items: center;
      z-index: 999;
    }
    #callScreen.active { display: flex; }
    #callScreen .caller-name { font-size: 2rem; font-weight: 700; }
    #callScreen .call-timer { font-size: 1.5rem; color: #4ade80; margin: 1rem 0; }
    #callScreen .actions { display: flex; gap: 1.5rem; }
    #callScreen .actions button { width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer; font-size: 1.8rem; background: #1e2a3a; }
    #callScreen .actions .hangup { background: #8a1a2a; }
    #callScreen .status-msg { color: #fbbf24; font-size: 0.9rem; margin-top: 0.5rem; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e2a3a; padding: 0.6rem 1.2rem; border-radius: 30px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 2000; }
    .toast.show { opacity: 1; }
    .log-area { background: #0b0e17; border-radius: 8px; padding: 0.5rem; font-family: monospace; font-size: 0.7rem; max-height: 100px; overflow-y: auto; color: #8892b0; margin-top: 1rem; }
  </style>
</head>
<body>
<div class="container">

  <div class="logo">📞 PremCall</div>
  <p class="subhead">Minimal P2P call – no country codes, just a 5‑digit number</p>

  <!-- Registration -->
  <div class="card">
    <div style="font-weight:600; margin-bottom:0.5rem;">Your Number</div>
    <input type="tel" id="phoneInput" placeholder="5 digits (e.g. 12345)" maxlength="5" inputmode="numeric" />
    <button class="btn btn-primary" id="registerBtn" style="margin-top:0.5rem;">Register</button>
    <div id="numberStatus" style="margin-top:0.5rem; color:#8892b0;"></div>
  </div>

  <!-- Dialer -->
  <div class="card">
    <div class="dialer-display" id="dialDisplay">Enter number</div>
    <div class="dialer-pad" id="dialPad">
      <div class="key" data-digit="1">1</div>
      <div class="key" data-digit="2">2</div>
      <div class="key" data-digit="3">3</div>
      <div class="key" data-digit="4">4</div>
      <div class="key" data-digit="5">5</div>
      <div class="key" data-digit="6">6</div>
      <div class="key" data-digit="7">7</div>
      <div class="key" data-digit="8">8</div>
      <div class="key" data-digit="9">9</div>
      <div class="key" data-digit="0">0</div>
      <div class="key" data-action="delete">⌫</div>
      <div class="key call" data-action="call">📞</div>
    </div>
  </div>

  <!-- Status / Actions -->
  <div class="flex" style="justify-content:space-between;">
    <button class="btn" id="checkStatusBtn">Check Status</button>
    <span id="statusResult" style="color:#8892b0;"></span>
  </div>

  <!-- Log area (to see what happens) -->
  <div class="log-area" id="logArea">Logs will appear here.</div>

</div>

<!-- Incoming Overlay -->
<div id="incomingOverlay">
  <div style="font-size:3rem; margin-bottom:0.5rem;" id="incomingAvatar">📞</div>
  <div class="caller-name" id="incomingName">Unknown</div>
  <div class="caller-number" id="incomingNumber">+1234567890</div>
  <div class="actions">
    <button class="answer" id="answerBtn">✅</button>
    <button class="reject" id="rejectBtn">❌</button>
  </div>
</div>

<!-- Call Screen -->
<div id="callScreen">
  <div style="font-size:3rem; margin-bottom:0.5rem;" id="callAvatar">📞</div>
  <div class="caller-name" id="callName">Calling...</div>
  <div class="call-timer" id="callTimer">00:00</div>
  <div class="status-msg" id="callStatusMsg"></div>
  <div class="actions">
    <button class="hangup" id="hangupCallBtn">📴</button>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Persistent audio element -->
<audio id="remoteAudio" autoplay playsinline style="display:none;"></audio>

<script>
  (function() {
    "use strict";

    // ─── DOM refs ────────────────────────────────────────────────
    const phoneInput = document.getElementById('phoneInput');
    const registerBtn = document.getElementById('registerBtn');
    const numberStatus = document.getElementById('numberStatus');
    const dialDisplay = document.getElementById('dialDisplay');
    const dialPad = document.getElementById('dialPad');
    const checkStatusBtn = document.getElementById('checkStatusBtn');
    const statusResult = document.getElementById('statusResult');
    const logArea = document.getElementById('logArea');
    const incomingOverlay = document.getElementById('incomingOverlay');
    const incomingName = document.getElementById('incomingName');
    const incomingNumber = document.getElementById('incomingNumber');
    const incomingAvatar = document.getElementById('incomingAvatar');
    const answerBtn = document.getElementById('answerBtn');
    const rejectBtn = document.getElementById('rejectBtn');
    const callScreen = document.getElementById('callScreen');
    const callName = document.getElementById('callName');
    const callAvatar = document.getElementById('callAvatar');
    const callTimer = document.getElementById('callTimer');
    const callStatusMsg = document.getElementById('callStatusMsg');
    const hangupCallBtn = document.getElementById('hangupCallBtn');
    const remoteAudio = document.getElementById('remoteAudio');
    const toast = document.getElementById('toast');

    // ─── State ──────────────────────────────────────────────────
    let myNumber = localStorage.getItem('premCallNumber') || null;
    let peer = null;
    let currentCall = null;         // MediaConnection
    let localStream = null;
    let isInCall = false;
    let isCaller = false;
    let incomingCall = null;
    let ringtoneInterval = null;
    let callTimerInterval = null;
    let callStartTime = null;
    let dialedNumber = '';

    // ─── Logging ──────────────────────────────────────────────────
    function log(msg) {
      const now = new Date().toLocaleTimeString();
      logArea.innerHTML = now + ' ' + msg + '\n' + logArea.innerHTML;
      console.log('[PremCall]', msg);
    }

    // ─── Toast ──────────────────────────────────────────────────
    let toastTimeout;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // ─── Registration ──────────────────────────────────────────
    function register() {
      const num = phoneInput.value.trim();
      if (!/^\d{5}$/.test(num)) {
        numberStatus.textContent = 'Enter exactly 5 digits.';
        return;
      }
      myNumber = num;
      localStorage.setItem('premCallNumber', myNumber);
      numberStatus.textContent = 'Registered: ' + myNumber;
      log('Registered number: ' + myNumber);
      initPeer();
    }

    registerBtn.addEventListener('click', register);
    phoneInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') register(); });

    // ─── PeerJS init ──────────────────────────────────────────
    function initPeer() {
      if (peer) { peer.destroy(); peer = null; }
      if (!myNumber) return;

      // Use default PeerJS config (no custom ICE) – PeerJS provides its own STUN/TURN
      peer = new Peer(myNumber, { debug: 2 });

      peer.on('open', (id) => {
        log('Peer open with ID: ' + id);
        showToast('Online as ' + id);
      });

      peer.on('error', (err) => {
        log('Peer error: ' + err.type + ' – ' + err.message);
        if (err.type === 'unavailable-id') {
          numberStatus.textContent = 'Number taken. Choose another.';
          localStorage.removeItem('premCallNumber');
          myNumber = null;
        } else {
          showToast('Error: ' + err.message);
        }
      });

      peer.on('disconnected', () => {
        log('Disconnected – trying to reconnect...');
        setTimeout(() => { if (peer) peer.reconnect(); }, 2000);
      });

      // Incoming call
      peer.on('call', (call) => {
        log('Incoming call from: ' + call.peer);
        if (isInCall) {
          call.close();
          showToast('Busy, rejecting');
          log('Rejected – already in call');
          return;
        }
        incomingCall = call;
        const name = call.peer;
        incomingName.textContent = name;
        incomingNumber.textContent = name;
        incomingAvatar.textContent = '📞';
        incomingOverlay.classList.add('active');
        playRingtone();
        // Auto‑miss after 20s
        setTimeout(() => {
          if (incomingCall && incomingOverlay.classList.contains('active')) {
            log('Auto‑missed call from ' + name);
            showToast('Missed call from ' + name);
            rejectIncomingCall();
          }
        }, 20000);
      });
    }

    // ─── Ringtone ──────────────────────────────────────────────
    function playRingtone() {
      stopRingtone();
      let ctx = new (window.AudioContext || window.webkitAudioContext)();
      let count = 0;
      ringtoneInterval = setInterval(() => {
        if (count >= 12 || !incomingOverlay.classList.contains('active')) {
          stopRingtone();
          return;
        }
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = count % 2 === 0 ? 440 : 330;
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.3);
        count++;
      }, 400);
    }
    function stopRingtone() {
      if (ringtoneInterval) {
        clearInterval(ringtoneInterval);
        ringtoneInterval = null;
      }
    }

    // ─── Microphone ──────────────────────────────────────────────
    async function getLocalStream() {
      if (!localStream) {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true }
          });
          log('Microphone obtained');
        } catch (err) {
          log('Microphone error: ' + err.message);
          showToast('Microphone access denied');
          throw err;
        }
      }
      return localStream;
    }

    // ─── Remote Audio ──────────────────────────────────────────
    function attachRemoteStream(stream) {
      log('Remote stream attached');
      remoteAudio.srcObject = stream;
      remoteAudio.muted = false;
      remoteAudio.volume = 1.0;
      remoteAudio.play().then(() => {
        log('Remote audio playing');
      }).catch((err) => {
        log('Autoplay prevented: ' + err.message);
        // Try on user interaction
        const resume = () => {
          remoteAudio.play().catch(() => {});
          document.removeEventListener('click', resume);
          document.removeEventListener('touchstart', resume);
        };
        document.addEventListener('click', resume, { once: true });
        document.addEventListener('touchstart', resume, { once: true });
      });
    }

    // ─── Make Call ──────────────────────────────────────────────
    async function makeCall(targetNumber) {
      if (isInCall) {
        showToast('Already in a call');
        log('Cannot call – already in call');
        return;
      }
      if (!peer) {
        showToast('Peer not ready');
        log('Peer not ready');
        return;
      }
      if (targetNumber === myNumber) {
        showToast('Cannot call yourself');
        log('Cannot call yourself');
        return;
      }
      if (!/^\d{5}$/.test(targetNumber)) {
        showToast('Enter a 5‑digit number');
        log('Invalid number');
        return;
      }

      log('Attempting to call ' + targetNumber);
      try {
        await getLocalStream();
        const call = peer.call(targetNumber, localStream);
        if (!call) {
          log('peer.call() returned null – peer may be offline');
          showToast('Could not call – peer offline');
          return;
        }
        log('Call initiated');
        currentCall = call;
        isCaller = true;
        isInCall = true;
        callStartTime = Date.now();
        showCallScreen(targetNumber);
        callStatusMsg.textContent = 'Ringing...';

        call.on('stream', (stream) => {
          log('Received remote stream');
          attachRemoteStream(stream);
          callStatusMsg.textContent = 'Connected';
          startTimer();
          showToast('Connected');
        });

        call.on('close', () => {
          log('Call closed by remote or network');
          endCall();
        });

        call.on('error', (err) => {
          log('Call error: ' + err.message);
          showToast('Call error: ' + err.message);
          endCall();
        });

        // ICE monitoring
        const pc = call.peerConnection;
        if (pc) {
          pc.oniceconnectionstatechange = () => {
            const state = pc.iceConnectionState;
            log('ICE state: ' + state);
            if (state === 'failed') {
              showToast('Connection lost');
              endCall();
            } else if (state === 'connected') {
              callStatusMsg.textContent = 'Connected';
            }
          };
        }
      } catch (err) {
        log('Call failed: ' + err.message);
        showToast('Call failed: ' + err.message);
        endCall();
      }
    }

    function showCallScreen(number) {
      callName.textContent = number;
      callAvatar.textContent = '📞';
      callScreen.classList.add('active');
      incomingOverlay.classList.remove('active');
    }

    function startTimer() {
      if (callTimerInterval) clearInterval(callTimerInterval);
      let seconds = 0;
      callTimerInterval = setInterval(() => {
        seconds++;
        const m = String(Math.floor(seconds / 60)).padStart(2, '0');
        const s = String(seconds % 60).padStart(2, '0');
        callTimer.textContent = `${m}:${s}`;
      }, 1000);
    }

    // ─── Answer / Reject ──────────────────────────────────────
    async function answerIncomingCall() {
      if (!incomingCall) {
        log('No incoming call to answer');
        return;
      }
      log('Answering call from ' + incomingCall.peer);
      try {
        stopRingtone();
        await getLocalStream();
        incomingCall.answer(localStream);
        currentCall = incomingCall;
        isCaller = false;
        isInCall = true;
        callStartTime = Date.now();
        const number = currentCall.peer;
        showCallScreen(number);
        incomingOverlay.classList.remove('active');
        callStatusMsg.textContent = 'Connecting...';

        currentCall.on('stream', (stream) => {
          log('Received remote stream (answer)');
          attachRemoteStream(stream);
          callStatusMsg.textContent = 'Connected';
          startTimer();
          showToast('Connected');
        });

        currentCall.on('close', () => {
          log('Call closed (answer side)');
          endCall();
        });

        currentCall.on('error', (err) => {
          log('Call error (answer): ' + err.message);
          showToast('Call error');
          endCall();
        });

        const pc = currentCall.peerConnection;
        if (pc) {
          pc.oniceconnectionstatechange = () => {
            const state = pc.iceConnectionState;
            log('ICE state: ' + state);
            if (state === 'failed') {
              showToast('Connection lost');
              endCall();
            } else if (state === 'connected') {
              callStatusMsg.textContent = 'Connected';
            }
          };
        }

        incomingCall = null;
      } catch (err) {
        log('Answer failed: ' + err.message);
        showToast('Answer failed: ' + err.message);
        rejectIncomingCall();
      }
    }

    function rejectIncomingCall() {
      if (incomingCall) { incomingCall.close(); incomingCall = null; }
      stopRingtone();
      incomingOverlay.classList.remove('active');
      log('Call rejected');
    }

    // ─── End Call ──────────────────────────────────────────────
    function endCall() {
      log('Ending call');
      if (currentCall) { currentCall.close(); currentCall = null; }
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      remoteAudio.pause();
      remoteAudio.srcObject = null;

      isInCall = false;
      isCaller = false;
      stopRingtone();
      incomingOverlay.classList.remove('active');
      callScreen.classList.remove('active');
      if (callTimerInterval) clearInterval(callTimerInterval);
      callTimer.textContent = '00:00';
      callStatusMsg.textContent = '';
      log('Call ended');
    }

    // ─── Dialer ──────────────────────────────────────────────────
    dialPad.addEventListener('click', (e) => {
      const key = e.target.closest('.key');
      if (!key) return;
      const digit = key.dataset.digit;
      const action = key.dataset.action;
      if (digit) {
        dialedNumber += digit;
        dialDisplay.textContent = dialedNumber;
      } else if (action === 'delete') {
        dialedNumber = dialedNumber.slice(0, -1);
        dialDisplay.textContent = dialedNumber || 'Enter number';
      } else if (action === 'call') {
        if (dialedNumber) makeCall(dialedNumber);
      }
    });

    // ─── Check Status ──────────────────────────────────────────
    checkStatusBtn.addEventListener('click', () => {
      const num = dialedNumber || prompt('Enter 5‑digit number to check:');
      if (!num) return;
      if (!peer) { statusResult.textContent = 'Peer not ready'; return; }
      statusResult.textContent = 'Checking...';
      log('Checking status for ' + num);
      const conn = peer.connect(num);
      conn.on('open', () => {
        statusResult.textContent = '✅ Online';
        log(num + ' is online');
        conn.close();
      });
      conn.on('error', () => {
        statusResult.textContent = '❌ Offline';
        log(num + ' is offline');
      });
      setTimeout(() => {
        if (statusResult.textContent === 'Checking...') {
          statusResult.textContent = '⏳ Timeout (offline)';
          log(num + ' timed out');
          conn.close();
        }
      }, 3000);
    });

    // ─── Button events ──────────────────────────────────────────
    answerBtn.addEventListener('click', answerIncomingCall);
    rejectBtn.addEventListener('click', rejectIncomingCall);
    hangupCallBtn.addEventListener('click', endCall);

    // ─── Init ──────────────────────────────────────────────────
    if (myNumber) {
      numberStatus.textContent = 'Registered: ' + myNumber;
      log('Using stored number: ' + myNumber);
      initPeer();
    } else {
      numberStatus.textContent = 'Enter a 5‑digit number to start.';
      log('No number stored – register first.');
    }

    // Keyboard support for dialer
    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') {
        dialedNumber += e.key;
        dialDisplay.textContent = dialedNumber;
      } else if (e.key === 'Backspace') {
        dialedNumber = dialedNumber.slice(0, -1);
        dialDisplay.textContent = dialedNumber || 'Enter number';
      } else if (e.key === 'Enter') {
        if (dialedNumber) makeCall(dialedNumber);
      }
    });

    console.log('PremCall minimal loaded. Check the log area for events.');
  })();
</script>
</body>
</html>

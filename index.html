                            reconnectAttempts++;
                            setTimeout(() => {
                                if (peer && !peer.destroyed) {
                                    try { peer.reconnect(); } catch (e) {}
                                }
                            }, delay);
                        });

                        peer.on('close', () => {
                            $('headerStatusDot').className = 'dot offline';
                            setTimeout(() => {
                                if (peer && !peer.destroyed) {
                                    try { peer.destroy(); } catch (e) {}
                                }
                                initPeer(id);
                            }, 5000);
                        });

                        peer.on('error', err => {
                            showToast('Network: ' + err.type);
                            if (err.type === 'unavailable-id' || err.type === 'invalid-id') {
                                if (!localStorage.getItem('premCallNumber')) {
                                    const newId = 'temp-' + Date.now();
                                    localStorage.setItem('premCallId', newId);
                                    initPeer(newId);
                                }
                            }
                        });

                        peer.on('call', call => {
                            const blocked = getBlocked();
                            if (blocked.includes(call.peer)) {
                                call.close();
                                showToast('Blocked caller');
                                return;
                            }
                            incomingCall = call;
                            showIncomingOverlay(call.peer);
                        });

                        peer.on('connection', conn => {
                            conn.on('data', data => {
                                if (data && data.type === 'msg') {
                                    receiveMessage(conn.peer, data.text);
                                } else if (data && data.type === 'typing') {
                                    handleTyping(conn.peer, data.active);
                                } else if (data && data.type === 'reaction') {
                                    handleReaction(conn.peer, data.msgId, data.emoji);
                                }
                            });
                        });

                    } catch (e) {
                        showToast('Failed to initialize Peer');
                        console.error(e);
                    }
                }
            }

            // ============================================================
            //  WEBRTC HELPERS
            // ============================================================
            async function getLocalStream(requestVideo) {
                const constraints = {
                    audio: { echoCancellation: true, noiseSuppression: true },
                    video: requestVideo ? { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } : false
                };
                if (localStream) {
                    localStream.getTracks().forEach(t => t.stop());
                    localStream = null;
                }
                try {
                    localStream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (err) {
                    if (requestVideo) {
                        try {
                            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                            showToast('Camera unavailable — audio only');
                        } catch (e2) { throw e2; }
                    } else throw err;
                }
                if ($('localVideo')) $('localVideo').srcObject = localStream;
                return localStream;
            }

            function showIncomingOverlay(id) {
                $('incomingAvatar').textContent = initials(id);
                $('incomingName').textContent = resolveName(id);
                $('incomingNumber').textContent = id;
                $('incomingOverlay').classList.add('active');
                vibrate([300, 200, 300]);
                try {
                    const ctx = new(window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = 440;
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.5);
                    setTimeout(() => {
                        const osc2 = ctx.createOscillator();
                        const gain2 = ctx.createGain();
                        osc2.connect(gain2);
                        gain2.connect(ctx.destination);
                        osc2.frequency.value = 480;
                        gain2.gain.setValueAtTime(0.3, ctx.currentTime);
                        gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                        osc2.start(ctx.currentTime);
                        osc2.stop(ctx.currentTime + 0.5);
                    }, 300);
                } catch (e) {}
            }

            function hideIncomingOverlay() {
                $('incomingOverlay').classList.remove('active');
            }

            function showCallScreen(id, isCaller, withVideo) {
                $('callAvatar').textContent = initials(id);
                $('callName').textContent = resolveName(id);
                $('callNumber').textContent = id;
                $('callTimer').textContent = '00:00';
                $('callRingWrap').classList.add('ring-anim');
                $('callScreen').classList.add('active');
                updateVideoUI(false);
            }

            function updateVideoUI(enabled) {
                videoEnabled = enabled;
                const cs = $('callScreen'),
                    voice = $('voiceUi'),
                    pip = $('localPip');
                cs.classList.toggle('video-mode', enabled);
                if (enabled) {
                    voice.classList.add('hidden');
                    pip.classList.remove('hidden');
                } else {
                    voice.classList.remove('hidden');
                    pip.classList.add('hidden');
                }
                $('videoToggleBtn').classList.toggle('active', enabled);
            }

            function startTimer() {
                stopTimer();
                timerSeconds = 0;
                timerInterval = setInterval(() => {
                    timerSeconds++;
                    const mm = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
                    const ss = String(timerSeconds % 60).padStart(2, '0');
                    $('callTimer').textContent = mm + ':' + ss;
                }, 1000);
            }

            function stopTimer() {
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = null;
                const out = String(Math.floor(timerSeconds / 60)).padStart(2, '0') + ':' +
                    String(timerSeconds % 60).padStart(2, '0');
                timerSeconds = 0;
                return out;
            }

            function startLog(number, type, direction) {
                currentLog = {
                    id: Date.now(),
                    number,
                    type,
                    direction,
                    started: Date.now(),
                    ended: null,
                    duration: '',
                    summary: '',
                    messages: []
                };
            }

            function endLog(duration) {
                if (!currentLog) return null;
                currentLog.ended = Date.now();
                currentLog.duration = duration;
                const logs = getLogs();
                logs.unshift(currentLog);
                if (logs.length > 20) logs.length = 20;
                saveLogs(logs);
                lastLog = currentLog;
                const done = currentLog;
                currentLog = null;
                return done;
            }

            function addHistoryEntry(number, direction, duration) {
                const h = getHistory();
                h.unshift({ number, direction, duration: duration || '—', timestamp: Date.now() });
                if (h.length > 50) h.length = 50;
                saveHistory(h);
                renderCalls();
            }

            function wireCallEvents(call, withVideo, peerId) {
                if (!activeCalls.includes(call)) activeCalls.push(call);
                call.on('stream', stream => {
                    if ($('remoteAudio')) {
                        $('remoteAudio').srcObject = stream;
                        $('remoteAudio').play().catch(() => {});
                    }
                    if ($('remoteVideo')) {
                        $('remoteVideo').srcObject = stream;
                        $('remoteVideo').play().catch(() => {});
                    }
                    const hasVideo = stream.getVideoTracks().length > 0;
                    updateVideoUI(hasVideo || withVideo);
                    $('callRingWrap').classList.remove('ring-anim');
                    if (!timerInterval) startTimer();
                });
                call.on('close', () => {
                    const idx = activeCalls.indexOf(call);
                    if (idx > -1) activeCalls.splice(idx, 1);
                    if (activeCalls.length === 0) endPeerCall();
                });
                call.on('error', () => {
                    const idx = activeCalls.indexOf(call);
                    if (idx > -1) activeCalls.splice(idx, 1);
                    if (activeCalls.length === 0) endPeerCall();
                });
            }

            function endPeerCall() {
                for (const c of activeCalls) try { c.close(); } catch (e) {}
                activeCalls = [];
                if (!inCall) return;
                inCall = false;
                const dur = stopTimer();
                const log = endLog(dur);
                const num = $('callNumber')?.textContent;
                $('callScreen').classList.remove('active');
                $('callRingWrap').classList.remove('ring-anim');
                if ($('remoteAudio')) $('remoteAudio').srcObject = null;
                if ($('remoteVideo')) $('remoteVideo').srcObject = null;
                if (localStream) {
                    localStream.getTracks().forEach(t => t.stop());
                    localStream = null;
                }
                if (log) addHistoryEntry(log.number, log.direction, dur);
                else if (num) addHistoryEntry(num, 'outgoing', dur);
                if (isRecording) stopCallRecording();
                showToast('Call ended');
            }

            // ============================================================
            //  MESSAGING
            // ============================================================
            function sendMessage(number, text, type = 'text') {
                const msgs = getMessages();
                if (!msgs[number]) msgs[number] = [];
                const msgObj = { sender: 'me', text, type, time: Date.now(), read: true, id: generateId() };
                msgs[number].push(msgObj);
                saveMessages(msgs);
                if (peer && number !== RAGINA_NUMBER) {
                    try {
                        const conn = peer.connect(number, { metadata: { type: 'chat' } });
                        conn.on('open', () => conn.send({ type: 'msg', text }));
                        setTimeout(() => { try { conn.close(); } catch (e) {} }, 3000);
                    } catch (e) {}
                }
                renderChats();
                return msgObj;
            }

            function receiveMessage(number, text) {
                const msgs = getMessages();
                if (!msgs[number]) msgs[number] = [];
                const msgObj = { sender: 'them', text, type: 'text', time: Date.now(), read: false, id: generateId() };
                msgs[number].push(msgObj);
                saveMessages(msgs);
                renderChats();
                if (document.hidden) {
                    try {
                        const n = new Notification('PremCall: ' + resolveName(number), {
                            body: text,
                            icon: 'https://raw.githubusercontent.com/suryasticsai/premCall/main/premCall-logo.png'
                        });
                        setTimeout(() => n.close(), 4000);
                    } catch (e) {}
                }
                showToast('New message from ' + resolveName(number));
                vibrate([100, 50, 100]);
            }

            function markRead(number) {
                const msgs = getMessages();
                if (msgs[number]) {
                    msgs[number].forEach(m => { if (m.sender !== 'me') m.read = true; });
                    saveMessages(msgs);
                    renderChats();
                }
            }

            function deleteChat(number) {
                const msgs = getMessages();
                delete msgs[number];
                saveMessages(msgs);
                renderChats();
                showToast('Chat deleted');
            }

            function handleTyping(number, active) {
                if (active) {
                    activeTyping[number] = true;
                    clearTimeout(typingTimeouts[number]);
                    typingTimeouts[number] = setTimeout(() => {
                        delete activeTyping[number];
                        renderChats();
                    }, 3000);
                } else {
                    delete activeTyping[number];
                }
                renderChats();
            }

            function handleReaction(number, msgId, emoji) {
                const msgs = getMessages();
                if (msgs[number]) {
                    const idx = msgs[number].findIndex(m => m.id === msgId);
                    if (idx > -1) {
                        if (!msgs[number][idx].reactions) msgs[number][idx].reactions = {};
                        msgs[number][idx].reactions[emoji] = (msgs[number][idx].reactions[emoji] || 0) + 1;
                        saveMessages(msgs);
                        renderChats();
                    }
                }
            }

            // ============================================================
            //  CALL RECORDING
            // ============================================================
            function startCallRecording() {
                if (isRecording) return;
                if (!localStream) { showToast('No audio stream'); return; }
                recordedChunks = [];
                try {
                    const audioTracks = localStream.getAudioTracks();
                    if (!audioTracks.length) { showToast('No audio track'); return; }
                    const recStream = new MediaStream(audioTracks);
                    callRecorder = new MediaRecorder(recStream);
                    callRecorder.ondataavailable = e => {
                        if (e.data.size > 0) recordedChunks.push(e.data);
                    };
                    callRecorder.onstop = () => {
                        if (recordedChunks.length) {
                            const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = 'call-recording-' + Date.now() + '.webm';
                            a.click();
                            setTimeout(() => URL.revokeObjectURL(url), 5000);
                            showToast('Recording saved');
                        }
                        recordedChunks = [];
                    };
                    callRecorder.start();
                    isRecording = true;
                    $('recordBtn').classList.add('active');
                    $('recordBtn').innerHTML = '<i class="fas fa-stop"></i>';
                    showToast('Recording started');
                } catch (e) {
                    showToast('Recording not available');
                }
            }

            function stopCallRecording() {
                if (!isRecording || !callRecorder) return;
                try {
                    callRecorder.stop();
                    isRecording = false;
                    $('recordBtn').classList.remove('active');
                    $('recordBtn').innerHTML = '<i class="fas fa-circle"></i>';
                } catch (e) {}
            }

            // ============================================================
            //  QR CODE GENERATION & SCANNER
            // ============================================================
            function showQR() {
                const num = localStorage.getItem('premCallNumber') || 'Not registered';
                $('qrContainer').innerHTML = '';
                try {
                    new QRCode($('qrContainer'), {
                        text: 'premcall://' + num,
                        width: 180,
                        height: 180,
                        colorDark: isLightMode ? '#0f172a' : '#f0f2f7',
                        colorLight: isLightMode ? '#ffffff' : '#0f111a',
                        correctLevel: QRCode.CorrectLevel.M
                    });
                } catch (e) {
                    $('qrContainer').innerHTML = '<div style="color:var(--text-dim)">QR unavailable</div>';
                }
                $('qrModal').classList.add('active');
            }

            function startQrScanner() {
                const modal = $('qrScannerModal');
                const reader = $('qr-reader');
                modal.classList.add('active');

                if (qrScanner) {
                    try { qrScanner.stop(); } catch (e) {}
                    qrScanner = null;
                }
                reader.innerHTML = '';

                try {
                    qrScanner = new Html5Qrcode("qr-reader");
                    const config = {
                        fps: 10,
                        qrbox: { width: 250, height: 250 },
                        aspectRatio: 1.0,
                    };
                    qrScanner.start({ facingMode: "environment" },
                        config,
                        onScanSuccess,
                        onScanError
                    );
                } catch (err) {
                    showToast('Camera access denied or not supported.');
                    modal.classList.remove('active');
                }
            }

            function onScanSuccess(decodedText) {
                if (qrScanner) {
                    try { qrScanner.stop(); } catch (e) {}
                    qrScanner = null;
                }
                $('qrScannerModal').classList.remove('active');

                let number = decodedText;
                if (number.startsWith('premcall://')) {
                    number = number.replace('premcall://', '');
                }
                const match = number.match(/\d{10}/);
                if (match) {
                    const num = match[0];
                    showToast('Scanned: ' + num);
                    if (confirm('Do you want to call ' + num + '?')) {
                        PremCall.call(num);
                    } else if (confirm('Open chat with ' + num + '?')) {
                        window.location.href = 'messages.html?to=' + num;
                    }
                } else {
                    showToast('Invalid QR code: no 10-digit number found.');
                }
            }

            function onScanError(err) {}

            function stopQrScanner() {
                if (qrScanner) {
                    try { qrScanner.stop(); } catch (e) {}
                    qrScanner = null;
                }
                $('qrScannerModal').classList.remove('active');
                $('qr-reader').innerHTML = '';
            }

            // ============================================================
            //  EXPORT CHATS
            // ============================================================
            function exportChats() {
                const msgs = getMessages();
                let text = '=== PremCall Chat Export ===\n\n';
                text += 'Exported: ' + new Date().toLocaleString() + '\n\n';
                Object.keys(msgs).forEach(num => {
                    const name = resolveName(num);
                    text += '--- ' + name + ' (' + num + ') ---\n';
                    msgs[num].forEach(m => {
                        const who = m.sender === 'me' ? 'Me' : name;
                        const when = new Date(m.time).toLocaleString();
                        text += '[' + when + '] ' + who + ': ' + m.text + '\n';
                    });
                    text += '\n';
                });
                const blob = new Blob([text], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'premcall-chats-' + Date.now() + '.txt';
                a.click();
                setTimeout(() => URL.revokeObjectURL(url), 5000);
                showToast('Chats exported');
            }

                    btn.addEventListener('click', () => switchTab(btn.dataset.tab));

                $('newChatModal').addEventListener('click', e => {
                    if (e.target === $('newChatModal')) $('newChatModal').classList.remove('active');
                });

                function renderNewChatList() {
                    const list = $('newChatList');
                    const contacts = getContacts();
                    list.innerHTML = '';
                    if (!contacts.length) {
                        list.innerHTML = '<div class="empty-state"><p>No contacts. Add one in the People tab.</p></div>';

                            </div>
                        `;

                    });

                $('newChatSearch').addEventListener('input', (e) => {
                    const val = e.target.value;
                    if (!val) { renderNewChatList(); return; }
                    const list = $('newChatList');
                    list.innerHTML = '';
                    if (/^\d{10}$/.test(val)) {
                        const el = document.createElement('div');

                            <div class="contact-avatar" style="background:var(--primary); color:#fff;"><i class="fas fa-phone"></i></div>
                            <div class="contact-body"><div class="contact-name">${val}</div><div class="contact-number">New number</div></div>
                            <div class="contact-actions">

                                <button data-num="${val}" data-call="1"><i class="fas fa-phone"></i></button>
                            </div>
                        `;

                    getContacts().filter(c =>

                    ).forEach(c => {
                        const el = document.createElement('div');

                        el.innerHTML = `
                            <div class="contact-avatar">${initials(c.name)}</div>
                            <div class="contact-body"><div class="contact-name">${c.name}</div><div class="contact-number">${c.number}</div></div>
                            <div class="contact-actions">
                                <button data-num="${c.number}" data-msg="1"><i class="fas fa-comment"></i></button>
                                <button data-num="${c.number}" data-call="1"><i class="fas fa-phone"></i></button>
                            </div>
                        `;
                        list.appendChild(el);
                    });
                });

                // ---- Chat list clicks ----
                function handleChatClick(e) {
                    const item = e.target.closest('.chat-item');
                    if (!item) return;
                    const num = item.dataset.number;
                    const btn = e.target.closest('button');
                    if (btn) {
                        if (btn.classList.contains('del-btn')) { deleteChat(num); return; }
                        if (btn.dataset.video) {
                            localStorage.setItem('premCallPendingCall', JSON.stringify({ number: num, video: true }));
                            if (num === RAGINA_NUMBER) {
                                // Open RAGina AI via floating widget
                                if (window.PremCall && typeof PremCall.openAiChat === 'function') {
                                    PremCall.openAiChat();
                                } else {
                                    showToast('RAGina AI not available.');
                                }
                                return;
                            }
                            window.location.href = 'messages.html?to=' + num + '&video=1';
                            return;
                        }
                        if (btn.classList.contains('call-btn')) {
                            if (num === RAGINA_NUMBER) {
                                if (window.PremCall && typeof PremCall.startRAGinaCall === 'function') {
                                    PremCall.startRAGinaCall();
                                } else {
                                    showToast('RAGina voice call not available.');
                                }
                                return;
                            }
                            PremCall.call(num);
                            return;
                        }
                    }
                    markRead(num);
                    if (num === RAGINA_NUMBER) {
                        if (window.PremCall && typeof PremCall.openAiChat === 'function') {
                            PremCall.openAiChat();
                        } else {
                            showToast('RAGina AI not available.');
                        }
                        return;
                    }
                    window.location.href = 'messages.html?to=' + num;
                }
                $('chatList').addEventListener('click', handleChatClick);
                $('pinnedChats').addEventListener('click', handleChatClick);

                // ---- Calls list ----
                $('callsList').addEventListener('click', (e) => {
                    const btn = e.target.closest('button');
                    if (!btn) return;

                    if (btn.dataset.video) PremCall.call(num, true);
                    else PremCall.call(num);

                $('contactsSearch').addEventListener('input', renderContacts);
                $('saveContactBtn').addEventListener('click', () => {
                    const name = $('contactNameInput').value.trim();
                    const number = $('contactNumberInput').value.trim();
                    if (!name || !/^\d{10}$/.test(number)) {
                        showToast('Enter valid name and 10-digit number');
                        return;
                    }
                    const c = getContacts().filter(x => x.number !== number);
                    c.unshift({ name, number, created: Date.now() });
                    saveContacts(c);
                    renderContacts();
                    $('contactNameInput').value = '';
                    $('contactNumberInput').value = '';

                $('contactsList').addEventListener('click', (e) => {
                    const btn = e.target.closest('button');

                    if (btn.dataset.del) {
                        saveContacts(getContacts().filter(x => x.number !== num));
                        renderContacts();
                        showToast('Deleted');
                        return;
                    }
                    if (btn.dataset.block) {
                        const blocked = getBlocked();
                        if (!blocked.includes(num)) {
                            blocked.push(num);
                            saveBlocked(blocked);
                            showToast('Blocked ' + resolveName(num));
                            renderContacts();
                            renderChats();
                        }
                        return;
                    }
                    if (btn.dataset.msg || btn.dataset.msg === '1') {
                        if (num === RAGINA_NUMBER) {
                            if (window.PremCall && typeof PremCall.openAiChat === 'function') {
                                PremCall.openAiChat();
                            } else {
                                showToast('RAGina AI not available.');
                            }
                            return;
                        }
                        window.location.href = 'messages.html?to=' + num;
                        return;
                    }
                    if (btn.dataset.video) {
                        if (num === RAGINA_NUMBER) {
                            if (window.PremCall && typeof PremCall.startRAGinaCall === 'function') {
                                PremCall.startRAGinaCall();
                            } else {
                                showToast('RAGina voice call not available.');
                            }
                            return;
                        }
                        localStorage.setItem('premCallPendingCall', JSON.stringify({ number: num, video: true }));
                        window.location.href = 'messages.html?to=' + num + '&video=1';
                        return;
                    }
                    if (btn.dataset.call) {
                        if (num === RAGINA_NUMBER) {
                            if (window.PremCall && typeof PremCall.startRAGinaCall === 'function') {
                                PremCall.startRAGinaCall();
                            } else {
                                showToast('RAGina voice call not available.');
                            }
                            return;
                        }
                        PremCall.call(num);
                        return;
                    }
                });

                // ---- Toggles ----
                document.querySelectorAll('.toggle').forEach(t => {
                    t.addEventListener('click', function() {
                        const key = this.dataset.key;
                        const isOn = this.classList.contains('on');
                        this.classList.toggle('on');
                        const newVal = !isOn;
                        if (key === 'transcript') transcriptEnabled = newVal;
                        if (key === 'summary') aiSummaryEnabled = newVal;
                        if (key === 'videoDefault') videoDefault = newVal;
                        if (key === 'reactions') reactionsEnabled = newVal;
                        if (key === 'theme') {
                            document.body.classList.toggle('light-mode', !newVal);
                            isLightMode = !newVal;
                            localStorage.setItem('premCallTheme', isLightMode ? 'light' : 'dark');
                            $('themeToggle').innerHTML = isLightMode ? '<i class="fas fa-sun"></i>' :
                                '<i class="fas fa-moon"></i>';
                        }
                        saveSettings();
                        showToast((key === 'transcript' ? 'Transcript' :
                            key === 'summary' ? 'AI Summary' :
                            key === 'videoDefault' ? 'Video default' :
                            key === 'reactions' ? 'Reactions' : 'Theme') + (newVal ? ' on' : ' off'));
                    });
                });

                // ---- Register ----
                $('registerBtn').addEventListener('click', () => {
                    const phone = prompt('Enter your 10-digit phone number:');
                    if (!phone || !/^\d{10}$/.test(phone)) { showToast('Invalid number'); return; }
                    const uuid = 'user-' + Date.now();
                    localStorage.setItem('premCallNumber', phone);
                    localStorage.setItem('premCallId', uuid);
                    localStorage.setItem('premCallVerified', 'true');
                    localStorage.setItem('premCallRegisteredAt', Date.now());
                    $('myNumberDisplay').textContent = phone;
                    $('registerBtn').style.display = 'none';
                    if (peer) try { peer.destroy(); } catch (e) {}
                    PremCall.init(uuid);
                    showToast('Registered as ' + phone);
                });

                // ---- QR Generation ----
                $('showQRBtn').addEventListener('click', showQR);
                $('qrClose').addEventListener('click', () => $('qrModal').classList.remove('active'));
                $('qrModal').addEventListener('click', e => {
                    if (e.target === $('qrModal')) $('qrModal').classList.remove('active');
                });

                // ---- QR Scanning ----
                $('scanQRBtn').addEventListener('click', startQrScanner);
                $('qrScannerClose').addEventListener('click', stopQrScanner);
                $('qrScannerModal').addEventListener('click', (e) => {
                    if (e.target === $('qrScannerModal')) stopQrScanner();
                });

                // ---- Export ----
                $('exportChatsBtn').addEventListener('click', exportChats);

                // ---- Clear data ----
                $('clearDataBtn').addEventListener('click', () => {
                    if (!confirm('Clear ALL data? This cannot be undone.')) return;
                    ['premCallContacts', 'premCallMessages', 'premCallLogs', 'premCallHistory',
                        'premCallSettings', 'premCallNumber', 'premCallId', 'premCallVerified',
                        'premCallBlocked', 'premCallReactions', 'premCallTyping'
                    ].forEach(k => localStorage.removeItem(k));
                    showToast('All data cleared');
                    renderChats();
                    renderCalls();
                    renderContacts();
                    syncSettings();
                });

                // ---- Call controls ----
                $('hangupCallBtn').addEventListener('click', () => {
                    // Try to end RAGina call first
                    if (window.PremCall && typeof PremCall.endRAGinaCall === 'function') {
                        PremCall.endRAGinaCall();
                    } else {
                        endPeerCall();
                    }
                    vibrate(15);
                });

                $('muteBtn').addEventListener('click', (e) => {
                    muted = !muted;
                    if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = !muted);
                    e.currentTarget.classList.toggle('active', muted);
                    e.currentTarget.innerHTML = muted ? '<i class="fas fa-microphone-slash"></i>' :
                        '<i class="fas fa-microphone"></i>';
                    showToast(muted ? 'Muted' : 'Unmuted');
                });

                $('speakerBtn').addEventListener('click', (e) => {
                    speakerOn = !speakerOn;
                    if ($('remoteAudio')) $('remoteAudio').volume = speakerOn ? 1 : 0.8;
                    e.currentTarget.classList.toggle('active', speakerOn);
                    showToast(speakerOn ? 'Speaker on' : 'Speaker off');
                });

                $('videoToggleBtn').addEventListener('click', async () => {
                    if (!inCall) return;
                    const newState = !videoEnabled;
                    if (newState) {
                        try {
                            const stream = await getLocalStream(true);
                            const vTrack = stream.getVideoTracks()[0];
                            if (!vTrack) { showToast('Camera not available'); return; }
                            for (const call of activeCalls) {
                                if (call && call.peerConnection) {
                                    const senders = call.peerConnection.getSenders();
                                    const vs = senders.find(s => s.track && s.track.kind === 'video');
                                    if (vs) try { await vs.replaceTrack(vTrack); } catch (e) {}
                                }
                            }
                            updateVideoUI(true);
                            showToast('Video on');
                        } catch (e) { showToast('Camera error'); }
                    } else {
                        if (localStream) localStream.getVideoTracks().forEach(t => t.stop());
                        for (const call of activeCalls) {
                            if (call && call.peerConnection) {
                                const senders = call.peerConnection.getSenders();
                                const vs = senders.find(s => s.track && s.track.kind === 'video');
                                if (vs) try { await vs.replaceTrack(null); } catch (e) {}
                            }
                        }
                        updateVideoUI(false);
                        showToast('Video off');
                    }
                });

                $('recordBtn').addEventListener('click', () => {
                    if (isRecording) stopCallRecording();
                    else startCallRecording();
                });

                $('screenShareBtn').addEventListener('click', async () => {
                    try {
                        const stream = await navigator.mediaDevices.getDisplayMedia({
                            video: { cursor: 'always' },
                            audio: false
                        });
                        const vTrack = stream.getVideoTracks()[0];
                        if (!vTrack) { showToast('Screen share cancelled'); return; }
                        for (const call of activeCalls) {
                            if (call && call.peerConnection) {
                                const senders = call.peerConnection.getSenders();
                                const vs = senders.find(s => s.track && s.track.kind === 'video');
                                if (vs) {
                                    await vs.replaceTrack(vTrack);
                                    showToast('Screen sharing');
                                    vTrack.onended = () => {
                                        showToast('Screen share ended');
                                    };
                                }
                            }
                        }
                    } catch (e) { showToast('Screen share failed'); }
                });

                $('answerBtn').addEventListener('click', async () => {
                    if (!incomingCall) return;
                    const call = incomingCall;
                    incomingCall = null;
                    hideIncomingOverlay();
                    try {
                        const stream = await getLocalStream(false);
                        startLog(call.peer, 'peer', 'incoming');
                        call.answer(stream);
                        showCallScreen(call.peer, false, false);
                        activeCalls = [];
                        activeCalls.push(call);
                        inCall = true;
                        wireCallEvents(call, false, call.peer);
                    } catch (e) { showToast('Microphone denied.'); }
                });

                $('rejectBtn').addEventListener('click', () => {
                    if (incomingCall) {
                        const id = incomingCall.peer;
                        incomingCall.close();
                        incomingCall = null;
                        addHistoryEntry(id, 'missed', '—');
                    }
                    hideIncomingOverlay();
                });

                $('chatToggleBtn').addEventListener('click', () => {
                    const num = $('callNumber')?.textContent;
                    if (num) {
                        if (num === RAGINA_NUMBER) {
                            if (window.PremCall && typeof PremCall.openAiChat === 'function') {
                                PremCall.openAiChat();
                            } else {
                                showToast('RAGina AI not available.');
                            }
                            return;
                        }
                        window.open('messages.html?to=' + num, '_blank');
                    }
                });

                // ---- Reconnect button ----
                $('reconnectBtn').addEventListener('click', () => {
                    if (peer) {
                        try { peer.destroy(); } catch (e) {}
                        peer = null;
                    }
                    const id = localStorage.getItem('premCallId') || 'temp-' + Date.now();
                    initPeer(id);
                    showToast('Reconnecting…');
                });

                // ---- Keyboard shortcuts ----
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        if ($('callScreen').classList.contains('active')) {
                            if (window.PremCall && typeof PremCall.endRAGinaCall === 'function') {
                                PremCall.endRAGinaCall();
                            } else {
                                endPeerCall();
                            }
                            return;
                        }
                        if ($('qrScannerModal').classList.contains('active')) {
                            stopQrScanner();
                            return;
                        }
                        $('newChatModal').classList.remove('active');
                        $('qrModal').classList.remove('active');
                    }
                    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                        e.preventDefault();
                        if (window.PremCall && typeof PremCall.openAiChat === 'function') {
                            PremCall.openAiChat();
                        } else {
                            showToast('RAGina AI not available.');
                        }
                    }
                });

                // ---- Init Peer ----
                const stored = localStorage.getItem('premCallNumber');
                const storedId = localStorage.getItem('premCallId');
                if (stored && localStorage.getItem('premCallVerified') === 'true' && storedId) {
                    $('myNumberDisplay').textContent = stored;
                    initPeer(storedId);
                } else {
                    $('myNumberDisplay').textContent = 'Guest';
                    initPeer('temp-' + Date.now());
                }

                // ---- TTS voices ----
                if (window.speechSynthesis) {
                    ttsVoices = window.speechSynthesis.getVoices();
                    window.speechSynthesis.onvoiceschanged = () => {
                        ttsVoices = window.speechSynthesis.getVoices();
                    };
                }

                // ---- Notification permission ----
                if ('Notification' in window && Notification.permission === 'default') {
                    Notification.requestPermission();
                }

                // ---- Initial renders ----
                renderChats();
                renderCalls();
                renderContacts();
                syncSettings();
                document.addEventListener('click', () => unlockSpeech(), { once: true });

                // ---- Handle pending call ----
                const pending = localStorage.getItem('premCallPendingCall');
                if (pending) {
                    try {
                        const { number, video } = JSON.parse(pending);
                        localStorage.removeItem('premCallPendingCall');
                        if (number === RAGINA_NUMBER) {
                            if (window.PremCall && typeof PremCall.startRAGinaCall === 'function') {
                                setTimeout(PremCall.startRAGinaCall, 800);
                            } else {
                                showToast('RAGina voice call not available.');
                            }
                        } else {
                            setTimeout(() => PremCall.call(number, video), 800);
                        }
                    } catch (e) {}
                }

                // ---- Online status ----
                setInterval(() => {
                    if (peer && !peer.destroyed) {
                        $('headerStatusDot').className = 'dot online';
                    }
                }, 5000);

                // ---- My Story click ----
                $('myStoryBtn').addEventListener('click', () => {
                    showToast('📸 Story feature coming soon!');
                });

                // ---- Account modal ----
                $('myNumberDisplay').addEventListener('click', () => {
                    const num = localStorage.getItem('premCallNumber');
                    if (num && localStorage.getItem('premCallVerified') === 'true') {
                        const div = document.createElement('div');
                        div.style.cssText =
                            'position:fixed;inset:0;z-index:7000;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;';
                        div.innerHTML = `
                            <div style="background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:1.5rem;max-width:340px;width:90%;text-align:center;">
                                <h3 style="font-family:var(--font-display);margin-bottom:.6rem;">Account Info</h3>
                                <div style="display:flex;justify-content:space-between;padding:.4rem 0;border-bottom:1px solid var(--surface-2);font-size:.8rem;"><span>Number</span><span>${num}</span></div>
                                <div style="display:flex;justify-content:space-between;padding:.4rem 0;border-bottom:1px solid var(--surface-2);font-size:.8rem;"><span>Registered</span><span>${localStorage.getItem('premCallRegisteredAt') ? new Date(Number(localStorage.getItem('premCallRegisteredAt'))).toLocaleDateString() : new Date().toLocaleDateString()}</span></div>
                                <button onclick="this.closest('div[style]').remove()" style="margin-top:.8rem;padding:.4rem 1rem;border-radius:40px;border:1px solid var(--line);background:transparent;color:var(--text-dim);cursor:pointer;font-family:var(--font-body);">Close</button>
                            </div>
                        `;
                        document.body.appendChild(div);
                    } else {
                        showToast('Not registered. Tap "Register Number" in Settings.');
                    }
                });

                console.log('💡 Press Cmd/Ctrl + K to open RAGina AI chat (floating widget)');
                console.log('📷 QR Scanner ready — tap "Scan QR Code"');

            });

            // ============================================================
            //  EXPOSE GLOBAL API
            // ============================================================
            global.PremCall = {
                RAGINA_NUMBER,
                init: initPeer,
                call: function(t, withVideo) {
                    if (t === RAGINA_NUMBER) {
                        if (window.PremCall && typeof window.PremCall.startRAGinaCall === 'function') {
                            window.PremCall.startRAGinaCall();
                        } else {
                            showToast('RAGina voice call not available.');
                        }
                        return;
                    }
                    if (!peer) { showToast('Register to call real numbers.'); return; }
                    if (isBlocked(t)) { showToast('This contact is blocked.'); return; }
                    const useVideo = withVideo || videoDefault;
                    getLocalStream(useVideo).then(stream => {
                        const call = peer.call(t, stream);
                        if (!call) { showToast('Unreachable.'); return; }
                        startLog(t, 'peer', 'outgoing');
                        showCallScreen(t, true, useVideo);
                        activeCalls = [];
                        activeCalls.push(call);
                        inCall = true;
                        wireCallEvents(call, useVideo, t);
                    }).catch(() => showToast('Microphone/Camera denied.'));
                },
                sendMessage: sendMessage,
                getContacts: getContacts,
                saveContacts: saveContacts,
                resolveName: resolveName,
                showToast: showToast,
                getMyNumber: getMyNumber,
                isBlocked: isBlocked,
                startQrScanner: startQrScanner,
                stopQrScanner: stopQrScanner
            };

        })(window);
    </script>

</body>
</html>

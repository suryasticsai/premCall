<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PremCall</title>
  <!-- load the library from CDN (or local) -->
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="premcall.js"></script>
  <style>
    /* ─── same styles as before (or your own) ─── */
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b0e17;
      color: #e8edf5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
      margin: 0;
    }
    .container {
      max-width: 420px;
      width: 100%;
      background: #131a26;
      border-radius: 28px;
      padding: 1.5rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid #1e2a3a;
      flex-shrink: 0;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.4rem;
      font-weight: 700;
      color: #4f8cf7;
    }
    .logo svg { width:28px; height:28px; stroke:#4f8cf7; stroke-width:2; fill:none; }
    .header-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: #8892b0;
    }
    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .status-dot.online { background: #4ade80; }
    .status-dot.offline { background: #f87171; }
    .status-dot.connecting { background: #fbbf24; }

    .settings-link {
      background: #1a2338;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.8rem;
      margin: 0.5rem 0;
      display: inline-block;
    }
    .settings-link:hover { background: #2a3a5a; }

    .dialer-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0.5rem 0;
    }
    .dialer-display {
      background: #0b0e17;
      border-radius: 16px;
      padding: 1rem 1.2rem;
      font-size: 2rem;
      font-weight: 300;
      text-align: center;
      letter-spacing: 3px;
      color: #e8edf5;
      border: 1px solid #1e2a3a;
      min-height: 4.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-all;
      margin-bottom: 1.2rem;
      font-family: 'Courier New', monospace;
    }
    .dialer-display .hint { font-size:0.9rem; color:#4a5a6a; letter-spacing:0; }
    .dialer-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.7rem;
      max-width: 300px;
      margin: 0 auto;
      width: 100%;
    }
    .dialer-pad .key {
      background: #1e2a3a;
      border-radius: 50%;
      aspect-ratio: 1/1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
      border: none;
      color: #e8edf5;
      font-family: inherit;
    }
    .dialer-pad .key:active { background:#2a3a5a; transform:scale(0.95); }
    .dialer-pad .key.call { background:#1a7a4a; color:#fff; }
    .dialer-pad .key.call:active { background:#1f9b5e; }
    .dialer-pad .key.call.disabled { opacity:0.4; pointer-events:none; }
    .dialer-pad .key .svg-icon { width:28px; height:28px; stroke:currentColor; stroke-width:2; fill:none; }

    .action-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 0.8rem;
      flex-shrink: 0;
    }
    .action-row .btn {
      padding:0.4rem 1rem;
      border:none;
      border-radius:40px;
      font-weight:600;
      font-size:0.8rem;
      cursor:pointer;
      background:transparent;
      border:1px solid #2a3a5a;
      color:#e8edf5;
    }
    .action-row .btn:hover { background:#1a2338; }
    .action-row .status-badge { font-size:0.8rem; color:#8892b0; display:flex; align-items:center; gap:0.3rem; }

    /* call screen overlay */
    #callScreen {
      display: none;
      position: fixed;
      top:0; left:0;
      width:100%; height:100%;
      background:#0b0e17;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      z-index:999;
      padding:2rem;
    }
    #callScreen.active { display:flex; }
    #callScreen .avatar {
      width:100px; height:100px;
      border-radius:50%;
      background:#2a3a5a;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:3rem;
      font-weight:700;
      color:#fff;
      margin-bottom:0.5rem;
    }
    #callScreen .name { font-size:2rem; font-weight:700; }
    #callScreen .number { color:#8892b0; margin-bottom:0.3rem; }
    #callScreen .substatus { color:#fbbf24; font-size:0.9rem; min-height:1.2rem; margin-bottom:1rem; }
    #callScreen .timer {
      font-size:1.8rem;
      color:#4ade80;
      font-family:'Courier New', monospace;
      margin-bottom:2rem;
      letter-spacing:2px;
    }
    #callScreen .call-actions {
      display:flex;
      gap:1.5rem;
    }
    #callScreen .call-actions button {
      width:62px; height:62px;
      border-radius:50%;
      border:none;
      cursor:pointer;
      font-size:1.6rem;
      background:#1e2a3a;
      color:#e8edf5;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:background 0.15s, transform 0.15s;
    }
    #callScreen .call-actions button:active { transform:scale(0.9); }
    #callScreen .call-actions .hangup { background:#8a1a2a; }
    #callScreen .call-actions .hangup:hover { background:#b52238; }
    #callScreen .call-actions .mute { background:#a67c1a; }
    #callScreen .call-actions .mute:hover { background:#ca9a2a; }
    #callScreen .call-actions .mute.active { background:#4a3a1a; color:#f87171; }
    #callScreen .call-actions .speaker { background:#1a4a8a; }
    #callScreen .call-actions .speaker:hover { background:#2563d6; }
    #callScreen .call-actions .speaker.active { background:#0f3460; box-shadow:0 0 0 2px #4f8cf7; }

    /* incoming overlay */
    #incomingOverlay {
      display: none;
      position: fixed;
      top:0; left:0;
      width:100%; height:100%;
      background:rgba(0,0,0,0.88);
      backdrop-filter:blur(12px);
      flex-direction:column;
      justify-content:center;
      align-items:center;
      z-index:1000;
      padding:2rem;
    }
    #incomingOverlay.active { display:flex; }
    #incomingOverlay .avatar {
      width:100px; height:100px;
      border-radius:50%;
      background:#2a3a5a;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:3rem;
      font-weight:700;
      color:#fff;
      margin-bottom:1rem;
    }
    #incomingOverlay .name { font-size:2rem; font-weight:700; }
    #incomingOverlay .number { color:#8892b0; margin-bottom:2rem; }
    #incomingOverlay .actions { display:flex; gap:2.5rem; }
    #incomingOverlay .actions button {
      width:72px; height:72px;
      border-radius:50%;
      border:none;
      cursor:pointer;
      font-size:2rem;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:transform 0.15s;
    }
    #incomingOverlay .actions button:active { transform:scale(0.9); }
    #incomingOverlay .actions .answer { background:#1a7a4a; color:#fff; }
    #incomingOverlay .actions .reject { background:#8a1a2a; color:#fff; }

    #toast {
      position:fixed; bottom:28px; left:50%;
      transform:translateX(-50%) translateY(20px);
      background:#1e2a3a; border:1px solid #2a3a5a;
      color:#e8edf5;
      padding:0.7rem 1.4rem;
      border-radius:40px;
      font-size:0.9rem;
      opacity:0;
      pointer-events:none;
      transition:opacity 0.25s ease, transform 0.25s ease;
      z-index:4000;
      max-width:90%;
      text-align:center;
      box-shadow:0 8px 30px rgba(0,0,0,0.5);
    }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    .log-area {
      background:#0b0e17;
      border-radius:12px;
      padding:0.5rem 0.8rem;
      font-family:'Courier New', monospace;
      font-size:0.65rem;
      max-height:80px;
      overflow-y:auto;
      color:#4a5a6a;
      margin-top:0.8rem;
      flex-shrink:0;
      line-height:1.6;
      border:1px solid #1a2338;
    }
    .log-area .log-entry { opacity:0.8; }
    .log-area .log-entry.error { color:#f87171; opacity:1; }
    .log-area .log-entry.success { color:#4ade80; opacity:1; }
    .log-area .log-entry.warning { color:#fbbf24; opacity:1; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 8v4l3 3"/>
        </svg>
        PremCall
      </div>
      <div class="header-right">
        <span id="myNumberDisplay"></span>
        <span class="status-dot offline" id="headerStatusDot"></span>
      </div>
    </div>

    <!-- settings link -->
    <a href="settings.html" class="settings-link">⚙️ Change number</a>

    <!-- dialer -->
    <div class="dialer-section">
      <div class="dialer-display" id="dialDisplay">
        <span class="hint">Enter 10-digit number</span>
      </div>
      <div class="dialer-pad" id="dialPad">
        <button class="key" data-digit="1">1</button>
        <button class="key" data-digit="2">2</button>
        <button class="key" data-digit="3">3</button>
        <button class="key" data-digit="4">4</button>
        <button class="key" data-digit="5">5</button>
        <button class="key" data-digit="6">6</button>
        <button class="key" data-digit="7">7</button>
        <button class="key" data-digit="8">8</button>
        <button class="key" data-digit="9">9</button>
        <button class="key" data-digit="*">*</button>
        <button class="key" data-digit="0">0</button>
        <button class="key" data-digit="#">#</button>
        <button class="key" data-action="delete">
          <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="23 18 17 12 23 6"/><polyline points="17 18 11 12 17 6"/></svg>
        </button>
        <button class="key call" id="dialCallBtn" data-action="call">
          <svg class="svg-icon" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        </button>
        <button class="key" data-action="clear">
          <svg class="svg-icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="action-row">
        <button class="btn" id="checkStatusBtn">Check Status</button>
        <span class="status-badge" id="statusResult"></span>
      </div>
    </div>

    <!-- log -->
    <div class="log-area" id="logArea">
      <div class="log-entry">Ready. Set your number in settings.</div>
    </div>
  </div>

  <!-- overlays -->
  <div id="incomingOverlay">
    <div class="avatar" id="incomingAvatar">📞</div>
    <div class="name" id="incomingName">Unknown</div>
    <div class="number" id="incomingNumber">+1234567890</div>
    <div class="actions">
      <button class="answer" id="answerBtn">✅</button>
      <button class="reject" id="rejectBtn">❌</button>
    </div>
  </div>

  <div id="callScreen">
    <div class="avatar" id="callAvatar">📞</div>
    <div class="name" id="callName">Calling...</div>
    <div class="number" id="callNumber">+1234567890</div>
    <div class="substatus" id="callSubstatus"></div>
    <div class="timer" id="callTimer">00:00</div>
    <div class="call-actions">
      <button class="mute" id="muteBtn" title="Mute / Unmute">🔇</button>
      <button class="hangup" id="hangupCallBtn" title="Hang up">📴</button>
      <button class="speaker" id="speakerBtn" title="Toggle speaker">🔊</button>
    </div>
  </div>

  <div id="toast"></div>
  <audio id="remoteAudio" autoplay playsinline style="display:none;"></audio>

  <script>
    (function() {
      'use strict';

      // ─── DOM refs ────────────────────────────────────────────────
      const dialDisplay = document.getElementById('dialDisplay');
      const dialPad = document.getElementById('dialPad');
      const dialCallBtn = document.getElementById('dialCallBtn');
      const checkStatusBtn = document.getElementById('checkStatusBtn');
      const statusResult = document.getElementById('statusResult');
      const logArea = document.getElementById('logArea');
      const incomingOverlay = document.getElementById('incomingOverlay');
      const incomingName = document.getElementById('incomingName');
      const incomingNumber = document.getElementById('incomingNumber');
      const incomingAvatar = document.getElementById('incomingAvatar');
      const answerBtn = document.getElementById('answerBtn');
      const rejectBtn = document.getElementById('rejectBtn');
      const callScreen = document.getElementById('callScreen');
      const callName = document.getElementById('callName');
      const callNumber = document.getElementById('callNumber');
      const callAvatar = document.getElementById('callAvatar');
      const callTimer = document.getElementById('callTimer');
      const callSubstatus = document.getElementById('callSubstatus');
      const hangupCallBtn = document.getElementById('hangupCallBtn');
      const muteBtn = document.getElementById('muteBtn');
      const speakerBtn = document.getElementById('speakerBtn');
      const myNumberDisplay = document.getElementById('myNumberDisplay');
      const headerStatusDot = document.getElementById('headerStatusDot');
      const remoteAudio = document.getElementById('remoteAudio');
      const toast = document.getElementById('toast');

      // ─── State ──────────────────────────────────────────────────
      let dialedNumber = '';
      let callTimerInterval = null;
      let callStartTime = null;
      let isMuted = false;
      let isSpeakerOn = false;

      // ─── Toast ──────────────────────────────────────────────────
      let toastTimeout = null;
      function showToast(msg, duration) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => toast.classList.remove('show'), duration || 2500);
      }

      // ─── Log ──────────────────────────────────────────────────
      function log(msg, type) {
        const now = new Date().toLocaleTimeString();
        const entry = document.createElement('div');
        entry.className = 'log-entry' + (type ? ' ' + type : '');
        entry.textContent = now + ' ' + msg;
        logArea.prepend(entry);
        while (logArea.children.length > 50) {
          logArea.removeChild(logArea.lastChild);
        }
      }

      // ─── Status Dot ──────────────────────────────────────────
      function setStatusDot(state) {
        headerStatusDot.className = 'status-dot ' + state;
      }

      // ─── Get stored number ──────────────────────────────────
      function getStoredNumber() {
        return localStorage.getItem('premCallNumber') || null;
      }

      function setStoredNumber(num) {
        localStorage.setItem('premCallNumber', num);
      }

      // ─── Init PremCall ──────────────────────────────────────────
      function initPremCall() {
        const number = getStoredNumber();
        if (!number) {
          myNumberDisplay.textContent = 'Not set';
          setStatusDot('offline');
          log('No number set. Go to settings.', 'warning');
          return;
        }
        if (!/^\d{10}$/.test(number)) {
          myNumberDisplay.textContent = 'Invalid';
          setStatusDot('offline');
          log('Stored number is not 10 digits. Fix in settings.', 'error');
          return;
        }

        myNumberDisplay.textContent = number;
        setStatusDot('connecting');
        log('Initializing with number: ' + number, 'info');

        try {
          PremCall.init(number, {
            onIncoming: (callerId) => {
              incomingName.textContent = callerId;
              incomingNumber.textContent = callerId;
              incomingAvatar.textContent = '📞';
              incomingOverlay.classList.add('active');
              showToast('Incoming call from ' + callerId);
            },
            onConnected: () => {
              setStatusDot('online');
              log('Connected', 'success');
              callSubstatus.textContent = 'Connected';
              startTimer();
            },
            onDisconnected: () => {
              setStatusDot('offline');
              log('Disconnected', 'error');
            },
            onRemoteStream: (stream) => {
              log('Remote stream received', 'success');
              remoteAudio.srcObject = stream;
              remoteAudio.muted = false;
              remoteAudio.play().catch(() => {
                // autoplay blocked, user interaction needed
                document.addEventListener('click', () => remoteAudio.play(), { once: true });
                document.addEventListener('touchstart', () => remoteAudio.play(), { once: true });
              });
              callSubstatus.textContent = 'Connected';
            },
            onCallStarted: (data) => {
              const name = data.target;
              callName.textContent = name;
              callNumber.textContent = name;
              callAvatar.textContent = '📞';
              callSubstatus.textContent = data.isCaller ? 'Ringing...' : 'Connecting...';
              callTimer.textContent = '00:00';
              callScreen.classList.add('active');
              incomingOverlay.classList.remove('active');
              if (callTimerInterval) clearInterval(callTimerInterval);
              callStartTime = Date.now();
            },
            onCallEnded: () => {
              callScreen.classList.remove('active');
              incomingOverlay.classList.remove('active');
              if (callTimerInterval) {
                clearInterval(callTimerInterval);
                callTimerInterval = null;
              }
              callTimer.textContent = '00:00';
              remoteAudio.srcObject = null;
              dialCallBtn.classList.remove('disabled');
              showToast('Call ended');
            },
            onError: (err) => {
              log('Error: ' + err.message, 'error');
              showToast('Error: ' + err.message);
              setStatusDot('offline');
            },
            onLog: (msg, level) => {
              log(msg, level);
            }
          });
          setStatusDot('online');
        } catch (err) {
          log('Init failed: ' + err.message, 'error');
          setStatusDot('offline');
          showToast('Init failed: ' + err.message);
        }
      }

      // ─── Timer ──────────────────────────────────────────────
      function startTimer() {
        if (callTimerInterval) clearInterval(callTimerInterval);
        let seconds = 0;
        callTimerInterval = setInterval(() => {
          seconds++;
          const m = String(Math.floor(seconds / 60)).padStart(2, '0');
          const s = String(seconds % 60).padStart(2, '0');
          callTimer.textContent = m + ':' + s;
        }, 1000);
      }

      // ─── Dialer ──────────────────────────────────────────────────
      dialPad.addEventListener('click', (e) => {
        const key = e.target.closest('.key');
        if (!key) return;
        const digit = key.dataset.digit;
        const action = key.dataset.action;

        if (digit) {
          if (dialedNumber.length < 15) {
            dialedNumber += digit;
            dialDisplay.textContent = dialedNumber;
          }
        } else if (action === 'delete') {
          dialedNumber = dialedNumber.slice(0, -1);
          dialDisplay.textContent = dialedNumber || 'Enter number';
          if (!dialedNumber) dialDisplay.innerHTML = '<span class="hint">Enter 10-digit number</span>';
        } else if (action === 'clear') {
          dialedNumber = '';
          dialDisplay.innerHTML = '<span class="hint">Enter 10-digit number</span>';
        } else if (action === 'call') {
          if (dialedNumber) {
            if (!/^\d{10}$/.test(dialedNumber)) {
              showToast('Enter exactly 10 digits');
              return;
            }
            dialCallBtn.classList.add('disabled');
            try {
              PremCall.call(dialedNumber);
            } catch (err) {
              showToast('Call failed: ' + err.message);
              dialCallBtn.classList.remove('disabled');
            }
          }
        }
      });

      // Keyboard support
      document.addEventListener('keydown', (e) => {
        if (e.key >= '0' && e.key <= '9') {
          if (dialedNumber.length < 15) {
            dialedNumber += e.key;
            dialDisplay.textContent = dialedNumber;
          }
        } else if (e.key === 'Backspace') {
          dialedNumber = dialedNumber.slice(0, -1);
          dialDisplay.textContent = dialedNumber || 'Enter number';
          if (!dialedNumber) dialDisplay.innerHTML = '<span class="hint">Enter 10-digit number</span>';
        } else if (e.key === 'Enter') {
          if (dialedNumber && /^\d{10}$/.test(dialedNumber)) {
            PremCall.call(dialedNumber);
          }
        }
      });

      // ─── Call Screen Controls ──────────────────────────────────
      hangupCallBtn.addEventListener('click', () => {
        PremCall.hangup();
        dialCallBtn.classList.remove('disabled');
      });

      muteBtn.addEventListener('click', () => {
        const muted = PremCall.mute();
        muteBtn.textContent = muted ? '🔊' : '🔇';
        muteBtn.className = muted ? 'mute active' : 'mute';
        showToast(muted ? 'Muted' : 'Unmuted');
      });

      speakerBtn.addEventListener('click', () => {
        const on = PremCall.speaker();
        speakerBtn.className = on ? 'speaker active' : 'speaker';
        showToast(on ? 'Speaker on' : 'Earpiece');
      });

      // ─── Incoming Overlay Buttons ──────────────────────────────
      answerBtn.addEventListener('click', async () => {
        try {
          await PremCall.answer();
          incomingOverlay.classList.remove('active');
        } catch (err) {
          showToast('Answer failed: ' + err.message);
        }
      });

      rejectBtn.addEventListener('click', () => {
        PremCall.hangup();
        incomingOverlay.classList.remove('active');
      });

      // ─── Check Status ──────────────────────────────────────────
      checkStatusBtn.addEventListener('click', async () => {
        const num = dialedNumber || prompt('Enter 10-digit number to check:');
        if (!num) return;
        if (!/^\d{10}$/.test(num)) {
          statusResult.textContent = 'Invalid number';
          return;
        }
        statusResult.textContent = 'Checking...';
        try {
          const online = await PremCall.checkStatus(num);
          statusResult.textContent = online ? '✅ Online' : '❌ Offline';
        } catch (err) {
          statusResult.textContent = 'Error';
        }
      });

      // ─── Auto‑init ──────────────────────────────────────────────
      initPremCall();

      // Auto‑load dial from URL param ?number=...
      (function autoLoad() {
        const params = new URLSearchParams(window.location.search);
        const num = params.get('number');
        if (num && /^\d{10}$/.test(num)) {
          dialedNumber = num;
          dialDisplay.textContent = num;
          setTimeout(() => {
            try { PremCall.call(num); } catch (e) {}
          }, 1500);
        }
      })();

      log('UI ready.', 'success');
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PremCall</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="premCall-logo.png" />

  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <!-- PremCall full library -->
  <script src="premcall.full.js"></script>

  <style>
    /* ─── Reset & Base ─── */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b0e17;
      color: #e8edf5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
      margin: 0;
    }
    .container {
      max-width: 480px;
      width: 100%;
      background: #131a26;
      border-radius: 28px;
      padding: 1.5rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ─── Header ─── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid #1e2a3a;
      flex-shrink: 0;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.4rem;
      font-weight: 700;
      color: #4f8cf7;
    }
    .logo img {
      height: 32px;
      width: 32px;
      border-radius: 50%;
      object-fit: cover;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: #8892b0;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .status-dot.online { background: #4ade80; }
    .status-dot.offline { background: #f87171; }
    .status-dot.connecting { background: #fbbf24; }

    /* ─── Settings Link ─── */
    .settings-link {
      background: #1a2338;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.8rem;
      margin: 0.5rem 0;
      display: inline-block;
      align-self: flex-start;
    }
    .settings-link:hover { background: #2a3a5a; }

    /* ─── Dialer ─── */
    .dialer-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0.5rem 0;
    }
    .dialer-display {
      background: #0b0e17;
      border-radius: 16px;
      padding: 1rem 1.2rem;
      font-size: 2rem;
      font-weight: 300;
      text-align: center;
      letter-spacing: 3px;
      color: #e8edf5;
      border: 1px solid #1e2a3a;
      min-height: 4.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-all;
      margin-bottom: 1.2rem;
      font-family: 'Courier New', monospace;
    }
    .dialer-display .hint {
      font-size: 0.9rem;
      color: #4a5a6a;
      letter-spacing: 0;
    }
    .dialer-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.7rem;
      max-width: 300px;
      margin: 0 auto;
      width: 100%;
    }
    .dialer-pad .key {
      background: #1e2a3a;
      border-radius: 50%;
      aspect-ratio: 1/1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
      border: none;
      color: #e8edf5;
      font-family: inherit;
    }
    .dialer-pad .key:active {
      background: #2a3a5a;
      transform: scale(0.95);
    }
    .dialer-pad .key.call {
      background: #1a7a4a;
      color: #fff;
    }
    .dialer-pad .key.call:active {
      background: #1f9b5e;
    }
    .dialer-pad .key.call.disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    .dialer-pad .key i {
      font-size: 1.8rem;
    }

    .action-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 0.8rem;
      flex-shrink: 0;
    }
    .action-row .btn {
      padding: 0.4rem 1rem;
      border: none;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      background: transparent;
      border: 1px solid #2a3a5a;
      color: #e8edf5;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .action-row .btn:hover {
      background: #1a2338;
    }
    .action-row .status-badge {
      font-size: 0.8rem;
      color: #8892b0;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    /* ─── Call Screen ─── */
    #callScreen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0b0e17;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 2rem;
    }
    #callScreen.active {
      display: flex;
    }
    #callScreen .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #2a3a5a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
    }
    #callScreen .avatar img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
    }
    #callScreen .name {
      font-size: 2rem;
      font-weight: 700;
    }
    #callScreen .number {
      color: #8892b0;
      margin-bottom: 0.3rem;
    }
    #callScreen .substatus {
      color: #fbbf24;
      font-size: 0.9rem;
      min-height: 1.2rem;
      margin-bottom: 1rem;
    }
    #callScreen .timer {
      font-size: 1.8rem;
      color: #4ade80;
      font-family: 'Courier New', monospace;
      margin-bottom: 2rem;
      letter-spacing: 2px;
    }
    #callScreen .call-actions {
      display: flex;
      gap: 1.5rem;
    }
    #callScreen .call-actions button {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 1.6rem;
      background: #1e2a3a;
      color: #e8edf5;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.15s;
    }
    #callScreen .call-actions button:active {
      transform: scale(0.9);
    }
    #callScreen .call-actions .hangup {
      background: #8a1a2a;
    }
    #callScreen .call-actions .hangup:hover {
      background: #b52238;
    }
    #callScreen .call-actions .mute {
      background: #a67c1a;
    }
    #callScreen .call-actions .mute:hover {
      background: #ca9a2a;
    }
    #callScreen .call-actions .mute.active {
      background: #4a3a1a;
      color: #f87171;
    }
    #callScreen .call-actions .speaker {
      background: #1a4a8a;
    }
    #callScreen .call-actions .speaker:hover {
      background: #2563d6;
    }
    #callScreen .call-actions .speaker.active {
      background: #0f3460;
      box-shadow: 0 0 0 2px #4f8cf7;
    }

    /* ─── Incoming Overlay ─── */
    #incomingOverlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(12px);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 2rem;
    }
    #incomingOverlay.active {
      display: flex;
    }
    #incomingOverlay .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #2a3a5a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 1rem;
    }
    #incomingOverlay .avatar img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
    }
    #incomingOverlay .name {
      font-size: 2rem;
      font-weight: 700;
    }
    #incomingOverlay .number {
      color: #8892b0;
      margin-bottom: 2rem;
    }
    #incomingOverlay .actions {
      display: flex;
      gap: 2.5rem;
    }
    #incomingOverlay .actions button {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s;
    }
    #incomingOverlay .actions button:active {
      transform: scale(0.9);
    }
    #incomingOverlay .actions .answer {
      background: #1a7a4a;
      color: #fff;
    }
    #incomingOverlay .actions .reject {
      background: #8a1a2a;
      color: #fff;
    }

    /* ─── Toast ─── */
    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1e2a3a;
      border: 1px solid #2a3a5a;
      color: #e8edf5;
      padding: 0.7rem 1.4rem;
      border-radius: 40px;
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 4000;
      max-width: 90%;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ─── Log ─── */
    .log-area {
      background: #0b0e17;
      border-radius: 12px;
      padding: 0.5rem 0.8rem;
      font-family: 'Courier New', monospace;
      font-size: 0.65rem;
      max-height: 80px;
      overflow-y: auto;
      color: #4a5a6a;
      margin-top: 0.8rem;
      flex-shrink: 0;
      line-height: 1.6;
      border: 1px solid #1a2338;
    }
    .log-area .log-entry {
      opacity: 0.8;
    }
    .log-area .log-entry.error {
      color: #f87171;
      opacity: 1;
    }
    .log-area .log-entry.success {
      color: #4ade80;
      opacity: 1;
    }
    .log-area .log-entry.warning {
      color: #fbbf24;
      opacity: 1;
    }

    /* ─── Call History ─── */
    #historySection {
      margin-top: 1rem;
      border-top: 1px solid #1e2a3a;
      padding-top: 0.8rem;
    }
    #historySection h3 {
      font-size: 0.9rem;
      color: #8892b0;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    #historyList {
      list-style: none;
      max-height: 120px;
      overflow-y: auto;
      font-size: 0.8rem;
    }
    #historyList li {
      display: flex;
      justify-content: space-between;
      padding: 0.3rem 0.2rem;
      border-bottom: 1px solid #1a2338;
      color: #94a3b8;
    }
    #historyList li .direction {
      font-weight: 600;
    }
    #historyList li .direction.incoming {
      color: #4ade80;
    }
    #historyList li .direction.outgoing {
      color: #4f8cf7;
    }
    #historyList li .direction.missed {
      color: #f87171;
    }
    #historyList li .time {
      color: #4a5a6a;
    }
    .clear-history {
      background: none;
      border: none;
      color: #4a5a6a;
      cursor: pointer;
      font-size: 0.7rem;
      text-decoration: underline;
      padding: 0.2rem 0.5rem;
    }
    .clear-history:hover {
      color: #f87171;
    }

    /* ─── Scrollbar ─── */
    .log-area::-webkit-scrollbar,
    #historyList::-webkit-scrollbar {
      width: 3px;
    }
    .log-area::-webkit-scrollbar-track,
    #historyList::-webkit-scrollbar-track {
      background: transparent;
    }
    .log-area::-webkit-scrollbar-thumb,
    #historyList::-webkit-scrollbar-thumb {
      background: #2a3a5a;
      border-radius: 10px;
    }

    /* ─── Responsive ─── */
    @media (max-width: 480px) {
      .container {
        padding: 1rem;
        border-radius: 20px;
      }
      .dialer-pad {
        gap: 0.5rem;
        max-width: 260px;
      }
      .dialer-pad .key {
        font-size: 1.4rem;
      }
      .logo {
        font-size: 1.2rem;
      }
      .dialer-display {
        font-size: 1.6rem;
        min-height: 3.8rem;
        padding: 0.7rem 1rem;
      }
      #incomingOverlay .name {
        font-size: 1.6rem;
      }
      #callScreen .name {
        font-size: 1.6rem;
      }
      #callScreen .call-actions button {
        width: 54px;
        height: 54px;
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- ═══ HEADER ═══ -->
    <div class="header">
      <div class="logo">
        <img src="premCall-logo.png" alt="PremCall" />
        PremCall
      </div>
      <div class="header-right">
        <span id="myNumberDisplay"></span>
        <span class="status-dot offline" id="headerStatusDot"></span>
      </div>
    </div>

    <!-- ═══ SETTINGS LINK ═══ -->
    <a href="settings.html" class="settings-link">
      <i class="fas fa-cog"></i> Change number
    </a>

    <!-- ═══ DIALER ═══ -->
    <div class="dialer-section">
      <div class="dialer-display" id="dialDisplay">
        <span class="hint"><i class="fas fa-phone"></i> Enter 10-digit number</span>
      </div>
      <div class="dialer-pad" id="dialPad">
        <button class="key" data-digit="1">1</button>
        <button class="key" data-digit="2">2</button>
        <button class="key" data-digit="3">3</button>
        <button class="key" data-digit="4">4</button>
        <button class="key" data-digit="5">5</button>
        <button class="key" data-digit="6">6</button>
        <button class="key" data-digit="7">7</button>
        <button class="key" data-digit="8">8</button>
        <button class="key" data-digit="9">9</button>
        <button class="key" data-digit="*">*</button>
        <button class="key" data-digit="0">0</button>
        <button class="key" data-digit="#">#</button>
        <button class="key" data-action="delete">
          <i class="fas fa-delete-left"></i>
        </button>
        <button class="key call" id="dialCallBtn" data-action="call">
          <i class="fas fa-phone"></i>
        </button>
        <button class="key" data-action="clear">
          <i class="fas fa-xmark"></i>
        </button>
      </div>

      <div class="action-row">
        <button class="btn" id="checkStatusBtn">
          <i class="fas fa-circle-check"></i> Check Status
        </button>
        <span class="status-badge" id="statusResult"></span>
      </div>
    </div>

    <!-- ═══ CALL HISTORY ═══ -->
    <div id="historySection">
      <h3>
        <i class="fas fa-clock-rotate-left"></i> Call History
        <button class="clear-history" id="clearHistoryBtn">Clear</button>
      </h3>
      <ul id="historyList"></ul>
    </div>

    <!-- ═══ LOG ═══ -->
    <div class="log-area" id="logArea">
      <div class="log-entry"><i class="fas fa-circle-info"></i> Ready.</div>
    </div>

  </div>

  <!-- ═══ INCOMING OVERLAY ═══ -->
  <div id="incomingOverlay">
    <div class="avatar" id="incomingAvatar">
      <img src="premCall-logo.png" alt="caller" />
    </div>
    <div class="name" id="incomingName">Unknown</div>
    <div class="number" id="incomingNumber">+1234567890</div>
    <div class="actions">
      <button class="answer" id="answerBtn"><i class="fas fa-phone"></i></button>
      <button class="reject" id="rejectBtn"><i class="fas fa-phone-slash"></i></button>
    </div>
  </div>

  <!-- ═══ CALL SCREEN ═══ -->
  <div id="callScreen">
    <div class="avatar" id="callAvatar">
      <img src="premCall-logo.png" alt="call" />
    </div>
    <div class="name" id="callName">Calling...</div>
    <div class="number" id="callNumber">+1234567890</div>
    <div class="substatus" id="callSubstatus"></div>
    <div class="timer" id="callTimer">00:00</div>
    <div class="call-actions">
      <button class="mute" id="muteBtn" title="Mute / Unmute">
        <i class="fas fa-microphone"></i>
      </button>
      <button class="hangup" id="hangupCallBtn" title="Hang up">
        <i class="fas fa-phone-slash"></i>
      </button>
      <button class="speaker" id="speakerBtn" title="Toggle speaker">
        <i class="fas fa-volume-high"></i>
      </button>
    </div>
  </div>

  <!-- ═══ TOAST ═══ -->
  <div id="toast"></div>

  <!-- ═══ REMOTE AUDIO ═══ -->
  <audio id="remoteAudio" autoplay playsinline style="display:none;"></audio>

  ──────────────────
    <script>
  (function() {
    'use strict';

    if (typeof PremCall === 'undefined') {
      document.getElementById('logArea').innerHTML =
        '<div class="log-entry error"><i class="fas fa-triangle-exclamation"></i> Error: PremCall library not loaded.</div>';
      return;
    }

    // ─── DOM refs ────────────────────────────────────────────────
    const dialDisplay = document.getElementById('dialDisplay');
    const dialPad = document.getElementById('dialPad');
    const dialCallBtn = document.getElementById('dialCallBtn');
    const checkStatusBtn = document.getElementById('checkStatusBtn');
    const statusResult = document.getElementById('statusResult');
    const logArea = document.getElementById('logArea');
    const incomingOverlay = document.getElementById('incomingOverlay');
    const incomingName = document.getElementById('incomingName');
    const incomingNumber = document.getElementById('incomingNumber');
    const incomingAvatar = document.getElementById('incomingAvatar');
    const answerBtn = document.getElementById('answerBtn');
    const rejectBtn = document.getElementById('rejectBtn');
    const callScreen = document.getElementById('callScreen');
    const callName = document.getElementById('callName');
    const callNumber = document.getElementById('callNumber');
    const callAvatar = document.getElementById('callAvatar');
    const callTimer = document.getElementById('callTimer');
    const callSubstatus = document.getElementById('callSubstatus');
    const hangupCallBtn = document.getElementById('hangupCallBtn');
    const muteBtn = document.getElementById('muteBtn');
    const speakerBtn = document.getElementById('speakerBtn');
    const myNumberDisplay = document.getElementById('myNumberDisplay');
    const headerStatusDot = document.getElementById('headerStatusDot');
    const remoteAudio = document.getElementById('remoteAudio');
    const toast = document.getElementById('toast');
    const historyList = document.getElementById('historyList');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');

    // ─── State ──────────────────────────────────────────────────
    let dialedNumber = '';
    let callTimerInterval = null;
    let toastTimeout = null;
    let pendingCallDirection = null;   // 'outgoing' or 'incoming'

    // ─── Call History (stored in localStorage) ──────────────────
    function getHistory() {
      try { return JSON.parse(localStorage.getItem('premCallHistory')) || []; }
      catch { return []; }
    }
    function saveHistory(history) { localStorage.setItem('premCallHistory', JSON.stringify(history)); }

    function addHistoryEntry(number, direction, duration) {
      const history = getHistory();
      history.unshift({ number, direction, duration: duration || '—', timestamp: Date.now() });
      if (history.length > 50) history.length = 50;
      saveHistory(history);
      renderHistory();
    }

    function renderHistory() {
      historyList.innerHTML = '';
      const history = getHistory();
      if (history.length === 0) {
        historyList.innerHTML = '<li style="color:#4a5a6a;font-style:italic;">No calls yet</li>';
        return;
      }
      history.forEach(entry => {
        const li = document.createElement('li');
        const dirIcon = entry.direction === 'incoming' ? 'fa-arrow-down' : entry.direction === 'outgoing' ? 'fa-arrow-up' : 'fa-phone-slash';
        const dirClass = entry.direction === 'incoming' ? 'incoming' : entry.direction === 'outgoing' ? 'outgoing' : 'missed';
        const date = new Date(entry.timestamp);
        const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        li.innerHTML = `<span class="direction ${dirClass}"><i class="fas ${dirIcon}"></i> ${entry.number}</span><span class="time">${entry.duration} · ${timeStr}</span>`;
        historyList.appendChild(li);
      });
    }

    clearHistoryBtn.addEventListener('click', () => {
      saveHistory([]);
      renderHistory();
      showToast('History cleared');
    });

    // ─── Toast ──────────────────────────────────────────────────
    function showToast(msg, duration = 2500) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove('show'), duration);
    }

    // ─── Log ──────────────────────────────────────────────────
    function log(msg, type) {
      const now = new Date().toLocaleTimeString();
      const entry = document.createElement('div');
      entry.className = 'log-entry' + (type ? ' ' + type : '');
      entry.textContent = now + ' ' + msg;
      logArea.prepend(entry);
      if (logArea.children.length > 50) logArea.removeChild(logArea.lastChild);
    }

    // ─── Status Dot ──────────────────────────────────────────
    function setStatusDot(state) {
      headerStatusDot.className = 'status-dot ' + state;
    }

    // ─── Get stored number ──────────────────────────────────
    function getStoredNumber() {
      return localStorage.getItem('premCallNumber') || null;
    }

    // ─── Timer ──────────────────────────────────────────────
    function startTimer() {
      if (callTimerInterval) clearInterval(callTimerInterval);
      let seconds = 0;
      callTimerInterval = setInterval(() => {
        seconds++;
        const m = String(Math.floor(seconds / 60)).padStart(2, '0');
        const s = String(seconds % 60).padStart(2, '0');
        callTimer.textContent = m + ':' + s;
      }, 1000);
      return () => {
        clearInterval(callTimerInterval);
        callTimerInterval = null;
        return seconds;
      };
    }
    let getCallDuration = null;

    // ─── Show / hide incoming overlay (forcefully) ────────────
    function showIncomingOverlay(callerId) {
      console.log('[UI] showIncomingOverlay called for:', callerId);
      if (!incomingOverlay) {
        console.error('[UI] incomingOverlay element not found!');
        return;
      }
      incomingName.textContent = callerId;
      incomingNumber.textContent = callerId;
      incomingAvatar.innerHTML = `<img src="premCall-logo.png" alt="caller" />`;
      incomingOverlay.style.display = 'flex';          // force show
      incomingOverlay.classList.add('active');         // keep CSS compatibility
      showToast('Incoming call from ' + callerId);
      log('Incoming call from ' + callerId, 'warning');
    }

    function hideIncomingOverlay() {
      if (!incomingOverlay) return;
      incomingOverlay.style.display = 'none';
      incomingOverlay.classList.remove('active');
    }

    function showCallScreen(name, isCaller) {
      console.log('[UI] showCallScreen:', name, isCaller ? 'outgoing' : 'incoming');
      callName.textContent = name;
      callNumber.textContent = name;
      callAvatar.innerHTML = `<img src="premCall-logo.png" alt="call" />`;
      callSubstatus.textContent = isCaller ? 'Ringing...' : 'Connecting...';
      callTimer.textContent = '00:00';
      callScreen.style.display = 'flex';
      callScreen.classList.add('active');
      hideIncomingOverlay();
      if (callTimerInterval) clearInterval(callTimerInterval);
      getCallDuration = null;
    }

    function hideCallScreen() {
      callScreen.style.display = 'none';
      callScreen.classList.remove('active');
      if (callTimerInterval) clearInterval(callTimerInterval);
      callTimer.textContent = '00:00';
      remoteAudio.srcObject = null;
      dialCallBtn.classList.remove('disabled');
    }

    // ─── Init PremCall ──────────────────────────────────────────
    function initPremCall() {
      const number = getStoredNumber();
      if (!number) {
        myNumberDisplay.textContent = 'Not set';
        setStatusDot('offline');
        log('No number set. Go to settings.', 'warning');
        return;
      }
      if (!/^\d{10}$/.test(number)) {
        myNumberDisplay.textContent = 'Invalid';
        setStatusDot('offline');
        log('Stored number is not 10 digits.', 'error');
        return;
      }

      myNumberDisplay.textContent = number;
      setStatusDot('connecting');
      log('Initializing with number: ' + number, 'info');

      try {
        PremCall.init(number, {
          onIncoming: (callerId) => {
            console.log('[UI] onIncoming callback fired with:', callerId);
            showIncomingOverlay(callerId);
          },
          onConnected: () => {
            console.log('[UI] onConnected');
            setStatusDot('online');
            callSubstatus.textContent = 'Connected';
            if (!callTimerInterval) {
              getCallDuration = startTimer();
            }
          },
          onDisconnected: () => {
            console.log('[UI] onDisconnected');
            setStatusDot('offline');
          },
          onRemoteStream: (stream) => {
            console.log('[UI] onRemoteStream');
            remoteAudio.srcObject = stream;
            remoteAudio.muted = false;
            remoteAudio.play().catch(() => {
              document.addEventListener('click', () => remoteAudio.play(), { once: true });
              document.addEventListener('touchstart', () => remoteAudio.play(), { once: true });
            });
            callSubstatus.textContent = 'Connected';
          },
          onCallStarted: (data) => {
            console.log('[UI] onCallStarted:', data);
            pendingCallDirection = data.isCaller ? 'outgoing' : 'incoming';
            showCallScreen(data.target, data.isCaller);
          },
          onCallEnded: () => {
            console.log('[UI] onCallEnded');
            // Calculate duration
            let duration = '—';
            if (getCallDuration) {
              const secs = getCallDuration();
              const m = String(Math.floor(secs / 60)).padStart(2, '0');
              const s = String(secs % 60).padStart(2, '0');
              duration = m + ':' + s;
              getCallDuration = null;
            }
            const currentNumber = callNumber.textContent;
            if (currentNumber && currentNumber !== 'Calling...' && currentNumber !== '+1234567890') {
              const dir = pendingCallDirection || 'incoming';
              addHistoryEntry(currentNumber, dir, duration);
            }
            pendingCallDirection = null;
            hideCallScreen();
            hideIncomingOverlay();
            showToast('Call ended');
          },
          onError: (err) => {
            console.error('[UI] onError:', err);
            log('Error: ' + err.message, 'error');
            showToast('Error: ' + err.message);
            setStatusDot('offline');
          },
          onLog: (msg, level) => {
            log(msg, level);
          }
        });
        setStatusDot('online');
      } catch (err) {
        log('Init failed: ' + err.message, 'error');
        setStatusDot('offline');
        showToast('Init failed: ' + err.message);
      }
    }

    // ─── Dialer ──────────────────────────────────────────────────
    dialPad.addEventListener('click', (e) => {
      const key = e.target.closest('.key');
      if (!key) return;
      const digit = key.dataset.digit;
      const action = key.dataset.action;
      if (digit) {
        if (dialedNumber.length < 15) {
          dialedNumber += digit;
          dialDisplay.textContent = dialedNumber;
        }
      } else if (action === 'delete') {
        dialedNumber = dialedNumber.slice(0, -1);
        dialDisplay.textContent = dialedNumber || 'Enter number';
        if (!dialedNumber) dialDisplay.innerHTML = '<span class="hint"><i class="fas fa-phone"></i> Enter 10-digit number</span>';
      } else if (action === 'clear') {
        dialedNumber = '';
        dialDisplay.innerHTML = '<span class="hint"><i class="fas fa-phone"></i> Enter 10-digit number</span>';
      } else if (action === 'call') {
        if (!dialedNumber || !/^\d{10}$/.test(dialedNumber)) {
          showToast('Enter exactly 10 digits');
          return;
        }
        dialCallBtn.classList.add('disabled');
        try {
          PremCall.call(dialedNumber);
        } catch (err) {
          showToast('Call failed: ' + err.message);
          dialCallBtn.classList.remove('disabled');
        }
      }
    });

    // Keyboard support
    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') {
        if (dialedNumber.length < 15) {
          dialedNumber += e.key;
          dialDisplay.textContent = dialedNumber;
        }
      } else if (e.key === 'Backspace') {
        dialedNumber = dialedNumber.slice(0, -1);
        dialDisplay.textContent = dialedNumber || 'Enter number';
        if (!dialedNumber) dialDisplay.innerHTML = '<span class="hint"><i class="fas fa-phone"></i> Enter 10-digit number</span>';
      } else if (e.key === 'Enter') {
        if (dialedNumber && /^\d{10}$/.test(dialedNumber)) {
          PremCall.call(dialedNumber);
        }
      }
    });

    // ─── Call Screen Controls ──────────────────────────────────
    hangupCallBtn.addEventListener('click', () => {
      PremCall.hangup();
      dialCallBtn.classList.remove('disabled');
    });

    muteBtn.addEventListener('click', () => {
      const muted = PremCall.mute();
      muteBtn.innerHTML = muted ? '<i class="fas fa-microphone-slash"></i>' : '<i class="fas fa-microphone"></i>';
      muteBtn.className = muted ? 'mute active' : 'mute';
      showToast(muted ? 'Muted' : 'Unmuted');
    });

    speakerBtn.addEventListener('click', () => {
      const on = PremCall.speaker();
      speakerBtn.className = on ? 'speaker active' : 'speaker';
      speakerBtn.innerHTML = on ? '<i class="fas fa-volume-high"></i>' : '<i class="fas fa-volume-xmark"></i>';
      showToast(on ? 'Speaker on' : 'Earpiece');
    });

    // ─── Incoming Overlay Buttons ──────────────────────────────
    answerBtn.addEventListener('click', async () => {
      try {
        await PremCall.answer();
        hideIncomingOverlay();
      } catch (err) {
        showToast('Answer failed: ' + err.message);
      }
    });

    rejectBtn.addEventListener('click', () => {
      const caller = incomingName.textContent;
      PremCall.hangup();
      hideIncomingOverlay();
      if (caller && caller !== 'Unknown') {
        addHistoryEntry(caller, 'missed', '—');
      }
      showToast('Call rejected');
    });

    // ─── Check Status ──────────────────────────────────────────
    checkStatusBtn.addEventListener('click', async () => {
      const num = dialedNumber || prompt('Enter 10-digit number to check:');
      if (!num) return;
      if (!/^\d{10}$/.test(num)) {
        statusResult.textContent = 'Invalid number';
        return;
      }
      statusResult.textContent = 'Checking...';
      try {
        const online = await PremCall.checkStatus(num);
        statusResult.textContent = online ? '✅ Online' : '❌ Offline';
      } catch (err) {
        statusResult.textContent = 'Error';
      }
    });

    // ─── Auto‑init ──────────────────────────────────────────────
    initPremCall();
    renderHistory();

    // Auto‑load dial from URL ?number=...
    (function autoLoad() {
      const params = new URLSearchParams(window.location.search);
      const num = params.get('number');
      if (num && /^\d{10}$/.test(num)) {
        dialedNumber = num;
        dialDisplay.textContent = num;
        setTimeout(() => {
          try { PremCall.call(num); } catch (e) {}
        }, 1500);
      }
    })();

    log('UI ready.', 'success');
  })();
</script>

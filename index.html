<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#070a12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PremCall" />
  <meta name="description" content="PremCall — a fast, focused voice dialer." />
  <title>PremCall</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/suryasticsai/premCall/main/premCall-logo.png" />
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/suryasticsai/premCall/main/premCall-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* (your existing CSS – unchanged) */
    :root{
      --bg-0:#05070d; --bg-1:#0a0e18; --surface:#0e1424; --surface-2:#141c30; --surface-3:#1b2540;
      --line:#1e2a42; --text:#eef2fb; --text-dim:#8891ab; --text-faint:#525d78;
      --signal:#4f8cf7; --signal-soft:#2f5fc4; --go:#2fd992; --go-deep:#12683f;
      --stop:#ff5470; --stop-deep:#7a1730; --warn:#ffb648; --warn-deep:#5c3d10;
      --radius-xl:30px; --radius-lg:22px; --radius-md:16px;
      --font-display:'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    body.light-mode{
      --bg-0:#f0f2f5; --bg-1:#ffffff; --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#f1f5f9;
      --line:#d1d5db; --text:#111827; --text-dim:#4b5563; --text-faint:#9ca3af;
      --signal:#2563eb; --signal-soft:#1d4ed8; --go:#10b981; --go-deep:#047857;
      --stop:#ef4444; --stop-deep:#b91c1c; --warn:#f59e0b; --warn-deep:#b45309;
    }
    *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
    html,body{height:100%;}
    body{
      font-family:var(--font-body);
      color:var(--text);
      background:radial-gradient(1100px 700px at 15% -10%, var(--bg-1) 0%, transparent 55%),
                radial-gradient(900px 600px at 110% 10%, var(--bg-1) 0%, transparent 50%),
                var(--bg-0);
      min-height:100vh; min-height:100dvh;
      display:flex; justify-content:center; align-items:flex-start; overflow-x:hidden;
      transition:background .3s ease, color .3s ease;
    }
    @media (prefers-reduced-motion: reduce){
      *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
    }
    .stage{ width:100%; display:flex; justify-content:center; padding:0; }
    .phone-frame{
      position:relative; width:100%; max-width:428px; min-height:100vh; min-height:100dvh;
      background:linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
      display:flex; flex-direction:column; padding: calc(1.1rem + var(--safe-t)) 1.15rem calc(1.1rem + var(--safe-b));
      transition:background .3s ease;
    }
    @media (min-width: 620px){
      body{ align-items:center; padding:3rem 1.5rem; }
      .phone-frame{
        min-height:auto; height:min(860px, 92vh); border-radius:44px;
        box-shadow: 0 0 0 10px #050810, 0 0 0 11px #23304e, 0 40px 100px -20px rgba(0,0,0,0.75), 0 0 90px -10px rgba(79,140,247,0.18);
        overflow:hidden;
      }
      body.light-mode .phone-frame{
        box-shadow: 0 0 0 10px #d1d5db, 0 0 0 11px #9ca3af, 0 40px 100px -20px rgba(0,0,0,0.2), 0 0 90px -10px rgba(37,99,235,0.15);
      }
      .phone-frame::before{
        content:""; position:absolute; top:14px; left:50%; transform:translateX(-50%);
        width:120px; height:22px; background:#050810; border-radius:0 0 16px 16px; z-index:5;
      }
      body.light-mode .phone-frame::before{ background:#d1d5db; }
      .phone-frame{ padding-top: calc(2.2rem); }
    }
    .header{ display:flex; justify-content:space-between; align-items:center; padding-bottom:0.85rem; border-bottom:1px solid var(--line); flex-shrink:0; }
    .brand{ display:flex; align-items:center; gap:0.55rem; cursor:default; }
    .brand img{ height:30px; width:30px; border-radius:9px; object-fit:cover; pointer-events:none; }
    .brand span{ font-family:var(--font-display); font-weight:700; font-size:1.15rem; letter-spacing:-0.02em; color:var(--text); }
    .header-right{ display:flex; align-items:center; gap:0.5rem; font-size:0.72rem; color:var(--text-dim); font-variant-numeric:tabular-nums; }
    .status-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0; box-shadow:0 0 0 3px transparent; transition:background .3s, box-shadow .3s; }
    .status-dot.online{ background:var(--go); box-shadow:0 0 0 3px rgba(47,217,146,0.18); }
    .status-dot.offline{ background:var(--stop); box-shadow:0 0 0 3px rgba(255,84,112,0.18); }
    .status-dot.connecting{ background:var(--warn); box-shadow:0 0 0 3px rgba(255,182,72,0.18); animation:blink 1.1s ease-in-out infinite; }
    @keyframes blink{ 50%{ opacity:0.35; } }
    .settings-link{
      background:var(--surface-2); border:1px solid var(--line); color:var(--text-dim); text-decoration:none;
      font-size:0.76rem; font-weight:500; padding:0.42rem 0.9rem; border-radius:40px;
      margin:0.75rem 0 0.2rem; display:inline-flex; align-items:center; gap:0.4rem; align-self:flex-start;
      transition:background .15s, color .15s, border-color .15s;
    }
    .settings-link:hover{ background:var(--surface-3); color:var(--text); border-color:var(--signal-soft); }
    .settings-link.hidden{ display:none; }
    .dialer-section{ flex:1; display:flex; flex-direction:column; padding-top:0.5rem; min-height:0; }
    .dialer-display{
      background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg);
      padding:1rem 1.1rem; min-height:4.6rem;
      display:flex; align-items:center; justify-content:center;
      font-family:var(--font-display); font-weight:600; font-size:1.9rem; letter-spacing:0.08em;
      color:var(--text); word-break:break-all; margin-bottom:1.3rem; position:relative;
    }
    .dialer-display .hint{ font-size:0.86rem; font-weight:400; letter-spacing:0; color:var(--text-faint); font-family:var(--font-body); display:flex; align-items:center; gap:0.5rem; }
    .dialer-display .cursor{ display:inline-block; width:2px; height:1.6rem; background:var(--signal); margin-left:2px; animation:caret 1s steps(1) infinite; }
    @keyframes caret{ 50%{ opacity:0; } }
    .dialer-display .left-btn, .dialer-display .right-btn{
      position:absolute; top:50%; transform:translateY(-50%);
      background:none; border:none; color:var(--text-faint); font-size:1.2rem; cursor:pointer; padding:5px;
      transition:color .15s;
    }
    .dialer-display .left-btn:hover, .dialer-display .right-btn:hover{ color:var(--text); }
    .dialer-display .left-btn{ left:8px; }
    .dialer-display .right-btn{ right:8px; }
    .dialer-pad{ display:grid; grid-template-columns:repeat(3, 1fr); gap:0.8rem; max-width:300px; margin:0 auto; width:100%; }
    .dialer-pad .key{
      position:relative; overflow:hidden;
      background:var(--surface); border:1px solid var(--line); border-radius:50%; aspect-ratio:1/1;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      font-family:var(--font-display); font-size:1.55rem; font-weight:600; color:var(--text);
      cursor:pointer; user-select:none; -webkit-user-select:none;
      transition:background .12s, border-color .12s, transform .08s;
    }
.agent-emoji {
    font-size: 1.3rem;
    line-height: 1;
}
    .dialer-pad .key .sub{ font-size:0.5rem; font-weight:600; letter-spacing:0.14em; color:var(--text-faint); margin-top:1px; font-family:var(--font-body); }
    .dialer-pad .key:active{ background:var(--surface-3); transform:scale(0.93); }
    .dialer-pad .key.call{ background:linear-gradient(160deg, var(--go) 0%, #17a06a 100%); border-color:transparent; color:#04140c; box-shadow:0 8px 20px -6px rgba(47,217,146,0.55); }
    .dialer-pad .key.call:active{ transform:scale(0.93); box-shadow:0 4px 12px -4px rgba(47,217,146,0.55); }
    .dialer-pad .key.call.disabled{ opacity:0.35; pointer-events:none; box-shadow:none; }
    .dialer-pad .key.ghost{ background:transparent; border-color:transparent; color:var(--text-dim); }
    .dialer-pad .key.ghost:active{ background:var(--surface-2); }
    .dialer-pad .key i{ font-size:1.3rem; }
    .ripple{ position:absolute; border-radius:50%; background:rgba(255,255,255,0.28); transform:scale(0); animation:rip .5s ease-out forwards; pointer-events:none; }
    @keyframes rip{ to{ transform:scale(2.6); opacity:0; } }
    .action-row{ display:flex; align-items:center; justify-content:center; gap:0.6rem; flex-wrap:wrap; margin-top:1rem; flex-shrink:0; }
    .action-row .btn{
      padding:0.45rem 1.05rem; border-radius:40px; font-weight:600; font-size:0.78rem; cursor:pointer;
      background:transparent; border:1px solid var(--line); color:var(--text);
      display:flex; align-items:center; gap:0.4rem; transition:background .15s, border-color .15s;
    }
    .action-row .btn:hover{ background:var(--surface-2); border-color:var(--signal-soft); }
    .action-row .status-badge{ font-size:0.78rem; color:var(--text-dim); display:flex; align-items:center; gap:0.3rem; min-height:1.2rem; }
    #callScreen, #incomingOverlay{
      display:none; position:absolute; inset:0; z-index:999;
      flex-direction:column; justify-content:center; align-items:center;
      padding:2rem 1.5rem calc(2rem + var(--safe-b));
      background: radial-gradient(600px 400px at 50% 20%, rgba(79,140,247,0.14), transparent 60%), var(--bg-0);
    }
    #callScreen.active, #incomingOverlay.active{ display:flex; }
    .avatar-wrap{ position:relative; width:132px; height:132px; display:flex; align-items:center; justify-content:center; margin-bottom:1.1rem; }
    .ring{ position:absolute; inset:0; border-radius:50%; border:1.5px solid var(--signal); opacity:0; }
    .ring-anim .ring{ animation:signal-pulse 2.4s ease-out infinite; }
    .ring-anim .ring:nth-child(2){ animation-delay:.8s; }
    .ring-anim .ring:nth-child(3){ animation-delay:1.6s; }
    @keyframes signal-pulse{ 0%{ transform:scale(0.72); opacity:0.55; } 100%{ transform:scale(1.65); opacity:0; } }
    .avatar{
      position:relative; width:96px; height:96px; border-radius:50%;
      background:linear-gradient(155deg, var(--surface-3), var(--surface));
      border:1px solid var(--line);
      display:flex; align-items:center; justify-content:center;
      font-family:var(--font-display); font-size:2.1rem; font-weight:700; color:var(--text);
      z-index:1;
    }
    .avatar img{ width:100%; height:100%; border-radius:50%; object-fit:cover; }
    .peer-name{ font-family:var(--font-display); font-size:1.55rem; font-weight:700; letter-spacing:-0.01em; text-align:center; }
    .peer-number{ color:var(--text-dim); margin-top:0.15rem; font-variant-numeric:tabular-nums; font-size:0.95rem; }
    .substatus{ color:var(--warn); font-size:0.85rem; min-height:1.2rem; margin-top:0.6rem; font-weight:500; letter-spacing:0.02em; }
    .call-timer{ font-family:var(--font-display); font-size:1.7rem; color:var(--go); font-variant-numeric:tabular-nums; letter-spacing:0.05em; margin-top:1.6rem; margin-bottom:2.2rem; }
    .call-actions{ display:flex; gap:1.4rem; align-items:center; }
    .call-actions button{
      width:60px; height:60px; border-radius:50%; border:none; cursor:pointer; font-size:1.4rem;
      background:var(--surface-2); color:var(--text); display:flex; align-items:center; justify-content:center;
      transition:background .15s, transform .1s, box-shadow .15s;
    }
    .call-actions button:active{ transform:scale(0.9); }
    .call-actions .hangup{ width:68px; height:68px; font-size:1.55rem; background:linear-gradient(160deg, var(--stop), #c2213f); box-shadow:0 8px 22px -6px rgba(255,84,112,0.55); }
    .call-actions .mute.active{ background:var(--warn-deep); color:var(--warn); box-shadow:inset 0 0 0 1.5px var(--warn); }
    .call-actions .speaker.active{ background:#0f2f57; color:var(--signal); box-shadow:inset 0 0 0 1.5px var(--signal); }
    .call-actions .label{ position:absolute; margin-top:76px; font-size:0.68rem; color:var(--text-faint); text-align:center; width:60px; }
    .call-actions .action-item{ position:relative; display:flex; flex-direction:column; align-items:center; }
    #incomingOverlay .swipe-hint{ font-size:0.72rem; color:var(--text-faint); margin-top:0.4rem; display:flex; align-items:center; gap:0.35rem; }
    #incomingOverlay .actions{ display:flex; gap:2.6rem; margin-top:2.2rem; }
    #incomingOverlay .actions button{
      width:66px; height:66px; border-radius:50%; border:none; cursor:pointer; font-size:1.7rem;
      display:flex; align-items:center; justify-content:center; color:#fff; transition:transform .12s;
    }
    #incomingOverlay .actions button:active{ transform:scale(0.9); }
    #incomingOverlay .actions .answer{ background:linear-gradient(160deg, var(--go), #17a06a); box-shadow:0 8px 22px -6px rgba(47,217,146,0.55); animation:answer-nudge 1.8s ease-in-out infinite; }
    #incomingOverlay .actions .reject{ background:linear-gradient(160deg, var(--stop), #c2213f); box-shadow:0 8px 22px -6px rgba(255,84,112,0.55); }
    @keyframes answer-nudge{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-4px); } }
    #toast{
      position:fixed; bottom:calc(28px + var(--safe-b)); left:50%; transform:translateX(-50%) translateY(20px);
      background:var(--surface-3); border:1px solid var(--line); color:var(--text);
      padding:0.7rem 1.3rem; border-radius:40px; font-size:0.85rem; font-weight:500;
      opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:4000;
      max-width:88%; text-align:center; box-shadow:0 10px 34px rgba(0,0,0,0.55);
    }
    #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
    .log-area{
      background:var(--surface); border:1px solid var(--line); border-radius:12px;
      padding:0.5rem 0.75rem; font-family:'SFMono-Regular', 'Courier New', monospace; font-size:0.62rem;
      max-height:64px; overflow-y:auto; color:var(--text-faint); margin-top:0.8rem; flex-shrink:0; line-height:1.65;
    }
    .log-entry.error{ color:var(--stop); opacity:1; }
    .log-entry.success{ color:var(--go); opacity:1; }
    .log-entry.warning{ color:var(--warn); opacity:1; }
    #historySection{ margin-top:1rem; border-top:1px solid var(--line); padding-top:0.75rem; flex-shrink:0; }
    #historySection h3{ font-size:0.8rem; color:var(--text-dim); margin-bottom:0.5rem; display:flex; align-items:center; justify-content:space-between; font-weight:600; }
    #historySection h3 .title{ display:flex; align-items:center; gap:0.5rem; }
    #historyList{ list-style:none; max-height:118px; overflow-y:auto; font-size:0.8rem; }
    #historyList li{ display:flex; align-items:center; gap:0.55rem; padding:0.4rem 0.1rem; border-bottom:1px solid #141b2c; color:var(--text-dim); }
    #historyList li .chip{ width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.65rem; flex-shrink:0; }
    #historyList li .chip.incoming{ background:rgba(47,217,146,0.15); color:var(--go); }
    #historyList li .chip.outgoing{ background:rgba(79,140,247,0.15); color:var(--signal); }
    #historyList li .chip.missed{ background:rgba(255,84,112,0.15); color:var(--stop); }
    #historyList li .num{ flex:1; font-variant-numeric:tabular-nums; color:var(--text); font-weight:500; font-size:0.82rem; }
    #historyList li .time{ color:var(--text-faint); font-size:0.7rem; text-align:right; }
    #historyList li.empty{ color:var(--text-faint); border-bottom:none; justify-content:center; padding:0.6rem; }
    .clear-history{ background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:0.7rem; padding:0.15rem 0.3rem; }
    .clear-history:hover{ color:var(--stop); }
    ::-webkit-scrollbar{ width:5px; height:5px; }
    ::-webkit-scrollbar-thumb{ background:var(--surface-3); border-radius:10px; }
    @media (max-width:380px){
      .dialer-pad{ gap:0.55rem; max-width:250px; }
      .dialer-display{ font-size:1.55rem; padding:0.8rem; }
    }
    #accountModal{
      display:none; position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.6); backdrop-filter:blur(8px);
      align-items:center; justify-content:center; z-index:5000;
    }
    #accountModal.active{ display:flex; }
    .account-card{
      background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg);
      padding:2rem 1.5rem; width:90%; max-width:360px; text-align:center;
      box-shadow:0 20px 40px rgba(0,0,0,0.5);
    }
    .account-card h2{ font-family:var(--font-display); font-size:1.3rem; margin-bottom:1.2rem; }
    .account-card .info-row{
      display:flex; justify-content:space-between; align-items:center; padding:0.5rem 0;
      border-bottom:1px solid var(--surface-2); font-size:0.85rem;
    }
    .account-card .info-row span:first-child{ color:var(--text-dim); }
    .account-card .info-row span:last-child{ color:var(--text); font-weight:600; }
    .account-card .close-btn{
      margin-top:1.2rem; width:100%; padding:0.6rem; border-radius:40px; border:1px solid var(--line);
      background:transparent; color:var(--text-dim); cursor:pointer; font-weight:600;
    }
    .account-card .close-btn:hover{ background:var(--surface-2); color:var(--text); }
  </style>
</head>
<body>

<div class="stage">
  <div class="phone-frame" id="phoneFrame">

    <div class="header">
      <div class="brand" id="brandLogo" title="Double-tap to toggle theme">
        <img src="https://raw.githubusercontent.com/suryasticsai/premCall/main/premCall-logo.png" alt="PremCall" />
        <span>PremCall</span>
      </div>
      <div class="header-right">
        <span id="myNumberDisplay" style="cursor:pointer;">—</span>
        <span class="status-dot offline" id="headerStatusDot"></span>
      </div>
    </div>

    <a href="settings.html" class="settings-link" id="registerLink"><i class="fas fa-shield-halved"></i> <span>Register</span></a>

    <div class="dialer-section">
      <div class="dialer-display" id="dialDisplay">
        <button class="left-btn" id="addBtn" style="display:none;" title="Add contact"><i class="fas fa-plus"></i></button>
        <span id="dialText">
          <span class="hint"><i class="fas fa-phone"></i> Enter a 10-digit number</span>
        </span>
        <button class="right-btn" id="backspaceBtn" style="display:none;" title="Backspace"><i class="fas fa-delete-left"></i></button>
      </div>

      <div class="dialer-pad" id="dialPad">
        <button class="key" data-digit="1">1</button>
        <button class="key" data-digit="2">2<span class="sub">ABC</span></button>
        <button class="key" data-digit="3">3<span class="sub">DEF</span></button>
        <button class="key" data-digit="4">4<span class="sub">GHI</span></button>
        <button class="key" data-digit="5">5<span class="sub">JKL</span></button>
        <button class="key" data-digit="6">6<span class="sub">MNO</span></button>
        <button class="key" data-digit="7">7<span class="sub">PQRS</span></button>
        <button class="key" data-digit="8">8<span class="sub">TUV</span></button>
        <button class="key" data-digit="9">9<span class="sub">WXYZ</span></button>
        <button class="key" data-digit="*">*</button>
        <button class="key" data-digit="0">0<span class="sub">+</span></button>
        <button class="key" data-digit="#">#</button>
        <button class="key ghost" onclick="window.location.href='messages.html'" aria-label="Messages">
          <i class="fas fa-comment"></i>
        </button>
        <button class="key call" id="dialCallBtn" data-action="call" aria-label="Call"><i class="fas fa-phone"></i></button>
        <button class="key ghost" onclick="window.location.href='raginagent.html'" aria-label="RAGina"> <i class="fas fa-robot"></i></button>
      </div>

      <div class="action-row">
        <button class="btn" id="checkStatusBtn"><i class="fas fa-circle-check"></i> Check status</button>
        <span class="status-badge" id="statusResult"></span>
      </div>
    </div>

    <div id="historySection">
      <h3>
        <span class="title"><i class="fas fa-clock-rotate-left"></i> Recent</span>
        <button class="clear-history" id="clearHistoryBtn">Clear</button>
      </h3>
      <ul id="historyList"></ul>
    </div>

    <div class="log-area" id="logArea"><div class="log-entry"><i class="fas fa-circle-info"></i> Ready.</div></div>

    <div id="incomingOverlay">
      <div class="avatar-wrap ring-anim">
        <div class="ring"></div><div class="ring"></div><div class="ring"></div>
        <div class="avatar" id="incomingAvatar">👤</div>
      </div>
      <div class="peer-name" id="incomingName">Unknown</div>
      <div class="peer-number" id="incomingNumber">+1234567890</div>
      <div class="swipe-hint"><i class="fas fa-arrow-up"></i> Incoming call</div>
      <div class="actions">
        <button class="reject" id="rejectBtn" aria-label="Decline"><i class="fas fa-phone-slash"></i></button>

<script>
/* ============================================================
   PremCall v2.1  (merged - call + chat)
   WebRTC calling + chat over PeerJS.
   ============================================================ */
(function (global) {
  'use strict';

  if (typeof global.Peer === 'undefined') {
    console.error('[PremCall] The PeerJS library was not found.');
    return;
  }

  const CONFIG = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun2.l.google.com:19302' },
      { urls: 'stun:stun3.l.google.com:19302' },
      { urls: 'stun:stun4.l.google.com:19302' },
      { urls: 'stun:stun.ekiga.net' },
      { urls: 'stun:stun.ideasip.com' },
      {
        urls: ['turn:numb.viagenie.ca:3478', 'turn:numb.viagenie.ca:443'],
        username: 'webrtc@live.com',
        credential: 'muazkh'
      }
    ],
    iceCandidatePoolSize: 10
  };

  let peer = null;
  let myNumber = null;
  let incomingCall = null;
  let activeCall = null;
  let localStream = null;
  let remoteStream = null;
  let inCall = false;
  let muted = false;
  let speakerOn = false;
  let callbacks = {};
  let messageListeners = new Set();

  function log(message, level) {
    console.log('[PremCall]', message);
    if (callbacks.onLog) callbacks.onLog(message, level);
  }

  function fire(name, data) {
    if (callbacks[name]) callbacks[name](data);
  }

  function resetCallState() {
    if (activeCall) {
      try { activeCall.close(); } catch (e) {}
    }
    activeCall = null;
    remoteStream = null;
    inCall = false;
    incomingCall = null;
    muted = false;
  }

  async function getLocalStream() {
    if (localStream && localStream.getAudioTracks().length > 0) return localStream;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });
      localStream = stream;
      log('Microphone acquired', 'info');
      return stream;
    } catch (e) {
      log('Microphone error: ' + e.message, 'error');
      throw e;
    }
  }

  function wireCallEvents(call, isCaller) {
    activeCall = call;
    inCall = true;
    fire('onCallStarted', { target: call.peer, isCaller: isCaller });

    call.on('stream', function (stream) {
      remoteStream = stream;
      fire('onRemoteStream', remoteStream);
    });

    call.on('close', function () {
      resetCallState();
      fire('onCallEnded', null);
    });

    call.on('error', function (err) {
      log('Call error: ' + err.message, 'error');
      resetCallState();
      fire('onError', err);
    });

    const pc = call.peerConnection;
    if (pc) {
      pc.oniceconnectionstatechange = function () {
        const state = pc.iceConnectionState;
        log('ICE state: ' + state, 'info');
        if (state === 'connected' || state === 'completed') {
          fire('onConnected', null);
        }
        if (state === 'failed' || state === 'disconnected') {
          resetCallState();
          fire('onError', new Error('Connection lost'));
        }
      };
    }
  }

  function attachPeerHandlers() {
    peer.on('open', function (id) {
      log('Connected with ID: ' + id, 'info');
      fire('online', id);
      fire('onConnected', id);
    });

    peer.on('error', function (err) {
      log('Peer error: ' + err.type + ' - ' + err.message, 'error');
      if (err.type === 'unavailable-id') {
        fire('onError', new Error('Number already taken'));
      } else {
        fire('onError', err);
      }
    });

    peer.on('close', function () {
      log('Connection closed', 'warn');
      fire('offline', null);
      fire('onDisconnected', null);
      if (inCall) resetCallState();
    });

    peer.on('disconnected', function () {
      log('Disconnected - reconnecting...', 'warn');
      fire('offline', null);
      fire('onDisconnected', null);
      setTimeout(function () {
        if (peer && !peer.destroyed) peer.reconnect();
      }, 3000);
    });

    peer.on('call', function (call) {
      log('Incoming call from: ' + call.peer, 'info');
      if (inCall) {
        call.close();
        log('Rejected - already in call', 'warn');
        return;
      }
      incomingCall = call;
      fire('onIncoming', call.peer);
    });

    peer.on('connection', function (conn) {
      conn.on('data', function (data) {
        try {
          const msg = typeof data === 'string' ? JSON.parse(data) : data;
          if (msg && msg.type === 'premcall-message') {
            const message = {
              from: msg.from,
              text: msg.text,
              timestamp: msg.timestamp || Date.now(),
              direction: 'incoming'
            };
            messageListeners.forEach(function (cb) { cb(message); });
            fire('onMessage', message);
          }
        } catch (e) {
          console.warn('[PremCall] Invalid message data', e);
        }
      });
    });
  }

  const PremCall = {
    init: function (number, opts) {
      if (!/^\d{10}$/.test(number)) {
        throw new Error('Number must be exactly 10 digits');
      }
      if (peer) {
        peer.destroy();
        peer = null;
      }
      myNumber = number;
      callbacks = opts || {};
      peer = new global.Peer(number, { debug: 2, config: CONFIG });
      attachPeerHandlers();
    },

    call: async function (target) {
      if (inCall) throw new Error('Already in a call');
      if (!peer) throw new Error('Not initialized. Call init() first.');
      if (!/^\d{10}$/.test(target)) throw new Error('Target must be exactly 10 digits');
      if (target === myNumber) throw new Error('Cannot call yourself');
      log('Calling ' + target + '...', 'info');
      try {
        const stream = await getLocalStream();
        const call = peer.call(target, stream);
        if (!call) throw new Error('Target unreachable');
        wireCallEvents(call, true);
      } catch (e) {
        log('Call failed: ' + e.message, 'error');
        throw e;
      }
    },

    answer: async function () {
      if (!incomingCall) throw new Error('No incoming call');
      const call = incomingCall;
      incomingCall = null;
      try {
        const stream = await getLocalStream();
        call.answer(stream);
        wireCallEvents(call, false);
      } catch (e) {
        log('Answer failed: ' + e.message, 'error');
        throw e;
      }
    },

    hangup: function () {
      resetCallState();
      fire('onCallEnded', null);
      log('Call ended', 'info');
    },

    mute: function () {
      if (!localStream) return muted;
      muted = !muted;
      localStream.getAudioTracks().forEach(function (t) { t.enabled = !muted; });
      fire('onMuteToggled', muted);
      return muted;
    },

    speaker: function () {
      speakerOn = !speakerOn;
      fire('onSpeakerToggled', speakerOn);
      return speakerOn;
    },

    checkStatus: function (number) {
      return new Promise(function (resolve) {
        if (!peer) return resolve(false);
        const conn = peer.connect(number);
        let done = false;
        conn.on('open', function () {
          if (!done) { done = true; resolve(true); conn.close(); }
        });
        conn.on('error', function () {
          if (!done) { done = true; resolve(false); }
        });
        setTimeout(function () {
          if (!done) { done = true; resolve(false); try { conn.close(); } catch (e) {} }
        }, 3000);
      });
    },

    getNumber: function () { return myNumber; },
    isInCall: function () { return inCall; },

    destroy: function () {
      if (peer) { peer.destroy(); peer = null; }
      if (localStream) {
        localStream.getTracks().forEach(function (t) { t.stop(); });
        localStream = null;
      }
      remoteStream = null;
      inCall = false;
      incomingCall = null;
      activeCall = null;
      myNumber = null;
      muted = false;
      speakerOn = false;
      messageListeners.clear();
    },

    sendMessage: function (target, text) {
      return new Promise(function (resolve, reject) {
        if (!peer) return reject(new Error('PremCall not initialized.'));
        if (!/^\d{10}$/.test(target)) return reject(new Error('Target must be 10 digits.'));
        if (!text || typeof text !== 'string' || text.trim().length === 0) {
          return reject(new Error('Message cannot be empty.'));
        }
        const payload = {
          type: 'premcall-message',
          from: myNumber,
          text: text.trim(),
          timestamp: Date.now()
        };
        const conn = peer.connect(target, { reliable: true });
        let done = false;
        conn.on('open', function () {
          conn.send(JSON.stringify(payload));
          if (!done) {
            done = true;
            const messageObj = { target: target, text: payload.text, timestamp: payload.timestamp, direction: 'outgoing' };
            resolve(messageObj);
            fire('onMessage', messageObj);
            setTimeout(function () { try { conn.close(); } catch (e) {} }, 500);
          }
        });
        conn.on('error', function (err) { if (!done) { done = true; reject(err); } });
        setTimeout(function () {
          if (!done) {
            done = true;
            reject(new Error('Send timeout'));
            try { conn.close(); } catch (e) {}
          }
        }, 5000);
      });
    },

    onMessage: function (cb) { if (typeof cb === 'function') messageListeners.add(cb); },
    offMessage: function (cb) { messageListeners.delete(cb); }
  };

  global.PremCall = PremCall;
  console.log('[PremCall] Library loaded (v2.1 embedded).');
})(window);
</script>

<script>
(function() {
  'use strict';

  if (typeof PremCall === 'undefined') {
    document.getElementById('logArea').innerHTML = '<div class="log-entry error">PremCall not loaded.</div>';
    return;
  }

  const dialDisplay    = document.getElementById('dialDisplay');
  const dialText       = document.getElementById('dialText');
  const addBtn         = document.getElementById('addBtn');
  const backspaceBtn   = document.getElementById('backspaceBtn');
  const dialPad        = document.getElementById('dialPad');
  const dialCallBtn    = document.getElementById('dialCallBtn');
  const checkStatusBtn = document.getElementById('checkStatusBtn');
  const statusResult   = document.getElementById('statusResult');
  const logArea        = document.getElementById('logArea');
  const incomingOverlay= document.getElementById('incomingOverlay');
  const incomingAvatar = document.getElementById('incomingAvatar');
  const incomingName   = document.getElementById('incomingName');
  const incomingNumber = document.getElementById('incomingNumber');
  const answerBtn      = document.getElementById('answerBtn');
  const rejectBtn       = document.getElementById('rejectBtn');
  const callScreen      = document.getElementById('callScreen');
  const callAvatar      = document.getElementById('callAvatar');
  const callRingWrap    = document.getElementById('callRingWrap');
  const callName        = document.getElementById('callName');
  const callNumber      = document.getElementById('callNumber');
  const callTimer       = document.getElementById('callTimer');
  const callSubstatus   = document.getElementById('callSubstatus');
  const hangupCallBtn   = document.getElementById('hangupCallBtn');
  const muteBtn         = document.getElementById('muteBtn');
  const speakerBtn      = document.getElementById('speakerBtn');
  const myNumberDisplay = document.getElementById('myNumberDisplay');
  const headerStatusDot = document.getElementById('headerStatusDot');
  const remoteAudio     = document.getElementById('remoteAudio');
  const toast           = document.getElementById('toast');
  const historyList     = document.getElementById('historyList');
  const clearHistoryBtn = document.getElementById('clearHistoryBtn');
  const registerLink    = document.getElementById('registerLink');
  const accountModal    = document.getElementById('accountModal');
  const brandLogo       = document.getElementById('brandLogo');

  let dialedNumber = '';
  let callTimerInterval = null;
  let toastTimeout = null;
  let pendingCallDirection = null;
  let getCallDuration = null;

  /* ---------- Theme toggle (double-tap on logo) ---------- */
  let lastLogoTap = 0;
  brandLogo.addEventListener('click', function() {
    const now = Date.now();
    if (now - lastLogoTap < 350) {
      document.body.classList.toggle('light-mode');
      showToast(document.body.classList.contains('light-mode') ? 'Bright mode' : 'Dark mode');
      lastLogoTap = 0;
    } else {
      lastLogoTap = now;
    }
  });

  /* ---------- WebAudio helpers ---------- */
  let actx = null;
  function audioCtx() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (actx && actx.state === 'suspended') actx.resume().catch(()=>{});
    return actx;
  }
  function beep(freq1, freq2, dur) {
    const ctx = audioCtx(); if (!ctx) return;
    const now = ctx.currentTime;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.06, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    gain.connect(ctx.destination);
    [freq1, freq2].forEach(f => {
      if (!f) return;
      const osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = f;
      osc.connect(gain); osc.start(now); osc.stop(now + dur);
    });
  }
  const DTMF = {
    '1':[697,1209],'2':[697,1336],'3':[697,1477],
    '4':[770,1209],'5':[770,1336],'6':[770,1477],
    '7':[852,1209],'8':[852,1336],'9':[852,1477],
    '*':[941,1209],'0':[941,1336],'#':[941,1477]
  };
  function playDtmf(d) { const t = DTMF[d]; if (t) beep(t[0], t[1], 0.08); }

  let ringtoneTimer = null;
  function startRingtone() { stopRingtone(); const tick = () => beep(440,480,0.35); tick(); ringtoneTimer = setInterval(tick,1600); }
  function stopRingtone() { if (ringtoneTimer) { clearInterval(ringtoneTimer); ringtoneTimer = null; } }
  function vibrate(pattern) { if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch(e){} } }

  /* ---------- ripple ---------- */
  function addRipple(el, evt) {
    const rect = el.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const point = evt.touches ? evt.touches[0] : evt;
    const x = (point ? point.clientX : rect.left + rect.width/2) - rect.left - size/2;
    const y = (point ? point.clientY : rect.top + rect.height/2) - rect.top - size/2;
    const span = document.createElement('span');
    span.className = 'ripple'; span.style.width = span.style.height = size+'px';
    span.style.left = x+'px'; span.style.top = y+'px';
    el.appendChild(span); setTimeout(() => span.remove(), 520);
  }

  /* ---------- history ---------- */
  function getHistory() { try { return JSON.parse(localStorage.getItem('premCallHistory')) || []; } catch(e) { return []; } }
  function saveHistory(h) { localStorage.setItem('premCallHistory', JSON.stringify(h)); }
  function addHistoryEntry(number, direction, duration) {
    const history = getHistory();
    history.unshift({ number, direction, duration: duration || '—', timestamp: Date.now() });
    if (history.length > 50) history.length = 50;
    saveHistory(history); renderHistory();
  }
  function renderHistory() {
    if (!historyList) return;
    historyList.innerHTML = '';
    const history = getHistory();
    if (!history.length) { historyList.innerHTML = '<li class="empty">No calls yet</li>'; return; }
    history.forEach(entry => {
      const li = document.createElement('li');
      const dirIcon = entry.direction === 'incoming' ? 'fa-arrow-down' : entry.direction === 'outgoing' ? 'fa-arrow-up' : 'fa-phone-slash';
      const dirClass = entry.direction === 'incoming' ? 'incoming' : entry.direction === 'outgoing' ? 'outgoing' : 'missed';
      const date = new Date(entry.timestamp);
      const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      li.innerHTML = `<span class="chip ${dirClass}"><i class="fas ${dirIcon}"></i></span><span class="num">${entry.number}</span><span class="time">${entry.duration}<br>${timeStr}</span>`;
      historyList.appendChild(li);
    });
  }
  clearHistoryBtn.addEventListener('click', () => { saveHistory([]); renderHistory(); showToast('History cleared'); });

  function showToast(msg, duration) {
    if (!toast) return;
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(toastTimeout); toastTimeout = setTimeout(() => toast.classList.remove('show'), duration || 2500);
  }
  function log(msg, type) {
    if (!logArea) return;
    const now = new Date().toLocaleTimeString();
    const entry = document.createElement('div');
    entry.className = 'log-entry' + (type ? ' ' + type : '');
    entry.textContent = now + ' ' + msg;
    logArea.prepend(entry);
    if (logArea.children.length > 50) logArea.removeChild(logArea.lastChild);
  }
  function setStatusDot(state) { if (headerStatusDot) headerStatusDot.className = 'status-dot ' + state; }
  function getStoredNumber() {
    const num = localStorage.getItem('premCallNumber');
    const verified = localStorage.getItem('premCallVerified') === 'true';
    return (num && verified) ? num : null;
  }
  function startTimer() {
    if (callTimerInterval) clearInterval(callTimerInterval);
    let seconds = 0;
    callTimerInterval = setInterval(() => {
      seconds++;
      const m = String(Math.floor(seconds / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');
      if (callTimer) callTimer.textContent = m + ':' + s;
    }, 1000);
    return () => { clearInterval(callTimerInterval); callTimerInterval = null; return seconds; };
  }
  function initials(label) {
    if (!label) return '👤';
    const digitsOnly = /^[\d+\s-]+$/.test(label);
    if (digitsOnly) return label.replace(/\D/g, '').slice(-2) || '👤';
    return label.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  }

  function showIncomingOverlay(callerId) {
    if (!incomingOverlay) return;
    incomingAvatar.textContent = initials(callerId);
    incomingName.textContent = callerId; incomingNumber.textContent = callerId;
    incomingOverlay.classList.add('active');
    startRingtone(); vibrate([300,200,300,200,300]);
    showToast('Incoming call from ' + callerId);
    log('Incoming call from ' + callerId, 'warning');
  }
  function hideIncomingOverlay() {
    if (!incomingOverlay) return;
    incomingOverlay.classList.remove('active'); stopRingtone();
    incomingOverlay.style.transform = ''; incomingOverlay.style.opacity = '';
  }
  function showCallScreen(name, isCaller) {
    if (!callScreen) return;
    stopRingtone();
    callAvatar.textContent = initials(name);
    callName.textContent = name; callNumber.textContent = name;
    callSubstatus.textContent = isCaller ? 'Ringing…' : 'Connecting…';
    callTimer.textContent = '00:00';
    callRingWrap.classList.add('ring-anim');
    callScreen.classList.add('active');
    hideIncomingOverlay();
    if (callTimerInterval) clearInterval(callTimerInterval);
    callTimerInterval = null; getCallDuration = null;
  }
  function hideCallScreen() {
    if (!callScreen) return;
    callScreen.classList.remove('active'); callRingWrap.classList.remove('ring-anim');
    if (callTimerInterval) clearInterval(callTimerInterval);
    callTimer.textContent = '00:00';
    if (remoteAudio) remoteAudio.srcObject = null;
    if (dialCallBtn) dialCallBtn.classList.remove('disabled');
  }

  function initPremCall() {
    const number = getStoredNumber();
    if (!number) {
      if (myNumberDisplay) myNumberDisplay.textContent = 'Not registered';
      setStatusDot('offline');
      log('No verified number yet. Tap Registration to set one up.', 'warning');
      showToast('Register your number to start calling');
      registerLink.classList.remove('hidden');
      return;
    }
    if (!/^\d{10}$/.test(number)) {
      if (myNumberDisplay) myNumberDisplay.textContent = 'Invalid';
      setStatusDot('offline');
      log('Stored number is not 10 digits.', 'error');
      registerLink.classList.remove('hidden');
      return;
    }
    registerLink.classList.add('hidden');
    if (myNumberDisplay) myNumberDisplay.textContent = number;
    setStatusDot('connecting');
    log('Initializing with number: ' + number, 'info');

    try {
      PremCall.init(number, {
        onIncoming: (callerId) => { showIncomingOverlay(callerId); },
        onPeerConnected: () => { setStatusDot('online'); },
        onConnected: () => {
          if (callScreen.classList.contains('active')) {
            if (callSubstatus) callSubstatus.textContent = 'Connected';
            callRingWrap.classList.remove('ring-anim');
            if (!callTimerInterval) getCallDuration = startTimer();
          }
        },
        onDisconnected: () => setStatusDot('offline'),
        onRemoteStream: (stream) => {
          if (remoteAudio) {
            remoteAudio.srcObject = stream; remoteAudio.muted = false;
            remoteAudio.play().catch(() => {
              document.addEventListener('click', () => remoteAudio.play(), { once: true });
              document.addEventListener('touchstart', () => remoteAudio.play(), { once: true });
            });
          }
          if (callSubstatus) callSubstatus.textContent = 'Connected';
        },
        onCallStarted: (data) => {
          pendingCallDirection = data.isCaller ? 'outgoing' : 'incoming';
          showCallScreen(data.target, data.isCaller);
        },
        onCallEnded: () => {
          let duration = '—';
          if (getCallDuration) {
            const secs = getCallDuration();
            const m = String(Math.floor(secs / 60)).padStart(2, '0');
            const s = String(secs % 60).padStart(2, '0');
            duration = m + ':' + s;
            getCallDuration = null;
          }
          const currentNumber = callNumber ? callNumber.textContent : '';
          if (currentNumber && currentNumber !== 'Calling…' && currentNumber !== '+1234567890') {
            addHistoryEntry(currentNumber, pendingCallDirection || 'incoming', duration);
          }
          pendingCallDirection = null;
          hideCallScreen(); hideIncomingOverlay(); showToast('Call ended');
        },
        onError: (err) => {
          log('Error: ' + err.message, 'error'); showToast('Error: ' + err.message); setStatusDot('offline');
        },
        onLog: (msg, level) => log(msg, level)
      });
      setStatusDot('online');
    } catch (err) {
      log('Init failed: ' + err.message, 'error'); setStatusDot('offline'); showToast('Init failed: ' + err.message);
    }
  }

  /* ---------- dialpad ---------- */
  function updateDisplay() {
    if (dialedNumber) {
      dialText.innerHTML = dialedNumber + '<span class="cursor"></span>';
      addBtn.style.display = 'block'; backspaceBtn.style.display = 'block';
    } else {
      dialText.innerHTML = '<span class="hint"><i class="fas fa-phone"></i> Enter a 10-digit number</span>';
      addBtn.style.display = 'none'; backspaceBtn.style.display = 'none';
    }
  }

  backspaceBtn.addEventListener('click', () => { dialedNumber = dialedNumber.slice(0, -1); updateDisplay(); vibrate(8); });
  addBtn.addEventListener('click', () => { showToast('Add contact feature coming soon'); vibrate(10); });

  dialPad.addEventListener('pointerdown', (e) => { const key = e.target.closest('.key'); if (key) addRipple(key, e); });

  dialPad.addEventListener('click', (e) => {
    const key = e.target.closest('.key'); if (!key) return;
    const digit = key.dataset.digit;
    const action = key.dataset.action;

    if (digit) {
      if (dialedNumber.length < 15) { dialedNumber += digit; updateDisplay(); }
      playDtmf(digit); vibrate(10);
    } else if (action === 'message') { showToast('Message feature coming soon'); vibrate(10); }
    else if (action === 'contacts') { showToast('Contacts feature coming soon'); vibrate(10); }
    else if (action === 'call') {
      if (!dialedNumber || !/^\d{10}$/.test(dialedNumber)) {
        const reason = !dialedNumber ? 'No number entered' : 'Number is ' + dialedNumber.length + ' characters, need exactly 10 digits (no * or #)';
        log(reason, 'error'); showToast('Enter exactly 10 digits'); vibrate([40,40,40]); return;
      }
      if (headerStatusDot.className.indexOf('online') === -1) {
        log('Not connected to signaling server yet — wait for the status dot to turn green.', 'warning');
        showToast('Still connecting, try again in a moment'); vibrate([40,40,40]); return;
      }
      dialCallBtn.classList.add('disabled'); vibrate(15);
      try { PremCall.call(dialedNumber); } catch (err) {
        log('Call failed: ' + err.message, 'error'); showToast('Call failed: ' + err.message); dialCallBtn.classList.remove('disabled');
      }
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') {
      if (dialedNumber.length < 15) { dialedNumber += e.key; updateDisplay(); playDtmf(e.key); }
    } else if (e.key === 'Backspace') { dialedNumber = dialedNumber.slice(0, -1); updateDisplay(); }
    else if (e.key === 'Enter') { if (dialedNumber && /^\d{10}$/.test(dialedNumber)) dialCallBtn.click(); }
  });

  hangupCallBtn.addEventListener('click', () => { PremCall.hangup(); dialCallBtn.classList.remove('disabled'); vibrate(15); });
  muteBtn.addEventListener('click', () => {
    const muted = PremCall.mute();
    muteBtn.innerHTML = muted ? '<i class="fas fa-microphone-slash"></i>' : '<i class="fas fa-microphone"></i>';
    muteBtn.className = muted ? 'mute active' : 'mute';
    showToast(muted ? 'Muted' : 'Unmuted'); vibrate(10);
  });
  speakerBtn.addEventListener('click', () => {
    const on = PremCall.speaker();
    speakerBtn.className = on ? 'speaker active' : 'speaker';
    speakerBtn.innerHTML = on ? '<i class="fas fa-volume-high"></i>' : '<i class="fas fa-volume-xmark"></i>';
    showToast(on ? 'Speaker on' : 'Earpiece'); vibrate(10);
  });
  answerBtn.addEventListener('click', async () => {
    try { await PremCall.answer(); hideIncomingOverlay(); vibrate(15); } catch (err) { showToast('Answer failed: ' + err.message); }
  });
  rejectBtn.addEventListener('click', () => {
    const caller = incomingName.textContent; PremCall.hangup(); hideIncomingOverlay();
    if (caller && caller !== 'Unknown') addHistoryEntry(caller, 'missed', '—');
    showToast('Call declined'); vibrate(15);
  });

  /* swipe */
  (function enableSwipe() {
    let startY = null;
    incomingOverlay.addEventListener('touchstart', (e) => { startY = e.touches[0].clientY; incomingOverlay.style.transition = 'none'; }, { passive: true });
    incomingOverlay.addEventListener('touchmove', (e) => {
      if (startY === null) return;
      const dy = e.touches[0].clientY - startY;
      incomingOverlay.style.transform = 'translateY(' + (dy * 0.35) + 'px)';
      incomingOverlay.style.opacity = String(1 - Math.min(Math.abs(dy) / 500, 0.5));
    }, { passive: true });
    incomingOverlay.addEventListener('touchend', (e) => {
      if (startY === null) return;
      const dy = e.changedTouches[0].clientY - startY;
      incomingOverlay.style.transition = 'transform .25s ease, opacity .25s ease';
      incomingOverlay.style.transform = ''; incomingOverlay.style.opacity = '';
      if (dy < -80) answerBtn.click(); else if (dy > 80) rejectBtn.click();
      startY = null;
    });
  })();

  checkStatusBtn.addEventListener('click', async () => {
    const num = dialedNumber || prompt('Enter 10-digit number to check:');
    if (!num) return;
    if (!/^\d{10}$/.test(num)) { statusResult.textContent = 'Invalid number'; return; }
    statusResult.textContent = 'Checking…';
    try {
      const online = await PremCall.checkStatus(num);
      statusResult.textContent = online ? '✅ Online' : '❌ Offline';
    } catch (err) { statusResult.textContent = 'Error'; log('Status check failed: ' + err.message, 'error'); }
  });

  // Account modal
  myNumberDisplay.addEventListener('click', () => {
    const num = getStoredNumber();
    if (num) {
      document.getElementById('accountNumber').textContent = num;
      const since = localStorage.getItem('premCallRegisteredAt');
      document.getElementById('accountDate').textContent = since ? new Date(Number(since)).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : 'Unknown';
      accountModal.classList.add('active');
    }
  });

  initPremCall();
  renderHistory();
  updateDisplay();

  (function autoLoad() {
    const params = new URLSearchParams(window.location.search);
    const num = params.get('number');
    if (num && /^\d{10}$/.test(num)) {
      dialedNumber = num; updateDisplay();
      setTimeout(() => { try { PremCall.call(num); } catch (e) {} }, 1500);
    }
  })();

  log('UI ready.', 'success');
})();
</script>
</body>
</html>

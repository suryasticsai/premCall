                // ─── IndexedDB ──────────────────────────────────────────
                const DB_NAME = 'RAGinaChatDB';

                function openDB() { /* ... same as before ... */ }
                async function saveToIndexedDB(data) { /* ... */ }
                async function loadFromIndexedDB() { /* ... */ }
                async function clearIndexedDB() { /* ... */ }

                // ─── Render messages ──────────────────────────────────
                function renderMessages(msgs) {
                    messages.innerHTML = '';
                    msgs.forEach(msg => {
                        const div = document.createElement('div');
                        div.className = 'msg ' + (msg.role || 'system');
                        div.innerHTML = msg.text || msg.html || '';
                        messages.appendChild(div);
                    });
                    messages.scrollTop = messages.scrollHeight;
                }

                function addMessage(role, text, extraHtml = '') {
                    const fullText = text + extraHtml;
                    const entry = { role, text: fullText };
                    messageHistory.push(entry);
                    const div = document.createElement('div');
                    div.className = 'msg ' + role;
                    div.innerHTML = fullText;
                    messages.appendChild(div);
                    messages.scrollTop = messages.scrollHeight;
                    saveToIndexedDB(messageHistory);
                    return div;
                }

                async function restoreChat() {
                    const saved = await loadFromIndexedDB();
                    if (saved && saved.length > 0) {
                        messageHistory = saved;
                        renderMessages(saved);
                        const nameMsg = saved.find(m => m.role === 'system' && m.text.includes('Welcome back'));
                        if (nameMsg) {
                            const match = nameMsg.text.match(/Welcome back, ([^!]+)/);
                            if (match) userName = match[1];
                        }
                        introDone = true;
                        conversationActive = true;
                        if (userName) {
                            try { localStorage.setItem('ragina_user_name', userName); } catch(e) {}
                        }
                        chatStatus.textContent = `Loaded ${saved.length} messages`;
                        chatStatus.style.color = '#6C63FF';
                        return true;
                    }
                    return false;
                }

                // ─── YouTube Player ──────────────────────────────────
                function initYouTubePlayer() {
                    if (window.YT && window.YT.Player) {
                        if (youtubePlayer) return;
                        youtubePlayer = new YT.Player('youtubePlayerContainer', {
                            height: '0',
                            width: '0',
                            videoId: '',
                            playerVars: { autoplay: 0, controls: 0, modestbranding: 1, rel: 0, showinfo: 0,
                                iv_load_policy: 3 },
                            events: {
                                onReady: onPlayerReady,
                                onStateChange: onPlayerStateChange,
                                onError: onPlayerError
                            }
                        });
                    } else {
                        setTimeout(initYouTubePlayer, 500);
                    }
                }

                function onPlayerReady(event) {
                    youtubePlayer = event.target;
                    playerReady = true;
                    if (playerReadyResolve) playerReadyResolve();
                    if (currentVideoId) {
                        try {
                            youtubePlayer.loadVideoById(currentVideoId);
                            if (musicPlaying) youtubePlayer.playVideo();
                        } catch (e) { console.warn('Failed to load pending video:', e); }
                    }
                }

                function onPlayerStateChange(event) {
                    const state = event.data;
                    if (state === YT.PlayerState.PLAYING) {
                        musicPlaying = true;
                        updatePlayPauseBtn(true);
                        if (!musicProgressInterval) {
                            musicProgressInterval = setInterval(updateProgressFromPlayer, 500);
                        }
                    } else if (state === YT.PlayerState.PAUSED) {
                        musicPlaying = false;
                        updatePlayPauseBtn(false);
                    } else if (state === YT.PlayerState.ENDED) {
                        stopSong();
                        addMessage('bot', 'Song finished!');
                        if (voiceActive && conversationActive && !currentAudio && !ttsLoading) {
                            setTimeout(startListening, 500);
                        }
                    }
                }

                function onPlayerError(event) {
                    console.warn('YouTube player error:', event.data);
                    addMessage('bot', 'Sorry, there was an error playing that song.');
                }

                function updateProgressFromPlayer() {
                    if (!youtubePlayer || !playerReady) return;
                    try {
                        const current = youtubePlayer.getCurrentTime();
                        const duration = youtubePlayer.getDuration();
                        if (duration && duration > 0) {
                            musicDuration = duration;
                            musicCurrentTime = current;
                            updateProgressUI();
                        }
                    } catch (e) {}
                }

                async function loadVideo(videoId, title) {
                    if (!playerReady) {
                        await playerReadyPromise;
                    }
                    if (!youtubePlayer || typeof youtubePlayer.loadVideoById !== 'function') {
                        console.warn('YouTube player not ready, reinitializing...');
                        playerReady = false;
                        initYouTubePlayer();
                        await playerReadyPromise;
                        if (!youtubePlayer || typeof youtubePlayer.loadVideoById !== 'function') {
                            addMessage('bot', 'Sorry, music player unavailable.');
                            return;
                        }
                    }
                    currentVideoId = videoId;
                    currentSongTitle = title;
                    try {
                        youtubePlayer.loadVideoById(videoId);
                        youtubePlayer.playVideo();
                        musicPlaying = true;
                        musicDuration = 0;
                        musicCurrentTime = 0;
                        updatePlayPauseBtn(true);
                        showMusicController();
                        songLabel.textContent = '🎵 ' + title;
                        updateProgressUI();
                        if (musicProgressInterval) clearInterval(musicProgressInterval);
                        musicProgressInterval = setInterval(updateProgressFromPlayer, 500);
                    } catch (err) {
                        console.error('loadVideo error:', err);
                        addMessage('bot', 'Could not play that song.');
                    }
                }

                function pauseSong() {
                    if (youtubePlayer && playerReady) youtubePlayer.pauseVideo();
                    musicPlaying = false;
                    updatePlayPauseBtn(false);
                }

                function resumeSong() {
                    if (youtubePlayer && playerReady) youtubePlayer.playVideo();
                    musicPlaying = true;
                    updatePlayPauseBtn(true);
                }

                function stopSong() {
                    if (youtubePlayer && playerReady) youtubePlayer.stopVideo();
                    musicPlaying = false;
                    currentVideoId = null;
                    currentSongTitle = '';
                    updatePlayPauseBtn(false);
                    hideMusicController();
                    if (musicProgressInterval) {
                        clearInterval(musicProgressInterval);
                        musicProgressInterval = null;
                    }
                    musicCurrentTime = 0;
                    musicDuration = 0;
                    updateProgressUI();
                }

                function showMusicController() { musicController.style.display = 'flex'; }
                function hideMusicController() { musicController.style.display = 'none'; }

                function updatePlayPauseBtn(playing) {
                    if (playing) {
                        btnPlayPause.innerHTML =
                        `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
                    } else {
                        btnPlayPause.innerHTML =
                        `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
                    }
                }

                function formatTime(seconds) {
                    if (!seconds || isNaN(seconds)) return '0:00';
                    const m = Math.floor(seconds / 60);
                    const s = Math.floor(seconds % 60);
                    return m + ':' + (s < 10 ? '0' : '') + s;
                }

                function updateProgressUI() {
                    const pct = (musicDuration > 0) ? (musicCurrentTime / musicDuration) * 100 : 0;
                    progressFill.style.width = pct + '%';
                    timeCurrent.textContent = formatTime(musicCurrentTime);
                    timeDuration.textContent = formatTime(musicDuration);
                }

                // ─── Music commands ──────────────────────────────────
                function executeMusicAction(action, song) {
                    switch (action) {
                        case 'play':
                            if (song) searchAndPlay(song);
                            else addMessage('bot', "What song would you like to play?");
                            break;
                        case 'pause':
                            if (musicPlaying) { pauseSong();
                                addMessage('bot', '⏸️ Paused.'); } else addMessage('bot', 'No song playing.');
                            break;
                        case 'resume':
                            if (currentVideoId && !musicPlaying) { resumeSong();
                                addMessage('bot', '▶️ Resumed.'); } else if (musicPlaying) addMessage('bot',
                                'Already playing.'); else addMessage('bot', 'No song paused.');
                            break;
                        case 'stop':
                            stopSong();
                            addMessage('bot', '⏹️ Stopped.');
                            break;
                        case 'change':
                            if (currentVideoId) { stopSong();
                                addMessage('bot', "⏭️ Changed. What next?"); } else addMessage('bot',
                                'No song playing.');
                            break;
                        default:
                            return false;
                    }
                    return true;
                }

                function handleMusicCommandFast(text) {
                    const lower = text.toLowerCase().trim();
                    if (/\b(?:not\s+this|some\s+other|different)\s+(?:song|music|track)\b/i.test(lower) ||
                        /\b(?:change|skip|next)\s+(?:this|the)?\s*(?:song|music|track)\b/i.test(lower) ||
                        lower === 'skip' || lower === 'next' || lower === 'change') {
                        executeMusicAction('change');
                        return true;
                    }
                    let playMatch = lower.match(/^(?:play|play me|can you play|put on)\s+(.+)/i);
                    if (playMatch) {
                        const query = playMatch[1].trim();
                        const filler = ['not this', 'some other', 'different', 'another', 'something else'];
                        if (query.length <= 2 || filler.some(w => query.includes(w))) {
                            executeMusicAction('change');
                            return true;
                        }
                        searchAndPlay(query);
                        return true;
                    }
                    let songMatch = lower.match(/^(.+)\s+(?:song|music|track)$/i);
                    if (songMatch) {
                        const query = songMatch[1].trim();
                        const filler = ['not this', 'some other', 'different', 'another', 'something else'];
                        if (query.length <= 2 || filler.some(w => query.includes(w))) {
                            executeMusicAction('change');
                            return true;
                        }
                        searchAndPlay(query);
                        return true;
                    }
                    if (/\b(?:pause|hold)\s+(?:the\s+)?(?:song|music|track)\b/i.test(lower) || lower === 'pause') {
                        executeMusicAction('pause');
                        return true;
                    }
                    if (/\b(?:resume|continue|unpause)\s+(?:the\s+)?(?:song|music|track)\b/i.test(lower) || lower ===
                        'resume') {
                        executeMusicAction('resume');
                        return true;
                    }
                    if (/\b(?:stop|end|finish)\s+(?:the\s+)?(?:song|music|track)\b/i.test(lower) || lower === 'stop') {
                        executeMusicAction('stop');
                        return true;
                    }
                    return false;
                }

                async function parseMusicCommandWithAI(text) {
                    const prompt =
                        `You are a music command parser. Given the user's message, determine if they want to control music playback. If yes, respond with a JSON object containing "action" and optionally "song". Actions: "play", "pause", "resume", "stop", "change". If not a music command, respond with {"action": "none"}.

            Important: Only set action to "play" if the user specifically asks for a song by name or artist. If they say things like "not this song", "some other song", "different song", "change", "skip", "next", then action should be "change". If they are just chatting, action should be "none".

            User: "${text}"
            Response:`;
                    try {
                        const res = await fetch(AI_ENDPOINT, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ prompt })
                        });
                        if (!res.ok) throw new Error(`AI ${res.status}`);
                        const data = await res.json();
                        const jsonMatch = data.text.match(/\{.*\}/s);
                        if (jsonMatch) {
                            const parsed = JSON.parse(jsonMatch[0]);
                            if (parsed.action === 'play') {
                                const song = (parsed.song || '').trim();
                                const filler = ['not this', 'some other', 'different', 'another', 'something else',
                                    'change', 'skip'
                                ];
                                if (!song || song.length <= 2 || filler.some(w => song.toLowerCase().includes(w))) {
                                    return { action: 'change' };
                                }
                            }
                            return parsed;
                        }
                        return { action: 'none' };
                    } catch (e) {
                        return { action: 'none' };
                    }
                }

                // ─── Get selected text ──────────────────────────────
                function getSelectedText() {
                    const sel = window.getSelection();
                    if (!sel || sel.isCollapsed) return '';
                    const text = sel.toString().trim();
                    console.log('📌 Selected text:', text);
                    return text;
                }

                // ─── AI call with retry & abort ──────────────────────
                async function callAI(prompt, signal) {
                    let attempts = 0;
                    const maxAttempts = 2;
                    let lastError = null;
                    while (attempts < maxAttempts) {
                        attempts++;
                        try {
                            const res = await fetch(AI_ENDPOINT, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ prompt }),
                                signal: signal,
                            });
                            if (!res.ok) throw new Error(`HTTP ${res.status}`);
                            const data = await res.json();
                            if (data.error || !data.text?.trim()) throw new Error(data.error || 'Empty response');
                            return data.text.trim();
                        } catch (err) {
                            if (err.name === 'AbortError') throw err;
                            lastError = err;
                            console.warn(`AI attempt ${attempts} failed:`, err.message);
                            if (attempts === 1 && FALLBACK_AI_ENDPOINT && FALLBACK_AI_ENDPOINT !== AI_ENDPOINT) {
                                try {
                                    const res = await fetch(FALLBACK_AI_ENDPOINT, {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ prompt }),
                                        signal: signal,
                                    });
                                    if (res.ok) {
                                        const data = await res.json();
                                        if (data.text?.trim()) return data.text.trim();
                                    }
                                } catch (e) {}
                            }
                            if (attempts < maxAttempts) await new Promise(r => setTimeout(r, 2000));
                        }
                    }
                    throw lastError || new Error('All AI attempts failed.');
                }

                async function getAIAnswer(question, selectedText, signal) {
                    let context = '';
                    if (selectedText) {
                        context = `The user has selected the following text on the page: "${selectedText}".\n\n`;
                    }
                    if (engine && typeof engine.retrieve === 'function') {
                        try {
                            const chunks = engine.retrieve(question, 5) || [];
                            const ragContext = chunks.map((c, i) => `[${i+1}] ${c.text}`).join('\n\n');
                            if (ragContext) {
                                context += 'Relevant context from knowledge base:\n' + ragContext + '\n\n';
                            }
                        } catch (e) {}
                    }
                    const recentHistory = history.slice(-8)
                        .map(h => `${h.role === 'user' ? (userName || 'User') : 'RAGina'}: ${h.text}`)
                        .join('\n');
                    const prompt =
                        `You are RAGina — witty, warm, sharp-tongued AI with access to YouTube music. Talk like a real friend. You can play songs. If the user asks for music, say you'll play it. Only use context below if relevant. You're talking to ${userName || 'someone new'}.

${context ? 'User provided selected text context:\n' + context : ''}

Recent:
${recentHistory}

${userName || 'User'}: ${question}
RAGina:`;
                    return await callAI(prompt, signal);
                }

                // ─── Search and play ──────────────────────────────────
                async function searchAndPlay(query) {
                    if (!query || query.length < 2) {
                        addMessage('bot', "Could you be more specific?");
                        return;
                    }
                    try {
                        const url = YT_SEARCH_URL + encodeURIComponent(query);
                        const res = await fetch(url);
                        if (!res.ok) throw new Error(`Worker returned ${res.status}`);
                        const data = await res.json();
                        if (!data.success || !data.items || data.items.length === 0) {
                            addMessage('bot', `Couldn't find "${query}".`);
                            const fallbackUrl =
                                `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
                            addMessage('bot',
                                `Open: <a href="${fallbackUrl}" target="_blank">${query} on YouTube</a>`);
                            return;
                        }
                        const song = data.items[0];
                        await loadVideo(song.id, song.title);
                        addMessage('bot', `🎵 Playing: <strong>${escapeHTML(song.title)}</strong>`);
                        if (voiceActive && !musicPlaying) await speakText(`Playing ${song.title}.`);
                    } catch (err) {
                        console.error('Search error:', err);
                        addMessage('bot', `Oops, could not play that. Error: ${err.message || 'unknown'}`);
                    }
                }

                function escapeHTML(str) { const d = document.createElement('div');
                    d.textContent = str; return d.innerHTML; }

                // ─── Button controls ──────────────────────────────────
                btnPlayPause.addEventListener('click', () => {
                    if (musicPlaying) { pauseSong();
                        addMessage('bot', '⏸️ Paused.'); } else if (currentVideoId) { resumeSong();
                        addMessage('bot', '▶️ Resumed.'); } else addMessage('bot', 'No song loaded.');
                });
                btnStop.addEventListener('click', () => { stopSong();
                    addMessage('bot', '⏹️ Stopped.'); });
                progressBar.addEventListener('click', (e) => {
                    if (!youtubePlayer || !playerReady || !currentVideoId) return;
                    const rect = progressBar.getBoundingClientRect();
                    const x = (e.clientX - rect.left) / rect.width;
                    const duration = youtubePlayer.getDuration();
                    if (duration && duration > 0) {
                        youtubePlayer.seekTo(x * duration, true);
                        updateProgressFromPlayer();
                    }
                });

                // ─── Drag / Click ──────────────────────────────────────
                let dragActive = false,
                    dragStartX = 0,
                    dragStartY = 0,
                    pointerDownX = 0,
                    pointerDownY = 0,
                    startLeft = 0,
                    startTop = 0,
                    isClick = false;
                function onPointerDown(e) {
                    if (e.target.closest('button') || e.target.closest('input') || e.target.closest('.btn-icon')) return;
                    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                    pointerDownX = clientX;
                    pointerDownY = clientY;
                    dragStartX = clientX;
                    dragStartY = clientY;
                    dragActive = true;
                    isClick = true;
                    const rect = app.getBoundingClientRect();
                    startLeft = rect.left;
                    startTop = rect.top;
                    app.style.transition = 'none';
                    e.preventDefault();
                }
                function onPointerMove(e) {
                    if (!dragActive) return;
                    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                    const dx = clientX - dragStartX,
                        dy = clientY - dragStartY;
                    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) isClick = false;
                    app.style.left = (startLeft + dx) + 'px';
                    app.style.top = (startTop + dy) + 'px';
                    app.style.right = 'auto';
                    app.style.bottom = 'auto';
                }
                function onPointerUp(e) {
                    if (!dragActive) return;
                    dragActive = false;
                    if (e.target.closest('button') || e.target.closest('input') || e.target.closest('.btn-icon')) return;
                    const clientX = e.clientX || (e.changedTouches && e.changedTouches[0].clientX);
                    const clientY = e.clientY || (e.changedTouches && e.changedTouches[0].clientY);
                    const dx = clientX - pointerDownX,
                        dy = clientY - pointerDownY;
                    if (Math.abs(dx) < 5 && Math.abs(dy) < 5 && isClick) {
                        handleClick(e);
                    }
                    isClick = false;
                }
                function handleClick(e) {
                    if (isMinimized) {
                        setMinimized(false);
                        if (!introDone) introduce();
                    } else {
                        const target = e.target;
                        if (target.closest && target.closest('.logo')) {
                            if (!introDone) introduce();
                            e.stopPropagation();
                        }
                    }
                }
                header.addEventListener('mousedown', onPointerDown);
                header.addEventListener('touchstart', onPointerDown, { passive: false });
                document.addEventListener('mousemove', onPointerMove);
                document.addEventListener('touchmove', onPointerMove, { passive: false });
                document.addEventListener('mouseup', onPointerUp);
                document.addEventListener('touchend', onPointerUp);
                logo.addEventListener('click', (e) => {
                    if (isMinimized) { setMinimized(false); if (!introDone) introduce(); } else if (!introDone)
                        introduce();
                    e.stopPropagation();
                });

                // ─── Minimize / Close ──────────────────────────────────
                function setMinimized(min) {
                    isMinimized = min;
                    app.classList.toggle('minimized', min);
                    if (min) {
                        minimizeBtn.innerHTML =
                            `<svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>`;
                        stopVAD();
                    } else {
                        minimizeBtn.innerHTML =
                            `<svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>`;
                        if (voiceActive && conversationActive) startVAD();
                        if (!musicPlaying) chatInput.focus();
                    }
                }
                minimizeBtn.addEventListener('click', (e) => { e.stopPropagation();
                    setMinimized(!isMinimized); });
                closeBtn.addEventListener('click', (e) => { e.stopPropagation();
                    setMinimized(true); });

                // ─── Intro ──────────────────────────────────────────────
                async function introduce() {
                    if (introDone) return;
                    introDone = true;
                    const introText =
                        "Hey there! I'm RAGina, your personal mentalist. I can chat, answer questions, and even play music. What's your name?";
                    addMessage('bot', introText);
                    awaitingName = true;
                    conversationActive = true;
                    if (voiceActive) {
                        await speakText(introText);
                        if (!isMinimized) startVAD();
                    }
                }

                // ─── AI helpers ──────────────────────────────────────
                function waitForEngine(timeoutMs) {
                    return new Promise(resolve => {
                        const start = Date.now();
                        (function poll() {
                            if (window.RAGina && window.RAGina.getEngine) {
                                try { resolve(window.RAGina.getEngine()); return; } catch (e) {}
                            }
                            if (Date.now() - start > timeoutMs) { resolve(null); return; }
                            setTimeout(poll, 200);
                        })();
                    });
                }
                async function loadName() { try { return localStorage.getItem('ragina_user_name'); } catch (e) { return null; } }
                async function saveName(name) { try { localStorage.setItem('ragina_user_name', name); } catch (e) {} }

                function extractName(raw) {
                    const text = raw.trim();
                    const m = text.match(/(?:my name is|i am|i'm|im|call me|it's|its)\s+([a-z][a-z '-]{0,24})/i);
                    const word = m && m[1] ? m[1].trim().split(/\s+/)[0] : (text.split(/\s+/)[0] || text);
                    const clean = word.replace(/[^a-zA-Z'-]/g, '');
                    return clean ? clean.charAt(0).toUpperCase() + clean.slice(1).toLowerCase() : 'friend';
                }

                // ─── Core sendMessage ──────────────────────────────────
                async function sendMessage(rawText) {
                    const text = (rawText || '').trim();
                    if (!text) return;
                    chatInput.value = '';
                    const selected = getSelectedText();

                    if (awaitingName) {
                        awaitingName = false;
                        userName = extractName(text);
                        await saveName(userName);
                        addMessage('user', text);
                        const greet = `Nice to meet you, ${userName}! What can I help you with today?`;
                        history.push({ role: 'user', text }, { role: 'bot', text: greet });
                        addMessage('bot', greet);
                        if (voiceActive) await speakText(greet);
                        if (!musicPlaying && !currentAudio && !ttsLoading) setTimeout(startListening, 500);
                        return;
                    }
                    if (selected) addMessage('system', `📝 Selected: "${selected}"`);
                    if (handleMusicCommandFast(text)) { addMessage('user', text); return; }

                    const aiCommand = await parseMusicCommandWithAI(text);
                    if (aiCommand.action && aiCommand.action !== 'none') {
                        const executed = executeMusicAction(aiCommand.action, aiCommand.song);
                        if (executed) { addMessage('user', text); return; }
                    }

                    addMessage('user', text);
                    history.push({ role: 'user', text });
                    if (history.length > 16) history = history.slice(-16);

                    llmAbortController = new AbortController();
                    showTyping();
                    if (voiceActive) setLiveTranscript('Thinking…');
                    try {
                        const answer = await getAIAnswer(text, selected, llmAbortController.signal);
                        hideTyping();
                        setLiveTranscript('');
                        addMessage('bot', answer);
                        history.push({ role: 'bot', text: answer });
                        if (voiceActive && !musicPlaying) {
                            await speakText(answer);
                        } else {
                            if (conversationActive && !musicPlaying) setTimeout(startListening, 500);
                        }
                    } catch (err) {
                        if (err.name === 'AbortError') {
                            console.log('LLM fetch aborted (barge‑in)');
                        } else {
                            hideTyping();
                            setLiveTranscript('');
                            addMessage('bot',
                            "I'm having trouble connecting. Could you try again?");
                            console.error('sendMessage error:', err);
                        }
                    } finally {
                        llmAbortController = null;
                    }
                }

                // ─── TTS ────────────────────────────────────────────────
                async function speakText(text) {
                    if (!voiceActive || !text) return;
                    const cleanText = text.replace(/[\u{1F300}-\u{1F9FF}]/gu, '').replace(/[\u{2600}-\u{26FF}]/gu, '')
                        .trim();
                    if (!cleanText) return;

                    if (ttsAbortController) {
                        ttsAbortController.abort();
                        ttsAbortController = null;
                    }
                    stopAudio();
                    isSpeaking = true;
                    ttsAbortController = new AbortController();

                    try {
                        const res = await fetch(VOICE_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ text: cleanText, language: 'en-US', voice_id: VOICE_ID,
                                speed: VOICE_SPEED }),
                            signal: ttsAbortController.signal,
                        });
                        if (!res.ok) throw new Error(`TTS ${res.status}`);
                        const blob = await res.blob();
                        const audioUrl = URL.createObjectURL(blob);
                        currentAudio = new Audio(audioUrl);
                        currentAudio.addEventListener('ended', () => {
                            currentAudio = null;
                            isSpeaking = false;
                            ttsAbortController = null;
                            if (conversationActive && !musicPlaying && !vad) {
                                if (!vad) setTimeout(startListening, 500);
                            }
                        });
                        currentAudio.addEventListener('error', () => {
                            currentAudio = null;
                            isSpeaking = false;
                            ttsAbortController = null;
                            if (conversationActive && !musicPlaying && !vad) setTimeout(startListening, 500);
                        });
                        currentAudio.play();
                    } catch (err) {
                        if (err.name === 'AbortError') {
                            console.log('TTS aborted (barge‑in)');
                        } else {
                            console.warn('Voice failed:', err.message);
                        }
                        isSpeaking = false;
                        ttsAbortController = null;
                    }
                }

                function stopAudio() {
                    if (currentAudio) {
                        currentAudio.pause();
                        currentAudio.currentTime = 0;
                        currentAudio.onended = null;
                        currentAudio.onerror = null;
                        currentAudio = null;
                    }
                    if (ttsAbortController) {
                        ttsAbortController.abort();
                        ttsAbortController = null;
                    }
                    ttsLoading = false;
                    isSpeaking = false;
                }

                // ─── VAD Handlers ──────────────────────────────────────
                function handleBargeIn() {
                    if (!voiceActive || !conversationActive || isMinimized) return;
                    if (isSpeaking || ttsAbortController || llmAbortController) {
                        console.log('🔊 Barge‑in – interrupting...');
                        stopAudio();
                        if (llmAbortController) {
                            llmAbortController.abort();
                            llmAbortController = null;
                        }
                        if (silenceTimer) {
                            clearTimeout(silenceTimer);
                            silenceTimer = null;
                        }
                        isSpeaking = false;
                    }
                }

                function handleSpeechEnd(audioBuffer) {
                    // Not used for transcription yet (we use webkitSpeechRecognition)
                    console.log('VAD speech end – not used for transcription.');
                }

                // ─── VAD Lifecycle ──────────────────────────────────────
                async function startVAD() {
                    if (vad) return;
                    if (typeof MicVAD === 'undefined') {
                        console.warn('VAD library not loaded – barge‑in disabled.');
                        return;
                    }
                    try {
                        micStream = await navigator.mediaDevices.getUserMedia({
                            audio: {
                                echoCancellation: true,
                                noiseSuppression: true,
                                autoGainControl: true,
                            }
                        });
                        audioContext = new(window.AudioContext || window.webkitAudioContext)();
                        vad = await MicVAD.new({
                            ...VAD_CONFIG,
                            stream: micStream,
                        });
                        vad.start();
                        console.log('✅ VAD started');
                    } catch (e) {
                        console.warn('VAD init failed:', e);
                        vad = null;
                        if (micStream) {
                            micStream.getTracks().forEach(t => t.stop());
                            micStream = null;
                        }
                        if (audioContext && audioContext.state !== 'closed') {
                            try { audioContext.close(); } catch (e) {}
                            audioContext = null;
                        }
                    }
                }

                function stopVAD() {
                    if (vad) {
                        try { vad.stop(); } catch (e) {}
                        vad = null;
                    }
                    if (micStream) {
                        micStream.getTracks().forEach(t => t.stop());
                        micStream = null;
                    }
                    if (audioContext && audioContext.state !== 'closed') {
                        try { audioContext.close(); } catch (e) {}
                        audioContext = null;
                    }
                }

                // ─── Mic ────────────────────────────────────────────────
                function startListening() {
                    if (!voiceActive || !SpeechRecognition) return;
                    if (currentAudio) return;
                    if (ttsLoading) return;
                    if (musicPlaying) return;
                    if (isMinimized) return;

                    if (recognition) {
                        try { recognition.stop(); } catch (e) {}
                        recognition = null;
                    }

                    recognition = new SpeechRecognition();
                    recognition.continuous = false;
                    recognition.interimResults = true;
                    recognition.lang = 'en-US';

                    let finalTranscript = '';

                    recognition.addEventListener('result', (e) => {
                        let interim = '';
                        for (let i = e.resultIndex; i < e.results.length; i++) {
                            const r = e.results[i];
                            if (r.isFinal) {
                                finalTranscript += r[0].transcript;
                            } else {
                                interim += r[0].transcript;
                            }
                        }
                        chatInput.value = finalTranscript + interim;
                        setLiveTranscript(interim || finalTranscript, !!interim);
                    });

                    recognition.addEventListener('end', () => {
                        micOrb.classList.remove('listening');
                        const text = finalTranscript.trim();
                        finalTranscript = '';
                        recognition = null;
                        setLiveTranscript('');

                        if (text) {
                            chatInput.value = text;
                            sendMessage(text);
                        } else {
                            if (wasPlayingBeforeMic && currentVideoId) {
                                wasPlayingBeforeMic = false;
                                resumeSong();
                            }
                        }
                    });

                    recognition.addEventListener('error', (e) => {
                        micOrb.classList.remove('listening');
                        setLiveTranscript('');
                        recognition = null;
                        if (e.error === 'not-allowed') {
                            setLiveTranscript('Mic denied');
                            setTimeout(() => setLiveTranscript(''), 4000);
                        }
                        if (wasPlayingBeforeMic && currentVideoId) {
                            wasPlayingBeforeMic = false;
                            resumeSong();
                        }
                    });

                    try {
                        recognition.start();
                        micOrb.classList.add('listening');
                        setLiveTranscript('🎤 Listening…', true);
                    } catch (e) {
                        recognition = null;
                    }
                }

                function stopListening() {
                    if (recognition) {
                        try { recognition.stop(); } catch (e) {}
                        recognition = null;
                    }
                    micOrb.classList.remove('listening');
                    setLiveTranscript('');
                    if (wasPlayingBeforeMic && currentVideoId) {
                        wasPlayingBeforeMic = false;
                        resumeSong();
                    }
                }

                micOrb.addEventListener('click', () => {
                    if (!voiceActive) return;
                    if (currentAudio) {
                        stopAudio();
                        if (musicPlaying) { wasPlayingBeforeMic = true;
                            pauseSong(); }
                        if (!conversationActive) conversationActive = true;
                        setTimeout(startListening, 100);
                        return;
                    }
                    if (micOrb.classList.contains('listening')) {
                        stopListening();
                        return;
                    }
                    if (musicPlaying) { wasPlayingBeforeMic = true;
                        pauseSong(); }
                    if (!conversationActive) conversationActive = true;
                    startListening();
                });

                voiceToggleBtn.addEventListener('click', () => {
                    voiceActive = !voiceActive;
                    if (voiceActive) {
                        voiceToggleBtn.innerHTML =
                            `<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>`;
                        voiceToggleBtn.classList.remove('voice-off');
                        if (!isMinimized && conversationActive) startVAD();
                    } else {
                        voiceToggleBtn.innerHTML =
                            `<svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>`;
                        voiceToggleBtn.classList.add('voice-off');
                        stopListening();
                        stopSong();
                        stopAudio();
                        stopVAD();
                    }
                });

                sendBtn.addEventListener('click', () => sendMessage(chatInput.value));
                chatInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') sendMessage(chatInput.value);
                });

                // ─── Export / Import / Clear ──────────────────────────
                saveChatBtn.addEventListener('click', () => {
                    const data = JSON.stringify(messageHistory, null, 2);
                    const blob = new Blob([data], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `ragina-chat-${new Date().toISOString().slice(0,10)}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                    chatStatus.textContent = 'Exported ✓';
                    chatStatus.style.color = '#6C63FF';
                    setTimeout(() => { chatStatus.textContent = 'Auto‑saved';
                        chatStatus.style.color = '#666'; }, 3000);
                });
                loadChatBtn.addEventListener('click', () => fileInput.click());
                fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        try {
                            const data = JSON.parse(ev.target.result);
                            if (Array.isArray(data)) {
                                messageHistory = data;
                                renderMessages(data);
                                saveToIndexedDB(data);
                                chatStatus.textContent = `Loaded ${data.length} messages`;
                                chatStatus.style.color = '#6C63FF';
                                const nameMsg = data.find(m => m.role === 'system' && m.text.includes(
                                'Welcome back'));
                                if (nameMsg) {
                                    const match = nameMsg.text.match(/Welcome back, ([^!]+)/);
                                    if (match) {
                                        userName = match[1];
                                        try { localStorage.setItem('ragina_user_name', userName); } catch (e) {}
                                    }
                                }
                                history = data.filter(m => m.role === 'user' || m.role === 'bot')
                                    .map(m => ({ role: m.role, text: m.text }));
                                introDone = true;
                                conversationActive = true;
                                if (userName) {
                                    setTimeout(() => {
                                        if (voiceActive && !musicPlaying && !currentAudio && !ttsLoading) {
                                            startListening();
                                        }
                                    }, 1000);
                                }
                            } else {
                                throw new Error('Invalid format');
                            }
                        } catch (err) {
                            alert('Failed to load chat file.');
                            console.error(err);
                        }
                    };
                    reader.readAsText(file);
                    fileInput.value = '';
                });
                clearChatBtn.addEventListener('click', async () => {
                    if (confirm('Clear all chat history?')) {
                        messageHistory = [];
                        messages.innerHTML = '';
                        history = [];
                        userName = null;
                        introDone = false;
                        conversationActive = false;
                        awaitingName = false;
                        try { localStorage.removeItem('ragina_user_name'); } catch (e) {}
                        await clearIndexedDB();
                        chatStatus.textContent = 'Cleared';
                        chatStatus.style.color = '#FF6584';
                        setTimeout(() => { chatStatus.textContent = 'Auto‑saved';
                            chatStatus.style.color = '#666'; }, 3000);
                    }
                });

                // ─── Typing / transcript ──────────────────────────────
                function setLiveTranscript(text, interim = false) {
                    liveTranscript.textContent = text || '';
                    liveTranscript.classList.toggle('interim', interim);
                }
                let typingEl = null;

                function showTyping() {
                    typingEl = document.createElement('div');
                    typingEl.className = 'typing-dots';
                    typingEl.innerHTML = '<span></span><span></span><span></span>';
                    messages.appendChild(typingEl);
                    messages.scrollTop = messages.scrollHeight;
                }

                function hideTyping() {
                    if (typingEl) { typingEl.remove();
                        typingEl = null; }
                }

                // ─── Boot ──────────────────────────────────────────────
                (async function init() {
                    // Load YouTube API if not present
                    if (!window.YT || !window.YT.Player) {
                        const script = document.createElement('script');
                        script.src = 'https://www.youtube.com/iframe_api';
                        script.async = true;
                        document.head.appendChild(script);
                        await new Promise(resolve => {
                            const check = () => {
                                if (window.YT && window.YT.Player) resolve();
                                else setTimeout(check, 200);
                            };
                            check();
                        });
                    }
                    initYouTubePlayer();

                    engine = await waitForEngine(5000);

                    const hasHistory = await restoreChat();
                    if (!hasHistory) {

                // ─── Expose YouTube callback ──────────────────────────
                window.onYouTubeIframeAPIReady = function() {
                    if (!youtubePlayer && window.YT && window.YT.Player) {
                        initYouTubePlayer();
                    }
                };
            }

            // ─── Execute ──────────────────────────────────────────────────
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => {
                    injectApp();
                    initApp();
                });
            } else {
                injectApp();
                initApp();
            }

        })();
    </script>

    <script>
        (function(global) {
            'use strict';

            // ============================================================
            //  CONSTANTS
            // ============================================================
            const RAGINA_NUMBER = '0000000000'; // kept for compatibility

            // ============================================================
            //  STATE
            // ============================================================
            let peer = null,
                myId = null,
                localStream = null,
                activeCalls = [],
                inCall = false;
            let muted = false,
                speakerOn = false,
                videoEnabled = false,
                incomingCall = null;
            let currentTab = 'chats',
                timerInterval = null,
                timerSeconds = 0;
            let transcriptEnabled = true,
                aiSummaryEnabled = true,
                videoDefault = false,
                reactionsEnabled = true;
            let ttsVoices = [],
                speechUnlocked = false;
            let currentLog = null,
                lastLog = null,
                isLightMode = false;
            let callRecorder = null,

                isRecording = false;

                typingTimeouts = {};

            // ============================================================

            // ============================================================
            const $ = id => document.getElementById(id);
            const showToast = msg => {

                t.classList.add('show');
                clearTimeout(t._hide);

            };
            global.showToast = showToast;

            function vibrate(p) {
                if (navigator.vibrate) try { navigator.vibrate(p); } catch (e) {}
            }

            function unlockSpeech() {
                if (!window.speechSynthesis || speechUnlocked) return;
                const u = new SpeechSynthesisUtterance(' ');
                u.volume = 0;
                u.onend = () => speechUnlocked = true;
                window.speechSynthesis.speak(u);
                setTimeout(() => speechUnlocked = true, 400);
            }

            // ============================================================
            //  STORAGE HELPERS
            // ============================================================
            const getContacts = () => {
                try { return JSON.parse(localStorage.getItem('premCallContacts')) || []; } catch (e) { return []; }
            };
            const saveContacts = c => localStorage.setItem('premCallContacts', JSON.stringify(c));
            const getMessages = () => {
                try { return JSON.parse(localStorage.getItem('premCallMessages')) || {}; } catch (e) { return {}; }
            };
            const saveMessages = m => localStorage.setItem('premCallMessages', JSON.stringify(m));
            const getLogs = () => {
                try { return JSON.parse(localStorage.getItem('premCallLogs')) || []; } catch (e) { return []; }
            };
            const saveLogs = l => localStorage.setItem('premCallLogs', JSON.stringify(l));
            const getHistory = () => {
                try { return JSON.parse(localStorage.getItem('premCallHistory')) || []; } catch (e) { return []; }
            };
            const saveHistory = h => localStorage.setItem('premCallHistory', JSON.stringify(h));
            const getBlocked = () => {
                try { return JSON.parse(localStorage.getItem('premCallBlocked')) || []; } catch (e) { return []; }
            };
            const saveBlocked = b => localStorage.setItem('premCallBlocked', JSON.stringify(b));

            // ============================================================
            //  UTILITY FUNCTIONS
            // ============================================================
            function resolveName(num) {
                const c = getContacts().find(x => x.number === num);
                return c ? c.name : (num === RAGINA_NUMBER ? 'RAGina AI' : num);
            }

            function initials(label) {
                if (!label) return '👤';
                if (/^[\d+\s-]+$/.test(label)) return label.replace(/\D/g, '').slice(-2) || '👤';
                return label.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
            }

            function timeAgo(ts) {
                const diff = Date.now() - ts;
                const mins = Math.floor(diff / 60000);
                if (mins < 1) return 'now';
                if (mins < 60) return mins + 'm';
                const hrs = Math.floor(mins / 60);
                if (hrs < 24) return hrs + 'h';
                const days = Math.floor(hrs / 24);
                if (days < 7) return days + 'd';
                return new Date(ts).toLocaleDateString();
            }

            function generateId() {
                return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
            }

            function getMyNumber() {
                return localStorage.getItem('premCallNumber') || null;
            }

            function isBlocked(num) {
                return getBlocked().includes(num);
            }

            function getUnreadCount() {
                const msgs = getMessages();
                let total = 0;
                Object.keys(msgs).forEach(k => {
                    msgs[k].forEach(m => { if (!m.read && m.sender !== 'me') total++; });
                });
                return total;
            }

            // ============================================================
            //  RENDER FUNCTIONS
            // ============================================================
            function switchTab(tab) {
                currentTab = tab;
                document.querySelectorAll('.tab-view').forEach(el => el.classList.remove('active'));
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                const target = $('tab' + tab.charAt(0).toUpperCase() + tab.slice(1));
                if (target) target.classList.add('active');
                const navBtn = document.querySelector('.nav-item[data-tab="' + tab + '"]');
                if (navBtn) navBtn.classList.add('active');
                if (tab === 'chats') renderChats();
                if (tab === 'calls') renderCalls();
                if (tab === 'contacts') renderContacts();
                if (tab === 'settings') syncSettings();
                vibrate(5);
            }

            function renderChats() {
                const msgs = getMessages();
                const contacts = getContacts();
                const list = $('chatList');
                const pinned = $('pinnedChats');
                list.innerHTML = '';
                pinned.innerHTML = '';
                const convos = [];
                const blocked = getBlocked();

                Object.keys(msgs).forEach(num => {
                    if (blocked.includes(num)) return;
                    const arr = msgs[num];
                    if (arr && arr.length) {
                        convos.push({
                            number: num,
                            lastMsg: arr[arr.length - 1],
                            unread: arr.filter(m => !m.read && m.sender !== 'me').length
                        });
                    }
                });
                contacts.forEach(c => {
                    if (blocked.includes(c.number)) return;
                    if (!convos.find(x => x.number === c.number)) {
                        convos.push({ number: c.number, lastMsg: null, unread: 0 });
                    }
                });
                // Keep RAGina in chat list for message history
                if (!blocked.includes(RAGINA_NUMBER) && !convos.find(x => x.number === RAGINA_NUMBER)) {
                    convos.push({ number: RAGINA_NUMBER, lastMsg: null, unread: 0 });
                }

                convos.sort((a, b) => {
                    const ta = a.lastMsg ? a.lastMsg.time : 0;
                    const tb = b.lastMsg ? b.lastMsg.time : 0;
                    return tb - ta;
                });

                if (convos.length === 0) {
                    $('chatsEmpty').style.display = 'block';
                    return;
                }
                $('chatsEmpty').style.display = 'none';

                convos.forEach((c, idx) => {
                    const el = document.createElement('div');
                    el.className = 'chat-item';
                    el.dataset.number = c.number;
                    const name = resolveName(c.number);
                    const isOnline = c.number === RAGINA_NUMBER;
                    const preview = c.lastMsg ?
                        (c.lastMsg.type === 'text' ? c.lastMsg.text :
                            c.lastMsg.type === 'image' ? '📷 Photo' :
                            c.lastMsg.type === 'voice' ? '🎤 Voice message' : '📎 File') :
                        'Tap to start chatting';
                    const time = c.lastMsg ? timeAgo(c.lastMsg.time) : '';
                    el.innerHTML = `
                        <div class="chat-avatar">${initials(name)}${isOnline ? '<div class="online-dot"></div>' : ''}</div>
                        <div class="chat-body">
                            <div class="chat-top"><span class="chat-name">${name}</span><span class="chat-time">${time}</span></div>
                            <div class="chat-preview">${c.number === RAGINA_NUMBER ? '<i class="fas fa-robot"></i> ' : ''}${preview}</div>
                        </div>
                        <div class="chat-meta">
                            ${c.unread > 0 ? `<span class="unread-badge">${c.unread}</span>` : ''}
                            ${activeTyping[c.number] ? '<div class="typing-dots"><span></span><span></span><span></span></div>' : ''}
                        </div>
                        <div class="chat-actions">
                            <button class="call-btn" data-num="${c.number}" title="Call"><i class="fas fa-phone"></i></button>
                            <button class="video-btn" data-num="${c.number}" title="Video" data-video="1"><i class="fas fa-video"></i></button>
                            <button class="danger del-btn" data-num="${c.number}" title="Delete chat"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                    if (idx < 2) pinned.appendChild(el);
                    else list.appendChild(el);
                });

                const totalUnread = getUnreadCount();
                const badge = $('chatBadge');
                if (totalUnread > 0) {
                    badge.textContent = totalUnread;
                    badge.style.display = 'flex';
                } else badge.style.display = 'none';
            }

            function renderCalls() {
                const h = getHistory();
                const list = $('callsList');
                list.innerHTML = '';
                if (!h.length) {
                    $('callsEmpty').style.display = 'block';
                    return;
                }
                $('callsEmpty').style.display = 'none';
                h.forEach(en => {
                    const el = document.createElement('div');

                    const cls = en.direction === 'incoming' ? 'incoming' :

                    const name = resolveName(en.number);
                    el.innerHTML = `
                        <div class="call-icon ${cls}"><i class="fas ${icon}"></i></div>
                        <div class="call-body">
                            <div class="call-name">${name}</div>
                            <div class="call-info"><i class="fas fa-clock"></i> ${en.duration || '—'} · ${timeAgo(en.timestamp)}</div>
                        </div>
                        <div class="call-actions">
                            <button class="call-back" data-num="${en.number}" title="Call back"><i class="fas fa-phone"></i></button>
                            <button class="video-back" data-num="${en.number}" data-video="1" title="Video call"><i class="fas fa-video"></i></button>
                        </div>

                    list.appendChild(el);

            }

            function renderContacts() {
                const c = getContacts();
                const list = $('contactsList');
                list.innerHTML = '';
                const search = ($('contactsSearch')?.value || '').trim().toLowerCase();
                const filtered = search ? c.filter(x =>
                    x.name.toLowerCase().includes(search) ||
                    x.number.includes(search)

                const blocked = getBlocked();
                const visible = filtered.filter(x => !blocked.includes(x.number));
                if (!visible.length) {
                    $('contactsEmpty').style.display = 'block';

                $('contactsEmpty').style.display = 'none';

                    const el = document.createElement('div');

            function syncSettings() {
                const num = localStorage.getItem('premCallNumber');
                const verified = localStorage.getItem('premCallVerified') === 'true';

                    $('settingsName').textContent = 'User ' + num.slice(-4);

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>premCall - Your Phone Number</title>

    <!-- PeerJS SDK from CDN -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e1a;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            padding: 1.5rem 1rem 3rem;
            min-height: 100vh;
        }
        .container { max-width: 600px; width: 100%; }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.25rem;
        }
        .logo-svg { width: 36px; height: 36px; display: inline-block; }
        .subhead { color: #8892b0; margin-bottom: 1.5rem; font-size: 0.95rem; }

        .card {
            background: #141b2b;
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #23304a;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .number-display {
            background: #0f1629;
            border: 2px solid #4f8cf7;
            border-radius: 16px;
            padding: 1rem 1.5rem;
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            color: #4f8cf7;
            letter-spacing: 2px;
            margin: 0.5rem 0 1rem;
        }

        input, textarea {
            width: 100%;
            padding: 0.75rem;
            background: #0f1629;
            border: 1px solid #2a3a5a;
            border-radius: 12px;
            color: #b0c7e0;
            font-size: 1rem;
            transition: border 0.2s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #4f8cf7;
        }
        input { margin-bottom: 0.5rem; }

        .flex-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.6rem;
            margin: 0.5rem 0 0.8rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            background: #2a3a5a;
            color: #e2e8f0;
            min-width: 100px;
        }
        .btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }
        .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(0.6);
        }

        .btn-green { background: #1a7a4a; color: #fff; }
        .btn-green:hover:not(:disabled) { background: #1f9b5e; }
        .btn-blue { background: #1a4a8a; color: #fff; }
        .btn-blue:hover:not(:disabled) { background: #2563d6; }
        .btn-red { background: #8a1a2a; color: #fff; }
        .btn-red:hover:not(:disabled) { background: #b52238; }
        .btn-yellow { background: #a67c1a; color: #fff; }
        .btn-yellow:hover:not(:disabled) { background: #ca9a2a; }

        .status {
            padding: 0.5rem 0.8rem;
            border-radius: 40px;
            background: #1a2338;
            font-size: 0.85rem;
            color: #94a3b8;
            margin: 0.5rem 0;
            display: inline-block;
        }
        .status-success { color: #4ade80; }
        .status-error { color: #f87171; }
        .status-warning { color: #fbbf24; }

        .call-status {
            padding: 1rem;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            margin: 0.5rem 0;
        }
        .call-status.ringing { background: #a67c1a33; color: #fbbf24; }
        .call-status.connected { background: #1a7a4a33; color: #4ade80; }
        .call-status.idle { background: #1a2338; color: #94a3b8; }
        .call-status.error { background: #8a1a2a33; color: #f87171; }

        .hidden { display: none !important; }

        @media (max-width: 480px) {
            .btn { min-width: 70px; padding: 0.5rem 1rem; font-size: 0.8rem; }
            .flex-row { gap: 0.4rem; }
            .number-display { font-size: 1.5rem; padding: 0.75rem 1rem; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- ─── HEADER ─── -->
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>
            <svg class="logo-svg" viewBox="0 0 24 24" fill="none" stroke="#4f8cf7" stroke-width="2">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
            premCall
        </h1>
        <span class="status" id="peerStatus">offline</span>
    </div>
    <p class="subhead">Peer-to-peer audio calls. Your browser is your phone.</p>

    <!-- ─── YOUR PHONE NUMBER ─── -->
    <div class="card">
        <div class="card-title">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2">
                <rect x="5" y="2" width="14" height="20" rx="2" />
                <line x1="12" y1="18" x2="12.01" y2="18" />
            </svg>
            Your Number
        </div>
        <div class="number-display" id="myNumberDisplay">---</div>
        <div class="flex-row">
            <button class="btn btn-green" id="generateBtn">
                <svg viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 0 0 4.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 0 1-15.357-2m15.357 2H15"/></svg>
                Generate New Number
            </button>
            <button class="btn btn-blue" id="copyNumberBtn">
                <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                Copy Number
            </button>
        </div>
        <div class="status" id="numberStatus">Click "Generate" to claim your number.</div>
    </div>

    <!-- ─── DIALER ─── -->
    <div class="card">
        <div class="card-title">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2">
                <polyline points="22 16.92 22 19.92 19.82 19.92" />
                <path d="M4.11 2.08L7.11 2.08C7.87 2.08 8.51 2.65 8.6 3.4C8.73 4.36 8.96 5.3 9.3 6.21C9.49 6.69 9.34 7.24 8.89 7.69L7.62 8.96C10.62 14.46 15.54 15.38 15.54 15.38L16.81 14.11C17.26 13.66 17.81 13.51 18.29 13.7C19.2 14.04 20.14 14.27 21.1 14.4C21.85 14.49 22.42 15.13 22.42 15.89L22.42 18.89C22.42 19.72 21.76 20.38 20.93 20.38C12.31 20.38 3.62 11.69 3.62 3.07C3.62 2.24 4.28 1.58 5.11 1.58L4.11 2.08Z" />
            </svg>
            Dialer
        </div>
        <input type="text" id="dialInput" placeholder="Enter number to call (e.g. 12345)" />
        <div class="flex-row">
            <button class="btn btn-green" id="callBtn">
                <svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                Call
            </button>
            <button class="btn btn-red hidden" id="hangupBtn">
                <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                Hang Up
            </button>
        </div>
        <div class="call-status idle" id="callStatusDisplay">📴 Idle</div>
        <div class="status" id="callStatus">Ready to call.</div>
    </div>

    <!-- ─── INCOMING CALL (hidden until someone calls you) ─── -->
    <div class="card hidden" id="incomingCard" style="border-color: #fbbf24;">
        <div class="card-title" style="color: #fbbf24;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            </svg>
            📞 Incoming Call
        </div>
        <p style="font-size: 1.2rem; margin-bottom: 0.5rem;">From: <strong id="callerIdDisplay">Unknown</strong></p>
        <div class="flex-row">
            <button class="btn btn-green" id="answerBtn">
                <svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                Answer
            </button>
            <button class="btn btn-red" id="rejectBtn">
                <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                Reject
            </button>
        </div>
    </div>

    <!-- ─── CALL CONTROLS (in-call) ─── -->
    <div class="card hidden" id="callControls">
        <div class="card-title">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2">
                <circle cx="12" cy="12" r="2"/><path d="M12 2v4"/><path d="M12 18v4"/><path d="M4.93 4.93l2.83 2.83"/><path d="M16.24 16.24l2.83 2.83"/><path d="M2 12h4"/><path d="M18 12h4"/><path d="M4.93 19.07l2.83-2.83"/><path d="M16.24 7.76l2.83-2.83"/>
            </svg>
            In Call
        </div>
        <p style="color: #94a3b8; margin-bottom: 0.5rem;">Connected to: <strong id="remotePeerDisplay">---</strong></p>
        <div class="flex-row">
            <button class="btn btn-yellow" id="muteBtn">
                <svg viewBox="0 0 24 24"><polyline points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M23 7l-4 5m0-5l4 5"/></svg>
                Mute
            </button>
            <button class="btn btn-red" id="endCallBtn">
                <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                End Call
            </button>
        </div>
    </div>

    <p style="font-size:0.75rem; color:#4a5a7a; text-align:center; margin-top:1rem;">
        Powered by WebRTC &amp; PeerJS. Audio flows directly between browsers.
    </p>
</div>

<script>
    (function() {
        "use strict";

        // ─── DOM refs ───
        const myNumberDisplay = document.getElementById('myNumberDisplay');
        const generateBtn = document.getElementById('generateBtn');
        const copyNumberBtn = document.getElementById('copyNumberBtn');
        const numberStatus = document.getElementById('numberStatus');
        const peerStatus = document.getElementById('peerStatus');
        const dialInput = document.getElementById('dialInput');
        const callBtn = document.getElementById('callBtn');
        const hangupBtn = document.getElementById('hangupBtn');
        const callStatusDisplay = document.getElementById('callStatusDisplay');
        const callStatus = document.getElementById('callStatus');
        const incomingCard = document.getElementById('incomingCard');
        const callerIdDisplay = document.getElementById('callerIdDisplay');
        const answerBtn = document.getElementById('answerBtn');
        const rejectBtn = document.getElementById('rejectBtn');
        const callControls = document.getElementById('callControls');
        const remotePeerDisplay = document.getElementById('remotePeerDisplay');
        const muteBtn = document.getElementById('muteBtn');
        const endCallBtn = document.getElementById('endCallBtn');

        // ─── State ───
        let myNumber = localStorage.getItem('premCallNumber') || null;
        let peer = null;           // PeerJS instance
        let currentCall = null;    // PeerJS MediaConnection
        let localStream = null;
        let remoteStream = null;
        let isMuted = false;
        let isInCall = false;
        let isCaller = false;
        let incomingCall = null;   // Stored incoming call for answering

        // ─── Helper: Status updates ───
        function setStatus(el, text, type) {
            el.textContent = text;
            el.className = 'status';
            if (type) el.classList.add('status-' + type);
        }

        function setCallStatus(text, type) {
            callStatusDisplay.textContent = text;
            callStatusDisplay.className = 'call-status ' + (type || 'idle');
        }

        // ─── Generate a random 5-8 digit number ───
        function generateNumber() {
            const length = 5 + Math.floor(Math.random() * 4); // 5-8 digits
            let num = '';
            for (let i = 0; i < length; i++) {
                num += Math.floor(Math.random() * 10);
            }
            return num;
        }

        // ─── Initialize PeerJS ───
        function initPeer() {
            if (peer) {
                peer.destroy();
                peer = null;
            }

            // Use the phone number as the Peer ID
            const id = myNumber;
            if (!id) {
                setStatus(peerStatus, 'no number set', 'error');
                return;
            }

            // Connect to PeerJS cloud server (free, public)
            // Using 'peerjs.com' as the default cloud server
            peer = new Peer(id, {
                debug: 2,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', () => {
                setStatus(peerStatus, 'online (peerjs)', 'success');
                setStatus(numberStatus, 'Number registered! You can receive calls.', 'success');
                console.log('✅ PeerJS online with ID:', id);
            });

            peer.on('error', (err) => {
                console.error('PeerJS error:', err);
                setStatus(peerStatus, 'error: ' + err.type, 'error');
                // If the ID is taken, generate a new one
                if (err.type === 'unavailable-id') {
                    setStatus(numberStatus, '⚠️ Number already taken. Generate a new one.', 'error');
                }
            });

            peer.on('connection', (conn) => {
                console.log('🔗 Incoming data connection from:', conn.peer);
            });

            peer.on('call', (call) => {
                // Incoming call!
                console.log('📞 Incoming call from:', call.peer);
                incomingCall = call;
                callerIdDisplay.textContent = call.peer;
                incomingCard.classList.remove('hidden');
                setCallStatus('📞 Incoming call from ' + call.peer, 'ringing');
                setStatus(callStatus, 'Incoming call...', 'warning');
                // Play a ringtone? We'll use a simple beep via Web Audio
                playRingtone();
            });

            peer.on('close', () => {
                setStatus(peerStatus, 'offline', 'error');
                console.log('PeerJS closed');
            });

            peer.on('disconnected', () => {
                setStatus(peerStatus, 'disconnected', 'error');
                console.log('PeerJS disconnected');
                // Try to reconnect
                setTimeout(() => { if (peer) peer.reconnect(); }, 3000);
            });
        }

        // ─── Simple ringtone using Web Audio ───
        let ringtoneContext = null;
        let ringtoneOscillator = null;

        function playRingtone() {
            try {
                if (!ringtoneContext) {
                    ringtoneContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                // Stop any existing ringtone
                if (ringtoneOscillator) {
                    ringtoneOscillator.stop();
                    ringtoneOscillator = null;
                }

                const osc = ringtoneContext.createOscillator();
                const gain = ringtoneContext.createGain();
                osc.connect(gain);
                gain.connect(ringtoneContext.destination);
                osc.frequency.value = 440;
                gain.gain.value = 0.2;
                osc.type = 'sine';
                osc.start();
                // Create a simple beep pattern
                let count = 0;
                const interval = setInterval(() => {
                    if (count >= 6 || !incomingCard || incomingCard.classList.contains('hidden')) {
                        clearInterval(interval);
                        if (ringtoneOscillator) {
                            ringtoneOscillator.stop();
                            ringtoneOscillator = null;
                        }
                        return;
                    }
                    if (ringtoneOscillator) {
                        ringtoneOscillator.stop();
                        ringtoneOscillator = null;
                    }
                    const newOsc = ringtoneContext.createOscillator();
                    const newGain = ringtoneContext.createGain();
                    newOsc.connect(newGain);
                    newGain.connect(ringtoneContext.destination);
                    newOsc.frequency.value = count % 2 === 0 ? 440 : 330;
                    newGain.gain.value = 0.15;
                    newOsc.type = 'sine';
                    newOsc.start();
                    newOsc.stop(ringtoneContext.currentTime + 0.3);
                    ringtoneOscillator = newOsc;
                    count++;
                }, 400);
                // Store interval to clear later
                window._ringtoneInterval = interval;
            } catch (e) {
                console.warn('Ringtone error:', e);
            }
        }

        function stopRingtone() {
            if (window._ringtoneInterval) {
                clearInterval(window._ringtoneInterval);
                window._ringtoneInterval = null;
            }
            if (ringtoneOscillator) {
                ringtoneOscillator.stop();
                ringtoneOscillator = null;
            }
        }

        // ─── Get microphone stream ───
        async function getLocalStream() {
            if (!localStream) {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true }
                });
            }
            return localStream;
        }

        // ─── Make an outgoing call ───
        async function makeCall(targetNumber) {
            if (!peer) {
                setStatus(callStatus, 'Peer not initialized. Generate a number first.', 'error');
                return;
            }
            if (isInCall) {
                setStatus(callStatus, 'Already in a call.', 'error');
                return;
            }
            if (targetNumber === myNumber) {
                setStatus(callStatus, 'Cannot call yourself.', 'error');
                return;
            }

            try {
                setCallStatus('📞 Calling ' + targetNumber + '...', 'ringing');
                setStatus(callStatus, 'Connecting...', 'warning');
                callBtn.disabled = true;

                // Get microphone
                await getLocalStream();

                // Call the target peer
                const call = peer.call(targetNumber, localStream);
                currentCall = call;
                isCaller = true;
                isInCall = true;

                call.on('stream', (stream) => {
                    remoteStream = stream;
                    const audio = new Audio();
                    audio.srcObject = stream;
                    audio.autoplay = true;
                    audio.id = 'remoteAudio';
                    document.body.appendChild(audio);
                    setCallStatus('🔊 Connected to ' + targetNumber, 'connected');
                    setStatus(callStatus, 'Connected!', 'success');
                    showCallControls(targetNumber);
                    incomingCard.classList.add('hidden');
                    callBtn.disabled = false;
                });

                call.on('close', () => {
                    endCall();
                });

                call.on('error', (err) => {
                    console.error('Call error:', err);
                    setStatus(callStatus, 'Call error: ' + err.message, 'error');
                    setCallStatus('❌ Call failed', 'error');
                    endCall();
                });

            } catch (err) {
                console.error('Make call error:', err);
                setStatus(callStatus, 'Failed: ' + err.message, 'error');
                setCallStatus('❌ Failed to call', 'error');
                callBtn.disabled = false;
            }
        }

        // ─── Answer an incoming call ───
        async function answerIncomingCall() {
            if (!incomingCall) return;

            try {
                stopRingtone();
                await getLocalStream();
                incomingCall.answer(localStream);
                currentCall = incomingCall;
                isCaller = false;
                isInCall = true;

                currentCall.on('stream', (stream) => {
                    remoteStream = stream;
                    const audio = new Audio();
                    audio.srcObject = stream;
                    audio.autoplay = true;
                    audio.id = 'remoteAudio';
                    document.body.appendChild(audio);
                    setCallStatus('🔊 Connected to ' + currentCall.peer, 'connected');
                    setStatus(callStatus, 'Connected!', 'success');
                    showCallControls(currentCall.peer);
                    incomingCard.classList.add('hidden');
                });

                currentCall.on('close', () => {
                    endCall();
                });

                currentCall.on('error', (err) => {
                    console.error('Call error:', err);
                    setStatus(callStatus, 'Call error: ' + err.message, 'error');
                    endCall();
                });

                incomingCall = null;
                callBtn.disabled = false;

            } catch (err) {
                console.error('Answer error:', err);
                setStatus(callStatus, 'Failed to answer: ' + err.message, 'error');
                incomingCall = null;
                incomingCard.classList.add('hidden');
            }
        }

        // ─── Reject incoming call ───
        function rejectIncomingCall() {
            if (incomingCall) {
                incomingCall.close();
                incomingCall = null;
            }
            stopRingtone();
            incomingCard.classList.add('hidden');
            setCallStatus('📴 Call rejected', 'idle');
            setStatus(callStatus, 'Call rejected.', 'error');
        }

        // ─── Show call controls ───
        function showCallControls(peerId) {
            remotePeerDisplay.textContent = peerId;
            callControls.classList.remove('hidden');
            hangupBtn.classList.remove('hidden');
            callBtn.classList.add('hidden');
        }

        // ─── Hide call controls ───
        function hideCallControls() {
            callControls.classList.add('hidden');
            hangupBtn.classList.add('hidden');
            callBtn.classList.remove('hidden');
            remotePeerDisplay.textContent = '---';
        }

        // ─── End call ───
        function endCall() {
            if (currentCall) {
                currentCall.close();
                currentCall = null;
            }
            if (remoteStream) {
                remoteStream.getTracks().forEach(t => t.stop());
                remoteStream = null;
            }
            // Don't stop local stream - reuse it
            const remoteAudio = document.getElementById('remoteAudio');
            if (remoteAudio) remoteAudio.remove();

            isInCall = false;
            isCaller = false;
            stopRingtone();
            incomingCard.classList.add('hidden');
            hideCallControls();
            setCallStatus('📴 Call ended', 'idle');
            setStatus(callStatus, 'Call ended.', 'error');
            callBtn.disabled = false;
            incomingCall = null;
        }

        // ─── Generate new number ───
        generateBtn.addEventListener('click', () => {
            const newNumber = generateNumber();
            myNumber = newNumber;
            localStorage.setItem('premCallNumber', newNumber);
            myNumberDisplay.textContent = newNumber;
            setStatus(numberStatus, 'New number generated: ' + newNumber, 'success');
            // Reinitialize peer with new ID
            initPeer();
        });

        // ─── Copy number ───
        copyNumberBtn.addEventListener('click', () => {
            if (myNumber) {
                navigator.clipboard.writeText(myNumber).then(() => {
                    setStatus(numberStatus, 'Number copied!', 'success');
                }).catch(() => {
                    // Fallback
                    const range = document.createRange();
                    range.selectNode(myNumberDisplay);
                    window.getSelection().removeAllRanges();
                    window.getSelection().addRange(range);
                    document.execCommand('copy');
                    setStatus(numberStatus, 'Number copied!', 'success');
                });
            }
        });

        // ─── Call button ───
        callBtn.addEventListener('click', () => {
            const target = dialInput.value.trim();
            if (!target) {
                setStatus(callStatus, 'Please enter a number.', 'error');
                return;
            }
            if (!/^\d+$/.test(target)) {
                setStatus(callStatus, 'Invalid number. Use digits only.', 'error');
                return;
            }
            if (!peer) {
                setStatus(callStatus, 'Generate a number first.', 'error');
                return;
            }
            makeCall(target);
        });

        // ─── Hangup button (from dialer) ───
        hangupBtn.addEventListener('click', endCall);

        // ─── Answer button ───
        answerBtn.addEventListener('click', answerIncomingCall);

        // ─── Reject button ───
        rejectBtn.addEventListener('click', rejectIncomingCall);

        // ─── End call button (from call controls) ───
        endCallBtn.addEventListener('click', endCall);

        // ─── Mute button ───
        muteBtn.addEventListener('click', () => {
            if (!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
            muteBtn.innerHTML = isMuted ?
                `<svg viewBox="0 0 24 24"><polyline points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M23 7l-4 5m0-5l4 5"/></svg> Unmute` :
                `<svg viewBox="0 0 24 24"><polyline points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M23 7l-4 5m0-5l4 5"/></svg> Mute`;
        });

        // ─── Enter key to call ───
        dialInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                callBtn.click();
            }
        });

        // ─── Initialize on load ───
        (function init() {
            if (myNumber) {
                myNumberDisplay.textContent = myNumber;
                setStatus(numberStatus, 'Welcome back! Your number: ' + myNumber, 'success');
                initPeer();
            } else {
                myNumberDisplay.textContent = '---';
                setStatus(numberStatus, 'Click "Generate" to claim your number.', 'warning');
            }

            // Check if URL has a ?number= parameter for auto-dial
            const params = new URLSearchParams(window.location.search);
            const autoNumber = params.get('number');
            if (autoNumber) {
                dialInput.value = autoNumber;
                // Auto-call after a short delay
                setTimeout(() => {
                    if (peer && myNumber) {
                        callBtn.click();
                    }
                }, 1500);
            }
        })();

        console.log('premCall loaded. Your number:', myNumber);
        console.log('Share this link to auto-dial: ' + window.location.origin + window.location.pathname + '?number=' + myNumber);

    })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#070a12" />
    <title>RAGina Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* Minimal dark theme – same as before but simplified */
        :root {
            --bg-0: #05070d;
            --bg-1: #0a0e18;
            --surface: #0e1424;
            --surface-2: #141c30;
            --surface-3: #1b2540;
            --line: #1e2a42;
            --text: #eef2fb;
            --text-dim: #8891ab;
            --text-faint: #525d78;
            --signal: #4f8cf7;
            --go: #2fd992;
            --stop: #ff5470;
            --radius: 16px;
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body {
            font-family: var(--font-body);
            color: var(--text);
            background: var(--bg-0);
            display: flex; justify-content: center;
            padding: 0;
            overflow-x: hidden;
        }
        .app-container {
            width: 100%; max-width: 480px; min-height: 100vh; min-height: 100dvh;
            background: var(--bg-1);
            display: flex; flex-direction: column;
            position: relative;
        }
        .header {
            display: flex; align-items: center; padding: 0.8rem 1rem;
            background: var(--surface); border-bottom: 1px solid var(--line);
            gap: 0.8rem; flex-shrink: 0;
        }
        .header .title {
            flex: 1; font-family: var(--font-display); font-weight: 700; font-size: 1.2rem;
            display: flex; align-items: center; gap: 0.5rem;
        }
        .header .icon-btn {
            background: none; border: none; color: var(--text-dim); font-size: 1.2rem; cursor: pointer;
            padding: 0.4rem; transition: color .2s;
        }
        .header .icon-btn:hover { color: var(--text); }
        .conversation-list {
            flex: 1; overflow-y: auto; padding: 0.5rem 0;
        }
        .conversation-item {
            display: flex; align-items: center; gap: 0.8rem; padding: 0.8rem 1rem;
            border-bottom: 1px solid var(--surface-2); cursor: pointer; transition: background .15s;
        }
        .conversation-item:hover { background: var(--surface-2); }
        .conversation-item .avatar {
            width: 48px; height: 48px; border-radius: 50%; background: var(--surface-3);
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font-display); font-weight: 700; font-size: 1.5rem;
            color: var(--text); flex-shrink: 0;
        }
        .conversation-item .info { flex: 1; min-width: 0; }
        .conversation-item .name { font-weight: 600; font-size: 0.95rem; }
        .conversation-item .preview {
            font-size: 0.8rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .conversation-item .time { font-size: 0.7rem; color: var(--text-faint); flex-shrink: 0; }
        .empty-state {
            text-align: center; color: var(--text-faint); padding: 2rem; font-size: 0.9rem;
        }
        .empty-state .icon { font-size: 2.5rem; display: block; margin-bottom: 0.8rem; opacity: 0.5; }
        .chat-view { flex: 1; display: none; flex-direction: column; }
        .chat-view.active { display: flex; }
        .chat-header {
            display: flex; align-items: center; gap: 0.8rem; padding: 0.8rem 1rem;
            background: var(--surface); border-bottom: 1px solid var(--line); flex-shrink: 0;
        }
        .chat-header .back-btn {
            background: none; border: none; color: var(--text); font-size: 1.4rem; cursor: pointer;
        }
        .chat-header .avatar {
            width: 36px; height: 36px; border-radius: 50%; background: var(--surface-3);
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
            color: var(--text); flex-shrink: 0;
        }
        .chat-header .peer-info { flex: 1; }
        .chat-header .peer-name { font-family: var(--font-display); font-weight: 600; font-size: 0.95rem; }
        .chat-header .peer-status { font-size: 0.7rem; color: var(--text-dim); }
        .chat-header .call-btn {
            background: none; border: none; color: var(--text-dim); font-size: 1.2rem; cursor: pointer;
            padding: 0.4rem; transition: color .2s;
        }
        .chat-header .call-btn:hover { color: var(--go); }
        .chat-header .call-btn.active { color: var(--stop); }
        .messages {
            flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.4rem;
        }
        .message-wrapper {
            display: flex; flex-direction: column; max-width: 85%;
            animation: fadeIn .15s ease;
        }
        .message-wrapper.outgoing { align-self: flex-end; align-items: flex-end; }
        .message-wrapper.incoming { align-self: flex-start; align-items: flex-start; }
        .message-bubble {
            padding: 0.6rem 0.9rem; border-radius: 16px; font-size: 0.9rem;
            white-space: pre-wrap; word-break: break-word;
        }
        .message-wrapper.outgoing .message-bubble {
            background: var(--signal); color: #fff; border-bottom-right-radius: 4px;
        }
        .message-wrapper.incoming .message-bubble {
            background: var(--surface-2); color: var(--text); border-bottom-left-radius: 4px;
        }
        .message-timestamp {
            font-size: 0.6rem; opacity: 0.6; margin-top: 0.15rem; display: block; text-align: right;
        }
        .date-divider {
            text-align: center; font-size: 0.7rem; color: var(--text-faint); padding: 0.5rem 0;
        }
        .chat-input-area {
            display: flex; gap: 0.5rem; padding: 0.8rem; background: var(--surface);
            border-top: 1px solid var(--line); flex-shrink: 0;
        }
        .chat-input-area input {
            flex: 1; padding: 0.6rem 1rem; border-radius: 20px; border: 1px solid var(--line);
            background: var(--bg-0); color: var(--text); outline: none;
            font-family: inherit; font-size: 0.95rem;
        }
        .chat-input-area input::placeholder { color: var(--text-faint); }
        .chat-input-area input:focus { border-color: var(--signal); }
        .chat-input-area button {
            width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--signal);
            color: #fff; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center;
            transition: opacity .2s, transform .1s;
        }
        .chat-input-area button:disabled { opacity: 0.4; cursor: not-allowed; }
        .hidden { display: none !important; }
        #toast {
            position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
            background: var(--surface-3); border: 1px solid var(--line);
            color: var(--text); padding: 0.7rem 1.3rem; border-radius: 40px;
            font-size: 0.85rem; z-index: 11000; opacity: 0; transition: opacity .3s;
            pointer-events: none; max-width: 90%;
        }
        #toast.show { opacity: 1; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* settings modal minimal */
        #settingsModal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
            align-items: center; justify-content: center; z-index: 20000;
        }
        #settingsModal.active { display: flex; }
        .settings-card {
            background: var(--surface); border: 1px solid var(--line);
            border-radius: 22px; padding: 1.8rem 1.5rem;
            width: 90%; max-width: 360px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .settings-card h2 { font-family: var(--font-display); font-size: 1.3rem; margin-bottom: 1.2rem; text-align: center; }
        .settings-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.6rem 0; border-bottom: 1px solid var(--surface-2); font-size: 0.9rem;
        }
        .settings-item .label { color: var(--text-dim); }
        .settings-item .toggle {
            position: relative; width: 44px; height: 24px; background: var(--line);
            border-radius: 12px; cursor: pointer; transition: background .2s;
        }
        .settings-item .toggle.active { background: var(--signal); }
        .settings-item .toggle .knob {
            position: absolute; top: 2px; left: 2px; width: 20px; height: 20px;
            background: #fff; border-radius: 50%; transition: transform .2s;
        }
        .settings-item .toggle.active .knob { transform: translateX(20px); }
        .settings-close {
            margin-top: 1.2rem; width: 100%; padding: 0.6rem; border-radius: 40px;
            border: 1px solid var(--line); background: transparent; color: var(--text-dim);
            cursor: pointer; font-weight: 600;
        }
        .settings-close:hover { background: var(--surface-2); color: var(--text); }
    </style>
</head>
<body>

<div class="app-container" id="app">
    <!-- Header -->
    <div class="header" id="listHeader">
        <span class="title"><i class="fas fa-robot" style="color: var(--signal);"></i> RAGina Agent</span>
        <button class="icon-btn" id="settingsBtn"><i class="fas fa-gear"></i></button>
    </div>
    <!-- Conversation list -->
    <div class="conversation-list" id="conversationList"></div>
    <!-- Chat view -->
    <div class="chat-view" id="chatView">
        <div class="chat-header">
            <button class="back-btn" id="chatBackBtn"><i class="fas fa-arrow-left"></i></button>
            <div class="avatar" id="chatPeerAvatar">🤖</div>
            <div class="peer-info">
                <span class="peer-name" id="chatPeerName">RAGina</span>
                <span class="peer-status" id="chatPeerStatus">Online</span>
            </div>
            <button class="call-btn" id="chatCallBtn" title="Call RAGina">
                <i class="fas fa-phone"></i>
            </button>
        </div>
        <div class="messages" id="messagesContainer"></div>
        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="Ask me anything…" autocomplete="off" />
            <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<!-- Settings Modal -->
<div id="settingsModal">
    <div class="settings-card">
        <h2>Settings</h2>
        <div class="settings-item">
            <span class="label">Dark / Light</span>
            <div class="toggle" id="themeToggle">
                <div class="knob"></div>
            </div>
        </div>
        <button class="settings-close" id="settingsClose">Close</button>
    </div>
</div>

<div id="toast"></div>

<script>
    // =========================================================================
    // 0. CONFIG – Knowledge from premCall.html (optional)
    // =========================================================================
    async function loadKnowledge() {
        try {
            const resp = await fetch('premCall.html');
            if (!resp.ok) throw new Error('File not found');
            const html = await resp.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            // Remove scripts/styles
            doc.querySelectorAll('script, style, link, meta, head, title, noscript').forEach(el => el.remove());
            let body = doc.body;
            if (!body || !body.textContent.trim()) body = doc.documentElement;
            let text = body.textContent.replace(/\s+/g, ' ').trim();
            if (text.length > 50) {
                return { title: 'premCall Documentation', content: text.slice(0, 15000) };
            }
        } catch (e) { /* ignore */ }
        return null;
    }

    // =========================================================================
    // 1. LOAD RAGina PRO
    // =========================================================================
    function loadRAGina(knowledge) {
        return new Promise((resolve, reject) => {
            window.RAGINA_CONFIG = {
                knowledge: knowledge ? [knowledge] : []
            };
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/gh/suryasticsai/RAGina@main/ragina-pro.min.js';
            script.onload = () => resolve();
            script.onerror = () => reject(new Error('Failed to load RAGina'));
            document.head.appendChild(script);
        });
    }

    // =========================================================================
    // 2. MAIN APP
    // =========================================================================
    (async function init() {
        // Load knowledge and RAGina
        const knowledge = await loadKnowledge();
        try {
            await loadRAGina(knowledge);
            console.log('RAGina loaded with knowledge');
        } catch (e) {
            console.warn('RAGina not loaded:', e.message);
        }

        // --- DOM refs ---
        const conversationList = document.getElementById('conversationList');
        const chatView = document.getElementById('chatView');
        const listHeader = document.getElementById('listHeader');
        const chatBackBtn = document.getElementById('chatBackBtn');
        const chatPeerAvatar = document.getElementById('chatPeerAvatar');
        const chatPeerName = document.getElementById('chatPeerName');
        const chatPeerStatus = document.getElementById('chatPeerStatus');
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatCallBtn = document.getElementById('chatCallBtn');
        const toast = document.getElementById('toast');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const settingsClose = document.getElementById('settingsClose');
        const themeToggle = document.getElementById('themeToggle');

        const BOT_NUMBER = 'RAGINA';
        const BOT_NAME = '🤖 RAGina';
        let conversations = {};
        let activePeer = null;
        let isCallActive = false;
        let recognition = null;
        let speechSynth = window.speechSynthesis;

        // --- Helpers ---
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(showToast._timer);
            showToast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function formatTime(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function formatDate(ts) {
            const d = new Date(ts);
            const today = new Date();
            if (d.toDateString() === today.toDateString()) return 'Today';
            const y = new Date(today); y.setDate(y.getDate() - 1);
            if (d.toDateString() === y.toDateString()) return 'Yesterday';
            return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
        }

        function loadConversations() {
            try { return JSON.parse(localStorage.getItem('raginaChats') || '{}'); } catch (e) { return {}; }
        }
        function saveConversations() {
            try { localStorage.setItem('raginaChats', JSON.stringify(conversations)); } catch (e) {}
        }

        // --- Render functions ---
        function renderMessages() {
            const msgs = conversations[activePeer] || [];
            messagesContainer.innerHTML = '';
            let lastDate = null;
            msgs.forEach(msg => {
                const d = formatDate(msg.timestamp);
                if (d !== lastDate) {
                    lastDate = d;
                    const div = document.createElement('div');
                    div.className = 'date-divider';
                    div.textContent = d;
                    messagesContainer.appendChild(div);
                }
                const wrapper = document.createElement('div');
                wrapper.className = 'message-wrapper ' + msg.direction;
                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                bubble.textContent = msg.text || '';
                wrapper.appendChild(bubble);
                const time = document.createElement('span');
                time.className = 'message-timestamp';
                let status = '';
                if (msg.pending) status = ' · sending…';
                else if (msg.error) status = ' · failed';
                time.textContent = formatTime(msg.timestamp) + status;
                wrapper.appendChild(time);
                messagesContainer.appendChild(wrapper);
            });
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function renderConversationList() {
            conversationList.innerHTML = '';
            const peers = Object.keys(conversations);
            if (peers.length === 0) {
                conversationList.innerHTML = '<div class="empty-state"><span class="icon"><i class="fas fa-robot"></i></span>No conversations</div>';
                return;
            }
            peers.forEach(peer => {
                const msgs = conversations[peer];
                const last = msgs[msgs.length - 1];
                const item = document.createElement('div');
                item.className = 'conversation-item';
                const avatar = document.createElement('div');
                avatar.className = 'avatar';
                avatar.textContent = peer === BOT_NUMBER ? '🤖' : '👤';
                item.appendChild(avatar);
                const info = document.createElement('div');
                info.className = 'info';
                const name = document.createElement('div');
                name.className = 'name';
                name.textContent = peer === BOT_NUMBER ? BOT_NAME : peer;
                info.appendChild(name);
                const preview = document.createElement('div');
                preview.className = 'preview';
                if (last) preview.textContent = (last.direction === 'outgoing' ? 'You: ' : '') + (last.text || '');
                info.appendChild(preview);
                item.appendChild(info);
                const time = document.createElement('span');
                time.className = 'time';
                if (last) time.textContent = formatTime(last.timestamp);
                item.appendChild(time);
                item.addEventListener('click', () => openChat(peer));
                conversationList.appendChild(item);
            });
        }

        // --- Open / close chat ---
        function openChat(peer) {
            activePeer = peer;
            listHeader.classList.add('hidden');
            conversationList.classList.add('hidden');
            chatView.classList.add('active');
            chatPeerAvatar.textContent = peer === BOT_NUMBER ? '🤖' : '👤';
            chatPeerName.textContent = peer === BOT_NUMBER ? BOT_NAME : peer;
            chatPeerStatus.textContent = 'Online';
            if (isCallActive) endCall();
            chatCallBtn.innerHTML = '<i class="fas fa-phone"></i>';
            renderMessages();
            messageInput.focus();
        }

        function closeChat() {
            if (isCallActive) endCall();
            activePeer = null;
            chatView.classList.remove('active');
            listHeader.classList.remove('hidden');
            conversationList.classList.remove('hidden');
            renderConversationList();
        }

        // --- Add message ---
        function addMessage(peer, msg) {
            if (!peer || !msg) return;
            if (!conversations[peer]) conversations[peer] = [];
            conversations[peer].push({
                text: String(msg.text || ''),
                timestamp: typeof msg.timestamp === 'number' ? msg.timestamp : Date.now(),
                direction: msg.direction === 'outgoing' ? 'outgoing' : 'incoming',
                from: msg.from || null,
                pending: msg.pending || false,
                error: msg.error || false,
                _tempId: msg._tempId || Date.now() + '-' + Math.random().toString(36).substr(2,6)
            });
            saveConversations();
            if (activePeer === peer) renderMessages();
            else renderConversationList();
        }

        // --- AI call (core) ---
        function askRAGina(query, callback) {
            if (!window.RAGina) {
                callback('🤖 RAGina is not available. Please check your internet connection.');
                return;
            }
            try {
                // Try the most common API: ask(query, onChunk, onComplete)
                if (typeof window.RAGina.ask === 'function') {
                    window.RAGina.ask(query, null, (answer) => {
                        callback(answer);
                    });
                } else if (typeof window.RAGina.chat === 'function') {
                    window.RAGina.chat(query, (answer) => {
                        callback(answer);
                    });
                } else {
                    // Fallback: try calling RAGina as a function
                    const result = window.RAGina(query);
                    if (typeof result === 'string') callback(result);
                    else callback('🤖 RAGina is not responding.');
                }
            } catch (e) {
                console.error(e);
                callback('🤖 Sorry, I encountered an error: ' + e.message);
            }
        }

        // --- Send message ---
        function sendMessage() {
            if (!activePeer) return;
            const text = messageInput.value.trim();
            if (!text) return;

            addMessage(activePeer, {
                text: text,
                timestamp: Date.now(),
                direction: 'outgoing',
                from: 'user',
                pending: false,
                error: false
            });
            messageInput.value = '';

            if (activePeer === BOT_NUMBER) {
                askRAGina(text, (answer) => {
                    addMessage(BOT_NUMBER, {
                        text: answer,
                        timestamp: Date.now(),
                        direction: 'incoming',
                        from: BOT_NUMBER,
                        pending: false,
                        error: false
                    });
                    renderMessages();
                    renderConversationList();
                });
            } else {
                renderMessages();
                renderConversationList();
            }
        }

        // --- Voice call ---
        function startCall() {
            if (activePeer !== BOT_NUMBER) {
                showToast('Voice calls only with RAGina.');
                return;
            }
            if (isCallActive) {
                showToast('Call already in progress.');
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showToast('Your browser does not support voice calls.');
                return;
            }
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            isCallActive = true;
            chatCallBtn.innerHTML = '<i class="fas fa-phone-slash"></i>';
            chatCallBtn.classList.add('active');
            showToast('Call started. Speak your question.');

            addMessage(BOT_NUMBER, {
                text: '🔊 Call started. Speak your question.',
                timestamp: Date.now(),
                direction: 'incoming',
                from: BOT_NUMBER,
                pending: false,
                error: false
            });
            renderMessages();
            renderConversationList();

            listenForSpeech();
        }

        function listenForSpeech() {
            if (!recognition || !isCallActive) return;
            recognition.start();

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                addMessage(BOT_NUMBER, {
                    text: '🎤 ' + transcript,
                    timestamp: Date.now(),
                    direction: 'outgoing',
                    from: 'user',
                    pending: false,
                    error: false
                });
                renderMessages();
                renderConversationList();

                askRAGina(transcript, (answer) => {
                    addMessage(BOT_NUMBER, {
                        text: '🤖 ' + answer,
                        timestamp: Date.now(),
                        direction: 'incoming',
                        from: BOT_NUMBER,
                        pending: false,
                        error: false
                    });
                    renderMessages();
                    renderConversationList();
                    // Speak the response
                    speakText(answer);
                });
            };

            recognition.onerror = (event) => {
                console.error('Speech error:', event.error);
                if (event.error === 'not-allowed') {
                    showToast('Microphone access denied. Ending call.');
                    endCall();
                } else {
                    setTimeout(listenForSpeech, 500);
                }
            };

            recognition.onend = () => {
                if (isCallActive) {
                    setTimeout(listenForSpeech, 300);
                }
            };
        }

        function speakText(text) {
            if (!window.speechSynthesis) return;
            // Cancel any ongoing speech
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 1;
            utterance.pitch = 1;
            utterance.volume = 1;
            window.speechSynthesis.speak(utterance);
        }

        function endCall() {
            isCallActive = false;
            if (recognition) {
                try { recognition.stop(); } catch (e) {}
                recognition = null;
            }
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }
            chatCallBtn.innerHTML = '<i class="fas fa-phone"></i>';
            chatCallBtn.classList.remove('active');
            showToast('Call ended.');
            addMessage(BOT_NUMBER, {
                text: '🔇 Call ended.',
                timestamp: Date.now(),
                direction: 'incoming',
                from: BOT_NUMBER,
                pending: false,
                error: false
            });
            renderMessages();
            renderConversationList();
        }

        // --- Event listeners ---
        chatCallBtn.addEventListener('click', () => {
            if (isCallActive) endCall();
            else startCall();
        });

        chatBackBtn.addEventListener('click', closeChat);
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        // Settings
        themeToggle.addEventListener('click', function() {
            this.classList.toggle('active');
            document.body.classList.toggle('light-mode');
        });
        settingsBtn.addEventListener('click', () => settingsModal.classList.add('active'));
        settingsClose.addEventListener('click', () => settingsModal.classList.remove('active'));
        settingsModal.addEventListener('click', (e) => { if (e.target === settingsModal) settingsModal.classList.remove('active'); });

        // --- Init data ---
        conversations = loadConversations();
        if (!conversations[BOT_NUMBER]) {
            conversations[BOT_NUMBER] = [{
                text: '🤖 Hello! I\'m RAGina. I\'ve read about premCall – ask me anything!',
                timestamp: Date.now(),
                direction: 'incoming',
                from: BOT_NUMBER,
                pending: false,
                error: false,
                _tempId: 'welcome'
            }];
            saveConversations();
        }
        renderConversationList();

        // Show knowledge status
        if (knowledge) {
            showToast('📚 Loaded knowledge from premCall.html');
        } else {
            showToast('🤖 RAGina is ready (no custom knowledge)');
        }
    })();
</script>
</body>
</html>

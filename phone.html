<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PremCall</title>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    /* ─── Global Reset ─── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b0e17;
      color: #e8edf5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
    .app-container {
      max-width: 420px;
      width: 100%;
      background: #131a26;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-height: 900px;
    }

    /* ─── Header ─── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.2rem 0.5rem;
      background: #0b0e17;
      border-bottom: 1px solid #1e2a3a;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .logo svg {
      width: 32px;
      height: 32px;
    }
    .logo-text {
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: -0.5px;
      color: #4f8cf7;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-dot.online { background: #4ade80; }
    .status-dot.offline { background: #f87171; }

    /* ─── Tabs ─── */
    .tabs {
      display: flex;
      background: #0b0e17;
      border-bottom: 1px solid #1e2a3a;
      flex-shrink: 0;
    }
    .tab {
      flex: 1;
      padding: 0.7rem 0;
      text-align: center;
      font-weight: 600;
      color: #6a7a8e;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
    }
    .tab.active {
      color: #4f8cf7;
      border-bottom-color: #4f8cf7;
    }
    .tab svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
    }

    /* ─── Tab Content ─── */
    .tab-content {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      background: #131a26;
    }
    .tab-content.active { display: block; }

    /* ─── Dialer ─── */
    .dialer-display {
      background: #0b0e17;
      border-radius: 16px;
      padding: 1rem;
      font-size: 2rem;
      font-weight: 300;
      text-align: center;
      letter-spacing: 2px;
      color: #e8edf5;
      margin-bottom: 1.5rem;
      min-height: 5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #1e2a3a;
    }
    .dialer-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.8rem;
      max-width: 320px;
      margin: 0 auto;
    }
    .dialer-pad .key {
      background: #1e2a3a;
      border-radius: 50%;
      aspect-ratio: 1/1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.1s;
      user-select: none;
      color: #e8edf5;
      border: none;
      outline: none;
    }
    .dialer-pad .key:active { background: #2a3a5a; }
    .dialer-pad .key.call {
      background: #1a7a4a;
      color: #fff;
    }
    .dialer-pad .key.call:active { background: #1f9b5e; }
    .dialer-pad .key.hangup {
      background: #8a1a2a;
      color: #fff;
    }
    .dialer-pad .key.hangup:active { background: #b52238; }
    .dialer-pad .key svg {
      width: 28px;
      height: 28px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    /* ─── Contacts ─── */
    .contact-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.7rem 0;
      border-bottom: 1px solid #1e2a3a;
      cursor: pointer;
      transition: 0.1s;
    }
    .contact-item:hover { background: #1a2338; }
    .contact-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #2a3a5a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.2rem;
      color: #fff;
      flex-shrink: 0;
    }
    .contact-info {
      flex: 1;
    }
    .contact-info .name {
      font-weight: 600;
      font-size: 1rem;
    }
    .contact-info .number {
      font-size: 0.8rem;
      color: #8892b0;
    }
    .contact-status {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .contact-status.online { background: #4ade80; }
    .contact-status.offline { background: #f87171; }

    /* ─── Incoming Call Overlay ─── */
    #incomingOverlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 2rem;
    }
    #incomingOverlay.active { display: flex; }
    #incomingOverlay .caller-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #2a3a5a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 1rem;
    }
    #incomingOverlay .caller-name { font-size: 2rem; font-weight: 700; }
    #incomingOverlay .caller-number { color: #8892b0; margin-bottom: 2rem; }
    #incomingOverlay .actions {
      display: flex;
      gap: 2rem;
    }
    #incomingOverlay .actions button {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #incomingOverlay .actions .answer { background: #1a7a4a; }
    #incomingOverlay .actions .reject { background: #8a1a2a; }
    #incomingOverlay .actions button svg {
      width: 32px;
      height: 32px;
      stroke: #fff;
      stroke-width: 2;
      fill: none;
    }

    /* ─── Call Screen ─── */
    #callScreen {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #0b0e17;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 2rem;
    }
    #callScreen.active { display: flex; }
    #callScreen .caller-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #2a3a5a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 1rem;
    }
    #callScreen .caller-name { font-size: 2rem; font-weight: 700; }
    #callScreen .caller-number { color: #8892b0; margin-bottom: 1.5rem; }
    #callScreen .call-timer { font-size: 1.5rem; color: #4ade80; margin-bottom: 2rem; }
    #callScreen .call-actions {
      display: flex;
      gap: 1.5rem;
    }
    #callScreen .call-actions button {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      background: #1e2a3a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #callScreen .call-actions button svg {
      width: 28px;
      height: 28px;
      stroke: #e8edf5;
      stroke-width: 2;
      fill: none;
    }
    #callScreen .call-actions .hangup { background: #8a1a2a; }
    #callScreen .call-actions .mute { background: #a67c1a; }
    #callScreen .call-actions .speaker { background: #1a4a8a; }

    /* ─── Messaging ─── */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0;
    }
    .message {
      padding: 0.5rem 0.8rem;
      margin: 0.3rem 0;
      border-radius: 12px;
      max-width: 80%;
      word-wrap: break-word;
    }
    .message.sent {
      background: #1a4a8a;
      margin-left: auto;
      color: #fff;
    }
    .message.received {
      background: #1e2a3a;
      color: #e8edf5;
    }
    .chat-input-area {
      display: flex;
      gap: 0.5rem;
      padding: 0.5rem 0;
      border-top: 1px solid #1e2a3a;
    }
    .chat-input-area input {
      flex: 1;
      padding: 0.6rem 1rem;
      border-radius: 30px;
      border: 1px solid #2a3a5a;
      background: #0b0e17;
      color: #e8edf5;
      outline: none;
    }
    .chat-input-area button {
      background: #1a4a8a;
      border: none;
      border-radius: 30px;
      padding: 0 1.2rem;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    /* ─── Buttons ─── */
    .btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      background: #1a4a8a;
      color: #fff;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid #2a3a5a;
      color: #e8edf5;
    }

    /* ─── Responsive ─── */
    @media (max-width: 480px) {
      .dialer-pad { gap: 0.6rem; }
      .dialer-pad .key { font-size: 1.5rem; }
    }
    .hidden { display: none !important; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #131a26; }
    ::-webkit-scrollbar-thumb { background: #2a3a5a; border-radius: 10px; }
  </style>
</head>
<body>
<div class="app-container">

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <!-- PremCall Logo SVG -->
      <svg viewBox="0 0 24 24" fill="none" stroke="#4f8cf7" stroke-width="2">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>

      <span class="status-dot online" id="headerStatusDot"></span>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" data-tab="dialer">
      <svg viewBox="0 0 24 24"><polyline points="22 16.92 22 19.92 19.82 19.92"/><path d="M4.11 2.08L7.11 2.08C7.87 2.08 8.51 2.65 8.6 3.4C8.73 4.36 8.96 5.3 9.3 6.21C9.49 6.69 9.34 7.24 8.89 7.69L7.62 8.96C10.62 14.46 15.54 15.38 15.54 15.38L16.81 14.11C17.26 13.66 17.81 13.51 18.29 13.7C19.2 14.04 20.14 14.27 21.1 14.4C21.85 14.49 22.42 15.13 22.42 15.89L22.42 18.89C22.42 19.72 21.76 20.38 20.93 20.38C12.31 20.38 3.62 11.69 3.62 3.07C3.62 2.24 4.28 1.58 5.11 1.58L4.11 2.08Z"/></svg>
      Dialer
    </div>
    <div class="tab" data-tab="contacts">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Contacts
    </div>
    <div class="tab" data-tab="messages">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>

    </div>
    <div class="tab" data-tab="history">

      History

  <!-- Dialer Tab -->
  <div class="tab-content active" id="tabDialer">
    <div class="dialer-display" id="dialDisplay">Enter number</div>
    <div class="dialer-pad" id="dialPad">
      <div class="key" data-digit="1">1</div>
      <div class="key" data-digit="2">2</div>
      <div class="key" data-digit="3">3</div>
      <div class="key" data-digit="4">4</div>
      <div class="key" data-digit="5">5</div>
      <div class="key" data-digit="6">6</div>
      <div class="key" data-digit="7">7</div>
      <div class="key" data-digit="8">8</div>
      <div class="key" data-digit="9">9</div>
      <div class="key" data-digit="*">*</div>
      <div class="key" data-digit="0">0</div>
      <div class="key" data-digit="#">#</div>
      <div class="key" data-action="delete">
        <svg viewBox="0 0 24 24"><polyline points="23 18 17 12 23 6"/><polyline points="17 18 11 12 17 6"/></svg>
      </div>
      <div class="key call" data-action="call">
        <svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      </div>
      <div class="key" data-action="clear">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>
    </div>
    <div style="margin-top:1rem;display:flex;gap:0.5rem;flex-wrap:wrap;">
      <button class="btn btn-outline" id="checkStatusBtn">Check Status</button>
      <button class="btn btn-outline" id="refreshContactsBtn">Refresh All</button>
      <span id="statusResult" style="color:#8892b0;"></span>
    </div>
  </div>

  <!-- Contacts Tab -->
  <div class="tab-content" id="tabContacts">
    <div style="display:flex;gap:0.5rem;margin-bottom:1rem;flex-wrap:wrap;">
      <input type="tel" id="contactInput" placeholder="Number" inputmode="numeric" style="flex:1;padding:0.5rem;border-radius:30px;border:1px solid #2a3a5a;background:#0b0e17;color:#e8edf5;" />
      <input type="text" id="contactNameInput" placeholder="Name" style="flex:1;padding:0.5rem;border-radius:30px;border:1px solid #2a3a5a;background:#0b0e17;color:#e8edf5;" />
      <button class="btn" id="addContactBtn">Add</button>
    </div>
    <div id="contactList"></div>
  </div>

  <!-- Messages Tab -->
  <div class="tab-content" id="tabMessages">
    <div style="margin-bottom:0.5rem;font-weight:600;">Chat with: <span id="chatPartnerDisplay">None</span></div>
    <div class="chat-messages" id="chatMessages">
      <p style="color:#8892b0;">Select a contact to start messaging.</p>
    </div>
    <div class="chat-input-area" id="chatInputArea">
      <input type="text" id="chatInput" placeholder="Type a message..." />
      <button id="sendMsgBtn">Send</button>
    </div>
  </div>

  <!-- History Tab -->
  <div class="tab-content" id="tabHistory">
    <div id="callHistoryList">
      <p style="color:#8892b0;">No calls yet.</p>
    </div>
    <button class="btn btn-outline" id="clearHistoryBtn" style="margin-top:1rem;">Clear History</button>

  <!-- Incoming Call Overlay -->
  <div id="incomingOverlay">
    <div class="caller-avatar" id="incomingAvatar">?</div>
    <div class="caller-name" id="incomingName">Unknown</div>
    <div class="caller-number" id="incomingNumber">+1234567890</div>
    <div class="actions">
      <button class="answer" id="answerOverlayBtn">
        <svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      </button>
      <button class="reject" id="rejectOverlayBtn">
        <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>

  <!-- Call Screen -->

    <div class="caller-avatar" id="callAvatar">?</div>
    <div class="caller-name" id="callName">Calling...</div>
    <div class="caller-number" id="callNumber">+1234567890</div>
    <div class="call-timer" id="callTimer">00:00</div>

      </button>
    </div>
  </div>

</div>

<script>
  (function() {
    "use strict";

    // ─── DOM refs ────────────────────────────────────────────────
    const dialDisplay = document.getElementById('dialDisplay');
    const dialPad = document.getElementById('dialPad');
    const checkStatusBtn = document.getElementById('checkStatusBtn');
    const refreshContactsBtn = document.getElementById('refreshContactsBtn');
    const statusResult = document.getElementById('statusResult');
    const contactList = document.getElementById('contactList');
    const contactInput = document.getElementById('contactInput');
    const contactNameInput = document.getElementById('contactNameInput');
    const addContactBtn = document.getElementById('addContactBtn');
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendMsgBtn = document.getElementById('sendMsgBtn');
    const chatPartnerDisplay = document.getElementById('chatPartnerDisplay');
    const callHistoryList = document.getElementById('callHistoryList');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const incomingOverlay = document.getElementById('incomingOverlay');
    const incomingName = document.getElementById('incomingName');
    const incomingNumber = document.getElementById('incomingNumber');
    const incomingAvatar = document.getElementById('incomingAvatar');
    const answerOverlayBtn = document.getElementById('answerOverlayBtn');
    const rejectOverlayBtn = document.getElementById('rejectOverlayBtn');
    const callScreen = document.getElementById('callScreen');
    const callName = document.getElementById('callName');
    const callNumber = document.getElementById('callNumber');
    const callAvatar = document.getElementById('callAvatar');
    const callTimer = document.getElementById('callTimer');
    const muteBtn = document.getElementById('muteBtn');
    const hangupCallBtn = document.getElementById('hangupCallBtn');
    const speakerBtn = document.getElementById('speakerBtn');
    const myNumberDisplay = document.getElementById('myNumberDisplay');
    const headerStatusDot = document.getElementById('headerStatusDot');

    // ─── State ──────────────────────────────────────────────────
    let myNumber = localStorage.getItem('premCallNumber') || null;
    let myCountryCode = localStorage.getItem('premCallCountry') || '+91';
    let peer = null;
    let currentCall = null;
    let localStream = null;
    let remoteStream = null;
    let isMuted = false;
    let isInCall = false;
    let isCaller = false;
    let incomingCall = null;
    let ringtoneInterval = null;
    let remoteAudioElement = null;
    let callHistory = JSON.parse(localStorage.getItem('premCallHistory') || '[]');
    let contacts = JSON.parse(localStorage.getItem('premCallContacts') || '[]');
    let callStartTime = null;
    let callTimerInterval = null;
    let dialedNumber = '';
    let isAnswering = false;
    let activeChatPartner = null;
    let dataConnections = {}; // number -> DataConnection
    let onlineStatus = {}; // number -> true/false (cached from last check)

    // ─── ICE Servers ──────────────────────────────────────────────
    function getIceServers() {
      return {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' },
          { urls: 'stun:stun3.l.google.com:19302' },
          { urls: 'stun:stun4.l.google.com:19302' },
          { urls: 'stun:stun.ekiga.net' },
          { urls: 'stun:stun.ideasip.com' },
          { urls: ['turn:numb.viagenie.ca:3478', 'turn:numb.viagenie.ca:443'],
            username: 'webrtc@live.com', credential: 'muazkh' }
        ],
        iceCandidatePoolSize: 10
      };
    }

    // ─── Helpers ──────────────────────────────────────────────────
    function setStatusDot(el, online) {
      el.className = 'status-dot ' + (online ? 'online' : 'offline');
    }

    function getContactName(number) {
      const c = contacts.find(c => c.number === number);
      return c ? c.name : number;
    }

    function getInitials(name) {
      if (!name) return '?';
      return name.charAt(0).toUpperCase();
    }

    function addCallHistory(number, direction, status, duration) {
      callHistory.unshift({ number, direction, status, duration, timestamp: Date.now() });
      if (callHistory.length > 100) callHistory.pop();
      localStorage.setItem('premCallHistory', JSON.stringify(callHistory));
      renderHistory();
    }

    function renderHistory() {
      if (!callHistory.length) {
        callHistoryList.innerHTML = '<p style="color:#8892b0;">No calls yet.</p>';
        return;
      }
      let html = '';
      callHistory.forEach(entry => {
        const dir = entry.direction === 'incoming' ? '←' : '→';
        const statusText = entry.status === 'answered' ? (entry.duration ? entry.duration + 's' : 'Answered') :
                           entry.status === 'missed' ? 'Missed' : entry.status;
        html += `<div class="contact-item">
          <div class="contact-avatar">${getInitials(getContactName(entry.number))}</div>
          <div class="contact-info">
            <div class="name">${getContactName(entry.number)}</div>
            <div class="number">${dir} ${entry.number} · ${statusText}</div>
          </div>
          <div style="font-size:0.7rem;color:#8892b0;">${new Date(entry.timestamp).toLocaleTimeString()}</div>
        </div>`;
      });
      callHistoryList.innerHTML = html;
    }

    function renderContacts() {
      if (!contacts.length) {
        contactList.innerHTML = '<p style="color:#8892b0;">No contacts saved.</p>';
        return;
      }
      let html = '';
      contacts.forEach(c => {
        const online = onlineStatus[c.number] === true;
        html += `<div class="contact-item" data-number="${c.number}">
          <div class="contact-avatar">${getInitials(c.name)}</div>
          <div class="contact-info">
            <div class="name">${c.name}</div>
            <div class="number">${c.number}</div>
          </div>
          <span class="contact-status ${online ? 'online' : 'offline'}"></span>
        </div>`;
      });
      contactList.innerHTML = html;
      // Click to dial or open chat
      contactList.querySelectorAll('.contact-item').forEach(el => {
        el.addEventListener('click', () => {
          const number = el.dataset.number;
          dialedNumber = number;
          dialDisplay.textContent = number;
          switchTab('dialer');
        });
        el.addEventListener('dblclick', () => {
          const number = el.dataset.number;
          openChat(number);
        });
      });
    }

    // ─── Check online status for a single number ────────────────
    function checkSingleOnline(number, callback) {
      if (!peer) { callback(false); return; }
      const conn = peer.connect(number);
      let opened = false;
      conn.on('open', () => {
        opened = true;
        conn.close();
        callback(true);
      });
      conn.on('error', () => {
        if (!opened) callback(false);
      });
      setTimeout(() => {
        if (!opened) {
          conn.close();
          callback(false);
        }
      }, 3000);
    }

    // ─── Refresh all contacts' status ────────────────────────────
    function refreshAllStatus() {
      statusResult.textContent = 'Checking...';
      let checked = 0;
      const total = contacts.length;
      if (total === 0) { statusResult.textContent = 'No contacts'; return; }
      contacts.forEach(c => {
        checkSingleOnline(c.number, (online) => {
          onlineStatus[c.number] = online;
          checked++;
          if (checked === total) {
            statusResult.textContent = 'Done';
            renderContacts();
            updateChatPartnerStatus();
          }
        });
      });
    }

    function updateChatPartnerStatus() {
      if (activeChatPartner && onlineStatus[activeChatPartner] !== undefined) {
        const online = onlineStatus[activeChatPartner];
        chatPartnerDisplay.textContent = getContactName(activeChatPartner) + (online ? ' (online)' : ' (offline)');
      }
    }

    // ─── Registration ──────────────────────────────────────────────
    function showRegistration() {
      const regScreen = document.createElement('div');
      regScreen.id = 'registrationScreen';
      regScreen.style.cssText = 'display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#0b0e17;padding:2rem;text-align:center;';
      regScreen.innerHTML = `
        <h2>PremCall</h2>
        <p style="color:#8892b0;">Set your number</p>
        <div style="display:flex;gap:0.5rem;margin:1rem 0;">
          <select id="countryCode" style="padding:0.5rem;border-radius:30px;border:1px solid #2a3a5a;background:#0b0e17;color:#e8edf5;">
            <option value="+91" selected>+91</option>
            <option value="+1">+1</option>
            <option value="+44">+44</option>
            <option value="+61">+61</option>
          </select>
          <input type="tel" id="phoneInput" placeholder="10 digits" maxlength="10" inputmode="numeric" style="padding:0.5rem;border-radius:30px;border:1px solid #2a3a5a;background:#0b0e17;color:#e8edf5;" />
        </div>
        <button class="btn" id="registerBtn">Register</button>
        <div id="regStatus" style="margin-top:1rem;color:#8892b0;"></div>
      `;
      document.body.prepend(regScreen);
      document.getElementById('registerBtn').addEventListener('click', registerNumber);
      document.getElementById('phoneInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') registerNumber(); });
    }

    function registerNumber() {
      const cc = document.getElementById('countryCode').value;
      const num = document.getElementById('phoneInput').value.trim();
      if (!/^\d{10}$/.test(num)) {
        document.getElementById('regStatus').textContent = 'Enter exactly 10 digits.';
        return;
      }
      const full = cc + num;
      if (localStorage.getItem('premCallNumber') === full) {
        document.getElementById('regStatus').textContent = 'Already registered.';
        return;
      }
      myNumber = full;
      myCountryCode = cc;
      localStorage.setItem('premCallNumber', myNumber);
      localStorage.setItem('premCallCountry', myCountryCode);
      document.getElementById('registrationScreen').remove();
      myNumberDisplay.textContent = myNumber;
      initPeer();
      renderContacts();
      renderHistory();
      // Start periodic refresh of contacts status every 30s
      setInterval(() => { if (contacts.length) refreshAllStatus(); }, 30000);
    }

    // ─── PeerJS init ──────────────────────────────────────────────
    function initPeer() {
      if (peer) { peer.destroy(); }
      if (!myNumber) return;
      peer = new Peer(myNumber, { debug: 2, config: getIceServers() });

      peer.on('open', () => {
        console.log('Peer online:', myNumber);
        setStatusDot(headerStatusDot, true);
        // Refresh contacts status on open
        if (contacts.length) refreshAllStatus();
      });

      peer.on('error', (err) => {
        console.error(err);
        if (err.type === 'unavailable-id') alert('Number already taken');
        setStatusDot(headerStatusDot, false);
      });

      peer.on('close', () => {
        setStatusDot(headerStatusDot, false);
      });

      peer.on('disconnected', () => {
        setStatusDot(headerStatusDot, false);
        setTimeout(() => { if (peer) peer.reconnect(); }, 3000);
      });

      peer.on('call', (call) => {
        if (isInCall) { call.close(); return; }
        incomingCall = call;
        const name = getContactName(call.peer);
        incomingName.textContent = name;
        incomingNumber.textContent = call.peer;
        incomingAvatar.textContent = getInitials(name);
        incomingOverlay.classList.add('active');
        playRingtone();
        setTimeout(() => {
          if (incomingCall && incomingOverlay.classList.contains('active')) {
            addCallHistory(call.peer, 'incoming', 'missed');
            rejectIncomingCall();
          }
        }, 20000);
      });

      // Data connections for messaging
      peer.on('connection', (conn) => {
        const peerId = conn.peer;
        dataConnections[peerId] = conn;
        onlineStatus[peerId] = true; // connection means online
        conn.on('data', (data) => {
          if (data.type === 'message') {
            if (activeChatPartner === peerId) {
              appendMessage(data.text, 'received');
            }
          }
        });
        conn.on('close', () => {
          delete dataConnections[peerId];
          onlineStatus[peerId] = false;
          renderContacts();
          updateChatPartnerStatus();
        });
        renderContacts();
        updateChatPartnerStatus();
      });
    }

    // ─── Ringtone ──────────────────────────────────────────────────
    function playRingtone() {
      stopRingtone();
      let ctx = new (window.AudioContext || window.webkitAudioContext)();
      let count = 0;
      ringtoneInterval = setInterval(() => {
        if (count >= 12 || !incomingOverlay.classList.contains('active')) {
          stopRingtone(); return;
        }
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = count % 2 === 0 ? 440 : 330;
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.3);
        count++;
      }, 400);
    }
    function stopRingtone() {
      if (ringtoneInterval) { clearInterval(ringtoneInterval); ringtoneInterval = null; }
    }

    // ─── Microphone ──────────────────────────────────────────────
    async function getLocalStream() {
      if (!localStream) {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
        localStream.addEventListener('inactive', () => { localStream = null; });
      }
      return localStream;
    }

    function getRemoteAudioElement() {
      if (!remoteAudioElement) {
        remoteAudioElement = document.createElement('audio');
        remoteAudioElement.id = 'remoteAudio';
        remoteAudioElement.setAttribute('playsInline', '');
        remoteAudioElement.autoplay = true;
        remoteAudioElement.style.display = 'none';
        document.body.appendChild(remoteAudioElement);
      }
      return remoteAudioElement;
    }

    function attachRemoteStream(stream) {
      remoteStream = stream;
      const audio = getRemoteAudioElement();
      audio.srcObject = stream;
      audio.play().catch(() => {});
      stream.onremovetrack = () => {
        if (stream.getTracks().length === 0) {
          audio.pause(); audio.srcObject = null; remoteStream = null;
        }
      };
    }

    // ─── Make Call ──────────────────────────────────────────────────
    async function makeCall(targetNumber) {
      if (isInCall) { alert('Already in a call'); return; }
      if (!peer) { alert('Peer not ready'); return; }
      if (targetNumber === myNumber) { alert('Cannot call yourself'); return; }
      try {
        await getLocalStream();
        const call = peer.call(targetNumber, localStream);
        currentCall = call;
        isCaller = true;
        isInCall = true;
        callStartTime = Date.now();
        showCallScreen(targetNumber);

        call.on('stream', (stream) => {
          attachRemoteStream(stream);
          addCallHistory(targetNumber, 'outgoing', 'answered');
          startTimer();
        });

        call.on('close', () => { endCall(); });
        call.on('error', (err) => { console.error(err); endCall(); });

        const pc = call.peerConnection;
        if (pc) {
          pc.oniceconnectionstatechange = () => {
            if (pc.iceConnectionState === 'failed') endCall();
          };
        }
      } catch (err) {
        alert('Call failed: ' + err.message);
        endCall();
      }
    }

    function showCallScreen(number) {
      const name = getContactName(number);
      callName.textContent = name;
      callNumber.textContent = number;
      callAvatar.textContent = getInitials(name);
      callScreen.classList.add('active');
      incomingOverlay.classList.remove('active');
    }

    function startTimer() {
      if (callTimerInterval) clearInterval(callTimerInterval);
      let seconds = 0;
      callTimerInterval = setInterval(() => {
        seconds++;
        const m = String(Math.floor(seconds / 60)).padStart(2, '0');
        const s = String(seconds % 60).padStart(2, '0');
        callTimer.textContent = `${m}:${s}`;
      }, 1000);
    }

    // ─── Answer / Reject ──────────────────────────────────────────
    async function answerIncomingCall() {
      if (isAnswering || !incomingCall) return;
      isAnswering = true;
      try {
        stopRingtone();
        await getLocalStream();
        incomingCall.answer(localStream);
        currentCall = incomingCall;
        isCaller = false;
        isInCall = true;
        callStartTime = Date.now();
        const number = currentCall.peer;
        addCallHistory(number, 'incoming', 'answered');
        showCallScreen(number);
        incomingOverlay.classList.remove('active');

        currentCall.on('stream', (stream) => {
          attachRemoteStream(stream);
          startTimer();
        });
        currentCall.on('close', () => { endCall(); });
        currentCall.on('error', (err) => { console.error(err); endCall(); });
        incomingCall = null;
      } catch (err) {
        alert('Answer failed: ' + err.message);
        if (incomingCall) incomingCall.close();
        incomingCall = null;
        incomingOverlay.classList.remove('active');
        isInCall = false;
      } finally { isAnswering = false; }
    }

    function rejectIncomingCall() {
      if (incomingCall) { incomingCall.close(); incomingCall = null; }
      stopRingtone();
      incomingOverlay.classList.remove('active');
    }

    // ─── End Call ──────────────────────────────────────────────────
    function endCall() {
      if (currentCall) { currentCall.close(); currentCall = null; }
      if (remoteStream) { remoteStream.getTracks().forEach(t => t.stop()); remoteStream = null; }
      const audio = getRemoteAudioElement();
      audio.pause(); audio.srcObject = null;
      isInCall = false;
      isCaller = false;
      stopRingtone();
      incomingOverlay.classList.remove('active');
      callScreen.classList.remove('active');
      if (callTimerInterval) clearInterval(callTimerInterval);
      callTimer.textContent = '00:00';
      callStartTime = null;
    }

    // ─── Messaging ──────────────────────────────────────────────────
    function openChat(number) {
      activeChatPartner = number;
      chatPartnerDisplay.textContent = getContactName(number);
      chatMessages.innerHTML = '';
      // Establish data connection if not already
      if (!dataConnections[number] && peer) {
        const conn = peer.connect(number);
        dataConnections[number] = conn;
        conn.on('open', () => {
          onlineStatus[number] = true;
          renderContacts();
          updateChatPartnerStatus();
        });
        conn.on('data', (data) => {
          if (data.type === 'message') {
            appendMessage(data.text, 'received');
          }
        });
        conn.on('close', () => {
          delete dataConnections[number];
          onlineStatus[number] = false;
          renderContacts();
          updateChatPartnerStatus();
        });
      } else if (dataConnections[number]) {
        // already connected
        onlineStatus[number] = true;
        updateChatPartnerStatus();
      }
      switchTab('messages');
    }

    function sendMessage(text) {
      if (!activeChatPartner) { alert('No chat partner selected'); return; }
      const conn = dataConnections[activeChatPartner];
      if (!conn || conn.readyState !== 'open') {
        alert('Not connected to ' + activeChatPartner);
        return;
      }
      conn.send({ type: 'message', text });
      appendMessage(text, 'sent');
    }

    function appendMessage(text, type) {
      const div = document.createElement('div');
      div.className = 'message ' + type;
      div.textContent = text;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // ─── Tab switching ──────────────────────────────────────────────
    function switchTab(tabName) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
      document.querySelector(`.tab[data-tab="${tabName}"]`).classList.add('active');
      document.getElementById('tab' + tabName.charAt(0).toUpperCase() + tabName.slice(1)).classList.add('active');
    }

    // ─── Event Listeners ────────────────────────────────────────────
    // Dial pad
    dialPad.addEventListener('click', (e) => {
      const key = e.target.closest('.key');
      if (!key) return;
      const digit = key.dataset.digit;
      const action = key.dataset.action;
      if (digit) { dialedNumber += digit; dialDisplay.textContent = dialedNumber; }
      else if (action === 'delete') { dialedNumber = dialedNumber.slice(0, -1); dialDisplay.textContent = dialedNumber || 'Enter number'; }
      else if (action === 'clear') { dialedNumber = ''; dialDisplay.textContent = 'Enter number'; }
      else if (action === 'call') { if (dialedNumber) makeCall(dialedNumber); }
    });

    // Check status
    checkStatusBtn.addEventListener('click', () => {
      const num = dialedNumber || prompt('Enter number to check:');
      if (num) {
        statusResult.textContent = 'Checking...';
        checkSingleOnline(num, (online) => {
          statusResult.textContent = online ? '✅ Online' : '❌ Offline';
        });
      }
    });

    // Refresh all
    refreshContactsBtn.addEventListener('click', refreshAllStatus);

    // Add contact
    addContactBtn.addEventListener('click', () => {
      const num = contactInput.value.trim();
      const name = contactNameInput.value.trim();
      if (!/^\d+$/.test(num)) { alert('Enter valid number'); return; }
      if (!name) { alert('Enter a name'); return; }
      contacts.push({ number: num, name });
      localStorage.setItem('premCallContacts', JSON.stringify(contacts));
      renderContacts();
      contactInput.value = ''; contactNameInput.value = '';
      // Refresh status for new contact
      if (contacts.length) refreshAllStatus();
    });

    // Send message
    sendMsgBtn.addEventListener('click', () => {
      const text = chatInput.value.trim();
      if (text) { sendMessage(text); chatInput.value = ''; }
    });
    chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMsgBtn.click(); });

    // Clear history
    clearHistoryBtn.addEventListener('click', () => {
      callHistory = [];
      localStorage.setItem('premCallHistory', JSON.stringify(callHistory));
      renderHistory();
    });

    // Incoming call buttons
    answerOverlayBtn.addEventListener('click', answerIncomingCall);
    rejectOverlayBtn.addEventListener('click', rejectIncomingCall);

    // Call screen buttons
    hangupCallBtn.addEventListener('click', endCall);
    muteBtn.addEventListener('click', () => {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
    });
    speakerBtn.addEventListener('click', () => {
      alert('Speaker toggle not implemented in this demo');
    });

    // Tabs
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const tabName = tab.dataset.tab;
        switchTab(tabName);
        if (tabName === 'messages' && !activeChatPartner) {
          chatMessages.innerHTML = '<p style="color:#8892b0;">Double‑click a contact to start chatting.</p>';
        }
      });
    });

    // ─── Init ──────────────────────────────────────────────────────
    if (myNumber) {
      myNumberDisplay.textContent = myNumber;
      initPeer();
      renderContacts();
      renderHistory();
      // Refresh contacts status every 30s
      setInterval(() => { if (contacts.length) refreshAllStatus(); }, 30000);
    } else {
      showRegistration();
    }

    console.log('PremCall loaded.');
  })();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>premCall</title>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #0a0e1a;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .container { max-width: 480px; width: 100%; margin: 0 auto; }

    /* ─── Registration Screen ─── */
    #registrationScreen {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
    }
    #registrationScreen h1 { font-size: 2.5rem; display: flex; align-items: center; gap: 0.5rem; }
    #registrationScreen .sub { color: #8892b0; margin-bottom: 1rem; }
    .reg-input-group { display: flex; gap: 0.5rem; width: 100%; max-width: 300px; }
    .reg-input-group select, .reg-input-group input { flex: 1; padding: 0.75rem; border-radius: 12px; border: 1px solid #2a3a5a; background: #0f1629; color: #e2e8f0; font-size: 1rem; }
    .reg-input-group select { flex: 0.8; }
    .reg-input-group input { flex: 2; }
    #otpSection { display: none; flex-direction: column; align-items: center; gap: 0.5rem; width: 100%; max-width: 300px; }
    #otpSection .otp-code { font-size: 2rem; font-weight: 700; color: #4f8cf7; letter-spacing: 0.5rem; }
    .btn { padding: 0.75rem 2rem; border: none; border-radius: 40px; font-weight: 600; cursor: pointer; transition: 0.2s; background: #2a3a5a; color: #fff; font-size: 1rem; }
    .btn-primary { background: #1a4a8a; }
    .btn-primary:hover { background: #2563d6; }
    .btn-success { background: #1a7a4a; }
    .btn-success:hover { background: #1f9b5e; }
    .btn-danger { background: #8a1a2a; }
    .btn-danger:hover { background: #b52238; }
    .btn-yellow { background: #a67c1a; color: #fff; }
    .btn-yellow:hover { background: #ca9a2a; }
    .btn-outline { background: transparent; border: 1px solid #4a5a7a; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status-badge { padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.8rem; background: #1a2338; }
    .status-online { color: #4ade80; }
    .status-offline { color: #f87171; }

    /* ─── Main App (hidden until registered) ─── */
    #mainApp { display: none; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; }
    .my-number { font-weight: 700; color: #4f8cf7; }
    .tabs { display: flex; gap: 0.5rem; margin: 1rem 0; border-bottom: 1px solid #2a3a5a; }
    .tab { padding: 0.5rem 1rem; cursor: pointer; border-bottom: 2px solid transparent; color: #94a3b8; }
    .tab.active { border-bottom-color: #4f8cf7; color: #fff; }
    .tab-content { display: none; padding: 1rem 0; }
    .tab-content.active { display: block; }

    /* ─── Dialer ─── */
    .dialer-display { background: #0f1629; border-radius: 12px; padding: 0.75rem; font-size: 1.5rem; text-align: center; margin-bottom: 1rem; }
    .dialer-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; max-width: 300px; margin: 0 auto; }
    .dialer-pad .key { background: #1a2338; border-radius: 50%; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 600; cursor: pointer; transition: 0.1s; user-select: none; }
    .dialer-pad .key:active { background: #2a3a5a; }
    .dialer-pad .key.call { background: #1a7a4a; color: #fff; }
    .dialer-pad .key.call:active { background: #1f9b5e; }
    .dialer-pad .key.hangup { background: #8a1a2a; color: #fff; }
    .dialer-pad .key.hangup:active { background: #b52238; }
    .dialer-pad .key.mute { background: #a67c1a; }
    .dialer-pad .key.mute:active { background: #ca9a2a; }

    /* ─── Call History ─── */
    .call-item { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #1a2338; }
    .call-item .direction { font-weight: 600; }
    .call-item .direction.incoming { color: #fbbf24; }
    .call-item .direction.outgoing { color: #4ade80; }
    .call-item .status { font-size: 0.8rem; color: #94a3b8; }

    /* ─── Incoming Call Overlay ─── */
    #incomingOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 1000;
      padding: 2rem;
    }
    #incomingOverlay.active { display: flex; }
    #incomingOverlay .caller-name { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; }
    #incomingOverlay .caller-number { color: #94a3b8; }
    #incomingOverlay .actions { display: flex; gap: 2rem; margin-top: 2rem; }
    #incomingOverlay .actions .btn { width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
    #incomingOverlay .actions .btn-answer { background: #1a7a4a; }
    #incomingOverlay .actions .btn-reject { background: #8a1a2a; }

    /* ─── Call Screen (active call) ─── */
    #callScreen {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #0a0e1a;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 2rem;
    }
    #callScreen.active { display: flex; }
    #callScreen .caller-info { text-align: center; margin-bottom: 2rem; }
    #callScreen .caller-info .name { font-size: 2rem; font-weight: 700; }
    #callScreen .caller-info .number { color: #94a3b8; }
    #callScreen .call-timer { font-size: 1.2rem; color: #4ade80; margin-bottom: 2rem; }

    /* ─── Responsive ─── */
    @media (max-width: 480px) {
      .dialer-pad { max-width: 280px; gap: 0.6rem; }
      .dialer-pad .key { font-size: 1.5rem; }
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="container">

  <!-- ========================================== -->
  <!-- REGISTRATION SCREEN                        -->
  <!-- ========================================== -->
  <div id="registrationScreen">
    <h1>📞 premCall</h1>
    <p class="sub">Set up your fixed phone number</p>
    <div class="reg-input-group">
      <select id="countryCode">
        <option value="+1">🇺🇸 +1</option>
        <option value="+44">🇬🇧 +44</option>
        <option value="+91" selected>🇮🇳 +91</option>
        <option value="+61">🇦🇺 +61</option>
        <option value="+81">🇯🇵 +81</option>
        <option value="+86">🇨🇳 +86</option>
        <option value="+49">🇩🇪 +49</option>
        <option value="+33">🇫🇷 +33</option>
        <option value="+39">🇮🇹 +39</option>
        <option value="+7">🇷🇺 +7</option>
        <option value="+55">🇧🇷 +55</option>
        <option value="+52">🇲🇽 +52</option>
        <option value="+82">🇰🇷 +82</option>
        <option value="+31">🇳🇱 +31</option>
        <option value="+34">🇪🇸 +34</option>
        <option value="+46">🇸🇪 +46</option>
        <option value="+41">🇨🇭 +41</option>
        <option value="+27">🇿🇦 +27</option>
        <option value="+62">🇮🇩 +62</option>
        <option value="+60">🇲🇾 +60</option>
        <option value="+63">🇵🇭 +63</option>
        <option value="+65">🇸🇬 +65</option>
        <option value="+64">🇳🇿 +64</option>
        <option value="+971">🇦🇪 +971</option>
        <option value="+966">🇸🇦 +966</option>
        <option value="+54">🇦🇷 +54</option>
        <option value="+56">🇨🇱 +56</option>
        <option value="+57">🇨🇴 +57</option>
        <option value="+51">🇵🇪 +51</option>
      </select>
      <input type="tel" id="phoneInput" placeholder="10-digit number" maxlength="10" inputmode="numeric" />
    </div>
    <button class="btn btn-primary" id="registerBtn">Register</button>
    <div id="otpSection">
      <p>Enter the OTP shown below:</p>
      <div class="otp-code" id="otpDisplay">----</div>
      <input type="text" id="otpInput" placeholder="Enter OTP" maxlength="4" inputmode="numeric" />
      <button class="btn btn-success" id="verifyOtpBtn">Verify OTP</button>
    </div>
    <div id="regStatus" class="status-badge" style="margin-top:1rem;"></div>
  </div>

  <!-- ========================================== -->
  <!-- MAIN APP (after registration)              -->
  <!-- ========================================== -->
  <div id="mainApp">
    <div class="header">
      <div class="my-number" id="myNumberDisplay">---</div>
      <div>
        <span class="status-badge" id="peerStatus">offline</span>
        <button class="btn btn-outline" style="margin-left:0.5rem;padding:0.2rem 0.6rem;font-size:0.7rem;" id="shareLinkBtn">Share</button>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" data-tab="dialer">Dialer</div>
      <div class="tab" data-tab="history">History</div>
      <div class="tab" data-tab="contacts">Contacts</div>
    </div>

    <!-- Dialer Tab -->
    <div class="tab-content active" id="tabDialer">
      <div class="dialer-display" id="dialDisplay">Enter number</div>
      <div class="dialer-pad" id="dialPad">
        <div class="key" data-digit="1">1</div>
        <div class="key" data-digit="2">2</div>
        <div class="key" data-digit="3">3</div>
        <div class="key" data-digit="4">4</div>
        <div class="key" data-digit="5">5</div>
        <div class="key" data-digit="6">6</div>
        <div class="key" data-digit="7">7</div>
        <div class="key" data-digit="8">8</div>
        <div class="key" data-digit="9">9</div>
        <div class="key" data-digit="*">*</div>
        <div class="key" data-digit="0">0</div>
        <div class="key" data-digit="#">#</div>
        <div class="key" data-action="delete">⌫</div>
        <div class="key call" data-action="call">📞</div>
        <div class="key" data-action="clear">✕</div>
      </div>
      <div style="margin-top:1rem;">
        <button class="btn btn-outline" id="checkStatusBtn">Check Number Status</button>
        <span id="statusResult" style="margin-left:0.5rem;"></span>
      </div>
    </div>

    <!-- History Tab -->
    <div class="tab-content" id="tabHistory">
      <div id="callHistoryList">
        <p style="color:#94a3b8;">No calls yet.</p>
      </div>
      <button class="btn btn-outline" id="clearHistoryBtn" style="margin-top:1rem;">Clear History</button>
    </div>

    <!-- Contacts Tab -->
    <div class="tab-content" id="tabContacts">
      <div style="display:flex;gap:0.5rem;margin-bottom:1rem;">
        <input type="tel" id="contactInput" placeholder="Enter number" inputmode="numeric" />
        <button class="btn btn-primary" id="addContactBtn">Add</button>
      </div>
      <div id="contactList"></div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- INCOMING CALL OVERLAY                      -->
  <!-- ========================================== -->
  <div id="incomingOverlay">
    <div class="caller-name" id="callerName">Unknown</div>
    <div class="caller-number" id="callerNumber">+1234567890</div>
    <div class="actions">
      <button class="btn btn-answer" id="answerOverlayBtn">✅</button>
      <button class="btn btn-reject" id="rejectOverlayBtn">❌</button>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- ACTIVE CALL SCREEN                         -->
  <!-- ========================================== -->
  <div id="callScreen">
    <div class="caller-info">
      <div class="name" id="activeCallerName">Calling...</div>
      <div class="number" id="activeCallerNumber">+1234567890</div>
    </div>
    <div class="call-timer" id="callTimer">00:00</div>
    <div class="dialer-pad" style="max-width:280px;">
      <div class="key" data-action="mute">🔇</div>
      <div class="key hangup" data-action="hangup">📴</div>
      <div class="key" data-action="speaker">🔊</div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- SCRIPTS                                    -->
  <!-- ========================================== -->
  <script>
    (function() {
      "use strict";

      // ─── DOM refs ────────────────────────────────────────────────
      const registrationScreen = document.getElementById('registrationScreen');
      const mainApp = document.getElementById('mainApp');
      const countryCode = document.getElementById('countryCode');
      const phoneInput = document.getElementById('phoneInput');
      const registerBtn = document.getElementById('registerBtn');
      const otpSection = document.getElementById('otpSection');
      const otpDisplay = document.getElementById('otpDisplay');
      const otpInput = document.getElementById('otpInput');
      const verifyOtpBtn = document.getElementById('verifyOtpBtn');
      const regStatus = document.getElementById('regStatus');

      const myNumberDisplay = document.getElementById('myNumberDisplay');
      const peerStatus = document.getElementById('peerStatus');
      const shareLinkBtn = document.getElementById('shareLinkBtn');
      const dialDisplay = document.getElementById('dialDisplay');
      const dialPad = document.getElementById('dialPad');
      const checkStatusBtn = document.getElementById('checkStatusBtn');
      const statusResult = document.getElementById('statusResult');
      const callHistoryList = document.getElementById('callHistoryList');
      const clearHistoryBtn = document.getElementById('clearHistoryBtn');
      const contactInput = document.getElementById('contactInput');
      const addContactBtn = document.getElementById('addContactBtn');
      const contactList = document.getElementById('contactList');

      const incomingOverlay = document.getElementById('incomingOverlay');
      const callerName = document.getElementById('callerName');
      const callerNumber = document.getElementById('callerNumber');
      const answerOverlayBtn = document.getElementById('answerOverlayBtn');
      const rejectOverlayBtn = document.getElementById('rejectOverlayBtn');

      const callScreen = document.getElementById('callScreen');
      const activeCallerName = document.getElementById('activeCallerName');
      const activeCallerNumber = document.getElementById('activeCallerNumber');
      const callTimer = document.getElementById('callTimer');

      // ─── State ──────────────────────────────────────────────────
      let myNumber = localStorage.getItem('premCallNumber') || null;
      let myCountryCode = localStorage.getItem('premCallCountry') || '+91';
      let peer = null;
      let currentCall = null;
      let localStream = null;
      let remoteStream = null;
      let isMuted = false;
      let isInCall = false;
      let isCaller = false;
      let incomingCall = null;
      let ringtoneInterval = null;
      let remoteAudioElement = null;
      let callHistory = JSON.parse(localStorage.getItem('premCallHistory') || '[]');
      let contacts = JSON.parse(localStorage.getItem('premCallContacts') || '[]');
      let callStartTime = null;
      let callTimerInterval = null;
      let dialedNumber = '';
      let isAnswering = false;

      // ─── ICE Servers ──────────────────────────────────────────────
      function getIceServers() {
        return {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
            { urls: 'stun:stun3.l.google.com:19302' },
            { urls: 'stun:stun4.l.google.com:19302' },
            { urls: 'stun:stun.ekiga.net' },
            { urls: 'stun:stun.ideasip.com' },
            {
              urls: ['turn:numb.viagenie.ca:3478', 'turn:numb.viagenie.ca:443'],
              username: 'webrtc@live.com',
              credential: 'muazkh'
            }
          ],
          iceCandidatePoolSize: 10
        };
      }

      // ─── Helpers ──────────────────────────────────────────────────
      function setStatus(el, text, type) {
        el.textContent = text;
        el.className = 'status-badge';
        if (type) el.classList.add('status-' + type);
      }

      function showError(msg) { alert('Error: ' + msg); }

      // ─── Registration ──────────────────────────────────────────────
      function registerNumber() {
        const cc = countryCode.value;
        const num = phoneInput.value.trim();
        if (!/^\d{10}$/.test(num)) {
          regStatus.textContent = 'Enter exactly 10 digits.';
          return;
        }
        const fullNumber = cc + num;
        // Check if already registered
        if (localStorage.getItem('premCallNumber') === fullNumber) {
          regStatus.textContent = 'Number already registered.';
          return;
        }
        // Generate OTP (simulated)
        const otp = Math.floor(1000 + Math.random() * 9000).toString();
        otpDisplay.textContent = otp;
        otpSection.style.display = 'flex';
        regStatus.textContent = 'Enter OTP to confirm.';
        // Store temp
        window._tempNumber = fullNumber;
        window._tempOtp = otp;
      }

      function verifyOtp() {
        const entered = otpInput.value.trim();
        if (entered === window._tempOtp) {
          // Fixed number
          myNumber = window._tempNumber;
          myCountryCode = countryCode.value;
          localStorage.setItem('premCallNumber', myNumber);
          localStorage.setItem('premCallCountry', myCountryCode);
          regStatus.textContent = '✅ Number registered!';
          registrationScreen.style.display = 'none';
          mainApp.style.display = 'block';
          myNumberDisplay.textContent = myNumber;
          initPeer();
          renderHistory();
          renderContacts();
          // Clean
          window._tempNumber = null;
          window._tempOtp = null;
        } else {
          regStatus.textContent = '❌ Invalid OTP. Try again.';
          otpInput.value = '';
        }
      }

      registerBtn.addEventListener('click', registerNumber);
      verifyOtpBtn.addEventListener('click', verifyOtp);
      phoneInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') registerNumber(); });
      otpInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') verifyOtp(); });

      // ─── PeerJS init ──────────────────────────────────────────────
      function initPeer() {
        if (peer) { peer.destroy(); peer = null; }
        if (!myNumber) return;

        peer = new Peer(myNumber, { debug: 2, config: getIceServers() });

        peer.on('open', () => {
          setStatus(peerStatus, 'online', 'online');
          console.log('✅ PeerJS online ID:', myNumber);
        });

        peer.on('error', (err) => {
          console.error('PeerJS error:', err);
          if (err.type === 'unavailable-id') {
            setStatus(peerStatus, 'number taken', 'offline');
          } else {
            setStatus(peerStatus, 'error: ' + err.type, 'offline');
          }
        });

        peer.on('call', (call) => {
          if (isInCall) {
            call.close();
            console.log('Rejected incoming call from ' + call.peer + ' (already in call)');
            return;
          }
          console.log('📞 Incoming call from:', call.peer);
          incomingCall = call;
          const displayName = getContactName(call.peer) || call.peer;
          callerName.textContent = displayName;
          callerNumber.textContent = call.peer;
          incomingOverlay.classList.add('active');
          playRingtone();
          // Auto-reject after 20 seconds (missed call)
          setTimeout(() => {
            if (incomingCall && incomingOverlay.classList.contains('active')) {
              // Missed
              addCallHistory(call.peer, 'incoming', 'missed');
              rejectIncomingCall();
            }
          }, 20000);
        });

        peer.on('close', () => {
          setStatus(peerStatus, 'offline', 'offline');
          if (isInCall) endCall();
        });

        peer.on('disconnected', () => {
          setStatus(peerStatus, 'disconnected', 'offline');
          setTimeout(() => { if (peer && !isInCall) peer.reconnect(); }, 3000);
        });
      }

      // ─── Ringtone ──────────────────────────────────────────────────
      function playRingtone() {
        stopRingtone();
        let ctx = new (window.AudioContext || window.webkitAudioContext)();
        let count = 0;
        ringtoneInterval = setInterval(() => {
          if (count >= 12 || !incomingOverlay.classList.contains('active')) {
            stopRingtone();
            return;
          }
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.value = count % 2 === 0 ? 440 : 330;
          osc.type = 'sine';
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.3);
          count++;
        }, 400);
      }
      function stopRingtone() {
        if (ringtoneInterval) { clearInterval(ringtoneInterval); ringtoneInterval = null; }
      }

      // ─── Microphone ──────────────────────────────────────────────
      async function getLocalStream() {
        if (!localStream) {
          try {
            localStream = await navigator.mediaDevices.getUserMedia({
              audio: { echoCancellation: true, noiseSuppression: true }
            });
            localStream.addEventListener('inactive', () => { localStream = null; });
          } catch (err) { throw err; }
        }
        return localStream;
      }

      // ─── Remote Audio ──────────────────────────────────────────────
      function getRemoteAudioElement() {
        if (!remoteAudioElement) {
          remoteAudioElement = document.createElement('audio');
          remoteAudioElement.id = 'remoteAudio';
          remoteAudioElement.setAttribute('playsInline', '');
          remoteAudioElement.autoplay = true;
          remoteAudioElement.style.display = 'none';
          document.body.appendChild(remoteAudioElement);
        }
        return remoteAudioElement;
      }

      function attachRemoteStream(stream) {
        remoteStream = stream;
        const audio = getRemoteAudioElement();
        audio.srcObject = stream;
        audio.play().catch(() => {});
        stream.onremovetrack = () => {
          if (stream.getTracks().length === 0) {
            audio.pause();
            audio.srcObject = null;
            remoteStream = null;
          }
        };
      }

      // ─── Call History ──────────────────────────────────────────────
      function addCallHistory(number, direction, status) {
        const entry = {
          number,
          direction,
          status,
          timestamp: new Date().toISOString(),
          duration: null
        };
        if (status === 'answered' && callStartTime) {
          const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
          entry.duration = elapsed;
        }
        callHistory.unshift(entry);
        if (callHistory.length > 100) callHistory.pop();
        localStorage.setItem('premCallHistory', JSON.stringify(callHistory));
        renderHistory();
      }

      function renderHistory() {
        if (callHistory.length === 0) {
          callHistoryList.innerHTML = '<p style="color:#94a3b8;">No calls yet.</p>';
          return;
        }
        let html = '';
        callHistory.forEach(entry => {
          const dir = entry.direction === 'incoming' ? '📥' : '📤';
          const statusText = entry.status === 'answered' ? (entry.duration ? entry.duration + 's' : 'Answered') :
                             entry.status === 'missed' ? 'Missed' : entry.status;
          html += `<div class="call-item">
            <div>
              <span class="direction ${entry.direction}">${dir}</span>
              ${getContactName(entry.number) || entry.number}
            </div>
            <div class="status">${statusText} ${new Date(entry.timestamp).toLocaleTimeString()}</div>
          </div>`;
        });
        callHistoryList.innerHTML = html;
      }

      clearHistoryBtn.addEventListener('click', () => {
        callHistory = [];
        localStorage.setItem('premCallHistory', JSON.stringify(callHistory));
        renderHistory();
      });

      // ─── Contacts ──────────────────────────────────────────────────
      function getContactName(number) {
        const contact = contacts.find(c => c.number === number);
        return contact ? contact.name : null;
      }

      function renderContacts() {
        if (contacts.length === 0) {
          contactList.innerHTML = '<p style="color:#94a3b8;">No contacts saved.</p>';
          return;
        }
        let html = '';
        contacts.forEach(c => {
          html += `<div class="call-item">
            <span>${c.name} (${c.number})</span>
            <button class="btn btn-outline" style="padding:0.2rem 0.6rem;font-size:0.7rem;" data-number="${c.number}">Call</button>
          </div>`;
        });
        contactList.innerHTML = html;
        // Attach call events to buttons
        contactList.querySelectorAll('button[data-number]').forEach(btn => {
          btn.addEventListener('click', () => {
            const num = btn.dataset.number;
            dialedNumber = num;
            dialDisplay.textContent = num;
            makeCall(num);
          });
        });
      }

      addContactBtn.addEventListener('click', () => {
        const num = contactInput.value.trim();
        if (!/^\d{10}$/.test(num)) { alert('Enter 10-digit number'); return; }
        const name = prompt('Enter name for this contact:');
        if (name) {
          contacts.push({ number: num, name });
          localStorage.setItem('premCallContacts', JSON.stringify(contacts));
          renderContacts();
          contactInput.value = '';
        }
      });

      // ─── Dialer ──────────────────────────────────────────────────
      function updateDialDisplay() {
        dialDisplay.textContent = dialedNumber || 'Enter number';
      }

      dialPad.addEventListener('click', (e) => {
        const key = e.target.closest('.key');
        if (!key) return;
        const digit = key.dataset.digit;
        const action = key.dataset.action;
        if (digit) {
          dialedNumber += digit;
          updateDialDisplay();
        } else if (action === 'delete') {
          dialedNumber = dialedNumber.slice(0, -1);
          updateDialDisplay();
        } else if (action === 'clear') {
          dialedNumber = '';
          updateDialDisplay();
        } else if (action === 'call') {
          if (dialedNumber) makeCall(dialedNumber);
        }
      });

      // Also support keyboard
      document.addEventListener('keydown', (e) => {
        if (e.key >= '0' && e.key <= '9') {
          dialedNumber += e.key;
          updateDialDisplay();
        } else if (e.key === 'Backspace') {
          dialedNumber = dialedNumber.slice(0, -1);
          updateDialDisplay();
        } else if (e.key === 'Enter') {
          if (dialedNumber) makeCall(dialedNumber);
        }
      });

      // ─── Check Status ──────────────────────────────────────────────
      checkStatusBtn.addEventListener('click', () => {
        const num = dialedNumber || contactInput.value || prompt('Enter number to check:');
        if (!num) return;
        checkPeerOnline(num);
      });

      function checkPeerOnline(number) {
        if (!peer) { statusResult.textContent = 'Peer not ready.'; return; }
        statusResult.textContent = 'Checking...';
        const conn = peer.connect(number);
        conn.on('open', () => {
          statusResult.textContent = '✅ Online';
          conn.close();
        });
        conn.on('error', () => {
          statusResult.textContent = '❌ Offline or unreachable';
        });
        setTimeout(() => {
          if (statusResult.textContent === 'Checking...') {
            statusResult.textContent = '⏳ Timeout (offline)';
            conn.close();
          }
        }, 5000);
      }

      // ─── Make Call ──────────────────────────────────────────────────
      async function makeCall(targetNumber) {
        if (isInCall) { setStatus(callStatus, 'Already in a call.', 'error'); return; }
        if (!peer) { alert('Peer not ready.'); return; }
        if (targetNumber === myNumber) { alert('Cannot call yourself.'); return; }
        try {
          setStatus(peerStatus, 'calling', 'online');
          await getLocalStream();
          const call = peer.call(targetNumber, localStream);
          currentCall = call;
          isCaller = true;
          isInCall = true;
          callStartTime = Date.now();
          showCallScreen(targetNumber);

          call.on('stream', (stream) => {
            attachRemoteStream(stream);
            addCallHistory(targetNumber, 'outgoing', 'answered');
            // Timer start
            if (callTimerInterval) clearInterval(callTimerInterval);
            let seconds = 0;
            callTimerInterval = setInterval(() => {
              seconds++;
              const m = String(Math.floor(seconds / 60)).padStart(2, '0');
              const s = String(seconds % 60).padStart(2, '0');
              callTimer.textContent = `${m}:${s}`;
            }, 1000);
          });

          call.on('close', () => {
            endCall();
          });

          call.on('error', (err) => {
            console.error('Call error:', err);
            endCall();
          });

          // ICE monitoring
          const pc = call.peerConnection;
          if (pc) {
            pc.oniceconnectionstatechange = () => {
              if (pc.iceConnectionState === 'failed') {
                endCall();
              }
            };
          }
        } catch (err) {
          alert('Call failed: ' + err.message);
          endCall();
        }
      }

      // ─── Show Call Screen ──────────────────────────────────────────
      function showCallScreen(number) {
        const name = getContactName(number) || number;
        activeCallerName.textContent = name;
        activeCallerNumber.textContent = number;
        callScreen.classList.add('active');
        incomingOverlay.classList.remove('active');
        // Hide dialer? We keep it but overlay is active.
      }

      // ─── Answer Incoming ──────────────────────────────────────────
      async function answerIncomingCall() {
        if (isAnswering || !incomingCall) return;
        isAnswering = true;
        try {
          stopRingtone();
          await getLocalStream();
          incomingCall.answer(localStream);
          currentCall = incomingCall;
          isCaller = false;
          isInCall = true;
          callStartTime = Date.now();
          const number = currentCall.peer;
          addCallHistory(number, 'incoming', 'answered');
          showCallScreen(number);
          incomingOverlay.classList.remove('active');

          currentCall.on('stream', (stream) => {
            attachRemoteStream(stream);
            if (callTimerInterval) clearInterval(callTimerInterval);
            let seconds = 0;
            callTimerInterval = setInterval(() => {
              seconds++;
              const m = String(Math.floor(seconds / 60)).padStart(2, '0');
              const s = String(seconds % 60).padStart(2, '0');
              callTimer.textContent = `${m}:${s}`;
            }, 1000);
          });

          currentCall.on('close', () => {
            endCall();
          });

          currentCall.on('error', (err) => {
            console.error('Call error:', err);
            endCall();
          });

          incomingCall = null;
        } catch (err) {
          alert('Answer failed: ' + err.message);
          if (incomingCall) incomingCall.close();
          incomingCall = null;
          incomingOverlay.classList.remove('active');
          isInCall = false;
        } finally {
          isAnswering = false;
        }
      }

      function rejectIncomingCall() {
        if (incomingCall) { incomingCall.close(); incomingCall = null; }
        stopRingtone();
        incomingOverlay.classList.remove('active');
        addCallHistory(callerNumber.textContent, 'incoming', 'rejected');
      }

      answerOverlayBtn.addEventListener('click', answerIncomingCall);
      rejectOverlayBtn.addEventListener('click', rejectIncomingCall);

      // ─── End Call ──────────────────────────────────────────────────
      function endCall() {
        if (currentCall) { currentCall.close(); currentCall = null; }
        if (remoteStream) { remoteStream.getTracks().forEach(t => t.stop()); remoteStream = null; }
        const audio = getRemoteAudioElement();
        audio.pause(); audio.srcObject = null;

        isInCall = false;
        isCaller = false;
        stopRingtone();
        incomingOverlay.classList.remove('active');
        callScreen.classList.remove('active');
        if (callTimerInterval) clearInterval(callTimerInterval);
        callTimer.textContent = '00:00';
        setStatus(peerStatus, 'online', 'online');
        // If call was active and we haven't logged it yet, log as ended.
        // Already logged on stream.
        callStartTime = null;
      }

      // ─── Call Screen Actions ──────────────────────────────────────
      document.querySelector('#callScreen .dialer-pad').addEventListener('click', (e) => {
        const key = e.target.closest('.key');
        if (!key) return;
        const action = key.dataset.action;
        if (action === 'hangup') {
          endCall();
        } else if (action === 'mute') {
          if (!localStream) return;
          isMuted = !isMuted;
          localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
          key.textContent = isMuted ? '🔊' : '🔇';
        } else if (action === 'speaker') {
          // Toggle speaker (not fully implemented)
        }
      });

      // ─── Share Link ──────────────────────────────────────────────
      shareLinkBtn.addEventListener('click', () => {
        if (!myNumber) return;
        const url = window.location.href.split('?')[0] + '?number=' + encodeURIComponent(myNumber);
        navigator.clipboard.writeText(url).then(() => {
          alert('Share link copied!\n' + url);
        }).catch(() => {
          prompt('Share this link:', url);
        });
      });

      // ─── Tab Switching ──────────────────────────────────────────────
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
          document.getElementById('tab' + tab.dataset.tab.charAt(0).toUpperCase() + tab.dataset.tab.slice(1)).classList.add('active');
        });
      });

      // ─── Auto-load from URL ──────────────────────────────────────
      (function autoLoad() {
        const params = new URLSearchParams(window.location.search);
        const num = params.get('number');
        if (num) {
          dialedNumber = num;
          updateDialDisplay();
          // If already registered, optionally auto-call after delay?
          // We'll just fill the dialer.
        }
      })();

      // ─── Initialize ──────────────────────────────────────────────
      if (myNumber) {
        registrationScreen.style.display = 'none';
        mainApp.style.display = 'block';
        myNumberDisplay.textContent = myNumber;
        initPeer();
        renderHistory();
        renderContacts();
        // Restore country code
        if (myCountryCode) countryCode.value = myCountryCode;
      } else {
        // Show registration
        registrationScreen.style.display = 'flex';
        mainApp.style.display = 'none';
      }

      console.log('premCall loaded. My number:', myNumber);
    })();
  </script>
</body>
</html>

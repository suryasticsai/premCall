<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>premCall</title>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #0a0e1a;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .container { max-width: 480px; width: 100%; margin: 0 auto; }

    /* ─── Registration Screen ─── */
    #registrationScreen {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
    }
    #registrationScreen h1 { font-size: 2.5rem; display: flex; align-items: center; gap: 0.5rem; }
    #registrationScreen .sub { color: #8892b0; margin-bottom: 1rem; }
    .reg-input-group { display: flex; gap: 0.5rem; width: 100%; max-width: 300px; }
    .reg-input-group select, .reg-input-group input { flex: 1; padding: 0.75rem; border-radius: 12px; border: 1px solid #2a3a5a; background: #0f1629; color: #e2e8f0; font-size: 1rem; }
    .reg-input-group select { flex: 0.8; }
    .reg-input-group input { flex: 2; }
    #otpSection { display: none; flex-direction: column; align-items: center; gap: 0.5rem; width: 100%; max-width: 300px; }
    #otpSection .otp-code { font-size: 2rem; font-weight: 700; color: #4f8cf7; letter-spacing: 0.5rem; }
    #otpSection input { padding: 0.75rem; border-radius: 12px; border: 1px solid #2a3a5a; background: #0f1629; color: #e2e8f0; font-size: 1rem; width: 100%; text-align: center; letter-spacing: 0.3rem; }
    .btn { padding: 0.75rem 2rem; border: none; border-radius: 40px; font-weight: 600; cursor: pointer; transition: 0.2s; background: #2a3a5a; color: #fff; font-size: 1rem; }
    .btn-primary { background: #1a4a8a; }
    .btn-primary:hover { background: #2563d6; }
    .btn-success { background: #1a7a4a; }
    .btn-success:hover { background: #1f9b5e; }
    .btn-danger { background: #8a1a2a; }
    .btn-danger:hover { background: #b52238; }
    .btn-yellow { background: #a67c1a; color: #fff; }
    .btn-yellow:hover { background: #ca9a2a; }
    .btn-outline { background: transparent; border: 1px solid #4a5a7a; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status-badge { padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.8rem; background: #1a2338; }
    .status-online { color: #4ade80; }
    .status-offline { color: #f87171; }

    /* ─── Main App (hidden until registered) ─── */
    #mainApp { display: none; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; }
    .my-number { font-weight: 700; color: #4f8cf7; }
    .tabs { display: flex; gap: 0.5rem; margin: 1rem 0; border-bottom: 1px solid #2a3a5a; }
    .tab { padding: 0.5rem 1rem; cursor: pointer; border-bottom: 2px solid transparent; color: #94a3b8; }
    .tab.active { border-bottom-color: #4f8cf7; color: #fff; }
    .tab-content { display: none; padding: 1rem 0; }
    .tab-content.active { display: block; }

    /* ─── Dialer ─── */
    .dialer-display { background: #0f1629; border-radius: 12px; padding: 0.75rem; font-size: 1.5rem; text-align: center; margin-bottom: 1rem; min-height: 3.2rem; word-break: break-all; }
    .dialer-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; max-width: 300px; margin: 0 auto; }
    .dialer-pad .key { background: #1a2338; border-radius: 50%; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 600; cursor: pointer; transition: 0.1s; user-select: none; }
    .dialer-pad .key:active { background: #2a3a5a; }
    .dialer-pad .key.call { background: #1a7a4a; color: #fff; }
    .dialer-pad .key.call:active { background: #1f9b5e; }
    .dialer-pad .key.call:disabled, .dialer-pad .key.disabled { opacity: 0.4; pointer-events: none; }
    .dialer-pad .key.hangup { background: #8a1a2a; color: #fff; }
    .dialer-pad .key.hangup:active { background: #b52238; }
    .dialer-pad .key.mute { background: #a67c1a; }
    .dialer-pad .key.mute:active { background: #ca9a2a; }
    .dialer-pad .key.mute.active-state, .dialer-pad .key.speaker.active-state { background: #4f8cf7; color: #fff; }

    /* ─── Call History ─── */
    .call-item { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #1a2338; gap: 0.5rem; }
    .call-item .direction { font-weight: 600; }
    .call-item .direction.incoming { color: #fbbf24; }
    .call-item .direction.outgoing { color: #4ade80; }
    .call-item .status { font-size: 0.8rem; color: #94a3b8; white-space: nowrap; }
    .call-item .status.missed, .call-item .status.declined, .call-item .status.busy, .call-item .status.rejected { color: #f87171; }

    /* ─── Incoming Call Overlay ─── */
    #incomingOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 1000;
      padding: 2rem;
    }
    #incomingOverlay.active { display: flex; }
    #incomingOverlay .caller-name { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; }
    #incomingOverlay .caller-number { color: #94a3b8; }
    #incomingOverlay .actions { display: flex; gap: 2rem; margin-top: 2rem; }
    #incomingOverlay .actions .btn { width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
    #incomingOverlay .actions .btn-answer { background: #1a7a4a; }
    #incomingOverlay .actions .btn-reject { background: #8a1a2a; }

    /* ─── Call Screen (active call) ─── */
    #callScreen {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #0a0e1a;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 2rem;
    }
    #callScreen.active { display: flex; }
    #callScreen .caller-info { text-align: center; margin-bottom: 2rem; }
    #callScreen .caller-info .name { font-size: 2rem; font-weight: 700; }
    #callScreen .caller-info .number { color: #94a3b8; }
    #callScreen .call-timer { font-size: 1.2rem; color: #4ade80; margin-bottom: 2rem; }
    #callScreen .call-substatus { color: #fbbf24; margin-bottom: 0.5rem; min-height: 1.2rem; }

    /* ─── Toast ─── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1a2338;
      border: 1px solid #2a3a5a;
      color: #e2e8f0;
      padding: 0.7rem 1.2rem;
      border-radius: 12px;
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 2000;
      max-width: 90%;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ─── Responsive ─── */
    @media (max-width: 480px) {
      .dialer-pad { max-width: 280px; gap: 0.6rem; }
      .dialer-pad .key { font-size: 1.5rem; }
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="container">

  <!-- ========================================== -->
  <!-- REGISTRATION SCREEN                        -->
  <!-- ========================================== -->
  <div id="registrationScreen">
    <h1>📞 premCall</h1>
    <p class="sub">Set up your fixed phone number</p>
    <div class="reg-input-group">
      <select id="countryCode">
        <option value="+1">🇺🇸 +1</option>
        <option value="+44">🇬🇧 +44</option>
        <option value="+91" selected>🇮🇳 +91</option>
        <option value="+61">🇦🇺 +61</option>
        <option value="+81">🇯🇵 +81</option>
        <option value="+86">🇨🇳 +86</option>
        <option value="+49">🇩🇪 +49</option>
        <option value="+33">🇫🇷 +33</option>
        <option value="+39">🇮🇹 +39</option>
        <option value="+7">🇷🇺 +7</option>
        <option value="+55">🇧🇷 +55</option>
        <option value="+52">🇲🇽 +52</option>
        <option value="+82">🇰🇷 +82</option>
        <option value="+31">🇳🇱 +31</option>
        <option value="+34">🇪🇸 +34</option>
        <option value="+46">🇸🇪 +46</option>
        <option value="+41">🇨🇭 +41</option>
        <option value="+27">🇿🇦 +27</option>
        <option value="+62">🇮🇩 +62</option>
        <option value="+60">🇲🇾 +60</option>
        <option value="+63">🇵🇭 +63</option>
        <option value="+65">🇸🇬 +65</option>
        <option value="+64">🇳🇿 +64</option>
        <option value="+971">🇦🇪 +971</option>
        <option value="+966">🇸🇦 +966</option>
        <option value="+54">🇦🇷 +54</option>
        <option value="+56">🇨🇱 +56</option>
        <option value="+57">🇨🇴 +57</option>
        <option value="+51">🇵🇪 +51</option>
      </select>
      <input type="tel" id="phoneInput" placeholder="10-digit number" maxlength="10" inputmode="numeric" />
    </div>
    <button class="btn btn-primary" id="registerBtn">Register</button>
    <div id="otpSection">
      <p>Enter the OTP shown below:</p>
      <div class="otp-code" id="otpDisplay">----</div>
      <input type="text" id="otpInput" placeholder="Enter OTP" maxlength="4" inputmode="numeric" />
      <button class="btn btn-success" id="verifyOtpBtn">Verify OTP</button>
    </div>
    <div id="regStatus" class="status-badge" style="margin-top:1rem;"></div>
  </div>

  <!-- ========================================== -->
  <!-- MAIN APP (after registration)              -->
  <!-- ========================================== -->
  <div id="mainApp">
    <div class="header">
      <div class="my-number" id="myNumberDisplay">---</div>
      <div>
        <span class="status-badge" id="peerStatus">offline</span>
        <button class="btn btn-outline" style="margin-left:0.5rem;padding:0.2rem 0.6rem;font-size:0.7rem;" id="shareLinkBtn">Share</button>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" data-tab="dialer">Dialer</div>
      <div class="tab" data-tab="history">History</div>
      <div class="tab" data-tab="contacts">Contacts</div>
    </div>

    <!-- Dialer Tab -->
    <div class="tab-content active" id="tabDialer">
      <div class="dialer-display" id="dialDisplay">Enter number</div>
      <div class="dialer-pad" id="dialPad">
        <div class="key" data-digit="1">1</div>
        <div class="key" data-digit="2">2</div>
        <div class="key" data-digit="3">3</div>
        <div class="key" data-digit="4">4</div>
        <div class="key" data-digit="5">5</div>
        <div class="key" data-digit="6">6</div>
        <div class="key" data-digit="7">7</div>
        <div class="key" data-digit="8">8</div>
        <div class="key" data-digit="9">9</div>
        <div class="key" data-digit="*">*</div>
        <div class="key" data-digit="0">0</div>
        <div class="key" data-digit="#">#</div>
        <div class="key" data-action="delete">⌫</div>
        <div class="key call" data-action="call" id="dialCallKey">📞</div>
        <div class="key" data-action="clear">✕</div>
      </div>
      <div style="margin-top:1rem;">
        <button class="btn btn-outline" id="checkStatusBtn">Check Number Status</button>
        <span id="statusResult" style="margin-left:0.5rem;"></span>
      </div>
    </div>

    <!-- History Tab -->
    <div class="tab-content" id="tabHistory">
      <div id="callHistoryList">
        <p style="color:#94a3b8;">No calls yet.</p>
      </div>
      <button class="btn btn-outline" id="clearHistoryBtn" style="margin-top:1rem;">Clear History</button>
    </div>

    <!-- Contacts Tab -->
    <div class="tab-content" id="tabContacts">
      <div style="display:flex;gap:0.5rem;margin-bottom:1rem;">
        <input type="tel" id="contactInput" placeholder="Enter number" inputmode="numeric" />
        <button class="btn btn-primary" id="addContactBtn">Add</button>
      </div>
      <div id="contactList"></div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- INCOMING CALL OVERLAY                      -->
  <!-- ========================================== -->
  <div id="incomingOverlay">
    <div class="caller-name" id="callerName">Unknown</div>
    <div class="caller-number" id="callerNumber">+1234567890</div>
    <div class="actions">
      <button class="btn btn-answer" id="answerOverlayBtn">✅</button>
      <button class="btn btn-reject" id="rejectOverlayBtn">❌</button>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- ACTIVE CALL SCREEN                         -->
  <!-- ========================================== -->
  <div id="callScreen">
    <div class="caller-info">
      <div class="name" id="activeCallerName">Calling...</div>
      <div class="number" id="activeCallerNumber">+1234567890</div>
    </div>
    <div class="call-substatus" id="callSubstatus"></div>
    <div class="call-timer" id="callTimer">00:00</div>
    <div class="dialer-pad" style="max-width:280px;">
      <div class="key mute" data-action="mute" id="muteKey">🔇</div>
      <div class="key hangup" data-action="hangup">📴</div>
      <div class="key speaker" data-action="speaker" id="speakerKey">🔊</div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- Persistent remote audio + toast            -->
  <!-- ========================================== -->
  <audio id="remoteAudio" autoplay playsinline style="display:none;"></audio>
  <div id="toast"></div>

  <!-- ========================================== -->
  <!-- SCRIPTS                                    -->
  <!-- ========================================== -->
  <script>
    (function() {
      "use strict";

      // ─── DOM refs ────────────────────────────────────────────────
      const registrationScreen = document.getElementById('registrationScreen');
      const mainApp = document.getElementById('mainApp');
      const countryCode = document.getElementById('countryCode');
      const phoneInput = document.getElementById('phoneInput');
      const registerBtn = document.getElementById('registerBtn');
      const otpSection = document.getElementById('otpSection');
      const otpDisplay = document.getElementById('otpDisplay');
      const otpInput = document.getElementById('otpInput');
      const verifyOtpBtn = document.getElementById('verifyOtpBtn');
      const regStatus = document.getElementById('regStatus');

      const myNumberDisplay = document.getElementById('myNumberDisplay');
      const peerStatus = document.getElementById('peerStatus');
      const shareLinkBtn = document.getElementById('shareLinkBtn');
      const dialDisplay = document.getElementById('dialDisplay');
      const dialPad = document.getElementById('dialPad');
      const dialCallKey = document.getElementById('dialCallKey');
      const checkStatusBtn = document.getElementById('checkStatusBtn');
      const statusResult = document.getElementById('statusResult');
      const callHistoryList = document.getElementById('callHistoryList');
      const clearHistoryBtn = document.getElementById('clearHistoryBtn');
      const contactInput = document.getElementById('contactInput');
      const addContactBtn = document.getElementById('addContactBtn');
      const contactList = document.getElementById('contactList');

      const incomingOverlay = document.getElementById('incomingOverlay');
      const callerName = document.getElementById('callerName');
      const callerNumber = document.getElementById('callerNumber');
      const answerOverlayBtn = document.getElementById('answerOverlayBtn');
      const rejectOverlayBtn = document.getElementById('rejectOverlayBtn');

      const callScreen = document.getElementById('callScreen');
      const activeCallerName = document.getElementById('activeCallerName');
      const activeCallerNumber = document.getElementById('activeCallerNumber');
      const callTimer = document.getElementById('callTimer');
      const callSubstatus = document.getElementById('callSubstatus');
      const muteKey = document.getElementById('muteKey');
      const speakerKey = document.getElementById('speakerKey');

      const remoteAudioEl = document.getElementById('remoteAudio');
      const toastEl = document.getElementById('toast');

      // ─── State ──────────────────────────────────────────────────
      let myNumber = localStorage.getItem('premCallNumber') || null; // digits-only, used as the actual PeerJS ID
      let myDisplayNumber = localStorage.getItem('premCallDisplayNumber') || null; // "+91 9876543210", for UI only
      let myCountryCode = localStorage.getItem('premCallCountry') || '+91';
      let peer = null;
      let currentCall = null;
      let localStream = null;
      let remoteStream = null;
      let isMuted = false;
      let isSpeakerOn = true;
      let isInCall = false;
      let isCaller = false;
      let incomingCall = null;
      let ringtoneInterval = null;
      let callHistory = JSON.parse(localStorage.getItem('premCallHistory') || '[]');
      let contacts = JSON.parse(localStorage.getItem('premCallContacts') || '[]');
      let callTimerInterval = null;
      let dialedNumber = '';
      let isAnswering = false;
      let wakeLock = null;
      let missedCallTimeoutId = null;

      // Per-call bookkeeping used to log accurate history when the call ends
      let currentCallPeerId = null;
      let currentCallDirection = null; // 'incoming' | 'outgoing'
      let callConnectedTime = null;    // set the moment audio actually starts flowing
      let callWasAnswered = false;
      let remoteOutcome = null;        // 'declined' | 'busy' set via signaling channel

      const MUTE_ICON = '🔇';
      const UNMUTE_ICON = '🔊';

      // ─── ICE Servers ──────────────────────────────────────────────
      function getIceServers() {
        return {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
            { urls: 'stun:stun3.l.google.com:19302' },
            { urls: 'stun:stun4.l.google.com:19302' },
            { urls: 'stun:stun.ekiga.net' },
            { urls: 'stun:stun.ideasip.com' },
            {
              urls: ['turn:numb.viagenie.ca:3478', 'turn:numb.viagenie.ca:443'],
              username: 'webrtc@live.com',
              credential: 'muazkh'
            }
          ],
          iceCandidatePoolSize: 10
        };
      }

      // ─── Helpers ──────────────────────────────────────────────────
      // PeerJS IDs are used directly in the signaling server's URL path, so
      // only letters, digits, "-" and "_" are safe. "+" (from a country
      // code) or spaces will make Peer() throw "ID is invalid" — strip
      // everything down to digits before it's ever used as an ID.
      function sanitizeId(str) {
        return String(str || '').replace(/\D/g, '');
      }

      function setStatus(el, text, type) {
        el.textContent = text;
        el.className = 'status-badge';
        if (type) el.classList.add('status-' + type);
      }

      let toastTimeoutId = null;
      function showToast(msg, duration) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimeoutId);
        toastTimeoutId = setTimeout(() => toastEl.classList.remove('show'), duration || 2500);
      }

      // ─── Screen Wake Lock (keeps the screen/audio alive during a call) ──
      async function requestWakeLock() {
        try {
          if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
          }
        } catch (err) {
          console.warn('Wake lock request failed:', err);
        }
      }
      function releaseWakeLock() {
        if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
      }
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          if (isInCall && !wakeLock) requestWakeLock();
          if (remoteAudioEl.paused && remoteAudioEl.srcObject) {
            remoteAudioEl.play().catch(() => {});
          }
        }
      });

      // ─── Registration ──────────────────────────────────────────────
      function registerNumber() {
        const cc = countryCode.value;
        const num = phoneInput.value.trim();
        if (!/^\d{10}$/.test(num)) {
          regStatus.textContent = 'Enter exactly 10 digits.';
          return;
        }
        // Peer ID must be digits-only (no "+"); keep the "+cc num" form
        // separately purely for display.
        const peerId = sanitizeId(cc + num);
        const displayNumber = cc + ' ' + num;
        const otp = Math.floor(1000 + Math.random() * 9000).toString();
        otpDisplay.textContent = otp;
        otpSection.style.display = 'flex';
        regStatus.textContent = 'Enter OTP to confirm.';
        window._tempNumber = peerId;
        window._tempDisplayNumber = displayNumber;
        window._tempOtp = otp;
      }

      function verifyOtp() {
        const entered = otpInput.value.trim();
        if (entered === window._tempOtp) {
          myNumber = window._tempNumber;
          myDisplayNumber = window._tempDisplayNumber;
          myCountryCode = countryCode.value;
          localStorage.setItem('premCallNumber', myNumber);
          localStorage.setItem('premCallDisplayNumber', myDisplayNumber);
          localStorage.setItem('premCallCountry', myCountryCode);
          regStatus.textContent = '✅ Number registered!';
          enterMainApp();
          window._tempNumber = null;
          window._tempDisplayNumber = null;
          window._tempOtp = null;
        } else {
          regStatus.textContent = '❌ Invalid OTP. Try again.';
          otpInput.value = '';
        }
      }

      function enterMainApp() {
        registrationScreen.style.display = 'none';
        mainApp.style.display = 'block';
        myNumberDisplay.textContent = myDisplayNumber || myNumber;
        if (myCountryCode) countryCode.value = myCountryCode;
        initPeer();
        renderHistory();
        renderContacts();
      }

      // If the chosen number turns out to be taken by someone else already
      // online, kick the user back to registration instead of leaving them
      // stuck on a permanently "offline" main screen.
      function resetRegistrationDueToConflict() {
        localStorage.removeItem('premCallNumber');
        localStorage.removeItem('premCallDisplayNumber');
        myNumber = null;
        myDisplayNumber = null;
        mainApp.style.display = 'none';
        registrationScreen.style.display = 'flex';
        otpSection.style.display = 'none';
        otpInput.value = '';
        regStatus.textContent = 'That number is already taken on this network — pick another.';
        showToast('Number unavailable, please choose a different one.');
      }

      registerBtn.addEventListener('click', registerNumber);
      verifyOtpBtn.addEventListener('click', verifyOtp);
      phoneInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') registerNumber(); });
      otpInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') verifyOtp(); });

      // ─── PeerJS init ──────────────────────────────────────────────
      function initPeer() {
        if (peer) { peer.destroy(); peer = null; }
        if (!myNumber) return;

        peer = new Peer(myNumber, { debug: 2, config: getIceServers() });

        peer.on('open', () => {
          setStatus(peerStatus, 'online', 'online');
          console.log('✅ PeerJS online ID:', myNumber);
        });

        peer.on('error', (err) => {
          console.error('PeerJS error:', err);
          if (err.type === 'unavailable-id') {
            resetRegistrationDueToConflict();
          } else {
            setStatus(peerStatus, 'error: ' + err.type, 'offline');
          }
        });

        // Incoming media calls
        peer.on('call', (call) => {
          if (isInCall) {
            notifyPeer(call.peer, 'busy');
            call.close();
            console.log('Rejected incoming call from ' + call.peer + ' (already in call)');
            return;
          }
          incomingCall = call;
          const displayName = getContactName(call.peer) || call.peer;
          callerName.textContent = displayName;
          callerNumber.textContent = call.peer;
          incomingOverlay.classList.add('active');
          playRingtone();

          clearTimeout(missedCallTimeoutId);
          missedCallTimeoutId = setTimeout(() => {
            if (incomingCall && incomingOverlay.classList.contains('active')) {
              addCallHistory(call.peer, 'incoming', 'missed', null);
              incomingCall.close();
              incomingCall = null;
              stopRingtone();
              incomingOverlay.classList.remove('active');
            }
          }, 20000);
        });

        // Incoming data connections — used for reject/busy signaling between peers
        peer.on('connection', (conn) => {
          if (conn.metadata && conn.metadata.type === 'signal') {
            conn.on('data', (data) => {
              if (!data || !data.type) return;
              if (currentCall && conn.peer === currentCall.peer) {
                if (data.type === 'reject') {
                  remoteOutcome = 'declined';
                  showToast('Call declined');
                  endCall();
                } else if (data.type === 'busy') {
                  remoteOutcome = 'busy';
                  showToast((getContactName(conn.peer) || conn.peer) + ' is busy');
                  endCall();
                }
              }
            });
          }
        });

        peer.on('close', () => {
          setStatus(peerStatus, 'offline', 'offline');
          if (isInCall) endCall();
        });

        peer.on('disconnected', () => {
          setStatus(peerStatus, 'disconnected', 'offline');
          setTimeout(() => { if (peer && !isInCall) peer.reconnect(); }, 3000);
        });
      }

      // Send a small signaling message to a peer without an active media call
      // (used to tell a caller their call was declined or the line is busy).
      function notifyPeer(peerId, type) {
        try {
          const conn = peer.connect(peerId, { reliable: true, metadata: { type: 'signal' } });
          conn.on('open', () => {
            conn.send({ type: type });
            setTimeout(() => conn.close(), 300);
          });
        } catch (err) {
          console.warn('Failed to notify peer:', err);
        }
      }

      // ─── Ringtone ──────────────────────────────────────────────────
      function playRingtone() {
        stopRingtone();
        let ctx = new (window.AudioContext || window.webkitAudioContext)();
        let count = 0;
        ringtoneInterval = setInterval(() => {
          if (count >= 12 || !incomingOverlay.classList.contains('active')) {
            stopRingtone();
            return;
          }
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.value = count % 2 === 0 ? 440 : 330;
          osc.type = 'sine';
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.3);
          count++;
        }, 400);
      }
      function stopRingtone() {
        if (ringtoneInterval) { clearInterval(ringtoneInterval); ringtoneInterval = null; }
      }

      // ─── Microphone ──────────────────────────────────────────────
      async function getLocalStream() {
        if (!localStream || localStream.getAudioTracks().every(t => t.readyState === 'ended')) {
          localStream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true }
          });
          localStream.getAudioTracks().forEach(track => {
            track.addEventListener('ended', () => {
              console.warn('Local mic track ended, attempting to restart...');
              if (isInCall) {
                navigator.mediaDevices.getUserMedia({ audio: true })
                  .then(stream => {
                    localStream = stream;
                    if (currentCall && currentCall.peerConnection) {
                      const senders = currentCall.peerConnection.getSenders();
                      const audioTrack = stream.getAudioTracks()[0];
                      senders.forEach(sender => {
                        if (sender.track && sender.track.kind === 'audio') sender.replaceTrack(audioTrack);
                      });
                    }
                  })
                  .catch(err => console.error('Failed to restart local stream:', err));
              }
            });
          });
        }
        return localStream;
      }

      // ─── Remote Audio ──────────────────────────────────────────────
      function attachRemoteStream(stream) {
        remoteStream = stream;
        remoteAudioEl.srcObject = stream;
        remoteAudioEl.muted = false;
        remoteAudioEl.volume = 1.0;

        const tryPlay = () => {
          remoteAudioEl.play().catch(err => {
            console.warn('Autoplay blocked, will resume on next interaction:', err);
            const resume = () => remoteAudioEl.play().catch(() => {});
            document.addEventListener('click', resume, { once: true });
            document.addEventListener('touchstart', resume, { once: true });
          });
        };
        tryPlay();

        stream.getAudioTracks().forEach(track => {
          track.onended = () => {
            console.warn('Remote audio track ended unexpectedly');
            if (isInCall) {
              callSubstatus.textContent = 'Reconnecting...';
              const pc = currentCall && currentCall.peerConnection;
              if (pc && pc.restartIce) pc.restartIce();
            }
          };
        });
      }

      // ─── Call timer ──────────────────────────────────────────────
      function startCallTimer() {
        callConnectedTime = Date.now();
        callWasAnswered = true;
        if (callTimerInterval) clearInterval(callTimerInterval);
        callTimer.textContent = '00:00';
        callTimerInterval = setInterval(() => {
          const seconds = Math.floor((Date.now() - callConnectedTime) / 1000);
          const m = String(Math.floor(seconds / 60)).padStart(2, '0');
          const s = String(seconds % 60).padStart(2, '0');
          callTimer.textContent = `${m}:${s}`;
        }, 1000);
      }
      function stopCallTimer() {
        if (callTimerInterval) { clearInterval(callTimerInterval); callTimerInterval = null; }
      }

      // Shared handler for both outgoing and incoming calls once audio starts flowing
      function onCallConnected(stream) {
        attachRemoteStream(stream);
        callSubstatus.textContent = '';
        startCallTimer();
        requestWakeLock();
      }

      // Shared ICE monitoring for both call directions
      function attachIceMonitoring(pc) {
        if (!pc) return;
        pc.oniceconnectionstatechange = () => {
          const state = pc.iceConnectionState;
          console.log('ICE state:', state);
          if (state === 'failed') {
            if (pc.restartIce) {
              pc.restartIce();
            } else {
              showToast('Connection lost');
              endCall();
            }
          } else if (state === 'disconnected') {
            callSubstatus.textContent = 'Connection unstable...';
          } else if (state === 'connected' || state === 'completed') {
            callSubstatus.textContent = '';
          }
        };
      }

      // ─── Call History ──────────────────────────────────────────────
      function addCallHistory(number, direction, status, durationSeconds) {
        const entry = {
          number,
          direction,
          status,
          timestamp: new Date().toISOString(),
          duration: (typeof durationSeconds === 'number') ? durationSeconds : null
        };
        callHistory.unshift(entry);
        if (callHistory.length > 100) callHistory.pop();
        localStorage.setItem('premCallHistory', JSON.stringify(callHistory));
        renderHistory();
      }

      function renderHistory() {
        if (callHistory.length === 0) {
          callHistoryList.innerHTML = '<p style="color:#94a3b8;">No calls yet.</p>';
          return;
        }
        let html = '';
        callHistory.forEach(entry => {
          const dir = entry.direction === 'incoming' ? '📥' : '📤';
          const labels = { answered: entry.duration != null ? formatDuration(entry.duration) : 'Answered',
                            missed: 'Missed', declined: 'Declined', busy: 'Busy',
                            rejected: 'Rejected', 'no answer': 'No answer' };
          const statusText = labels[entry.status] || entry.status;
          html += `<div class="call-item">
            <div>
              <span class="direction ${entry.direction}">${dir}</span>
              ${escapeHtml(getContactName(entry.number) || entry.number)}
            </div>
            <div class="status ${entry.status}">${statusText} · ${new Date(entry.timestamp).toLocaleTimeString()}</div>
          </div>`;
        });
        callHistoryList.innerHTML = html;
      }

      function formatDuration(seconds) {
        const m = String(Math.floor(seconds / 60)).padStart(2, '0');
        const s = String(seconds % 60).padStart(2, '0');
        return `${m}:${s}`;
      }

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      clearHistoryBtn.addEventListener('click', () => {
        callHistory = [];
        localStorage.setItem('premCallHistory', JSON.stringify(callHistory));
        renderHistory();
      });

      // ─── Contacts ──────────────────────────────────────────────────
      function getContactName(number) {
        const contact = contacts.find(c => c.number === number);
        return contact ? contact.name : null;
      }

      function renderContacts() {
        if (contacts.length === 0) {
          contactList.innerHTML = '<p style="color:#94a3b8;">No contacts saved.</p>';
          return;
        }
        let html = '';
        contacts.forEach(c => {
          html += `<div class="call-item">
            <span>${escapeHtml(c.name)} (${escapeHtml(c.number)})</span>
            <button class="btn btn-outline" style="padding:0.2rem 0.6rem;font-size:0.7rem;" data-number="${escapeHtml(c.number)}">Call</button>
          </div>`;
        });
        contactList.innerHTML = html;
        contactList.querySelectorAll('button[data-number]').forEach(btn => {
          btn.addEventListener('click', () => {
            const num = btn.dataset.number;
            dialedNumber = num;
            dialDisplay.textContent = num;
            makeCall(num);
          });
        });
      }

      addContactBtn.addEventListener('click', () => {
        const num = sanitizeId(contactInput.value);
        if (num.length < 7 || num.length > 15) { showToast('Enter a valid number (include country code)'); return; }
        const name = prompt('Enter name for this contact:');
        if (name) {
          contacts.push({ number: num, name });
          localStorage.setItem('premCallContacts', JSON.stringify(contacts));
          renderContacts();
          contactInput.value = '';
        }
      });

      // ─── Dialer ──────────────────────────────────────────────────
      function updateDialDisplay() {
        dialDisplay.textContent = dialedNumber || 'Enter number';
      }

      dialPad.addEventListener('click', (e) => {
        const key = e.target.closest('.key');
        if (!key) return;
        const digit = key.dataset.digit;
        const action = key.dataset.action;
        if (digit) {
          dialedNumber += digit;
          updateDialDisplay();
        } else if (action === 'delete') {
          dialedNumber = dialedNumber.slice(0, -1);
          updateDialDisplay();
        } else if (action === 'clear') {
          dialedNumber = '';
          updateDialDisplay();
        } else if (action === 'call') {
          if (dialedNumber) makeCall(dialedNumber);
        }
      });

      document.addEventListener('keydown', (e) => {
        if (mainApp.style.display !== 'block' || callScreen.classList.contains('active')) return;
        if (e.key >= '0' && e.key <= '9') {
          dialedNumber += e.key;
          updateDialDisplay();
        } else if (e.key === 'Backspace') {
          dialedNumber = dialedNumber.slice(0, -1);
          updateDialDisplay();
        } else if (e.key === 'Enter') {
          if (dialedNumber) makeCall(dialedNumber);
        }
      });

      // ─── Check Status ──────────────────────────────────────────────
      checkStatusBtn.addEventListener('click', () => {
        const num = dialedNumber || contactInput.value || prompt('Enter number to check:');
        if (!num) return;
        checkPeerOnline(num);
      });

      function checkPeerOnline(number) {
        if (!peer) { statusResult.textContent = 'Peer not ready.'; return; }
        const targetId = sanitizeId(number);
        if (!targetId) { statusResult.textContent = 'Enter a valid number.'; return; }
        statusResult.textContent = 'Checking...';
        let settled = false;
        const conn = peer.connect(targetId, { metadata: { type: 'probe' } });
        conn.on('open', () => {
          if (settled) return;
          settled = true;
          statusResult.textContent = '✅ Online';
          conn.close();
        });
        conn.on('error', () => {
          if (settled) return;
          settled = true;
          statusResult.textContent = '❌ Offline or unreachable';
        });
        setTimeout(() => {
          if (!settled) {
            settled = true;
            statusResult.textContent = '⏳ Timeout (offline)';
            conn.close();
          }
        }, 5000);
      }

      // ─── Make Call ──────────────────────────────────────────────────
      async function makeCall(rawTargetNumber) {
        if (isInCall) { showToast('Already in a call.'); return; }
        if (!peer) { showToast('Peer not ready.'); return; }
        const targetNumber = sanitizeId(rawTargetNumber);
        if (!targetNumber) { showToast('Enter a valid number.'); return; }
        if (targetNumber === myNumber) { showToast('Cannot call yourself.'); return; }

        dialCallKey.classList.add('disabled');
        try {
          await getLocalStream();
          const call = peer.call(targetNumber, localStream);
          currentCall = call;
          currentCallPeerId = targetNumber;
          currentCallDirection = 'outgoing';
          callWasAnswered = false;
          remoteOutcome = null;
          isCaller = true;
          isInCall = true;
          showCallScreen(targetNumber);
          callSubstatus.textContent = 'Ringing...';

          call.on('stream', onCallConnected);
          call.on('close', () => endCall());
          call.on('error', (err) => {
            console.error('Call error:', err);
            showToast('Call failed');
            endCall();
          });

          attachIceMonitoring(call.peerConnection);
        } catch (err) {
          showToast('Call failed: ' + err.message);
          isInCall = false;
        } finally {
          dialCallKey.classList.remove('disabled');
        }
      }

      // ─── Show Call Screen ──────────────────────────────────────────
      function showCallScreen(number) {
        const name = getContactName(number) || number;
        activeCallerName.textContent = name;
        activeCallerNumber.textContent = number;
        callSubstatus.textContent = '';
        callTimer.textContent = '00:00';
        callScreen.classList.add('active');
        incomingOverlay.classList.remove('active');
      }

      // ─── Answer Incoming ──────────────────────────────────────────
      async function answerIncomingCall() {
        if (isAnswering || !incomingCall) return;
        isAnswering = true;
        clearTimeout(missedCallTimeoutId);
        try {
          stopRingtone();
          await getLocalStream();
          incomingCall.answer(localStream);
          currentCall = incomingCall;
          currentCallPeerId = currentCall.peer;
          currentCallDirection = 'incoming';
          callWasAnswered = false;
          remoteOutcome = null;
          isCaller = false;
          isInCall = true;
          showCallScreen(currentCallPeerId);
          incomingOverlay.classList.remove('active');

          currentCall.on('stream', onCallConnected);
          currentCall.on('close', () => endCall());
          currentCall.on('error', (err) => {
            console.error('Call error:', err);
            showToast('Call error');
            endCall();
          });

          attachIceMonitoring(currentCall.peerConnection);
          incomingCall = null;
        } catch (err) {
          showToast('Answer failed: ' + err.message);
          if (incomingCall) incomingCall.close();
          incomingCall = null;
          incomingOverlay.classList.remove('active');
          isInCall = false;
        } finally {
          isAnswering = false;
        }
      }

      function rejectIncomingCall() {
        clearTimeout(missedCallTimeoutId);
        if (incomingCall) {
          const peerId = incomingCall.peer;
          notifyPeer(peerId, 'reject');
          addCallHistory(peerId, 'incoming', 'rejected', null);
          incomingCall.close();
          incomingCall = null;
        }
        stopRingtone();
        incomingOverlay.classList.remove('active');
      }

      answerOverlayBtn.addEventListener('click', answerIncomingCall);
      rejectOverlayBtn.addEventListener('click', rejectIncomingCall);

      // ─── End Call ──────────────────────────────────────────────────
      function endCall() {
        if (!isInCall) return; // guard against the async 'close' event firing twice
        isInCall = false;

        // Log accurate history now that we know how the call actually ended
        if (currentCallPeerId) {
          let status, duration = null;
          if (callWasAnswered) {
            status = 'answered';
            duration = callConnectedTime ? Math.floor((Date.now() - callConnectedTime) / 1000) : 0;
          } else if (remoteOutcome) {
            status = remoteOutcome; // 'declined' | 'busy'
          } else if (isCaller) {
            status = 'no answer';
          } else {
            status = null; // incoming, unanswered — already logged by reject/missed-timeout paths
          }
          if (status) addCallHistory(currentCallPeerId, currentCallDirection, status, duration);
        }

        if (currentCall) { currentCall.close(); currentCall = null; }
        if (remoteStream) { remoteStream.getTracks().forEach(t => t.stop()); remoteStream = null; }
        remoteAudioEl.pause();
        remoteAudioEl.srcObject = null;
        releaseWakeLock();

        isCaller = false;
        isMuted = false;
        isSpeakerOn = true;
        if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = true);
        muteKey.textContent = MUTE_ICON;
        muteKey.classList.remove('active-state');
        speakerKey.classList.add('active-state');

        stopRingtone();
        stopCallTimer();
        incomingOverlay.classList.remove('active');
        callScreen.classList.remove('active');
        callTimer.textContent = '00:00';
        setStatus(peerStatus, 'online', 'online');

        currentCallPeerId = null;
        currentCallDirection = null;
        callConnectedTime = null;
        callWasAnswered = false;
        remoteOutcome = null;
      }

      // ─── Call Screen Actions ──────────────────────────────────────
      document.querySelector('#callScreen .dialer-pad').addEventListener('click', (e) => {
        const key = e.target.closest('.key');
        if (!key) return;
        const action = key.dataset.action;
        if (action === 'hangup') {
          endCall();
        } else if (action === 'mute') {
          if (!localStream) return;
          isMuted = !isMuted;
          localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
          key.textContent = isMuted ? UNMUTE_ICON : MUTE_ICON;
          key.classList.toggle('active-state', isMuted);
        } else if (action === 'speaker') {
          toggleSpeaker(key);
        }
      });

      // Best-effort output-device toggle. setSinkId is only supported on a
      // subset of browsers (mainly desktop Chrome/Edge); elsewhere we just
      // tell the user it isn't available rather than pretending it worked.
      async function toggleSpeaker(key) {
        if (typeof remoteAudioEl.setSinkId !== 'function') {
          showToast('Output switching not supported on this browser');
          return;
        }
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const outputs = devices.filter(d => d.kind === 'audiooutput');
          if (outputs.length < 2) {
            showToast('No alternate audio output found');
            return;
          }
          isSpeakerOn = !isSpeakerOn;
          const target = isSpeakerOn ? outputs[0] : outputs[1];
          await remoteAudioEl.setSinkId(target.deviceId);
          key.classList.toggle('active-state', isSpeakerOn);
        } catch (err) {
          console.warn('setSinkId failed:', err);
          showToast('Could not switch audio output');
        }
      }

      // ─── Share Link ──────────────────────────────────────────────
      shareLinkBtn.addEventListener('click', () => {
        if (!myNumber) return;
        const url = window.location.href.split('?')[0] + '?number=' + encodeURIComponent(myNumber);
        navigator.clipboard.writeText(url).then(() => {
          showToast('Share link copied!');
        }).catch(() => {
          prompt('Share this link:', url);
        });
      });

      // ─── Tab Switching ──────────────────────────────────────────────
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
          document.getElementById('tab' + tab.dataset.tab.charAt(0).toUpperCase() + tab.dataset.tab.slice(1)).classList.add('active');
        });
      });

      // ─── Auto-load from URL ──────────────────────────────────────
      (function autoLoad() {
        const params = new URLSearchParams(window.location.search);
        const num = params.get('number');
        if (num) {
          dialedNumber = num.replace(/\D/g, '');
          updateDialDisplay();
        }
      })();

      // ─── Initialize ──────────────────────────────────────────────
      if (myNumber) {
        enterMainApp();
      } else {
        registrationScreen.style.display = 'flex';
        mainApp.style.display = 'none';
      }

      console.log('premCall loaded. My number:', myNumber);
    })();
  </script>
</body>
</html>

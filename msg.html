<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#070a12" />
<title>PremCall — Messages</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/suryasticsai/premCall/main/premCall-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<style>
    :root {
        --bg-0:#05070d; --bg-1:#0a0e18; --surface:#0e1424; --surface-2:#141c30; --surface-3:#1b2540;
        --line:#1e2a42; --text:#eef2fb; --text-dim:#8891ab; --text-faint:#525d78;
        --signal:#4f8cf7; --signal-soft:#2f5fc4; --go:#2fd992; --stop:#ff5470; --warn:#ffb648;
        --radius-lg:18px; --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif;
        --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    }
    body.light-mode {
        --bg-0:#f0f2f5; --bg-1:#ffffff; --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#f1f5f9;
        --line:#d1d5db; --text:#111827; --text-dim:#4b5563; --text-faint:#9ca3af;
        --signal:#2563eb; --go:#10b981; --stop:#ef4444; --warn:#f59e0b;
    }
    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    html, body { height:100%; overflow:hidden; font-family:var(--font-body); color:var(--text); background:var(--bg-0); }
    .app { max-width:428px; margin:0 auto; height:100%; display:flex; flex-direction:column; background:linear-gradient(180deg,var(--bg-1),var(--bg-0)); }
    .chat-header { display:flex; align-items:center; gap:.7rem; padding:calc(.7rem + var(--safe-t)) 1rem .6rem; border-bottom:1px solid var(--line); flex:0 0 auto; background:rgba(10,14,24,.8); backdrop-filter:blur(10px); }
    .chat-header .back { color:var(--text-dim); text-decoration:none; font-size:1.1rem; padding:.2rem; }
    .chat-header .avatar { width:38px; height:38px; border-radius:50%; background:var(--surface-3); display:flex; align-items:center; justify-content:center; font-size:1rem; font-weight:700; }
    .chat-header .info { flex:1; }
    .chat-header .name { font-family:var(--font-display); font-weight:700; font-size:1rem; }
    .chat-header .status { font-size:.65rem; color:var(--text-faint); }
    .chat-header .status.online { color:var(--go); }

    .chat-messages { flex:1 1 auto; min-height:0; overflow-y:auto; padding:1rem; display:flex; flex-direction:column; gap:.4rem; scrollbar-width:thin; }
    .chat-messages::-webkit-scrollbar { width:4px; }
    .chat-messages::-webkit-scrollbar-thumb { background:var(--surface-3); border-radius:10px; }

    .bubble-wrap { display:flex; flex-direction:column; max-width:78%; animation:popIn .25s ease-out; }
    @keyframes popIn { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
    .bubble-wrap.sent { align-self:flex-end; align-items:flex-end; }
    .bubble-wrap.received { align-self:flex-start; align-items:flex-start; }
    .bubble { padding:.65rem .9rem; border-radius:18px; font-size:.88rem; line-height:1.4; word-wrap:break-word; }
    .bubble-wrap.sent .bubble { background:linear-gradient(140deg,var(--signal),var(--signal-soft)); color:#fff; border-bottom-right-radius:4px; }
    .bubble-wrap.received .bubble { background:var(--surface-2); color:var(--text); border-bottom-left-radius:4px; border:1px solid var(--line); }
    .bubble-meta { font-size:.58rem; color:var(--text-faint); margin-top:.15rem; display:flex; gap:.35rem; align-items:center; }
    .bubble-meta .read { color:var(--go); }
    .bubble-meta .sent-icon { color:var(--text-faint); }

    .chat-input { flex:0 0 auto; padding:.6rem 1rem calc(.6rem + var(--safe-b)); border-top:1px solid var(--line); display:flex; gap:.5rem; align-items:center; background:rgba(10,14,24,.8); backdrop-filter:blur(10px); }
    .chat-input input { flex:1; background:var(--surface-2); border:1px solid var(--line); border-radius:40px; padding:.55rem 1rem; color:var(--text); font-family:var(--font-body); font-size:.9rem; outline:none; }
    .chat-input input::placeholder { color:var(--text-faint); }
    .chat-input button { width:40px; height:40px; border-radius:50%; border:none; background:var(--go); color:#04140c; font-size:1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .1s; }
    .chat-input button:active { transform:scale(.92); }
    .chat-input button:disabled { opacity:.4; cursor:not-allowed; }

    #toast { position:fixed; bottom:calc(20px + var(--safe-b)); left:50%; transform:translateX(-50%) translateY(20px); background:var(--surface-3); border:1px solid var(--line); color:var(--text); padding:.55rem 1.2rem; border-radius:40px; font-size:.8rem; opacity:0; pointer-events:none; transition:.25s; z-index:6000; }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">
    <div class="chat-header">
        <a href="index.html" class="back"><i class="fas fa-arrow-left"></i></a>
        <div class="avatar" id="chatAvatar">👤</div>
        <div class="info">
            <div class="name" id="chatName">—</div>
            <div class="status" id="chatStatus">Connecting…</div>
        </div>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input">
        <input type="text" id="msgInput" placeholder="Type a message…" autocomplete="off" />
        <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function() {
    'use strict';
    const $ = id => document.getElementById(id);
    const params = new URLSearchParams(window.location.search);
    const toNumber = params.get('to') || '';
    const myNumber = localStorage.getItem('premCallNumber') || 'unknown';
    const chatName = $('chatName'), chatStatus = $('chatStatus'), chatAvatar = $('chatAvatar');
    const chatMessages = $('chatMessages'), msgInput = $('msgInput'), sendBtn = $('sendBtn');
    const toast = $('toast');
    let toastTimeout = null;

    chatName.textContent = toNumber || 'Unknown';
    chatAvatar.textContent = toNumber ? toNumber.replace(/\D/g,'').slice(-2) : '👤';

    function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); clearTimeout(toastTimeout); toastTimeout = setTimeout(() => toast.classList.remove('show'), 2200); }

    /* ---------- Deduplication fix: use a Set of rendered message IDs ---------- */
    const renderedIds = new Set();
    const msgMap = new Map(); // id -> msg object

    function renderMessage(msg) {
        if (renderedIds.has(msg.id)) return; // CRITICAL: prevents duplicates
        renderedIds.add(msg.id);
        msgMap.set(msg.id, msg);

        const wrap = document.createElement('div');
        wrap.className = 'bubble-wrap ' + (msg.sender === myNumber ? 'sent' : 'received');
        wrap.dataset.id = msg.id;

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = msg.text;

        const meta = document.createElement('div');
        meta.className = 'bubble-meta';
        const time = new Date(msg.timestamp).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
        let statusIcon = '';
        if (msg.sender === myNumber) {
            statusIcon = msg.read ? '<i class="fas fa-check-double read"></i>' : '<i class="fas fa-check sent-icon"></i>';
        }
        meta.innerHTML = '<span>' + time + '</span>' + statusIcon;

        wrap.appendChild(bubble);
        wrap.appendChild(meta);
        chatMessages.appendChild(wrap);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function updateReadStatus(id) {
        const msg = msgMap.get(id);
        if (msg) { msg.read = true; }
        const wrap = chatMessages.querySelector('.bubble-wrap[data-id="' + id + '"]');
        if (wrap) {
            const meta = wrap.querySelector('.bubble-meta');
            if (meta && !meta.querySelector('.fa-check-double')) {
                meta.innerHTML = meta.innerHTML.replace(/<i class="fas fa-check[^"]*"><\/i>/g, '') + '<i class="fas fa-check-double read"></i>';
            }
        }
    }

    /* ---------- PeerJS data connection ---------- */
    let peer = null, conn = null, connected = false;
    const stored = localStorage.getItem('premCallNumber');

    function initPeer() {
        if (!stored || stored === 'unknown') { chatStatus.textContent = 'Register to message'; return; }
        try {
            peer = new Peer(stored, { debug: 0 });
            peer.on('open', () => { chatStatus.textContent = 'Online'; chatStatus.classList.add('online'); connectToPeer(); });
            peer.on('error', err => { chatStatus.textContent = 'Error: ' + err.type; });
            peer.on('connection', c => {
                conn = c; setupConn();
                chatStatus.textContent = 'Connected'; chatStatus.classList.add('online');
            });
        } catch(e) { chatStatus.textContent = 'Peer error'; }
    }

    function connectToPeer() {
        if (!peer || !toNumber) return;
        try {
            conn = peer.connect(toNumber, { reliable: true });
            setupConn();
        } catch(e) {}
    }

    function setupConn() {
        if (!conn) return;
        conn.on('open', () => { connected = true; chatStatus.textContent = 'Connected'; chatStatus.classList.add('online'); });
        conn.on('data', data => {
            if (!data || !data.type) return;
            if (data.type === 'chat') {
                // Ignore echo of our own messages
                if (data.payload.sender === myNumber) return;
                renderMessage(data.payload);
                // Send read receipt back
                if (conn && conn.open) conn.send({ type: 'read-receipt', id: data.payload.id });
            } else if (data.type === 'read-receipt') {
                updateReadStatus(data.id);
            }
        });
        conn.on('close', () => { connected = false; chatStatus.textContent = 'Offline'; chatStatus.classList.remove('online'); });
        conn.on('error', () => { connected = false; });
    }

    /* ---------- Send with unique ID (prevents duplicates) ---------- */
    function sendMessage() {
        const text = msgInput.value.trim();
        if (!text) return;
        if (!connected) { showToast('Not connected yet'); return; }

        // Generate unique ID: sender-timestamp-random
        const id = myNumber + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
        const msg = { id, text, sender: myNumber, timestamp: Date.now(), read: false };

        // Optimistically render immediately
        renderMessage(msg);
        msgInput.value = '';

        // Send via PeerJS
        if (conn && conn.open) {
            conn.send({ type: 'chat', payload: msg });
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

    /* Load cached messages for this conversation */
    (function loadCache() {
        try {
            const key = 'premCallMsgs_' + toNumber;
            const raw = localStorage.getItem(key);
            if (raw) {
                const arr = JSON.parse(raw);
                arr.forEach(m => { if (!renderedIds.has(m.id)) renderMessage(m); });
            }
        } catch(e) {}
    })();

    /* Auto-save messages every 3 seconds */
    setInterval(() => {
        try {
            const key = 'premCallMsgs_' + toNumber;
            const arr = Array.from(msgMap.values()).slice(-200);
            localStorage.setItem(key, JSON.stringify(arr));
        } catch(e) {}
    }, 3000);

    initPeer();
})();
</script>
</body>
</html>
